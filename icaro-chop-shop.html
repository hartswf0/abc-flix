<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>VC Block Chopper · MP4 First</title>
    <style>
        :root {
            --ink: #000;
            --paper: #fffdf2;
            --floor: #e7ddc8;
            --blue: #1238d6;
            --red: #e00000;
            --yellow: #ffd000;
            --green: #078b3f;
            --line: 5px solid #000;
            --safe: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            border-radius: 0 !important;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background: var(--floor);
            color: var(--ink);
            font-family: Arial Black, Arial, Helvetica, sans-serif;
        }

        button,
        input {
            font: inherit;
            border: var(--line);
            background: var(--paper);
            color: var(--ink);
            font-weight: 950;
        }

        button {
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 5px 5px 0 var(--ink)
        }

        button:active {
            transform: translate(5px, 5px);
            box-shadow: none
        }

        button:disabled {
            opacity: .42;
            box-shadow: none;
            transform: none
        }

        input {
            width: 100%;
            min-width: 0;
            text-align: center;
            font-size: 23px
        }

        input[type=file] {
            display: none
        }

        #app {
            height: 100dvh;
            display: grid;
            grid-template-rows: 50px minmax(0, 1fr) 92px 96px 58px 34px;
        }

        /* action chain */
        #chain {
            display: grid;
            grid-template-columns: 1fr 76px 96px 1fr;
            gap: 7px;
            padding: 6px;
            background: var(--paper);
            border-bottom: var(--line);
        }

        .block {
            min-height: 38px;
            display: grid;
            place-items: center;
            font-size: 14px;
            padding: 0 4px
        }

        #load {
            background: var(--blue);
            color: #fff
        }

        #mode {
            background: #000;
            color: #fff
        }

        #chop {
            background: var(--yellow)
        }

        #valuebox {
            border: var(--line);
            background: #fff;
            box-shadow: 5px 5px 0 var(--ink);
            display: grid;
            grid-template-rows: 12px 1fr;
            overflow: hidden;
        }

        #vlabel {
            font-size: 8px;
            line-height: 12px;
            text-align: center;
            background: #000;
            color: #fff
        }

        #value {
            border: 0;
            min-height: 28px;
            padding: 0
        }

        /* video */
        #stage {
            min-height: 0;
            position: relative;
            background: #d3c7b2;
            overflow: hidden
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: none
        }

        #probe {
            display: none
        }

        #empty {
            position: absolute;
            inset: 10px;
            display: grid;
            place-items: center;
            text-align: center;
            border: var(--line);
            background: var(--paper)
        }

        #empty b {
            font-size: 16vw;
            line-height: .85
        }

        #empty span {
            display: block;
            font-size: 12px;
            letter-spacing: .08em
        }

        #badge {
            position: absolute;
            left: 8px;
            top: 8px;
            display: none;
            border: var(--line);
            background: var(--yellow);
            box-shadow: 5px 5px 0 var(--ink);
            padding: 6px 10px;
            font-size: 17px;
        }

        #blade {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 5px;
            background: var(--red);
            left: 0;
            display: none;
            pointer-events: none
        }

        #toast {
            position: absolute;
            left: 50%;
            bottom: 10px;
            transform: translateX(-50%);
            border: var(--line);
            background: #000;
            color: #fff;
            padding: 7px 12px;
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            max-width: calc(100% - 20px);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #toast.on {
            opacity: 1
        }

        /* head tail */
        #ends {
            background: var(--floor);
            border-top: var(--line);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 8px;
        }

        .end {
            position: relative;
            border: var(--line);
            background: #000;
            overflow: hidden;
            aspect-ratio: 16/9;
            min-height: 0;
        }

        .end canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000
        }

        .tag {
            position: absolute;
            left: 0;
            top: 0;
            background: var(--paper);
            border-right: 4px solid #000;
            border-bottom: 4px solid #000;
            padding: 2px 6px;
            font-size: 10px;
        }

        .time {
            position: absolute;
            right: 0;
            bottom: 0;
            background: var(--yellow);
            border-left: 4px solid #000;
            border-top: 4px solid #000;
            padding: 2px 6px;
            font-size: 10px;
        }

        /* chips */
        #blocks {
            background: var(--paper);
            border-top: var(--line);
            padding: 8px;
            display: flex;
            gap: 9px;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
        }

        #blocks::-webkit-scrollbar {
            display: none
        }

        .piece {
            flex: 0 0 132px;
            min-height: 74px;
            background: var(--paper);
            display: grid;
            grid-template-columns: 44px 1fr;
            grid-template-rows: 1fr 20px;
            padding: 0;
            text-align: left;
            position: relative;
        }

        .piece.on {
            background: var(--red);
            color: #fff
        }

        .piece.off {
            opacity: .42;
            background: #ccc
        }

        .num {
            grid-row: 1/3;
            display: grid;
            place-items: center;
            background: #000;
            color: #fff;
            font-size: 15px
        }

        .piece.on .num {
            background: #fff;
            color: var(--red)
        }

        .ptime {
            align-self: end;
            padding: 7px 7px 0;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .frames {
            padding: 0 7px 5px;
            font-size: 8px;
            opacity: .78;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .offtag {
            position: absolute;
            right: 0;
            top: 0;
            background: #000;
            color: #fff;
            border-left: 3px solid #000;
            border-bottom: 3px solid #000;
            padding: 2px 5px;
            font-size: 8px;
            display: none
        }

        .piece.off .offtag {
            display: block
        }

        /* export */
        #export {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding: 6px;
            padding-bottom: calc(6px + var(--safe));
            background: var(--paper);
            border-top: var(--line);
        }

        #export button {
            font-size: 11px;
            min-height: 42px;
            padding: 0 3px
        }

        #thisbtn {
            background: #000;
            color: #fff
        }

        #picsbtn {
            background: var(--blue);
            color: #fff
        }

        #vidsbtn {
            background: var(--yellow)
        }

        #allbtn {
            background: var(--green);
            color: #fff
        }

        /* state */
        #statebar {
            background: #000;
            color: #fff;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            font-size: 10px;
            border-top: 3px solid #000;
        }

        #statebar div {
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 4px
        }

        #statebar div:last-child {
            border-right: 0
        }

        #progress {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 7px;
            background: #000;
            z-index: 5;
            display: none;
        }

        #bar {
            height: 100%;
            width: 0;
            background: var(--green)
        }

        @media(min-width:980px) {
            #app {
                grid-template-columns: 250px minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) 118px 126px 36px;
            }

            #chain {
                grid-column: 1;
                grid-row: 1;
                grid-template-columns: 1fr;
                grid-auto-rows: 70px;
                align-content: start;
                border-bottom: 0;
                border-right: var(--line);
            }

            .block {
                font-size: 21px
            }

            #valuebox {
                height: 70px
            }

            #vlabel {
                height: 18px;
                line-height: 18px
            }

            #value {
                height: 42px;
                font-size: 29px
            }

            #export {
                grid-column: 1;
                grid-row: 2/4;
                grid-template-columns: 1fr;
                align-content: start;
                border-top: var(--line);
                border-right: var(--line);
            }

            #export button {
                font-size: 18px;
                min-height: 56px
            }

            #stage {
                grid-column: 2;
                grid-row: 1
            }

            #ends {
                grid-column: 2;
                grid-row: 2
            }

            #blocks {
                grid-column: 2;
                grid-row: 3
            }

            #statebar {
                grid-column: 1/3;
                grid-row: 4
            }

            .piece {
                flex-basis: 166px;
                min-height: 90px
            }

            .num {
                font-size: 19px
            }

            .ptime {
                font-size: 16px
            }

            .frames {
                font-size: 10px
            }
        }
    </style>
</head>

<body>
    <div id="app">
        <section id="chain">
            <button id="load" class="block" aria-label="Load video">Load</button>
            <button id="mode" class="block" aria-label="Switch seconds or count">Sec</button>
            <div id="valuebox"><span id="vlabel">SIZE</span><input id="value" value="3.167" type="number" step="0.001"
                    min="0.1" inputmode="decimal" aria-label="Cut value"></div>
            <button id="chop" class="block" aria-label="Chop video">Chop</button>
            <input id="file" type="file" accept="video/*">
        </section>

        <main id="stage">
            <video id="video" playsinline controls muted></video>
            <video id="probe" playsinline muted></video>
            <div id="empty">
                <div><b>LOAD</b><span>SEC / COUNT · CHOP · EXPORT</span></div>
            </div>
            <div id="badge">--</div>
            <div id="blade"></div>
            <div id="toast"></div>
            <div id="progress">
                <div id="bar"></div>
            </div>
        </main>

        <section id="ends">
            <div class="end"><canvas id="head"></canvas>
                <div class="tag">HEAD</div>
                <div class="time" id="headtime">--</div>
            </div>
            <div class="end"><canvas id="tail"></canvas>
                <div class="tag">TAIL</div>
                <div class="time" id="tailtime">--</div>
            </div>
        </section>

        <section id="blocks"></section>

        <section id="export">
            <button id="thisbtn">This</button>
            <button id="picsbtn">Pics</button>
            <button id="vidsbtn">MP4</button>
            <button id="allbtn">All</button>
        </section>

        <section id="statebar">
            <div id="sfile">NO FILE</div>
            <div id="scuts">0 CUTS</div>
            <div id="sexport">IDLE</div>
        </section>
    </div>

    <script>
        (() => {
            "use strict";

            const STORE = "vc_block_chopper_export_state_v4";
            const $ = id => document.getElementById(id);
            const video = $("video"), probe = $("probe"), file = $("file"), blocks = $("blocks");
            const empty = $("empty"), badge = $("badge"), blade = $("blade"), toastEl = $("toast");
            const value = $("value"), modeBtn = $("mode"), vlabel = $("vlabel");
            const head = $("head"), tail = $("tail"), headtime = $("headtime"), tailtime = $("tailtime");
            const progress = $("progress"), bar = $("bar");
            const sfile = $("sfile"), scuts = $("scuts"), sexport = $("sexport");

            let url = null, toastTimer = null, drawSerial = 0, busy = false;

            const defaultState = () => ({
                name: "NO FILE", stem: "video", fps: 30, mode: "sec", value: 3.167,
                pieces: [], active: 0, hasVideo: false
            });

            let state = loadState();

            const safe = name => (name || "video")
                .replace(/\.[^/.]+$/, "")
                .replace(/[^a-z0-9_-]+/gi, "_")
                .replace(/^_+|_+$/g, "")
                .slice(0, 56) || "video";

            const num = (v, f = 0) => {
                const x = Number(v);
                return Number.isFinite(x) ? x : f;
            };

            const fmt = (v, d = 1) => num(v, 0).toFixed(d);
            const ms = t => String(Math.round(num(t, 0) * 1000)).padStart(7, "0") + "ms";
            const cid = i => "C" + String(i).padStart(3, "0");
            const frame = t => Math.max(0, Math.round(num(t, 0) * state.fps));

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORE);
                    if (!raw) return defaultState();
                    const s = Object.assign(defaultState(), JSON.parse(raw));
                    s.hasVideo = false;
                    return s;
                } catch (e) { return defaultState(); }
            }

            function saveState() {
                try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { }
                renderState();
            }

            function toast(t) {
                toastEl.textContent = t;
                toastEl.classList.add("on");
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toastEl.classList.remove("on"), 900);
            }

            function setBusy(on, label) {
                busy = !!on;
                sexport.textContent = label || (on ? "BUSY" : "IDLE");
                document.querySelectorAll("button,input").forEach(el => {
                    if (el.id !== "file") el.disabled = !!on;
                });
                progress.style.display = on ? "block" : "none";
                if (!on) bar.style.width = "0%";
            }

            function setProgress(done, total, label) {
                const pct = total ? Math.round((done / total) * 100) : 0;
                bar.style.width = pct + "%";
                sexport.textContent = (label || "EXPORT") + " " + pct + "%";
            }

            function active() { return state.pieces[state.active] || null; }
            function onPieces() { return state.pieces.filter(p => !p.off); }

            function labelFor(p) { return cid(p.i) + "__" + ms(p.a) + "-" + ms(p.b); }
            function videoName(p, ext) { return state.stem + "__" + labelFor(p) + "." + (ext || "webm"); }
            function headName(p) { return state.stem + "__" + cid(p.i) + "__HEAD__" + ms(p.a) + ".png"; }
            function tailName(p) { return state.stem + "__" + cid(p.i) + "__TAIL__" + ms(p.b) + ".png"; }

            function render() {
                modeBtn.textContent = state.mode === "sec" ? "Sec" : "Count";
                vlabel.textContent = state.mode === "sec" ? "SIZE" : "PIECES";
                value.step = state.mode === "sec" ? "0.001" : "1";
                value.min = state.mode === "sec" ? "0.1" : "1";
                value.value = state.mode === "sec" ? fmt(state.value, 3) : String(Math.max(1, Math.round(state.value)));
                renderBlocks();
                renderBadge();
                moveBlade();
                drawEnds();
                renderState();
            }

            function renderState() {
                sfile.textContent = state.hasVideo ? state.stem : (state.name && state.name !== "NO FILE" ? "RELOAD " + state.stem : "NO FILE");
                scuts.textContent = onPieces().length + "/" + state.pieces.length + " CUTS";
                if (!busy && sexport.textContent.indexOf("%") === -1) {
                    const choice = recorderChoice();
                    sexport.textContent = state.hasVideo ? (choice.direct ? "MP4 OK" : "WEBM+RUNNER") : "IDLE";
                }
            }

            function renderBadge() {
                const p = active();
                if (!p) {
                    badge.style.display = "none";
                    headtime.textContent = "--";
                    tailtime.textContent = "--";
                    return;
                }
                badge.style.display = "block";
                badge.textContent = cid(p.i) + " " + fmt(p.a, 1) + "–" + fmt(p.b, 1);
                headtime.textContent = fmt(p.a, 2);
                tailtime.textContent = fmt(p.b, 2);
            }

            function renderBlocks() {
                if (!state.pieces.length) { blocks.innerHTML = ""; return; }
                blocks.innerHTML = state.pieces.map((p, i) => `
      <button class="piece ${i === state.active ? "on" : ""} ${p.off ? "off" : ""}" data-i="${i}" aria-label="${cid(p.i)} ${fmt(p.a, 1)} to ${fmt(p.b, 1)}">
        <span class="num">${cid(p.i)}</span>
        <span class="ptime">${fmt(p.a, 1)}–${fmt(p.b, 1)}</span>
        <span class="frames">F${frame(p.a)}–${frame(p.b)}</span>
        <span class="offtag">OFF</span>
      </button>
    `).join("");

                blocks.querySelectorAll(".piece").forEach(el => {
                    let downAt = 0;
                    el.onpointerdown = () => downAt = Date.now();
                    el.onpointerup = () => {
                        if (busy) return;
                        const i = Number(el.dataset.i);
                        if (Date.now() - downAt > 520) {
                            state.pieces[i].off = !state.pieces[i].off;
                            state.active = i;
                            toast(state.pieces[i].off ? "OFF" : "ON");
                        } else {
                            state.active = i;
                            playPiece();
                        }
                        saveState();
                        render();
                    };
                });

                const on = blocks.querySelector(".piece.on");
                if (on) on.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
            }

            function loadVideo(f) {
                if (!f) return;
                if (url) URL.revokeObjectURL(url);
                url = URL.createObjectURL(f);
                state.name = f.name;
                state.stem = safe(f.name);
                state.hasVideo = true;
                video.src = url;
                probe.src = url;
                video.style.display = "block";
                empty.style.display = "none";
                video.onloadedmetadata = () => {
                    makePieces();
                    toast("READY");
                    saveState();
                };
            }

            function readValue() {
                const raw = num(value.value, state.mode === "sec" ? 3.167 : 6);
                state.value = state.mode === "sec" ? Math.max(.1, raw) : Math.max(1, Math.round(raw));
            }

            function makePieces() {
                if (!video.duration) return toast("LOAD");
                readValue();
                const arr = [];
                if (state.mode === "count") {
                    const count = Math.max(1, Math.round(state.value));
                    const step = video.duration / count;
                    for (let i = 0; i < count; i++) {
                        arr.push({ i, a: i * step, b: i === count - 1 ? video.duration : (i + 1) * step, off: false });
                    }
                } else {
                    const step = Math.max(.1, state.value);
                    let t = 0, i = 0;
                    while (t < video.duration - .001) {
                        const b = Math.min(video.duration, t + step);
                        arr.push({ i, a: t, b, off: false });
                        t = b; i++;
                        if (i > 3000) break;
                    }
                }
                state.pieces = arr;
                state.active = 0;
                video.currentTime = 0;
                saveState();
                render();
                toast(arr.length + " BLOCKS");
            }

            function playPiece() {
                const p = active();
                if (!p) return toast("CHOP");
                if (!state.hasVideo) return toast("RELOAD");
                video.currentTime = p.a;
                video.play().catch(() => { });
                const stop = () => {
                    if (video.currentTime >= p.b) {
                        video.pause();
                        video.removeEventListener("timeupdate", stop);
                    }
                    moveBlade();
                };
                video.addEventListener("timeupdate", stop);
            }

            function moveBlade() {
                if (!video.duration) { blade.style.display = "none"; return; }
                blade.style.display = "block";
                blade.style.left = Math.max(0, Math.min(100, (video.currentTime / video.duration) * 100)) + "%";
            }

            function seekProbe(t) {
                return new Promise(resolve => {
                    if (!probe.src) return resolve();
                    const done = () => {
                        probe.removeEventListener("seeked", done);
                        resolve();
                    };
                    probe.addEventListener("seeked", done, { once: true });
                    probe.currentTime = Math.max(0, Math.min(t, Math.max(0, (probe.duration || t) - .001)));
                    setTimeout(done, 750);
                });
            }

            function drawFit(canvas) {
                const ctx = canvas.getContext("2d");
                const cw = 1280, ch = 720;
                canvas.width = cw;
                canvas.height = ch;
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, cw, ch);
                const vw = probe.videoWidth || 16;
                const vh = probe.videoHeight || 9;
                const scale = Math.min(cw / vw, ch / vh);
                const dw = Math.round(vw * scale);
                const dh = Math.round(vh * scale);
                const dx = Math.round((cw - dw) / 2);
                const dy = Math.round((ch - dh) / 2);
                ctx.drawImage(probe, dx, dy, dw, dh);
            }

            async function canvasForTime(t) {
                if (!state.hasVideo || !probe.src || !probe.videoWidth) return null;
                await seekProbe(t);
                const c = document.createElement("canvas");
                drawFit(c);
                return c;
            }

            async function drawCanvasAt(canvas, t, serial) {
                if (!state.hasVideo || !probe.src || !probe.videoWidth) return;
                await seekProbe(t);
                if (serial !== drawSerial) return;
                drawFit(canvas);
            }

            async function drawEnds() {
                const p = active();
                if (!p || !state.hasVideo || !probe.src || !probe.videoWidth) return;
                const serial = ++drawSerial;
                const tailT = Math.max(p.a, p.b - (1 / state.fps));
                try {
                    await drawCanvasAt(head, p.a, serial);
                    await drawCanvasAt(tail, tailT, serial);
                } catch (e) { }
            }

            function manifest(pieces, mode) {
                return {
                    type: "VC_BLOCK_CHOPPER_LOCAL_EXPORT",
                    version: "4.0",
                    exportMode: mode,
                    source: state.name,
                    stem: state.stem,
                    fps: state.fps,
                    chopMode: state.mode,
                    chopValue: state.value,
                    naming: "<stem>__C000__0000000ms-0003167ms.mp4 when supported; otherwise .webm + MP4 runner",
                    exportedAt: new Date().toISOString(),
                    cuts: pieces.map(p => ({
                        id: cid(p.i),
                        from: +p.a.toFixed(3),
                        to: +p.b.toFixed(3),
                        off: !!p.off,
                        fromFrame: frame(p.a),
                        toFrame: frame(p.b),
                        localVideoFile: videoName(p, recorderChoice().direct ? "mp4" : "webm"),
                        mp4File: videoName(p, "mp4"),
                        webmFile: videoName(p, "webm"),
                        headFile: headName(p),
                        tailFile: tailName(p)
                    }))
                };
            }

            function piecesFor(mode) {
                if (mode === "this") {
                    const p = active();
                    return p ? [p] : [];
                }
                return onPieces();
            }

            function downloadBlob(name, blob) {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = name;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
            }

            function downloadText(name, type, text) {
                downloadBlob(name, new Blob([text], { type }));
            }

            function canvasToBlob(canvas) {
                return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
            }

            async function downloadPics(pieces, label) {
                if (!state.hasVideo) return toast("RELOAD");
                if (!pieces.length) return toast("NO CUTS");
                setBusy(true, "PICS");
                const total = pieces.length * 2;
                let done = 0;
                for (const p of pieces) {
                    const h = await canvasForTime(p.a);
                    if (h) {
                        const hb = await canvasToBlob(h);
                        downloadBlob(headName(p), hb);
                    }
                    done++; setProgress(done, total, "PICS");
                    await sleep(160);

                    const tt = Math.max(p.a, p.b - (1 / state.fps));
                    const tc = await canvasForTime(tt);
                    if (tc) {
                        const tb = await canvasToBlob(tc);
                        downloadBlob(tailName(p), tb);
                    }
                    done++; setProgress(done, total, "PICS");
                    await sleep(160);
                }
                downloadText(state.stem + "__" + label + "__manifest.json", "application/json", JSON.stringify(manifest(pieces, label), null, 2));
                setBusy(false, "READY");
                render();
                toast("PICS");
            }

            function recorderChoice() {
                const list = [
                    { mime: "video/mp4;codecs=avc1.42E01E,mp4a.40.2", ext: "mp4" },
                    { mime: "video/mp4;codecs=avc1.640028,mp4a.40.2", ext: "mp4" },
                    { mime: "video/mp4;codecs=h264,aac", ext: "mp4" },
                    { mime: "video/mp4", ext: "mp4" },
                    { mime: "video/webm;codecs=vp9,opus", ext: "webm" },
                    { mime: "video/webm;codecs=vp8,opus", ext: "webm" },
                    { mime: "video/webm", ext: "webm" }
                ];
                if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return { mime: "", ext: "webm", direct: false };
                for (const item of list) {
                    if (MediaRecorder.isTypeSupported(item.mime)) return { ...item, direct: item.ext === "mp4" };
                }
                return { mime: "", ext: "webm", direct: false };
            }

            async function recordPiece(p) {
                if (!window.MediaRecorder || !video.captureStream) throw new Error("NO_RECORDER");
                const choice = recorderChoice();
                const stream = video.captureStream();
                const chunks = [];
                const rec = new MediaRecorder(stream, choice.mime ? { mimeType: choice.mime } : undefined);

                return new Promise((resolve, reject) => {
                    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
                    rec.onerror = () => reject(new Error("RECORDER_ERROR"));
                    rec.onstop = () => {
                        const type = choice.mime || rec.mimeType || "video/webm";
                        const ext = type.indexOf("mp4") >= 0 ? "mp4" : "webm";
                        resolve({ blob: new Blob(chunks, { type }), ext, mime: type });
                    };

                    const stopAtEnd = () => {
                        if (video.currentTime >= p.b) {
                            video.pause();
                            video.removeEventListener("timeupdate", stopAtEnd);
                            if (rec.state !== "inactive") rec.stop();
                        }
                    };

                    video.addEventListener("timeupdate", stopAtEnd);
                    video.currentTime = p.a;

                    const start = () => {
                        video.removeEventListener("seeked", start);
                        rec.start();
                        video.play().catch(err => {
                            video.removeEventListener("timeupdate", stopAtEnd);
                            reject(err);
                        });
                    };

                    video.addEventListener("seeked", start, { once: true });
                    setTimeout(() => {
                        if (rec.state === "recording") {
                            video.pause();
                            video.removeEventListener("timeupdate", stopAtEnd);
                            rec.stop();
                        }
                    }, Math.max(1000, (p.b - p.a + .75) * 1000));
                });
            }

            async function downloadVids(pieces, label) {
                if (!state.hasVideo) return toast("RELOAD");
                if (!pieces.length) return toast("NO CUTS");
                if (!window.MediaRecorder || !video.captureStream) {
                    downloadText(state.stem + "__" + label + "__mp4_runner.py", "text/x-python", runner(label, pieces));
                    downloadText(state.stem + "__" + label + "__manifest.json", "application/json", JSON.stringify(manifest(pieces, label), null, 2));
                    toast("MP4 RUNNER");
                    return;
                }

                const choice = recorderChoice();
                setBusy(true, choice.direct ? "MP4" : "WEBM");
                let done = 0;
                let fallbackRunner = false;
                for (const p of pieces) {
                    setProgress(done, pieces.length, choice.direct ? "MP4" : "WEBM");
                    try {
                        const result = await recordPiece(p);
                        downloadBlob(videoName(p, result.ext), result.blob);
                    } catch (e) {
                        fallbackRunner = true;
                        downloadText(state.stem + "__" + label + "__mp4_runner.py", "text/x-python", runner(label, pieces));
                        toast("MP4 RUNNER");
                        break;
                    }
                    done++;
                    setProgress(done, pieces.length, choice.direct ? "MP4" : "WEBM");
                    await sleep(250);
                }
                downloadText(state.stem + "__" + label + "__manifest.json", "application/json", JSON.stringify(manifest(pieces, label), null, 2));
                setBusy(false, "READY");
                render();
                toast(fallbackRunner ? "RUNNER" : (choice.direct ? "MP4" : "WEBM"));
            }

            async function exportMode(mode) {
                if (busy) return;
                const pieces = piecesFor(mode === "all" ? "cuts" : mode);
                if (!pieces.length) return toast("NO CUTS");
                if (!state.hasVideo) return toast("RELOAD");

                if (mode === "pics") return downloadPics(pieces, "pics");
                if (mode === "vids") return downloadVids(pieces, "vids");
                if (mode === "this") {
                    const p = pieces;
                    await downloadPics(p, "this_pics");
                    await downloadVids(p, "this_vid");
                    return;
                }
                if (mode === "all") {
                    await downloadPics(pieces, "all_pics");
                    await downloadVids(pieces, "all_vids");
                    downloadText(state.stem + "__all__runner_mp4.py", "text/x-python", runner("all", pieces));
                    return;
                }
            }

            function runner(mode, pieces) {
                const m = manifest(pieces, mode);
                return `# VC Block Chopper MP4 Runner
# Browser exports MP4 when MediaRecorder supports it. This runner always exports MP4 + PNG heads/tails.
from google.colab import files
from moviepy.video.io.VideoFileClip import VideoFileClip
from pathlib import Path
import json, shutil

M = json.loads(${JSON.stringify(JSON.stringify(m, null, 2))})
uploaded = files.upload()
video = VideoFileClip(next(iter(uploaded)))

root = Path(M["stem"] + "__VC_MP4__" + M["exportMode"])
cuts_dir = root / "cuts_mp4"
still_dir = root / "heads_tails_png"
manifest_dir = root / "manifest"
for d in [cuts_dir, still_dir, manifest_dir]:
    d.mkdir(parents=True, exist_ok=True)

with open(manifest_dir / (M["stem"] + "__manifest.json"), "w") as f:
    json.dump(M, f, indent=2)

for c in M["cuts"]:
    start = float(c["from"])
    end = float(c["to"])
    tail_t = max(start, end - (1 / float(M["fps"])))

    print("VIDEO", c["id"], start, end)
    clip = video.subclip(start, end)
    clip.write_videofile(str(cuts_dir / c["mp4File"]), codec="libx264", audio_codec="aac", fps=float(M["fps"]))

    print("STILLS", c["id"])
    video.save_frame(str(still_dir / c["headFile"]), t=start)
    video.save_frame(str(still_dir / c["tailFile"]), t=tail_t)

zip_path = shutil.make_archive(str(root), "zip", str(root))
files.download(zip_path)
print("DONE", zip_path)
`;
            }

            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

            $("load").onclick = () => file.click();
            file.onchange = e => loadVideo(e.target.files[0]);
            $("chop").onclick = makePieces;

            modeBtn.onclick = () => {
                if (busy) return;
                state.mode = state.mode === "sec" ? "count" : "sec";
                state.value = state.mode === "sec" ? 3.167 : 6;
                saveState();
                render();
                if (video.duration) makePieces();
            };

            value.onchange = makePieces;
            video.ontimeupdate = moveBlade;
            probe.onloadedmetadata = () => drawEnds();

            $("thisbtn").onclick = () => exportMode("this");
            $("picsbtn").onclick = () => exportMode("pics");
            $("vidsbtn").onclick = () => exportMode("vids");
            $("allbtn").onclick = () => exportMode("all");

            document.addEventListener("keydown", e => {
                if (e.target === value || busy) return;
                if (e.key === " ") { e.preventDefault(); playPiece(); }
                if (e.key === "ArrowLeft" && state.active > 0) { state.active--; playPiece(); render(); saveState(); }
                if (e.key === "ArrowRight" && state.active < state.pieces.length - 1) { state.active++; playPiece(); render(); saveState(); }
            });

            if (state.pieces.length) {
                empty.querySelector("span").textContent = "RELOAD VIDEO";
            }
            render();
        })();
    </script>
</body>
