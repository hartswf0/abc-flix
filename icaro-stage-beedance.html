<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ABC FLIX · BEEDANCE</title>
    <style>
        :root { --bg:#f4f4f0; --black:#111; --white:#fff; --act-e:#0a7a3f; --act-f:#c00; --act-g:#0033cc; --bw:1.5px; --tab-h:56px; --status-h:32px; --cmd-h:42px; --safe-b:env(safe-area-inset-bottom,0px); --mono:'Helvetica Neue',Helvetica,Arial,sans-serif; --accent:#c00; --good:#0a7a3f; --warn:#c8a800; --bad:#c00; --muted:#777; --line:#d0d0d0 }
        * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; border-radius:0 !important }
        html,body { width:100%; height:100%; margin:0; padding:0; overflow:hidden; position:fixed; inset:0; height:100dvh; background:var(--bg); color:var(--black); font-family:var(--mono); user-select:none; -webkit-user-select:none }
        #app { display:flex; flex-direction:column; width:100%; height:100dvh }
        #status-bar { flex:0 0 var(--status-h); display:flex; align-items:center; background:#222; color:var(--white); border-bottom:1px solid #444; z-index:50; padding:0 10px; gap:8px }
        .sb-label { font:900 10px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--accent) }
        .sb-spacer { flex:1 }
        .sb-dot { width:7px; height:7px; border:1px solid #666; flex-shrink:0 }
        .sb-dot.ready { background:#0c0; border-color:#0c0 }
        .sb-dot.busy { background:#ff0; border-color:#ff0 }
        .sb-val { font:700 9px/1 var(--mono); color:#888; text-transform:uppercase }
        #canvas-zone { flex:1 1 0%; overflow-y:auto; overflow-x:hidden; background:var(--bg); padding:10px; scrollbar-width:thin }
        #cmd-zone { flex:0 0 var(--cmd-h); display:flex; align-items:stretch; border-top:2px solid var(--black); background:var(--white); padding:0; gap:0; margin:0 }
        #cmd-zone textarea { flex:1; border:none; background:var(--bg); padding:10px 12px; outline:none; resize:none; font:400 13px/1.3 var(--mono); color:var(--black) }
        #cmd-zone textarea::placeholder { color:#aaa }
        #cmd-zone textarea:focus { background:#fff }
        #cmd-zone button { flex:0 0 var(--cmd-h); border:none; background:var(--accent); color:#fff; font:900 16px/1 var(--mono); cursor:pointer; border-left:2px solid var(--black) }
        #tab-bar { flex:0 0 calc(var(--tab-h) + var(--safe-b)); display:flex; border-top:2px solid var(--black); background:var(--white); z-index:60; padding-bottom:var(--safe-b) }
        .tab-btn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; height:var(--tab-h); font:900 8px/1 var(--mono); text-transform:uppercase; color:var(--black); cursor:pointer; background:var(--white); border:none; border-right:1px solid var(--line); letter-spacing:.05em; transition:background .1s }
        .tab-btn:last-child { border-right:none }
        .tab-letter { font-size:18px; line-height:1; margin-bottom:3px; font-weight:900 }
        .tab-btn.on-e { background:var(--act-e); color:#fff }
        .tab-btn.on-f { background:var(--act-f); color:#fff }
        .tab-btn.on-g { background:var(--act-g); color:#fff }
        .tab-btn.on-h { background:#222; color:#fff }
        .sec-head { padding:6px 10px; background:var(--bg); color:var(--black); font:900 10px/1 var(--mono); text-transform:uppercase; letter-spacing:.1em; border-bottom:1px solid var(--line); margin-top:10px }
        .sec-head:first-child { margin-top:0 }
        .sec-body { padding:10px; background:var(--white); border:1px solid var(--line); border-top:none; margin-bottom:2px }
        .sh-btn { display:flex; align-items:center; justify-content:center; padding:12px 14px; font:900 11px/1 var(--mono); text-transform:uppercase; background:var(--white); border:1.5px solid var(--black); color:var(--black); cursor:pointer; letter-spacing:.06em }
        .sh-btn:active { transform:scale(.98) }
        .sh-row { display:flex; gap:6px }
        .sh-row .sh-btn { flex:1 }
        .sh-label { font:900 9px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:4px }
        .chat-msg { display:flex; gap:8px; padding:6px 0; border-bottom:1px solid var(--line) }
        .chat-msg.user { background:rgba(200,0,0,.04) }
        .chat-who { font:900 9px/1 var(--mono); color:var(--muted); text-transform:uppercase; flex-shrink:0; width:16px; padding-top:2px }
        .chat-msg.user .chat-who { color:var(--accent) }
        .chat-text { font:400 12px/1.5 var(--mono); color:var(--black); white-space:pre-wrap; word-break:break-word; flex:1 }
        .chat-time { font:400 9px/1 var(--mono); color:var(--muted); flex-shrink:0; padding-top:2px }
        .kpi-row { display:flex; gap:6px }
        .kpi { flex:1; border:1px solid var(--line); padding:8px; text-align:center; background:var(--white) }
        .kpi b { display:block; font-size:16px; font-weight:900 }
        .kpi span { font:700 7px/1 var(--mono); text-transform:uppercase; color:var(--muted); letter-spacing:.08em; margin-top:2px; display:block }
        .toast { position:fixed; left:8px; right:8px; bottom:calc(var(--tab-h) + var(--safe-b) + 8px); background:#222; color:#fff; padding:10px 14px; font:400 11px/1.3 var(--mono); z-index:999; transform:translateY(200%); transition:transform .25s; border:1px solid #444 }
        .toast.show { transform:translateY(0) }
        .toast b { display:block; text-transform:uppercase; letter-spacing:.08em; font-size:9px; font-weight:900; margin-bottom:3px; color:var(--accent) }
        .toast p { margin:0; color:#ccc }
        .primary { background:var(--accent) !important; color:#fff !important; border-color:var(--accent) !important }
        .secondary { background:var(--white); color:var(--black); border:1.5px solid var(--black) }
        .danger { background:#fff0f0; color:var(--bad); border:1.5px solid var(--bad) }
        body.embedded #status-bar { flex:0 0 28px; padding:0 6px }
        body.embedded #canvas-zone { padding:6px }
        body.embedded .chat-text { font-size:11px }
        .grid { display:flex; flex-direction:column; gap:6px }
        .grid.two { display:grid; grid-template-columns:1fr 1fr; gap:6px }
        .grid.three { display:grid; grid-template-columns:repeat(3,1fr); gap:6px }
        .card { border:1px solid var(--line); padding:10px; background:var(--white) }
        .card h2 { margin:0 0 6px; font:900 14px/1.2 var(--mono) }
        .card h3 { margin:0 0 4px; font:900 11px/1.2 var(--mono); text-transform:uppercase; letter-spacing:.06em }
        .card p { margin:4px 0 0; font:400 11px/1.5 var(--mono); color:var(--muted) }
        .list { display:flex; flex-direction:column; gap:4px }
        .row { display:flex; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line) }
        .row:last-child { border-bottom:none }
        .row-num { font:900 11px/1 var(--mono); color:var(--muted); width:20px; text-align:center; flex-shrink:0 }
        .row-main { flex:1; min-width:0 }
        .row-main b { display:block; font:700 11px/1.3 var(--mono) }
        .row-main span { display:block; font:400 10px/1.3 var(--mono); color:var(--muted); margin-top:2px }
        .tag { font:900 8px/1 var(--mono); padding:3px 6px; border:1px solid var(--line); text-transform:uppercase; letter-spacing:.06em; white-space:nowrap }
        .tag.good { border-color:var(--good); color:var(--good) }
        .tag.warn { border-color:var(--warn); color:var(--warn) }
        .tag.blue { border-color:var(--act-g); color:var(--act-g) }
        .btn-row { display:flex; gap:6px; flex-wrap:wrap }
        .tiny { font:700 9px/1 var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.06em }
        .wide { width:100% }
        .notice { padding:10px; background:#fffbe6; border:1px solid var(--warn); font:400 11px/1.5 var(--mono) }
        .field { display:flex; flex-direction:column; gap:3px; margin-bottom:8px }
        .field label { font:700 9px/1 var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted) }
        .field input, .field textarea, .field select { border:1.5px solid var(--line); padding:8px; font:400 12px/1.3 var(--mono); background:var(--bg); outline:none }
        .field input:focus, .field textarea:focus { border-color:var(--accent) }
        .settings { max-width:500px }
        .empty { display:flex; align-items:center; justify-content:center; min-height:200px; text-align:center; padding:20px }
        .empty h2 { font:900 14px/1.2 var(--mono); margin:0 0 8px }
        .empty p { font:400 11px/1.5 var(--mono); color:var(--muted); margin:0 0 12px }
        .chips { display:flex; gap:4px; flex-wrap:wrap; justify-content:center }
        .chip { border:1.5px solid var(--black); padding:6px 10px; font:700 10px/1 var(--mono); text-transform:uppercase; cursor:pointer; background:var(--white) }
        .chip:hover { background:var(--bg) }
        .prompt-chip { cursor:pointer }
        .prompt-action { cursor:pointer }
        .selectable { cursor:pointer }
        .selectable:hover { outline:2px solid var(--accent); outline-offset:-2px }
        .export-btn { cursor:pointer }
        .script { font:400 12px/1.6 var(--mono); white-space:pre-wrap; padding:10px; background:var(--white); border:1px solid var(--line) }
        .shot-table { width:100%; border-collapse:collapse; font:400 10px/1.3 var(--mono) }
        .shot-table th { text-align:left; font:900 8px/1 var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding:6px 4px; border-bottom:2px solid var(--black) }
        .shot-table td { padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top }
        .shot-table tr:hover { background:var(--bg) }
        .story-grid { display:flex; gap:6px; flex-wrap:wrap }
        .frame { border:1px solid var(--line); background:var(--white); width:140px; flex-shrink:0; cursor:pointer }
        .frame:hover { border-color:var(--accent) }
        .frame-art { aspect-ratio:128/96; background:#000; overflow:hidden; border-bottom:1px solid var(--line) }
        .frame-body { padding:6px }
        .frame-body b { font:700 10px/1.2 var(--mono); display:block }
        .frame-body p { font:400 9px/1.3 var(--mono); color:var(--muted); margin:3px 0 0 }
        .timeline { padding:10px }
        .timeline h3 { font:900 11px/1 var(--mono); text-transform:uppercase; margin:0 0 8px }
        .tl-row { display:flex; gap:6px; align-items:center; height:24px; margin-bottom:4px }
        .tl-label { font:900 8px/1 var(--mono); text-transform:uppercase; width:60px; flex-shrink:0; text-align:right; color:var(--muted) }
        .tl-track { flex:1; height:16px; background:var(--bg); position:relative; border:1px solid var(--line) }
        .tl-block { position:absolute; top:0; height:100%; font:700 7px/16px var(--mono); text-align:center; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 3px; background:var(--accent) }
        .tl-block.good { background:var(--good) }
        .tl-block.warn { background:var(--warn) }
        .tl-block.blue { background:var(--act-g) }
        .wave { flex:1; height:16px; background:repeating-linear-gradient(90deg,var(--line) 0,var(--line) 1px,transparent 1px,transparent 6px); border:1px solid var(--line) }
        .diagnostic { padding:8px; border:1px solid var(--line); background:var(--white); margin-bottom:4px }
        .diagnostic b { font:700 11px/1.2 var(--mono); display:block }
        .diagnostic p { font:400 10px/1.4 var(--mono); color:var(--muted); margin:3px 0 0 }
        .diagnostic.good { border-left:3px solid var(--good) }
        .diagnostic.warn { border-left:3px solid var(--warn) }
        .diagnostic.bad, .diagnostic.error { border-left:3px solid var(--bad) }
        .diagram-wrap { display:flex; gap:10px }
        .diagram { flex:1; position:relative; min-height:260px; background:var(--bg); border:1px solid var(--line) }
        .inspector { width:200px; display:flex; flex-direction:column; gap:6px }
        .inspector h3 { font:900 11px/1 var(--mono); text-transform:uppercase; margin:0 }
        .train-outline { position:absolute; inset:8%; border:2px solid var(--black); opacity:.15 }
        .seat { position:absolute; width:8px; height:8px; border:1px solid var(--black); opacity:.2 }
        .person { position:absolute; width:28px; height:28px; display:grid; place-items:center; font:900 9px/1 var(--mono); border:2px solid var(--black); background:var(--white); transform:translate(-50%,-50%); cursor:pointer; z-index:3 }
        .person:hover { border-color:var(--accent) }
        .cam { position:absolute; font:900 7px/1 var(--mono); background:var(--accent); color:#fff; padding:3px 5px; transform:translate(-50%,-50%); z-index:4 }
        .bee { position:absolute; width:4px; height:4px; background:#c8a800; border:1px solid var(--black); transform:translate(-50%,-50%); pointer-events:none }
        .path { position:absolute; inset:0; pointer-events:none }
        .path svg { width:100%; height:100% }
        .node { position:absolute; padding:6px 10px; font:700 10px/1.2 var(--mono); border:1.5px solid var(--black); background:var(--white); white-space:nowrap; cursor:pointer; max-width:160px; overflow:hidden; text-overflow:ellipsis }
        .node:hover { border-color:var(--accent) }
        .node.selected { border-color:var(--accent); background:rgba(200,0,0,.05) }
        .edge { position:absolute; height:2px; background:var(--line); transform-origin:left center; z-index:1 }
        .board { position:relative; min-height:200px; overflow-x:auto }
        .stack-item { display:flex; gap:8px; align-items:center; padding:8px; border:1px solid var(--line); background:var(--white) }
        .stack-item .ico { font-size:16px; flex-shrink:0 }
        .stack-item b { font:700 10px/1 var(--mono) }
        .stack-item span { font:400 9px/1 var(--mono); color:var(--muted) }
    </style>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Crect x='4' y='4' width='56' height='56' fill='%23111' stroke='%23333' stroke-width='2'/%3E%3Ccircle cx='32' cy='28' r='14' fill='none' stroke='%23e60000' stroke-width='3'/%3E%3Ccircle cx='32' cy='28' r='5' fill='%23e60000'/%3E%3Ctext x='32' y='44' text-anchor='middle' fill='%23fff' font-family='Helvetica' font-size='9' font-weight='900'%3EBD%3C/text%3E%3C/svg%3E">
</head>
<body>
    <div id="app">
        <div id="status-bar">
            <span class="sb-label" style="color:var(--accent)">BEEDANCE</span>
            <span class="sb-spacer"></span>
            <span class="sb-dot" id="apiDot"></span>
            <span class="sb-val" id="apiLabel">API OFF</span>
        </div>
        <div id="canvas-zone"></div>
        <form id="cmd-zone" onsubmit="event.preventDefault();handleSubmit()">
            <textarea id="chatInput" rows="1" placeholder="Tell BeeDance what to make…"></textarea>
            <button id="sendBtn" type="submit">➤</button>
        </form>
        <nav id="tab-bar">
            <button class="tab-btn on-e" id="tab-e" onclick="navSheet('e')"><span class="tab-letter">E</span>STORY</button>
            <button class="tab-btn" id="tab-f" onclick="navSheet('f')"><span class="tab-letter">F</span>BOARD</button>
            <button class="tab-btn" id="tab-g" onclick="navSheet('g')"><span class="tab-letter">G</span>SHOTS</button>
            <button class="tab-btn" id="tab-h" onclick="navSheet('h')"><span class="tab-letter">H</span>EXPORT</button>
        </nav>
    </div>
    <div class="toast" id="toast"><b></b><p></p></div>
    <script>
        // ── EMBEDDED DETECTION ──
        if (window.self !== window.top) { document.body.classList.add('embedded'); }

        const STORAGE_KEY = "beedance_v1_state";
        const API_KEY_STORAGE = "beedance_v1_api_key";
        let activeSheet = 'e';

        const state = {
            api: { endpoint:"https://api.openai.com/v1/chat/completions", model:"gpt-4o-mini", key:"", remember:false, temperature:0.72, strict:true, connected:false },
            ui: { surface:"overview", sheet:"story", selected:null, busy:false, theme:"light", chatOpen:false },
            chat: [{ role:"assistant", content:"Hi. I'm BeeDance. Tell me the film you want to make.\n\nI can generate scripts, boards, shots, timelines, storyboard prompts, diagnostics, and export packets.\n\nReal generation starts after you add your API key in Settings.", time:nowTime() }],
            project: null, history: []
        };

        function nowTime() { return new Date().toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" }); }
        function uid(prefix="id") { return `${prefix}_${Math.random().toString(36).slice(2,9)}_${Date.now().toString(36)}`; }
        function esc(s="") { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
        function clamp(n,min,max) { return Math.max(min,Math.min(max,n)); }

        function load() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const saved = JSON.parse(raw);
                    Object.assign(state.api, saved.api || {});
                    Object.assign(state.ui, saved.ui || {});
                    state.chat = saved.chat || state.chat;
                    state.project = saved.project || null;
                    state.history = saved.history || [];
                }
                const rememberedKey = localStorage.getItem(API_KEY_STORAGE);
                if (rememberedKey) { state.api.key = rememberedKey; state.api.remember = true; }
            } catch (e) { console.warn(e) }
        }

        function save() {
            const safe = JSON.parse(JSON.stringify(state));
            if (!state.api.remember) safe.api.key = "";
            localStorage.setItem(STORAGE_KEY, JSON.stringify(safe));
            if (state.api.remember && state.api.key) localStorage.setItem(API_KEY_STORAGE, state.api.key);
            if (!state.api.remember) localStorage.removeItem(API_KEY_STORAGE);
        }

        function toast(title, body = "") {
            const t = document.getElementById("toast");
            t.querySelector("b").textContent = title;
            t.querySelector("p").textContent = body;
            t.classList.add("show");
            clearTimeout(toast._t);
            toast._t = setTimeout(() => t.classList.remove("show"), 4200);
        }

        function pushChat(role, content) {
            state.chat.push({ role, content, time: nowTime() });
            save();
            renderCanvas();
        }

        function setBusy(v, label = "Generating") {
            state.ui.busy = v;
            const btn = document.getElementById("sendBtn");
            if (btn) btn.textContent = v ? "…" : "➤";
            renderApiStatus(label);
        }
        function navSheet(id) {
            activeSheet = id;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.className = 'tab-btn';
                if (b.id === 'tab-' + id) b.classList.add('on-' + id);
            });
            renderCanvas();
        }

        function handleSubmit() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            handleUserSubmit(text);
        }

        // ── RENDER ──
        function renderApiStatus(label) {
            const dot = document.getElementById('apiDot');
            const lbl = document.getElementById('apiLabel');
            if (!dot || !lbl) return;
            dot.className = 'sb-dot';
            if (state.ui.busy) { dot.classList.add('busy'); lbl.textContent = label || 'WORKING'; return; }
            if (state.api.connected || state.api.key) { dot.classList.add('ready'); lbl.textContent = 'API ON'; }
            else lbl.textContent = 'API OFF';
        }

        function renderCanvas() {
            const root = document.getElementById('canvas-zone');
            // Chat log always at top
            let html = '<div style="margin-bottom:6px">';
            html += state.chat.map(m => {
                const u = m.role === 'user';
                return `<div class="chat-msg ${u?'user':''}"><div class="chat-who">${u?'Y':'B'}</div><div class="chat-text">${esc(m.content)}</div><div class="chat-time">${m.time||''}</div></div>`;
            }).join('');
            html += '</div>';
            // Then sheet content
            if (!state.project) {
                html += `<div class="sec-head">NO PROJECT</div><div class="sec-body" style="text-align:center;padding:20px">
                    <div style="font:900 14px/1 var(--mono);text-transform:uppercase;margin-bottom:8px">Your film is empty.</div>
                    <div style="font:700 10px/1.4 var(--mono);color:var(--muted);margin-bottom:12px">Type a command below. Example: "make a movie about bees on a train"</div></div>`;
            } else {
                const p = state.project;
                const renderers = { e: () => storySheetHTML(p), f: () => boardSheetHTML(p), g: () => shotsSheetHTML(p), h: () => exportSheetHTML(p) };
                html += (renderers[activeSheet] || renderers.e)();
            }
            root.innerHTML = html;
            root.scrollTop = root.scrollHeight;
            bindSurfaceActions();
        }

        function render() { renderApiStatus(); renderCanvas(); save(); }
        function renderTabs() {} // no-op, tabs are static
        function renderChat() {} // chat is rendered inline in renderCanvas
        function renderSurface() { renderCanvas(); } // alias
        function openChat() { document.getElementById('chatInput').focus(); }
        function closeChat() {} // no-op
        function openChatMobile() { openChat(); }
        function closeChatMobile() { closeChat(); }
        function updateBottomNav() {} // no-op
        function switchSheet(id) { const map = {story:'e',board:'f',shots:'g',export:'h'}; navSheet(map[id]||'e'); }
        // ── SHEET COMPOSITES ──
        function sheetSection(title, content) {
            return `<div class="sec-head">${title}</div><div class="sec-body">${content}</div>`;
        }

        function storySheetHTML(p) {
            const scene = p.scenes?.[0];
            const pkt = p.icaroPacket;
            const totalClips = pkt?.reel?.reduce((s, sc) => s + (sc.beats?.length || 0), 0) || 0;
            const rendered = pkt?.reel?.reduce((s, sc) => s + (sc.beats?.filter(b => b.status === 'rendered').length || 0), 0) || 0;
            return [
                sheetSection(`PROJECT · ${esc(p.title || 'UNTITLED')}`, `
                    <div style="font:400 12px/1.5 var(--mono);color:var(--muted);margin-bottom:8px">${esc(p.logline || 'No logline.')}</div>
                    <div class="kpi-row">
                        <div class="kpi"><b>${p.scenes?.length || 0}</b><span>Scenes</span></div>
                        <div class="kpi"><b>${p.characters?.length || 0}</b><span>Characters</span></div>
                        <div class="kpi"><b>${p.shots?.length || 0}</b><span>Shots</span></div>
                        <div class="kpi"><b>${p.storyboard?.length || 0}</b><span>Frames</span></div>
                    </div>`),
                sheetSection('SCENE', `
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
                        <div><div style="font:700 9px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Current Scene</div>
                        <div style="font:700 13px/1.3 var(--mono)">${scene ? esc(scene.title) : 'No scene'}</div>
                        <div style="font:400 11px/1.4 var(--mono);color:var(--muted);margin-top:4px">${scene ? esc(scene.summary || '') : ''}</div></div>
                        <div><div style="font:700 9px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Theme</div>
                        <div style="font:700 13px/1.3 var(--mono)">${esc(p.theme || 'Not set')}</div></div>
                    </div>`),
                (p.characters?.length ? sheetSection('CAST', `
                    <div style="display:flex;gap:6px;flex-wrap:wrap">${p.characters.map(c => 
                        `<div style="border:1px solid var(--line);padding:8px;flex:1;min-width:120px;background:var(--white)">
                            <div style="font:700 12px/1 var(--mono)">${esc(c.name)}</div>
                            <div style="font:400 10px/1 var(--mono);color:var(--muted);margin-top:4px">${esc(c.role || '')}</div>
                            <div style="font:400 10px/1.4 var(--mono);color:var(--muted);margin-top:4px">${esc(c.description || '')}</div>
                        </div>`).join('')}</div>`) : ''),
                sheetSection('SCRIPT', `
                    <pre style="font:400 12px/1.6 var(--mono);white-space:pre-wrap;max-height:240px;overflow:auto;margin:0;color:var(--black)">${esc(p.script || p.scenes?.map(s => s.script).filter(Boolean).join('\n\n') || 'No script yet.')}</pre>`),
                (pkt && totalClips > 0 ? sheetSection(`ICARO QUEUE · ${rendered}/${totalClips} CLIPS`, `
                    <div style="height:6px;border:1px solid var(--line);margin-bottom:8px;background:var(--bg)">
                        <div style="height:100%;width:${totalClips?Math.round(rendered/totalClips*100):0}%;background:var(--good)"></div>
                    </div>
                    <div class="btn-row">
                        <button class="primary prompt-action" data-prompt="prepare this project for Icaro Stage">Regenerate Queue</button>
                        <button class="secondary" id="copyFullPacket">Copy Packet JSON</button>
                    </div>`) : sheetSection('ICARO QUEUE', `
                    <div style="font:700 9px/1.3 var(--mono);color:var(--muted)">No queue yet. Ask to prepare this project for Icaro Stage.</div>
                    <button class="primary prompt-action" data-prompt="prepare this project for Icaro Stage" style="margin-top:6px">Prepare for Icaro</button>`)),
                sheetSection('RECENT CHANGES', `
                    <div class="list">${(p.changeLog || []).slice(-6).reverse().map(x => 
                        `<div class="row"><div class="row-num">✓</div><div class="row-main"><b>${esc(x.title || 'Change')}</b><span>${esc(x.body || '')}</span></div><span class="tag">${esc(x.time || '')}</span></div>`).join('') || '<div style="font:700 9px/1 var(--mono);color:var(--muted);text-transform:uppercase">No changes yet.</div>'}</div>`)
            ].join('');
        }

        function boardSheetHTML(p) {
            const frames = p.storyboard || [];
            return [
                sheetSection('STORYBOARD', `
                    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">
                        <button class="primary prompt-action" data-prompt="generate or regenerate the full storyboard prompts for every shot">Regenerate Storyboard</button>
                    </div>
                    <div style="display:flex;gap:3px;flex-wrap:wrap">
                        ${frames.map((f, i) => `<div style="width:120px;border:var(--bw) solid var(--black);background:var(--white);flex-shrink:0" class="selectable" data-select-type="storyboard-frame" data-select-id="${f.id}" data-select-label="${esc(f.title)}">
                            <div style="aspect-ratio:128/96;background:#000;overflow:hidden;border-bottom:2px solid var(--black);position:relative">
                                ${f.imageData ? `<img src="${f.imageData}" style="width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated">` : `<div style="width:100%;height:100%;background:var(--bg);display:grid;place-items:center;font:900 18px/1 var(--mono);color:var(--muted)">${String(i+1).padStart(2,'0')}</div>`}
                                <div style="position:absolute;bottom:0;left:0;right:0;padding:2px 4px;background:rgba(0,0,0,.75);font:700 6px/1 var(--mono);color:#fff;text-transform:uppercase;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(f.title)}</div>
                            </div>
                            <div style="padding:4px;font:900 8px/1.2 var(--mono);text-transform:uppercase">${String(i+1).padStart(2,'0')} ${esc(f.title)}</div>
                            <div style="padding:0 4px 4px;font:700 8px/1.3 var(--mono);color:var(--muted)">${esc((f.description || f.prompt || '').substring(0,60))}</div>
                        </div>`).join('')}
                        ${frames.length === 0 ? '<div style="font:700 9px/1 var(--mono);color:var(--muted);text-transform:uppercase;padding:12px">No frames. Ask BeeDance or capture from Icaro Stage.</div>' : ''}
                    </div>`),
                sheetSection('DIAGRAM', boardHTML(p))
            ].join('');
        }

        function shotsSheetHTML(p) {
            return [
                sheetSection('SHOT LIST', shotsHTML(p)),
                sheetSection('TIMELINE', timelineHTML(p)),
                sheetSection('DIAGNOSTICS', diagnosticsHTML(p))
            ].join('');
        }

        function exportSheetHTML(p) {
            return [
                sheetSection('EXPORT', exportHTML(p)),
                sheetSection('SETTINGS', settingsHTML())
            ].join('');
        }

        function scriptHTML(p) {
            const sceneTabs = (p.scenes || []).map((s, i) => `<button class="chip selectable" data-select-type="scene" data-select-id="${s.id}" data-select-label="${esc(s.title)}">${i + 1}. ${esc(s.title)}</button>`).join("");
            const text = p.script || p.scenes?.map(s => s.script).filter(Boolean).join("\n\n") || "No script yet.";
            return `<div class="grid"><div class="card"><h3>Script Surface</h3><div class="chips" style="justify-content:flex-start">${sceneTabs}</div></div><div class="script">${esc(text)}</div></div>`;
        }

        function boardHTML(p) {
            const nodes = p.beats || [];
            if (!nodes.length) return `<div class="card"><h3>No causal board yet</h3><p>Ask BeeDance to create a story map.</p></div>`;
            const W = 720, H = 450;
            const positions = nodes.map((b, i) => {
                const cols = Math.min(4, Math.ceil(Math.sqrt(nodes.length)));
                const row = Math.floor(i / cols), col = i % cols;
                return { id: b.id, x: 40 + col * (W - 200) / (cols - 1 || 1), y: 35 + row * 120 };
            });
            const edges = [];
            for (let i = 0; i < positions.length - 1; i++) edges.push([positions[i], positions[i + 1]]);
            const edgeHTML = edges.map(([a, b]) => {
                const x1 = a.x + 150, y1 = a.y + 31, x2 = b.x, y2 = b.y + 31;
                const dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy), ang = Math.atan2(dy, dx) * 180 / Math.PI;
                return `<div class="edge" style="left:${x1}px;top:${y1}px;width:${len}px;transform:rotate(${ang}deg)"></div>`;
            }).join("");
            return `<div class="board" style="min-width:${W}px">${edgeHTML}${nodes.map((b, i) => { const pos = positions[i]; return `<div class="node selectable ${state.ui.selected?.id === b.id ? "selected" : ""}" style="left:${pos.x}px;top:${pos.y}px" data-select-type="beat" data-select-id="${b.id}" data-select-label="${esc(b.title)}">${i + 1}. ${esc(b.title)}</div>` }).join("")}</div>`;
        }

        function diagramHTML(p) {
            const d = p.blocking || defaultBlocking();
            const seats = [];
            for (let i = 0; i < 6; i++) seats.push(`<div class="seat" style="left:${12 + i * 13}%;top:18%"></div><div class="seat" style="left:${12 + i * 13}%;top:70%"></div>`);
            const people = (d.characters || []).map(ch => `<div class="person ${esc(ch.kind || "")} selectable" data-select-type="blocking-character" data-select-id="${esc(ch.id)}" data-select-label="${esc(ch.name)}" style="left:${ch.x}%;top:${ch.y}%">${esc((ch.name || "?").slice(0, 2).toUpperCase())}</div>`).join("");
            const cams = (d.cameras || []).map(c => `<div class="cam selectable" data-select-type="camera" data-select-id="${esc(c.id)}" data-select-label="${esc(c.label)}" style="left:${c.x}%;top:${c.y}%">${esc(c.label)}</div>`).join("");
            const bees = Array.from({ length: d.beeCount || 46 }, (_, i) => {
                const a = i * 2.399, r = 2 + (i % 19) * .7;
                const x = (d.beeCenter?.x || 52) + Math.cos(a) * r + ((i % 5) - 2) * .8;
                const y = (d.beeCenter?.y || 50) + Math.sin(a) * r * .65 + ((i % 7) - 3) * .5;
                return `<i class="bee" style="left:${clamp(x, 8, 92)}%;top:${clamp(y, 12, 88)}%"></i>`;
            }).join("");
            const path = `<div class="path"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M ${d.path?.[0]?.x || 18} ${d.path?.[0]?.y || 52} C 35 30, 48 72, 58 48 S 78 42, 86 34" fill="none" stroke="#149947" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M86 34 l-4 1 l2 4" fill="none" stroke="#149947" stroke-width="1.2"/></svg></div>`;
            return `
        <div class="diagram-wrap">
          <div class="diagram">
            <div class="train-outline"></div>${seats.join("")}${path}${bees}${people}${cams}
          </div>
          <div class="inspector">
            <h3>Diagram Inspector</h3>
            <p class="tiny">Top-down blocking generated from project state.</p>
            <div class="field"><label>Scene</label><input value="${esc(p.scenes?.[0]?.title || "Scene")}" readonly></div>
            <div class="field"><label>Swarm Density</label><input value="${d.beeCount || 46} bees shown" readonly></div>
            <div class="field"><label>Selected</label><input value="${esc(state.ui.selected?.label || "None")}" readonly></div>
            <button class="primary wide prompt-action" data-prompt="regenerate the blocking diagram from the current script and make it clearer">Regenerate Blocking</button>
            <button class="secondary wide prompt-action" style="margin-top:8px" data-prompt="make the bee path more readable and update the camera positions">Clarify Paths</button>
          </div>
        </div>`;
        }

        function shotsHTML(p) {
            const shots = p.shots || [];
            return `<div class="card"><h3>Shot List</h3><table class="shot-table"><thead><tr><th>#</th><th>Shot</th><th>Camera</th><th>Type</th><th>Purpose</th><th>Time</th></tr></thead><tbody>${shots.map((s, i) => `<tr class="selectable" data-select-type="shot" data-select-id="${s.id}" data-select-label="${esc(s.title)}"><td>${String(i + 1).padStart(2, "0")}</td><td><b>${esc(s.title)}</b><br><span class="tiny">${esc(s.subject || "")}</span></td><td>${esc(s.camera || "")}</td><td>${esc(s.type || "")}</td><td>${esc(s.purpose || "")}</td><td>${esc(s.time || "")}</td></tr>`).join("")}</tbody></table>${shots.length ? "" : `<p>No shots yet. Ask BeeDance to generate a shot list.</p>`}</div>`;
        }

        function timelineHTML(p) {
            const rows = p.timeline?.tracks || [];
            return `<div class="timeline"><h3>Timeline / State Strip</h3>${rows.map((r, idx) => `<div class="tl-row"><div class="tl-label">${esc(r.label)}</div><div class="tl-track">${(r.blocks || []).map((b, j) => `<div class="tl-block ${["good", "warn", "blue", ""][j % 4]}" style="left:${b.start || 0}%;width:${b.width || 20}%">${esc(b.label)}</div>`).join("")}</div></div>`).join("")}<div class="tl-row"><div class="tl-label">Sound</div><div class="wave"></div></div>${rows.length ? "" : `<p>No timeline yet. Ask BeeDance to build the timeline.</p>`}</div>`;
        }

        function storyboardHTML(p) {
            const frames = p.storyboard || [];
            return `<div class="grid"><div class="card"><h3>Storyboard</h3><p>Capture frames from Icaro Stage or generate prompts. In the Studio, use <b>⊙ Capture</b> to grab frames and <b>Send boards to plan →</b> to import them here.</p><button class="primary prompt-action" data-prompt="generate or regenerate the full storyboard prompts for every shot">Regenerate Storyboard</button></div><div class="story-grid">${frames.map((f, i) => `<div class="frame selectable" data-select-type="storyboard-frame" data-select-id="${f.id}" data-select-label="${esc(f.title)}"><div class="frame-art">${f.imageData ? `<img src="${f.imageData}" alt="${esc(f.title)}" style="width:100%;height:100%;object-fit:cover;display:block;image-rendering:pixelated;background:#000">` : frameSVG(i, f)}</div><div class="frame-body"><b>${String(i + 1).padStart(2, "0")} ${esc(f.title)}</b>${f.type === 'capture' ? '<span class="tag" style="font-size:8px;margin-left:6px">CAPTURED</span>' : ''}<p>${esc(f.description || f.prompt || "")}</p></div></div>`).join("")}</div>${frames.length ? "" : `<div class="card"><p>No storyboard yet.</p></div>`}</div>`;
        }

        function frameSVG(i, f) {
            const mood = i % 4;
            return `<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
        <rect width="320" height="200" fill="#f7f7f2"/>
        <rect x="12" y="24" width="296" height="130" rx="18" fill="none" stroke="#111" stroke-width="4"/>
        <line x1="28" y1="70" x2="292" y2="70" stroke="#111" stroke-width="2" opacity=".35"/>
        <line x1="28" y1="126" x2="292" y2="126" stroke="#111" stroke-width="2" opacity=".35"/>
        ${Array.from({ length: mood === 2 ? 34 : 18 }, (_, k) => `<circle cx="${130 + Math.cos(k * 2.1) * (20 + k % 10 * 3)}" cy="${86 + Math.sin(k * 1.7) * (10 + k % 8 * 2)}" r="3" fill="#c48800" stroke="#111"/>`).join("")}
        <circle cx="${60 + mood * 12}" cy="120" r="15" fill="#111"/><rect x="${48 + mood * 12}" y="136" width="24" height="28" fill="#111"/>
        <circle cx="238" cy="118" r="15" fill="#111"/><rect x="226" y="134" width="24" height="28" fill="#111"/>
        <path d="M40 172 C90 150, 150 186, 210 164 S280 160,300 145" fill="none" stroke="#111" stroke-width="3"/>
        <text x="16" y="18" font-family="monospace" font-size="11" font-weight="900" fill="#111">${esc(f.camera || "CAM")} · ${esc(f.type || "SHOT")}</text>
      </svg>`;
        }

        function diagnosticsHTML(p) {
            const ds = p.diagnostics || [];
            return `<div class="grid"><div class="card"><h3>Diagnostics</h3><p>Ask in plain language: “fix whatever doesn't make sense.”</p><button class="primary prompt-action" data-prompt="run a full story diagnostic and repair anything that does not make sense while preserving the current project">Fix Whatever Doesn't Make Sense</button></div><div class="list">${ds.map(d => `<div class="diagnostic ${esc(d.severity || "warn")}"><b>${esc(d.title)}</b><p>${esc(d.description)}</p><p class="tiny">Affects: ${esc((d.affects || []).join(", "))}</p></div>`).join("") || `<div class="diagnostic good"><b>No diagnostics yet</b><p>Ask BeeDance to check the story.</p></div>`}</div></div>`;
        }

        function icaroHTML(p) {
            const pkt = p.icaroPacket;
            if (!pkt || !pkt.reel || !pkt.reel.length) return `
        <div class="empty"><div>
          <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3"><rect x="18" y="18" width="64" height="64" rx="8"/><path d="M38 38h24M38 50h24M38 62h16"/><circle cx="72" cy="72" r="14" fill="currentColor" stroke="none" opacity=".25"/><path d="M68 72h8M72 68v8" stroke-width="3"/></svg>
          <h2>No Icaro Queue</h2>
          <p>Ask BeeDance to prepare this project for Icaro Stage. The film will be broken into small render units that Icaro can build one at a time.</p>
          <div class="chips">
            <button class="chip prompt-chip">prepare this project for Icaro Stage</button>
            <button class="chip prompt-chip">break this film into BEFLIX render units</button>
          </div>
        </div></div>`;
            const totalClips = pkt.reel.reduce((s, sc) => s + (sc.beats?.length || 0), 0);
            const rendered = pkt.reel.reduce((s, sc) => s + (sc.beats?.filter(b => b.status === 'rendered').length || 0), 0);
            const pct = totalClips ? Math.round(rendered / totalClips * 100) : 0;
            return `
        <div class="grid">
          <div class="card">
            <h2 style="display:flex;align-items:center;gap:10px">◈ Icaro Queue <span class="tag" style="font-size:10px">${rendered}/${totalClips} CLIPS · ${pct}%</span></h2>
            <p>${esc(pkt.projectTitle || p.title)} · ${pkt.grid || '128×96'} · ${pkt.fps || 12} fps</p>
            <div style="height:8px;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:8px 0">
              <div style="height:100%;width:${pct}%;background:var(--good);transition:.3s"></div>
            </div>
            <div class="btn-row">
              <button class="primary prompt-action" data-prompt="prepare this project for Icaro Stage">Regenerate Queue</button>
              <button class="secondary" id="copyFullPacket">Copy Full Packet JSON</button>
            </div>
          </div>
          ${pkt.reel.map((sc, si) => {
              const scRendered = (sc.beats || []).filter(b => b.status === 'rendered').length;
              return `<div class="card"><h3>${esc(sc.sceneTitle || sc.sceneId)} <span class="tag">${scRendered}/${sc.beats?.length || 0}</span></h3>
              <div class="list">${(sc.beats || []).map((bt, bi) => {
                  const st = bt.status || 'not_sent';
                  const stClass = st === 'rendered' ? 'good' : st === 'revision' ? 'warn' : '';
                  const stLabel = st === 'rendered' ? '✓ RENDERED' : st === 'revision' ? '⟳ REVISION' : st === 'sent' ? '↗ SENT' : '○ NOT SENT';
                  return `<div class="row selectable" data-select-type="icaro-clip" data-select-id="${esc(bt.beatId)}" data-select-label="${esc(bt.clipTitle || bt.beatId)}">
                    <div class="row-num" style="font-size:9px">${String(si+1).padStart(2,'0')}.${String(bi+1).padStart(2,'0')}</div>
                    <div class="row-main"><b>${esc(bt.clipTitle || bt.beatId)}</b><span>${esc(bt.visualIntent || '')}</span></div>
                    <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
                      <span class="tag ${stClass}">${stLabel}</span>
                      <div class="btn-row" style="gap:4px">
                        <button class="secondary icaro-send" data-clip-idx="${si}-${bi}" style="font-size:9px;padding:5px 7px;background:var(--accent);color:#fff;border-color:var(--accent)">SEND →</button>
                        <button class="secondary icaro-copy" data-clip-idx="${si}-${bi}" style="font-size:9px;padding:5px 7px">COPY</button>
                        <button class="secondary icaro-mark" data-clip-idx="${si}-${bi}" style="font-size:9px;padding:5px 7px">${st === 'rendered' ? 'UNMARK' : 'MARK ✓'}</button>
                      </div>
                    </div>
                  </div>`;
              }).join('')}</div></div>`;
          }).join('')}
          <div class="card"><h3>Continuity Rules</h3><div class="list">${(pkt.style?.continuityRules || []).map(r => `<div class="row"><div class="row-num">◆</div><div class="row-main"><span>${esc(r)}</span></div></div>`).join('') || '<p>None specified.</p>'}</div></div>
        </div>`;
        }

        function stackHTML(p) {
            return `<div class="grid three">${stackItems(p).map(item => `<div class="stack-item"><div class="ico">${item.ico}</div><div><b>${esc(item.title)}</b><br><span>${esc(item.body)}</span></div><span class="tag">${item.count}</span></div>`).join("")}</div>`;
        }

        function exportHTML(p) {
            const ready = Boolean(p.script && p.shots?.length && (p.storyboard?.length || p.storyboardPrompts?.length));
            return `<div class="grid">
        <div class="card"><h2>${ready ? "Production Packet Ready" : "Export Checklist"}</h2><p>${ready ? "Everything needed for a first packet exists." : "Some outputs are missing. You can still export project JSON, or ask BeeDance to finish the missing assets."}</p></div>
        <div class="grid two">
          <button class="primary export-btn" data-export="json">Download Project JSON</button>
          <button class="secondary export-btn" data-export="script">Download Script HTML</button>
          <button class="secondary export-btn" data-export="shots">Download Shot List CSV</button>
          <button class="secondary export-btn" data-export="storyboard">Download Storyboard HTML</button>
          <button class="primary export-btn wide" data-export="flipbook" style="grid-column: 1 / -1; background: var(--accent); border-color: var(--accent); color: white;">Print Flipbook (A4)</button>
        </div>
        <div class="card"><h3>Deliverables</h3><div class="list">
          <div class="row"><div class="row-num">${p.script ? "✓" : "!"}</div><div class="row-main"><b>Script</b><span>${p.script ? "Generated" : "Missing"}</span></div></div>
          <div class="row"><div class="row-num">${p.shots?.length ? "✓" : "!"}</div><div class="row-main"><b>Shot List</b><span>${p.shots?.length || 0} shots</span></div></div>
          <div class="row"><div class="row-num">${p.storyboard?.length ? "✓" : "!"}</div><div class="row-main"><b>Storyboard</b><span>${p.storyboard?.length || 0} frames/prompts</span></div></div>
          <div class="row"><div class="row-num">✓</div><div class="row-main"><b>Scene Data</b><span>JSON state export available</span></div></div>
        </div></div>
      </div>`;
        }

        function settingsHTML() {
            return `<div class="settings grid">
        <div class="notice"><strong>Real AI mode.</strong> BeeDance does not fake generation. Add an OpenAI-compatible chat/completions endpoint and API key. Your key is used directly from this browser. For production, put a server proxy in front of this.</div>
        <div class="card">
          <h2>AI Settings</h2>
          <div class="field"><label>Endpoint</label><input id="apiEndpoint" value="${esc(state.api.endpoint)}" placeholder="https://api.openai.com/v1/chat/completions"></div>
          <div class="field"><label>Model</label><input id="apiModel" value="${esc(state.api.model)}" placeholder="gpt-4o-mini"></div>
          <div class="field"><label>API Key</label><input id="apiKey" type="password" value="${esc(state.api.key)}" placeholder="sk-..."></div>
          <div class="field"><label>Temperature</label><input id="apiTemp" type="number" min="0" max="2" step="0.05" value="${esc(state.api.temperature)}"></div>
          <label style="display:flex;gap:9px;align-items:center;margin:8px 0 14px"><input id="rememberKey" type="checkbox" ${state.api.remember ? "checked" : ""}> <span>Remember key on this device</span></label>
          <div class="btn-row"><button class="primary" id="saveSettings">Save Settings</button><button class="secondary" id="testApi">Test Connection</button><button class="danger" id="clearKey">Clear Key</button></div>
        </div>
        <div class="card"><h3>Required model behavior</h3><p>The model must return JSON with an assistant_message and an actions array. BeeDance applies the actions to the project state and then renders all surfaces from that state.</p></div>
      </div>`;
        }

        function renderStack() {
            const body = document.getElementById("stackBody");
            if (!body) return;
            const items = state.project ? stackItems(state.project) : [];
            const countEl = document.getElementById("stackCount");
            if (countEl) countEl.textContent = `${items.length} assets`;
            body.innerHTML = items.length ? items.map(item => `<div class="stack-item"><div class="ico">${item.ico}</div><div><b>${esc(item.title)}</b><br><span>${esc(item.body)}</span></div><span class="tag">${item.count}</span></div>`).join("") : `<div class="notice">No project stack yet. Start by typing a movie idea.</div>`;
        }

        function stackItems(p) {
            const icaroClips = p.icaroPacket?.reel?.reduce((s, sc) => s + (sc.beats?.length || 0), 0) || 0;
            const icaroRendered = p.icaroPacket?.reel?.reduce((s, sc) => s + (sc.beats?.filter(b => b.status === 'rendered').length || 0), 0) || 0;
            return [
                { ico: "🎬", title: "Project", body: p.title || "Untitled", count: "1" },
                { ico: "👥", title: "Characters", body: "Cast and lenses", count: p.characters?.length || 0 },
                { ico: "▤", title: "Scenes", body: "Script scenes", count: p.scenes?.length || 0 },
                { ico: "⌁", title: "Causal Board", body: "Beats and links", count: p.beats?.length || 0 },
                { ico: "🎥", title: "Shots", body: "Camera plan", count: p.shots?.length || 0 },
                { ico: "▧", title: "Storyboard", body: "Frames and prompts", count: p.storyboard?.length || 0 },
                { ico: "◈", title: "Icaro Queue", body: icaroClips ? `${icaroRendered}/${icaroClips} rendered` : "Not prepared", count: icaroClips },
                { ico: "⚠", title: "Diagnostics", body: "Story checks", count: p.diagnostics?.length || 0 }
            ];
        }

        function bindPromptChips() {
            document.querySelectorAll(".prompt-chip").forEach(b => b.onclick = () => { document.getElementById("chatInput").value = b.textContent; openChat(); });
        }

        function bindSurfaceActions() {
            document.querySelectorAll(".selectable").forEach(el => el.onclick = () => {
                state.ui.selected = { type: el.dataset.selectType, id: el.dataset.selectId, label: el.dataset.selectLabel };
                toast("Selected", `${state.ui.selected.type}: ${state.ui.selected.label}`);
            });
            document.querySelectorAll(".prompt-action").forEach(b => b.onclick = () => {
                document.getElementById("chatInput").value = b.dataset.prompt;
                openChat();
            });
            document.querySelectorAll(".prompt-chip").forEach(b => b.onclick = () => {
                document.getElementById("chatInput").value = b.textContent;
                openChat();
            });
            document.querySelectorAll(".export-btn").forEach(b => b.onclick = () => exportThing(b.dataset.export));
            // Settings (embedded in export sheet)
            const saveBtn = document.getElementById("saveSettings");
            if (saveBtn) bindSettings();
            // Icaro Queue buttons
            const copyPktBtn = document.getElementById("copyFullPacket");
            if (copyPktBtn) copyPktBtn.onclick = () => { const pkt = state.project?.icaroPacket; if (pkt) { navigator.clipboard.writeText(JSON.stringify(pkt, null, 2)).then(() => toast("Copied", "Full ICARO_REEL_PACKET copied to clipboard.")).catch(() => toast("Error", "Copy failed.")); } };
            document.querySelectorAll(".icaro-copy").forEach(b => b.onclick = (e) => { e.stopPropagation(); const [si, bi] = b.dataset.clipIdx.split('-').map(Number); const bt = state.project?.icaroPacket?.reel?.[si]?.beats?.[bi]; if (bt) { const clipPkt = { type: 'ICARO_CLIP_UNIT', sceneId: state.project.icaroPacket.reel[si].sceneId, ...bt, grid: state.project.icaroPacket.grid, fps: state.project.icaroPacket.fps, style: state.project.icaroPacket.style }; navigator.clipboard.writeText(JSON.stringify(clipPkt, null, 2)).then(() => toast("Copied", bt.clipTitle || bt.beatId)).catch(() => toast("Error", "Copy failed.")); } });
            document.querySelectorAll(".icaro-mark").forEach(b => b.onclick = (e) => { e.stopPropagation(); const [si, bi] = b.dataset.clipIdx.split('-').map(Number); const bt = state.project?.icaroPacket?.reel?.[si]?.beats?.[bi]; if (bt) { bt.status = bt.status === 'rendered' ? 'not_sent' : 'rendered'; save(); render(); toast(bt.status === 'rendered' ? 'Marked rendered' : 'Unmarked', bt.clipTitle || bt.beatId); } });
            // SEND TO STAGE via postMessage bus
            document.querySelectorAll(".icaro-send").forEach(b => b.onclick = (e) => {
                e.stopPropagation();
                const [si, bi] = b.dataset.clipIdx.split('-').map(Number);
                const bt = state.project?.icaroPacket?.reel?.[si]?.beats?.[bi];
                if (bt) {
                    const clipPkt = { type: 'ICARO_CLIP_UNIT', sceneId: state.project.icaroPacket.reel[si].sceneId, sceneTitle: state.project.icaroPacket.reel[si].sceneTitle, ...bt, grid: state.project.icaroPacket.grid, fps: state.project.icaroPacket.fps, style: state.project.icaroPacket.style };
                    window.parent.postMessage(clipPkt, '*');
                    bt.status = 'sent';
                    save(); render();
                    toast("Sent to Stage", bt.clipTitle || bt.beatId);
                }
            });
        }

        function bindSettings() {
            document.getElementById("saveSettings").onclick = saveSettings;
            document.getElementById("testApi").onclick = testApi;
            document.getElementById("clearKey").onclick = () => { state.api.key = ""; state.api.connected = false; localStorage.removeItem(API_KEY_STORAGE); save(); render(); toast("Key cleared", "Generation is blocked until a key is added."); };
        }

        function saveSettings() {
            state.api.endpoint = document.getElementById("apiEndpoint").value.trim();
            state.api.model = document.getElementById("apiModel").value.trim();
            state.api.key = document.getElementById("apiKey").value.trim();
            state.api.temperature = Number(document.getElementById("apiTemp").value || 0.7);
            state.api.remember = document.getElementById("rememberKey").checked;
            save(); render(); toast("Settings saved", state.api.key ? "API key present." : "No API key saved.");
        }

        async function testApi() {
            saveSettings();
            if (!requireApi()) return;
            setBusy(true, "Testing API");
            try {
                const res = await callChat([{ role: "system", content: "Return only this JSON: {\"assistant_message\":\"ok\",\"actions\":[]}" }, { role: "user", content: "test" }], .1);
                state.api.connected = true;
                toast("API connected", "The endpoint responded. BeeDance can generate real project actions.");
            } catch (e) {
                state.api.connected = false;
                toast("API test failed", e.message || String(e));
            } finally { setBusy(false); render(); }
        }

        function requireApi() {
            if (!state.api.endpoint || !state.api.model || !state.api.key) {
                state.ui.surface = "settings";
                render();
                toast("API required", "Add endpoint, model, and key before generating.");
                return false;
            }
            return true;
        }

        async function handleUserSubmit(text) {
            text = text.trim();
            if (!text || state.ui.busy) return;
            pushChat("user", text);
            if (!requireApi()) return;
            setBusy(true, "Asking AI");
            try {
                const packet = await askAIForActions(text);
                if (packet.assistant_message) pushChat("assistant", packet.assistant_message);
                applyActions(packet.actions || [], text);
                state.api.connected = true;
                render();
            } catch (e) {
                pushChat("assistant", `Generation failed. ${e.message || e}\n\nYour project state was preserved.`);
                toast("Generation failed", e.message || String(e));
            } finally {
                setBusy(false); render();
            }
        }

        function projectSummaryForPrompt() {
            if (!state.project) return "No project exists yet.";
            const p = state.project;
            return JSON.stringify({
                title: p.title, logline: p.logline, genre: p.genre, tone: p.tone, theme: p.theme,
                scenes: (p.scenes || []).map(s => ({ id: s.id, title: s.title, summary: s.summary })),
                characters: (p.characters || []).map(c => ({ id: c.id, name: c.name, role: c.role, description: c.description })),
                beats: (p.beats || []).map(b => ({ id: b.id, title: b.title, description: b.description })),
                shots: (p.shots || []).map(s => ({ id: s.id, title: s.title, type: s.type, purpose: s.purpose, time: s.time })),
                selected: state.ui.selected
            }, null, 2);
        }

        function systemPrompt() {
            return `You are BeeDance, a real AI action engine for a chat-first film builder. Words assemble film. The GUI only reveals, tunes, selects, and exports state.

CRITICAL OUTPUT RULE:
Return ONLY valid JSON. No markdown. No code fences. The JSON shape is:
{"assistant_message":"short helpful message to user","actions":[{"type":"action_name","payload":{}}]}

You are not a prose chatbot. You generate structured actions that mutate a project.

Supported actions:
- create_project: payload is a full project object.
- update_project: payload fields merge into project.
- add_change: payload {title, body}.
- set_surface: payload {surface}. Valid surfaces: overview, script, board, diagram, shots, timeline, storyboard, diagnostics, icaro, stack, export, settings.
- replace_characters: payload {characters:[...]}
- replace_scenes: payload {scenes:[...]}
- replace_beats: payload {beats:[...]}
- replace_script: payload {script:"..."}
- replace_blocking: payload {blocking:{characters,cameras,beeCenter,beeCount,path}}
- replace_shots: payload {shots:[...]}
- replace_timeline: payload {timeline:{tracks:[...]}}
- replace_storyboard: payload {storyboard:[...]}
- replace_diagnostics: payload {diagnostics:[...]}
- create_icaro_reel_packet: payload {packet:{...}} — Generates the ICARO_REEL_PACKET for Icaro Stage.

When creating a new project, generate a complete first pass: project, characters, scenes, beats, script, blocking, shots, timeline, storyboard prompts, diagnostics.

Every entity needs stable ids. Use lowercase ids like char_frank, scene_01, beat_01, shot_01, frame_01.

Project shape:
{
 title, logline, genre, tone:[...], theme, createdAt,
 characters:[{id,name,role,description,motivation,fear,dialogueStyle}],
 scenes:[{id,title,slugline,summary,script,beats:[beat ids]}],
 beats:[{id,title,description,purpose}],
 script,
 blocking:{characters:[{id,name,kind,x,y}], cameras:[{id,label,x,y}], beeCenter:{x,y}, beeCount:number, path:[{x,y}]},
 shots:[{id,title,camera,type,subject,purpose,time,beatId,description}],
 timeline:{tracks:[{label,blocks:[{label,start,width}]}]},
 storyboard:[{id,title,shotId,camera,type,description,prompt}],
 diagnostics:[{id,severity,title,description,affects:[...]}],
 changeLog:[]
}

Icaro Stage Integration:
When the user says "prepare this project for Icaro Stage" or similar, generate a create_icaro_reel_packet action AND a set_surface action to "icaro".
The ICARO_REEL_PACKET breaks the film into small renderable BEFLIX clips. Do NOT write the whole BEFLIX movie as one huge script. Each render unit should be 10-120 frames, one visual idea, one camera logic.

ICARO_REEL_PACKET shape:
{
  type: "ICARO_REEL_PACKET",
  projectTitle, grid: "128x96", fps: 12,
  style: { palette, motion, density, continuityRules: [...] },
  reel: [{
    sceneId, sceneTitle, durationFrames,
    beats: [{
      beatId, clipTitle, durationFrames, fps,
      visualIntent, dramaticPurpose, continuityRules: [...],
      requiredObjects: [...], motionPlan,
      beflixPrompt: "detailed BEFLIX generation prompt for this clip",
      acceptanceCriteria: [...], suggestedFileName,
      status: "not_sent"
    }]
  }]
}

BEFLIX prompt rules: grid is 128×96, commands are CLR/PNT/LIN/REC/SHF, intensity 0-7. Build each frame from scratch where possible. Use REC values rhythmically. Make every clip readable in monochrome.

For Bees on a Train, keep it funny, chaotic, cinematic, and filmable. Assume novice prompts. Make strong decisions. Keep scope small if the user refers to selected object. If user asks to export, set surface to export and add missing export readiness diagnostics if needed.`;
        }

        async function askAIForActions(userText) {
            const messages = [
                { role: "system", content: systemPrompt() },
                { role: "user", content: `Current project state summary:\n${projectSummaryForPrompt()}\n\nCurrent surface: ${state.ui.surface}\nSelected object: ${JSON.stringify(state.ui.selected)}\n\nUser request:\n${userText}` }
            ];
            const raw = await callChat(messages, state.api.temperature);
            return parseActionPacket(raw);
        }

        async function callChat(messages, temperature) {
            const res = await fetch(state.api.endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${state.api.key}` },
                body: JSON.stringify({ model: state.api.model, messages, temperature, response_format: { type: "json_object" } })
            });
            const text = await res.text();
            if (!res.ok) throw new Error(`HTTP ${res.status}: ${text.slice(0, 400)}`);
            let data;
            try { data = JSON.parse(text); } catch { throw new Error(`Endpoint returned non-JSON response: ${text.slice(0, 300)}`) }
            const content = data.choices?.[0]?.message?.content ?? data.output_text ?? data.content;
            if (!content) throw new Error("No assistant content returned by endpoint.");
            return content;
        }

        function parseActionPacket(raw) {
            let txt = String(raw).trim();
            txt = txt.replace(/^```json/i, "").replace(/^```/i, "").replace(/```$/i, "").trim();
            try {
                const packet = JSON.parse(txt);
                if (!packet || typeof packet !== "object") throw new Error("Packet is not an object.");
                if (!Array.isArray(packet.actions)) packet.actions = [];
                return packet;
            } catch (e) {
                throw new Error(`Model returned invalid action JSON. Raw: ${txt.slice(0, 500)}`);
            }
        }

        function applyActions(actions, sourcePrompt) {
            if (!Array.isArray(actions)) return;
            const before = JSON.stringify(state.project);
            for (const a of actions) {
                if (!a || !a.type) continue;
                const p = a.payload || {};
                switch (a.type) {
                    case "create_project": state.project = normalizeProject(p); break;
                    case "update_project": if (state.project) Object.assign(state.project, p); break;
                    case "replace_characters": ensureProject(); state.project.characters = p.characters || []; break;
                    case "replace_scenes": ensureProject(); state.project.scenes = p.scenes || []; break;
                    case "replace_beats": ensureProject(); state.project.beats = p.beats || []; break;
                    case "replace_script": ensureProject(); state.project.script = p.script || ""; break;
                    case "replace_blocking": ensureProject(); state.project.blocking = p.blocking || defaultBlocking(); break;
                    case "replace_shots": ensureProject(); state.project.shots = p.shots || []; break;
                    case "replace_timeline": ensureProject(); state.project.timeline = p.timeline || { tracks: [] }; break;
                    case "replace_storyboard": ensureProject(); state.project.storyboard = p.storyboard || []; break;
                    case "replace_diagnostics": ensureProject(); state.project.diagnostics = p.diagnostics || []; break;
                    case "create_icaro_reel_packet":
                        ensureProject();
                        state.project.icaroPacket = p.packet || p;
                        // Broadcast reel packet to parent harness
                        try { window.parent.postMessage({ ...state.project.icaroPacket, type: 'ICARO_REEL_PACKET' }, '*'); } catch(e) {}
                        break;
                    case "import_clip_receipt": ensureProject(); importClipReceipt(p); break;
                    case "add_change": addChange(p.title || "AI Change", p.body || "Updated project."); break;
                    case "set_surface": if (p.surface) state.ui.surface = p.surface; break;
                }
            }
            if (state.project) {
                state.project.updatedAt = new Date().toISOString();
                state.project.provenance = state.project.provenance || [];
                state.project.provenance.push({ id: uid("prov"), prompt: sourcePrompt, time: new Date().toISOString(), actions: actions.map(a => a.type) });
                addChange("Prompt applied", sourcePrompt);
                if (!state.project.blocking) state.project.blocking = defaultBlocking();
            }
            const after = JSON.stringify(state.project);
            if (before !== after) state.history.push({ time: new Date().toISOString(), sourcePrompt, actions });
        }

        function ensureProject() {
            if (!state.project) state.project = normalizeProject({ title: "Untitled Film", logline: "", genre: "", tone: [], createdAt: new Date().toISOString() });
        }

        function normalizeProject(p) {
            return {
                id: p.id || uid("project"),
                title: p.title || "Untitled Film",
                logline: p.logline || "",
                genre: p.genre || "",
                tone: p.tone || [],
                theme: p.theme || "",
                createdAt: p.createdAt || new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                characters: p.characters || [],
                scenes: p.scenes || [],
                beats: p.beats || [],
                script: p.script || p.scenes?.map(s => s.script).filter(Boolean).join("\n\n") || "",
                blocking: p.blocking || defaultBlocking(),
                shots: p.shots || [],
                timeline: p.timeline || { tracks: [] },
                storyboard: p.storyboard || [],
                diagnostics: p.diagnostics || [],
                icaroPacket: p.icaroPacket || null,
                clipReceipts: p.clipReceipts || [],
                changeLog: p.changeLog || [],
                provenance: p.provenance || []
            };
        }

        function addChange(title, body) {
            if (!state.project) return;
            state.project.changeLog = state.project.changeLog || [];
            state.project.changeLog.push({ title, body, time: nowTime() });
            if (state.project.changeLog.length > 80) state.project.changeLog = state.project.changeLog.slice(-80);
        }

        function defaultBlocking() {
            return {
                characters: [
                    { id: "char_man", name: "Man", kind: "man", x: 20, y: 58 },
                    { id: "char_conductor", name: "Conductor", kind: "conductor", x: 78, y: 56 },
                    { id: "char_boy", name: "Boy", kind: "boy", x: 82, y: 24 }
                ],
                cameras: [{ id: "cam_a", label: "CAM A", x: 50, y: 8 }, { id: "cam_b", label: "CAM B", x: 50, y: 92 }],
                beeCenter: { x: 52, y: 48 }, beeCount: 42, path: [{ x: 18, y: 52 }, { x: 50, y: 42 }, { x: 82, y: 36 }]
            };
        }

        function addChange(title, body) {
            if (!state.project) return;
            state.project.changeLog = state.project.changeLog || [];
            state.project.changeLog.push({ title, body, time: nowTime() });
            if (state.project.changeLog.length > 80) state.project.changeLog = state.project.changeLog.slice(-80);
        }

        function importClipReceipt(receipt) {
            if (!state.project || !receipt) return;
            state.project.clipReceipts = state.project.clipReceipts || [];
            state.project.clipReceipts.push({ ...receipt, importedAt: new Date().toISOString() });
            if (state.project.icaroPacket?.reel) {
                for (const sc of state.project.icaroPacket.reel) {
                    if (sc.sceneId !== receipt.sceneId) continue;
                    for (const bt of (sc.beats || [])) {
                        if (bt.beatId === receipt.beatId) {
                            bt.status = 'rendered';
                            bt.clipReceipt = receipt;
                            if (receipt.beflixCode) bt.beflixCode = receipt.beflixCode;
                            if (receipt.notes) bt.notes = receipt.notes;
                        }
                    }
                }
            }
            addChange('Clip Receipt Imported', (receipt.clipId || receipt.beatId) + ': ' + (receipt.frames || '?') + ' frames');
        }

        function exportThing(kind) {
            if (!state.project) { toast("Nothing to export", "Create a project first."); return; }
            const p = state.project;
            if (kind === "json") download(safeName(p.title)+"_project.json", JSON.stringify(p,null,2), "application/json");
            if (kind === "script") download(safeName(p.title)+"_script.html", "<!doctype html><meta charset=utf-8><title>"+esc(p.title)+" Script</title><style>body{font-family:monospace;max-width:760px;margin:40px auto;white-space:pre-wrap;line-height:1.55}</style><h1>"+esc(p.title)+"</h1>"+esc(p.script||""), "text/html");
            if (kind === "shots") download(safeName(p.title)+"_shot_list.csv", shotsCSV(p.shots||[]), "text/csv");
            if (kind === "storyboard") download(safeName(p.title)+"_storyboard.html", storyboardDoc(p), "text/html");
            if (kind === "flipbook") {
                const storyboardFrames = p.storyboard && p.storyboard.length ? p.storyboard : (p.beats || []).map((b, i) => ({
                    index: i + 1,
                    dataUrl: `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="128" height="96" viewBox="0 0 128 96"><rect width="128" height="96" fill="%23111"/><rect x="4" y="4" width="120" height="88" fill="none" stroke="%23333" stroke-width="1"/><circle cx="64" cy="40" r="16" fill="none" stroke="%23e60000" stroke-width="2"/><text x="64" y="76" fill="%23fff" font-family="monospace" font-size="7" font-weight="900" text-anchor="middle">${esc(b.title.substring(0, 24).toUpperCase())}</text><text x="64" y="86" fill="%23666" font-family="monospace" font-size="5" text-anchor="middle">BEAT CARD / NO CANVAS IMAGE</text></svg>`,
                    duration: 1
                }));
                if (!storyboardFrames.length) {
                    toast("No frames to export", "Add some beats or storyboard frames first.");
                    return;
                }
                const rendered = storyboardFrames.map((f, i) => ({
                    index: i + 1,
                    dataUrl: f.imageData || f.dataUrl || `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="128" height="96" viewBox="0 0 128 96"><rect width="128" height="96" fill="%23111"/><circle cx="64" cy="48" r="14" fill="none" stroke="%23e60000" stroke-width="2"/><text x="64" y="80" fill="%23fff" font-family="monospace" font-size="8" text-anchor="middle">FRAME ${i+1}</text></svg>`,
                    duration: 1
                }));
                try {
                    localStorage.setItem('icaro_flipbook_frames', JSON.stringify(rendered));
                    localStorage.setItem('icaro_flipbook_title', p.title || 'ABC FLIX');
                } catch(e) {
                    console.error("Could not write flipbook frames:", e);
                }
                window.open('icaro-flip.html', '_blank');
                toast("Flipbook launched", "Printing workshop opened.");
                return;
            }
            toast("Export created", kind.toUpperCase()+" downloaded.");
        }
        function safeName(s) { return String(s||"beedance").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,""); }
        function download(name,content,type) { const blob=new Blob([content],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
        function shotsCSV(shots) { const rows=[["id","title","camera","type","subject","purpose","time","beatId"]].concat(shots.map(s=>[s.id,s.title,s.camera,s.type,s.subject,s.purpose,s.time,s.beatId])); return rows.map(r=>r.map(x=>`"${String(x||"").replace(/"/g,'""')}"`).join(",")).join("\n"); }
        function storyboardDoc(p) { return "<!doctype html><meta charset=utf-8><title>"+esc(p.title)+" Storyboard</title><h1>"+esc(p.title)+" Storyboard</h1>"; }

        // ── ENTER KEY ──
        document.getElementById("chatInput").addEventListener("keydown", e => { if (e.key==="Enter" && !e.shiftKey) { e.preventDefault(); handleSubmit(); } });

        // ── INIT ──
        load();
        render();

        // ── POSTMESSAGE BUS ──
        window.addEventListener('message', (e) => {
            const msg = e.data;
            if (!msg || !msg.type) return;
            switch (msg.type) {
                case 'ICARO_CLIP_RECEIPT':
                    importClipReceipt(msg); save(); render();
                    toast('Receipt received', msg.clipTitle || msg.beatId || 'Clip rendered');
                    break;
                case 'STUDIO_BOARD_CONTEXT':
                    if (msg.dataUrl && state.project) {
                        state.project.storyboard = state.project.storyboard || [];
                        state.project.storyboard.push({ id:'board_'+Date.now(), title:msg.label||'Captured Frame', type:'capture', imageData:msg.dataUrl, description:'Captured from Icaro Stage', prompt:'' });
                        save(); render(); toast('Board received', msg.label||'Frame captured');
                    }
                    break;
                case 'STUDIO_BOARDS_BATCH':
                    if (msg.boards && msg.boards.length && state.project) {
                        state.project.storyboard = state.project.storyboard || [];
                        msg.boards.forEach((b,i) => { state.project.storyboard.push({ id:'board_'+Date.now()+'_'+i, title:b.label||'Board '+(i+1), type:'capture', imageData:b.dataUrl, description:'Captured from Icaro Stage', prompt:'' }); });
                        save(); render(); toast('Boards received', msg.boards.length+' frames added');
                        navSheet('f');
                    }
                    break;
            }
        });
    </script>
