<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ORB PRO 5</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23000' stroke-width='1.6'/%3E%3Cg fill='%23000'%3E%3Ccircle cx='11' cy='11' r='1.5'/%3E%3Ccircle cx='16' cy='10' r='1.9'/%3E%3Ccircle cx='21' cy='11' r='1.5'/%3E%3Ccircle cx='10' cy='16' r='1.9'/%3E%3Ccircle cx='16' cy='16' r='2.4'/%3E%3Ccircle cx='22' cy='16' r='1.9'/%3E%3Ccircle cx='11' cy='21' r='1.5'/%3E%3Ccircle cx='16' cy='22' r='1.9'/%3E%3Ccircle cx='21' cy='21' r='1.5'/%3E%3C/g%3E%3Cpath d='M1 16h30' stroke='%23ff2e2e' stroke-width='1.4'/%3E%3C/svg%3E">
<meta name="theme-color" content="#ffffff">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#000;--paper:#fff;--red:#ff2e2e;--blue:#3b82f6;--amber:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--paper);color:var(--ink);overscroll-behavior:none}
body{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:11px;line-height:1;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--ink);cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}

.bar{flex:0 0 auto;display:flex;align-items:stretch;height:26px;border-bottom:2px solid var(--ink)}
.bar button,.bar span{display:flex;align-items:center;padding:0 8px;font-size:10px;
  border:none;border-right:1px solid var(--ink);background:var(--paper);letter-spacing:.04em;
  flex:0 0 auto;white-space:nowrap}
#view{width:56px;justify-content:center}
#camk{width:64px;justify-content:center}
#add{width:62px;justify-content:center}
#undo{width:56px;justify-content:center}
#where{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;display:block;
  line-height:26px}
.bar .sp{width:52px;justify-content:center}
.bar .sp{margin-left:auto;border:none;border-left:1px solid var(--ink)}
.bar #add{font-weight:600}

.stage{flex:1 1 auto;position:relative;min-height:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.rest{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;
  letter-spacing:.1em;pointer-events:none}

/* Nothing in here resizes with the work. The sheet scrolls; the keys,
   the name column and the cells keep the same size and the same place,
   so a target you hit once stays hittable. */
/* the controls sit above the timeline, so the timeline keeps the width */
.reel{flex:0 0 auto;display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.keys{flex:0 0 44px;height:44px;display:flex;align-items:stretch;background:var(--paper);
  border-bottom:1px solid var(--ink)}
.keys button{flex:1 1 0;min-width:44px;border:none;border-right:1px solid var(--ink);
  padding:0;font-size:11px;letter-spacing:.03em}
.keys button:last-child{border-right:none}
.ops{flex:0 0 36px;height:36px;display:flex;align-items:stretch;background:var(--amber);
  border-bottom:1px solid var(--ink)}
.ops[hidden]{display:none}
.ops button{flex:1 1 0;min-width:36px;border:none;border-right:1px solid var(--ink);
  background:transparent;padding:0;font-size:10px;letter-spacing:.03em}
.ops button:first-child{flex:2.2 1 0;font-weight:600;text-align:left;padding:0 8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ops button:first-child i{font-style:normal;font-weight:400;opacity:.75}
.cel.ghost{box-shadow:inset 0 0 0 2px var(--ink);background:rgba(0,0,0,.08)}
/* what you are holding will land here: dotted, follows the frame you are on */
.cel.land{outline:2px dotted var(--blue);outline-offset:-3px;background:rgba(59,130,246,.10)}
/* where it was before the last edit: dashed, until the next edit */
.cel.was{outline:2px dashed rgba(0,0,0,.35);outline-offset:-3px}
.say{font-size:10px;line-height:1.3;padding:3px 8px;border-bottom:1px solid var(--ink);
  background:var(--paper);white-space:normal}
.say[hidden]{display:none}
@keyframes blink{0%{background:var(--amber)}100%{background:rgba(255,210,63,.42)}}
.flash .cel.sel{animation:blink .45s ease-out}
.flash .ops button:first-child{animation:blink .45s ease-out}
.cel.ghost::after{content:none}
.subject{flex:1 1 100%;font-size:10px;letter-spacing:.06em;padding:3px 0 0;
  border-bottom:1px solid var(--ink);margin-bottom:2px}
.subject b{font-weight:600}
.subject i{font-style:normal;opacity:.7}
.ops button:last-child{border-right:none}
.ops button[disabled]{opacity:.3}
.cel,.orb{-webkit-touch-callout:none;user-select:none}
/* a finger across a layer's cells scrubs and selects; up and down still
   scrolls the sheet. The take strip keeps the sheet's own sideways scroll. */
.cells{touch-action:pan-y}
.cel.sel{background:rgba(255,210,63,.42);box-shadow:inset 0 3px 0 var(--ink),inset 0 -3px 0 var(--ink)}
.cel.sel.first{box-shadow:inset 3px 0 0 var(--ink),inset 0 3px 0 var(--ink),inset 0 -3px 0 var(--ink)}
.cel.sel.last{box-shadow:inset -3px 0 0 var(--ink),inset 0 3px 0 var(--ink),inset 0 -3px 0 var(--ink)}
.cel.sel.first.last{box-shadow:inset 0 0 0 3px var(--ink)}
.cel.now{box-shadow:inset 0 0 0 2px var(--red)}
.cel.sel.now{box-shadow:inset 0 0 0 3px var(--ink),inset 0 0 0 5px var(--red)}
/* the export ticket: what will be written, in words, beside the keys */
.ticket{flex:1 1 100%;display:flex;flex-direction:column;gap:3px;border:1px solid var(--ink);
  padding:6px 8px;font-size:10px;line-height:1.4}
.ticket b{font-size:12px;font-weight:600;letter-spacing:.04em}
.ticket i{font-style:normal;opacity:.7}
.ticket .warn{color:var(--red)}
.sheet{height:126px;overflow:auto;scrollbar-width:none;display:flex;flex-direction:column;
  align-items:flex-start}
.sheet::-webkit-scrollbar{display:none}
.takes{flex:0 0 auto;display:flex;flex-direction:column}
.take{display:flex;border-bottom:1px solid var(--ink);position:sticky;top:0;
  background:var(--paper);z-index:2}
.take:last-child{border-bottom:none}
.tk{display:flex;align-items:center;justify-content:flex-start;flex:0 0 78px;width:78px;
  padding:0 5px;font-size:10px;font-weight:600;border-right:1px solid var(--ink)}
.orb{position:relative;border:none;border-right:1px solid var(--ink);padding:0;
  background:transparent;line-height:0;flex:0 0 auto;z-index:1}
.orb .n{position:absolute;left:1px;top:1px;font-size:8px;line-height:1;padding:0 2px}
.orb[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.orb.span{background:rgba(255,210,63,.55)}
/* one canvas under a whole row: the thumbnails are columns of it, the
   buttons above it are glass. A row is one allocation, not one per cel. */
.strip,.cells{position:relative;display:flex;flex:0 0 auto}
.rowcv{position:absolute;left:0;top:0;pointer-events:none}
.fault{position:absolute;left:0;right:0;top:0;display:flex;flex-wrap:wrap;gap:0;
  background:var(--paper);border-bottom:2px solid var(--red);font-size:10px;z-index:5}
.fault span{flex:1 1 100%;padding:5px 8px;border-bottom:1px solid var(--ink)}
.fault button{flex:1 1 0;height:34px;border:none;border-right:1px solid var(--ink)}
.fault button:last-child{border-right:none}
.fault[hidden]{display:none}
.orb.lift{opacity:.4}
.track{display:flex;align-items:center;border-bottom:1px solid var(--ink);height:34px}
.track.on{background:#f2f2f2}
.track.off{opacity:.45}
.track .tn{flex:0 0 78px;width:78px;border:none;border-right:1px solid var(--ink);
  background:transparent;padding:0 5px;text-align:left;letter-spacing:.03em;height:34px;
  display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden}
.track .tn b{font-size:9px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;display:block}
.track .tn em{font-style:normal;font-size:7.5px;opacity:.75;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;display:block;min-height:9px}
.track.off .tn b{text-decoration:line-through}
.track.on .tn em{opacity:.85}
.track.on .tn{background:var(--ink);color:var(--paper)}
.cel{flex:0 0 auto;border:none;border-right:1px solid #ddd;background:transparent;padding:0;
  position:relative;height:34px;z-index:1}
.cel{display:flex;align-items:center;justify-content:center}
.cel canvas{display:block}
.cel.held{opacity:.55}
.cel.born::before{content:"";position:absolute;left:2px;top:2px;width:5px;height:5px;
  background:var(--ink)}
.cel.pic::before{border-radius:0;box-shadow:0 0 0 1px var(--paper),0 0 0 2px var(--ink);
  background:var(--paper)}
.cel.era::before{background:var(--paper);box-shadow:0 0 0 1px var(--ink)}
.cel.mov::before{background:var(--blue)}
.cel.now{box-shadow:inset 0 0 0 2px var(--red)}
.track.cam{background:#f4f8ff}
.cel.key::after{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;
  background:var(--blue);transform:translate(-50%,-50%) rotate(45deg)}
.cel.key{touch-action:none;cursor:grab}
/* a clip reads as one bar: a body you can slide and two ends you can pull */
.cel.clip{touch-action:none;box-shadow:inset 0 -3px 0 var(--blue)}
.cel.clip.head{box-shadow:inset 3px -3px 0 var(--blue);cursor:ew-resize}
.cel.clip.tail{box-shadow:inset -3px -3px 0 var(--blue);cursor:ew-resize}
.cel.clip.head.tail{box-shadow:inset 3px -3px 0 var(--blue),inset -3px 0 0 var(--blue)}
.track.cam .tn em{color:var(--blue)}

.tray{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px;padding:5px 6px;align-items:flex-start;
  border-top:1px solid var(--ink);height:34vh;min-height:190px;overflow-y:auto;
  align-content:flex-start}
.tray[hidden]{display:none}
.tray button{padding:5px 8px;font-size:11px}
.tray button small{font-size:9px;opacity:.7}
.pal{display:flex;border:1px solid var(--ink)}
.sl{display:flex;align-items:center;gap:6px;border:1px solid var(--ink);padding:2px 6px}
.sl input[type=range]{width:110px;height:20px;accent-color:#000;background:none;border:none}
.sl svg{width:18px;height:18px;flex:0 0 auto}
.gl{width:58px;flex:0 0 58px;padding:4px 0 3px;border:none;border-right:1px solid var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:var(--ink);background:var(--paper);font-size:8px;letter-spacing:.02em}
.gl>span{max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl:last-child{border-right:none}
.gl svg{width:22px;height:22px}
.gl[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.gl[disabled]{opacity:.28;cursor:default}
.grp{display:flex;flex-direction:column;gap:2px}
.grp>i{font-style:normal;font-size:8px;letter-spacing:.12em;padding-left:1px}
.stack{display:flex;flex-direction:column;border:1px solid var(--ink);min-width:190px}
.lrow{display:flex;align-items:center;gap:6px;border:none;border-bottom:1px solid var(--ink);
  background:var(--paper);padding:0 6px;text-align:left;height:34px;
  touch-action:none;cursor:grab;user-select:none}
.lrow.drag{opacity:.45}
.lrow.over{box-shadow:inset 0 3px 0 var(--red)}
.eyw{flex:0 0 auto;width:30px;height:30px;display:flex;align-items:center;
  justify-content:center;margin-left:-4px}
.grip{margin-left:auto;display:flex;flex-direction:column;gap:2px;padding-left:6px;
  flex:0 0 auto}
.grip i{display:block;width:14px;height:2px;background:currentColor;opacity:.5}
.lrow:last-child{border-bottom:none}
.lrow.on{background:var(--ink);color:var(--paper)}
.lrow b{font-weight:600;font-size:11px;min-width:5ch}
.lrow u{text-decoration:none;font-size:9px;opacity:.75;flex:1}
.lrow s{text-decoration:none;font-size:9px;opacity:.6;flex:0 0 auto}
.ey{width:11px;height:11px;border:1.5px solid currentColor;border-radius:50%;flex:0 0 auto;
  position:relative}
.ey::after{content:"";position:absolute;inset:3px;background:currentColor;border-radius:50%}
.ey.off::after{display:none}
.ey.off{opacity:.35}
.grp>.pal,.grp>.sl{align-self:flex-start}
.sl b{font-size:11px;min-width:2ch;text-align:right}
.ik{width:30px;height:28px;padding:0;border:none;border-right:1px solid var(--ink);
  display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ik:last-child{border-right:none}
.ik svg{width:20px;height:20px}
.ik[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tray input[type=text]{flex:1 1 140px;min-width:110px;font:inherit;font-size:11px;padding:5px;
  border:1px solid var(--ink);background:var(--paper);color:var(--ink)}
.tray .t{flex:1 1 100%;font-size:10px;line-height:1.45}
.tray.cam{flex-direction:column;flex-wrap:nowrap;overflow:hidden;gap:4px;
  align-items:stretch}
.tray.cam .grp{flex:0 0 auto}
.tray.cam .row2{display:flex;gap:5px;flex:0 0 auto}
.tray.cam .row2>.grp{flex:1 1 0;min-width:0}
.tray.cam{height:40vh}
.tray.out{gap:5px}
.tray.out .keys2{display:flex;flex-wrap:wrap;gap:5px;flex:0 0 auto}
.shotwrap{flex:1 1 auto;min-height:54px;position:relative;display:flex;
  align-items:center;justify-content:center}
.shotwrap canvas{display:block;border:1px solid var(--ink);background:var(--paper)}
.shotlab{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;
  font-size:9px;background:var(--paper);border:1px solid var(--ink);padding:0 4px}
.foot{flex:0 0 auto;display:flex;height:46px;border-top:1px solid var(--ink)}
.foot button{flex:1;border:none;border-right:1px solid var(--ink);font-size:9px;
  letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px}
.foot button b{font-size:15px;font-weight:600;line-height:1}
.foot button:last-child{border-right:none}
</style>
</head>
<body>

<div class="bar">
  <button id="view">ORB</button>
  <button id="camk">CAM</button>
  <span id="where"></span>
  <button id="add">+ ADD</button>
  <button id="undo">UNDO</button>
  <button class="sp" id="hold">live</button>
</div>

<div class="stage"><canvas id="stage"></canvas><div class="rest" id="rest">draw, or drop a picture</div>
  <div class="fault" id="fault" hidden><span id="faultSay"></span>
    <button id="fRestore">RESTORE</button><button id="fKeep">KEEP SCORE</button><button id="fNew">NEW</button></div></div>

<div class="reel" id="reel"></div>
<div class="tray" id="tray" hidden></div>

<div class="foot">
  <button id="fTool"><b>A</b>DRAW</button>
  <button id="fLayer"><b>B</b>LAYER</button>
  <button id="fMedia"><b>C</b>PLACE</button>
  <button id="fMotion"><b>D</b>TIME</button>
  <button id="fRender"><b>E</b>OUT</button>
  <button id="fCam"><b>F</b>CAM</button>
</div>

<input id="file" type="file" accept="image/*,video/*" multiple hidden>
<input id="score" type="file" accept="application/json,.json" hidden>

<script>
"use strict";
/* ORB PRO 5 — the fortified orb. v4 crashed phones. The scars, in order:
     the reel      one canvas a row, STRUCTURE rebuilt rarely, CURSOR patched (I4)
     canvases      CANVAS_MAX, LAYERS_MAX; none made after boot except DECODE,
                   ENCODE and TILE, each a singleton (I2, I3)
     the ball      a dot table per step, no arrays per dot (DOTS)
     the governor  slow paint twice -> coarser step; the line says "thinned"
     the budget    BUDGET: pictures by device class, export area 16 Mpx
     the journal   UNDO restores the score's shape and says what came back
     the session   marks kept to one storage key; RESTORE on boot and on FAULT
     the fault     error -> the bar: marks kept, RESTORE / KEEP SCORE / NEW
     stops         film import, KEEP, playback when hidden, the API at 15 s
   One external dependency: the Plex Mono font. Everything else is here. */
/* ================= sphere math ================= */
const TAU=Math.PI*2,PI=Math.PI,D2R=PI/180,R2D=180/PI;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};
const dirLL=(lam,phi)=>{const c=Math.cos(phi);return [c*Math.sin(lam),Math.sin(phi),c*Math.cos(lam)];};
const llDir=d=>[Math.atan2(d[0],d[2]),Math.asin(clamp(d[1],-1,1))];
const uvDir=d=>{const l=llDir(d);return [l[0]/TAU+.5,.5-l[1]/PI];};
const dirUV=(u,v)=>dirLL(TAU*(u-.5),PI*(.5-v));
const ang=(a,b)=>2*Math.asin(clamp(Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2])/2,0,1));
const rotAx=(d,ax,a)=>{const k=norm(ax),c=Math.cos(a),s=Math.sin(a);
  return add(add(mul(d,c),mul(cross(k,d),s)),mul(k,dot(k,d)*(1-c)));};
const basis=(f,up)=>{const F=norm(f),r=norm(cross(up,F));return {f:F,r,u:cross(F,r)};};
const upFor=d=>Math.abs(d[1])>.985?[0,0,1]:[0,1,0];

/* ================= state ================= */
const INKS=9;                       // nine tones
const BRUSHES=[2,3,5,8,12,18,26,36];  // degrees across
const S={
  frames:1,frame:0,rows:1,ver:0,playing:false,fps:8,
  strokes:[],epoch:0,
  dir:dirLL(0,0),yaw:.5,pitch:.18,
  layers:[{n:"BASE",vis:true,mode:"OVER",op:1,key:false,kt:0.90}],layer:0,busy:false,look:0,
  onion:{n:0,after:false},slit:0,
  /* the ball's orientation is how you look at it; the camera has its own,
     so orbiting the ball never moves the shot and aiming the shot never
     moves the ball */
  cam:{yaw:.5,pitch:.18,fov:75*D2R,eye:0,roll:0},
  camOn:false,camMon:true,camAuto:false,shotAsp:16/9,
  camKeys:[],   /* 0 off, 1 the frame, 2 the frame and the monitor */
  brush:8*D2R,ink:INKS,tool:"PEN",view:"ORB",tray:null,pin:null,sel:null,span:null,
  place:70*D2R,wrapMode:"AUTO",
  grid:{deg:true,minor:true,cube:true,frame:false,fan:false},
  render:{field:true,what:"FLAT",sheet:true,size:1024,loops:1,mp4:false},
  rendering:false,stop:false,fault:null,spanL:null,clip:null,ghost:null,was:null};

/* ================= marks: strokes as a density field ================= */
/* A thumbnail is sixty pixels across. Baking it at the full grid was
   thirty two thousand cells to draw about three hundred dots — sixteen
   times more work than the picture can hold. So there are two grids: the
   one the stage reads, and a coarse one the strip reads. Same code, same
   maths, one sixteenth of the cells. */
function makeGrid(w,hh){
  const dirs=new Float32Array(w*hh*3);
  for(let y=0;y<hh;y++)for(let x=0;x<w;x++){
    const d=dirUV((x+.5)/w,(y+.5)/hh),i=(y*w+x)*3;
    dirs[i]=d[0];dirs[i+1]=d[1];dirs[i+2]=d[2];}
  return {w,h:hh,n:w*hh,dirs};}
const GW=256,GH=128,DIRS=new Float32Array(GW*GH*3);
for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){
  const d=dirUV((x+.5)/GW,(y+.5)/GH),i=(y*GW+x)*3;
  DIRS[i]=d[0];DIRS[i+1]=d[1];DIRS[i+2]=d[2];}
const cellDir=(i,G)=>{const D=G?G.dirs:DIRS;return [D[i*3],D[i*3+1],D[i*3+2]];};
const BIG={w:GW,h:GH,n:GW*GH,dirs:DIRS};
const SMALL=makeGrid(64,32);
const cache=new Map();
/* a mark lays down its own tone. Painting light over dark makes it light,
   and scribbling at one tone never darkens past that tone. */
function splat(g,d,r,tone,G){
  G=G||BIG;
  const T=tone*255;
  const l=llDir(d),cy=(.5-l[1]/PI)*G.h,rp=r/PI*G.h;
  const rl=Math.min(G.w/2,r/TAU*G.w/Math.max(Math.cos(l[1]),1e-3)+1.5);
  const cx=(l[0]/TAU+.5)*G.w;
  for(let y=Math.max(0,Math.floor(cy-rp-1));y<=Math.min(G.h-1,Math.ceil(cy+rp+1));y++)
  for(let k=Math.floor(cx-rl-1);k<=Math.ceil(cx+rl+1);k++){
    const i=y*G.w+((k%G.w)+G.w)%G.w,a=ang(d,cellDir(i,G));
    if(a>r)continue;

    const dx=TD[i3],dy=TD[i3+1],dz=TD[i3+2];
    const kz=dx*R2[0]+dy*R2[1]+dz*R2[2];
    if(kz<=0.02)continue;
    const kx=dx*R0[0]+dy*R0[1]+dz*R0[2],ky=dx*R1[0]+dy*R1[1]+dz*R1[2];
    const ci=TI[i];
    let CC=C,gg=grid;
    if(slitOn){const lat=TL[i];const ff=slitFrame(lat);gg=gridAt(lat);
      if(ff!==f)CC=cells(ff,v,only,true,G);}
    let cr=0,cg=0,cb=0,has=CC.rgba[ci*4+3]!==0;
    if(has){cr=CC.rgba[ci*4];cg=CC.rgba[ci*4+1];cb=CC.rgba[ci*4+2];}
    if(showLive){dtmp[0]=dx;dtmp[1]=dy;dtmp[2]=dz;
      const lc=prevAt(dtmp,liveB);if(lc){has=true;cr=lc[0]|0;cg=lc[1]|0;cb=lc[2]|0;}}
    const ink=gg[ci]/255;
    let rad,col;
    if(ink>.04){rad=cell*(.10+.80*ink);col="#000";}   // paint covers picture
    else if(has){const L=(cr*.299+cg*.587+cb*.114)/255;rad=cell*(.22+.62*(1-L));
      col=colStr(cr,cg,cb);}
    else if(opt.ground!==false){rad=cell*.07;col="rgba(0,0,0,.35)";}
    else continue;
    if(ink<=.04&&skins.length)for(const sk of skins){
      if(sk.g[ci]/255<=.06)continue;
      g.strokeStyle=sk.fwd?"rgba(255,210,63,.85)":"rgba(59,130,246,"+(0.9/sk.k).toFixed(2)+")";
      g.lineWidth=Math.max(.6,cell*.10);
      g.beginPath();g.arc(cx+kx*Rd,cy-ky*Rd,cell*(.36-.07*sk.k),0,TAU);g.stroke();
      break;}
    rad*=(.55+.45*kz);                                // foreshortening at the rim
    if(rad>radMax)rad=radMax;
    if(rad<.35)continue;
    const sx=cx+kx*Rd,sy=cy-ky*Rd;
    g.fillStyle=col;
    if(rad<2.2){g.fillRect(sx-rad,sy-rad,rad*2,rad*2);}
    else{g.beginPath();g.arc(sx,sy,rad,0,TAU);g.fill();}}
  g.restore();
  if(opt.grid!==false){
    drawGrid(g,W,H,d=>{const k=toScreen(d,R);
      return [cx+k[0]*Rd,cy-k[1]*Rd,k[2]>0];},Math.max(1,W/460),false);
    g.strokeStyle="rgba(0,0,0,.8)";g.lineWidth=Math.max(1,W/300);
    g.beginPath();g.arc(cx,cy,Rd,0,TAU);g.stroke();}
  // the horizon: the equator as it truly projects, running off both edges
  if(opt.horizon!==false){
    g.strokeStyle="#ff2e2e";g.lineWidth=Math.max(1,W/460);
    g.beginPath();let pen=false,first=null,last=null;
    for(let lon=-180;lon<=180;lon+=2){
      const k=toScreen(dirLL(lon*D2R,0),R);
      if(k[2]<=0){pen=false;continue;}
      const p=[cx+k[0]*Rd,cy-k[1]*Rd];
      if(!first)first=p;last=p;
      if(!pen){g.moveTo(p[0],p[1]);pen=true;}else g.lineTo(p[0],p[1]);}
    g.stroke();
    if(first&&last){g.beginPath();
      g.moveTo(0,first[1]);g.lineTo(first[0],first[1]);
      g.moveTo(last[0],last[1]);g.lineTo(W,last[1]);g.stroke();}}
  // the picked direction
  if(opt.frustum){
    const asp=S.shotAsp||1.7778;
    const CR=camRot(),P=eyePos(CR),corners=frustumCorners(CR,asp);
    const scr=p=>{const k=toScreen(p,R);return [cx+k[0]*Rd,cy-k[1]*Rd,k[2]>0];};
    const eye=[cx+dot(P,R[0])*Rd,cy-dot(P,R[1])*Rd];   // seen from the ball's view
    if(corners){
      g.strokeStyle="#3b82f6";g.lineWidth=1.6*Math.max(1,W/460);
      g.beginPath();
      for(let i=0;i<4;i++){const a=scr(corners[i]),b=scr(corners[(i+1)%4]);
        if(a[2]&&b[2]){g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);}}
      g.stroke();
      g.setLineDash([3*Math.max(1,W/460),3*Math.max(1,W/460)]);
      g.beginPath();
      for(const p of corners){const a=scr(p);
        if(a[2]){g.moveTo(eye[0],eye[1]);g.lineTo(a[0],a[1]);}}
      g.stroke();g.setLineDash([]);}
    const aim=shellHit(P,CR[2]),as=aim?scr(aim):null;
    g.fillStyle="#fff";g.strokeStyle="#3b82f6";g.lineWidth=2*Math.max(1,W/460);
    g.beginPath();g.arc(eye[0],eye[1],5*Math.max(1,W/460),0,TAU);g.fill();g.stroke();
    /* the handle is there whichever side of the ball it points at: filled
       when it faces you, hollow when it is round the back, and grabbable
       either way, so aiming never depends on where you happen to be */
    if(as){
      const r=7*Math.max(1,W/460);
      g.lineWidth=2*Math.max(1,W/460);
      if(as[2]){g.fillStyle="#3b82f6";g.beginPath();g.arc(as[0],as[1],r,0,TAU);g.fill();
        g.strokeStyle="#000";g.lineWidth=1.2*Math.max(1,W/460);g.stroke();}
      else{g.strokeStyle="#3b82f6";g.beginPath();g.arc(as[0],as[1],r,0,TAU);g.stroke();
        g.beginPath();g.arc(as[0],as[1],r*0.35,0,TAU);g.stroke();}
      SGAIM=[as[0],as[1]];}}
  if(opt.handles&&S.sel&&S.sel.img&&!S.sel.wrap&&live(S.sel,f,v)>=0)
    drawHandles(g,S.sel,d=>{const k=toScreen(d,R);
      return [cx+k[0]*Rd,cy-k[1]*Rd,k[2]>0];},Math.max(1,W/460));
  if(opt.marker!==false){
    const k=toScreen(S.dir,R);
    if(k[2]>0){g.fillStyle="#ff2e2e";g.beginPath();
      g.arc(cx+k[0]*Rd,cy-k[1]*Rd,Math.max(2,W/150),0,TAU);g.fill();}}
  return {cx,cy,Rd,R};}

/* the flat chart, same dots, rectangular lattice */
function drawFlat(cv,f,v,opt){
  const g=cv.getContext("2d"),W=cv.width,H=cv.height;
  g.fillStyle="#fff";g.fillRect(0,0,W,H);
  /* two units wide, one high, centred, with room around it. The cells come
     out square because the plate does, which is the whole point of it. */
  const bw=Math.min(W*0.96,H*0.92*2),bh=bw/2;
  const x0=(W-bw)/2,top=(H-bh)/2;
  const C=cells(f,v),grid=wetGrid(f,v),step=opt.step||3.2;
  const skins=[];
  if(opt.onion&&S.frames>1)for(let k=1;k<=S.onion.n;k++){
    if(bakesLeft<=0)break;
    skins.push({g:field((f-k+S.frames*k)%S.frames,v,null,true),k});
    if(S.onion.after&&bakesLeft>0)
      skins.push({g:field((f+k)%S.frames,v,null,true),k,fwd:true});}
  const cell=bw/(360/step);
  for(let lat=90-step/2;lat>-90;lat-=step){
    const y=top+(90-lat)/180*bh;
    for(let lon=-180+step/2;lon<180;lon+=step){
      const x=x0+(lon+180)/360*bw;
      const d=dirLL(lon*D2R,lat*D2R);
      const c=colourIn(C,idxOf(d)),ink=inkAt(grid,d);
      let rad,col;
      if(ink>.04){rad=cell*(.10+.80*ink);col="#000";}
      else if(c){rad=cell*(.22+.62*(1-lum(c)));
        col="rgb("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+")";}
      else{rad=cell*.07;col="rgba(0,0,0,.35)";}
      if(ink<=.04)for(const sk of skins){
        if(inkAt(sk.g,d)<=.06)continue;
        g.strokeStyle=sk.fwd?"rgba(255,210,63,.85)":"rgba(59,130,246,"+(0.9/sk.k).toFixed(2)+")";
        g.lineWidth=Math.max(.6,cell*.10);
        g.beginPath();g.arc(x,y,cell*(.36-.07*sk.k),0,TAU);g.stroke();break;}
      if(rad<.35)continue;
      g.fillStyle=col;
      if(rad<2.2){g.fillRect(x-rad,y-rad,rad*2,rad*2);}
      else{g.beginPath();g.arc(x,y,rad,0,TAU);g.fill();}}}
  g.strokeStyle="rgba(0,0,0,.55)";g.lineWidth=Math.max(1,W/500);
  g.strokeRect(x0,top,bw,bh);
  if(opt.grid!==false){
    drawGrid(g,W,H,d=>{const uv=uvDir(d);return [x0+uv[0]*bw,top+uv[1]*bh,true];},
      Math.max(1,W/460),true);
    if(S.grid.deg){
      g.fillStyle="#000";g.font=(9*Math.max(1,W/460))+"px 'IBM Plex Mono',monospace";
      g.textAlign="center";g.textBaseline="top";
      for(let lon=-180;lon<=180;lon+=30)
        g.fillText(lon+"\u00B0",clamp(x0+(lon+180)/360*bw,16,W-16),top+bh+3);
      g.textAlign="left";g.textBaseline="middle";
      for(let lat=-60;lat<=60;lat+=30)
        g.fillText((lat>0?"+":"")+lat+"\u00B0",Math.max(2,x0-30),top+(90-lat)/180*bh);}}
  g.strokeStyle="#ff2e2e";g.lineWidth=Math.max(1,W/460);
  if(S.camOn){
    const CR=camRot(),P=eyePos(CR),cs=frustumCorners(CR,S.shotAsp||16/9);
    const put=d=>{const uv=uvDir(d);return [x0+uv[0]*bw,top+uv[1]*bh];};
    if(cs){
      g.strokeStyle="#3b82f6";g.lineWidth=1.6*Math.max(1,W/500);
      for(let i=0;i<4;i++){
        const a=put(cs[i]),b=put(cs[(i+1)%4]);
        if(Math.abs(a[0]-b[0])>bw*0.5)continue;    // the seam: leave the gap
        g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();}}
    const aim=shellHit(P,CR[2]);
    if(aim){const a=put(aim);
      g.fillStyle="#3b82f6";g.beginPath();
      g.arc(a[0],a[1],7*Math.max(1,W/500),0,TAU);g.fill();
      g.strokeStyle="#000";g.lineWidth=1.2*Math.max(1,W/500);g.stroke();
      SGAIM=[a[0],a[1]];}}
  const ey=top+bh/2;
  g.beginPath();g.moveTo(0,ey);g.lineTo(W,ey);g.stroke();
  const uv=uvDir(S.dir);
  g.fillStyle="#ff2e2e";g.beginPath();
  g.arc(x0+uv[0]*bw,top+uv[1]*bh,Math.max(2,W/150),0,TAU);g.fill();
  return {flat:true,x0,top,bw,bh};}

/* ---------- marching squares -----------------------------------------
   The dots are a sampling of a field. Where the field crosses a level,
   there is a line. Finding it turns a mass of tone into an outline, which
   is a different thing to animate, and the way to trace a ghost. */
function contourDirs(grid,level){
  /* the grid holds a tone in a byte, so the level must be scaled to it */
  const t=level*255;
  const out=[],lerp=(a,b)=>{const dd=b-a;return Math.abs(dd)<1e-6?.5:clamp((t-a)/dd,0,1);};
  const put=(gx,gy)=>{
    if(out.length>5000)return;
    out.push(dirUV((((gx%GW)+GW)%GW+.5)/GW,clamp((gy+.5)/GH,0,1)));};
  for(let y=0;y<GH-1;y++){
   if(out.length>1800)break;
   for(let x=0;x<GW;x++){
    const x1=(x+1)%GW;
    const a=grid[y*GW+x],b=grid[y*GW+x1],c=grid[(y+1)*GW+x1],d=grid[(y+1)*GW+x];
    const code=(a>t?8:0)|(b>t?4:0)|(c>t?2:0)|(d>t?1:0);
    if(code===0||code===15)continue;
    if((a>t)!==(b>t))put(x+lerp(a,b),y);          // top edge
    if((b>t)!==(c>t))put(x+1,y+lerp(b,c));        // right edge
    if((d>t)!==(c>t))put(x+lerp(d,c),y+1);        // bottom edge
    if((a>t)!==(d>t))put(x,y+lerp(a,d));          // left edge
  }}
  return out;}

/* ---------- the span: operations speak to a run of frames ---------- */
function spanFrames(){
  if(!S.span)return [S.frames>1?S.frame:null];
  const a=Math.min(S.span.a,S.span.b),b=Math.max(S.span.a,S.span.b),out=[];
  for(let f=a;f<=b;f++)out.push(f);
  return out;}
const inSpan=f=>S.span&&f>=Math.min(S.span.a,S.span.b)&&f<=Math.max(S.span.a,S.span.b);
/* ================= span operations ==========================================
   A span is a run of frames, on one line or on all of them (S.spanL). The
   operations are the ones a timeline owes: COPY, CUT (the marks go, the
   frames stay), PASTE (at the frame you are on), DUP (the span again, after
   itself), DROP (the frames go and the gap closes), nudge. A mark that is
   held across the span's edge is cut at the edge, not lost. Each says on
   the line what it did; UNDO takes it back. */
const spanAB=()=>S.span?[Math.min(S.span.a,S.span.b),Math.max(S.span.a,S.span.b)]:null;
const spanN=()=>{const r=spanAB();return r?r[1]-r[0]+1:0;};
const onLine=s=>S.spanL==null||(s.L||0)===S.spanL;
const inTake=s=>s.v==null||s.v===S.ver;
const sEnd=s=>s.to!=null?s.to:Infinity;
const sStart=s=>s.f==null?0:s.f;
const spanSays=()=>"f"+(spanAB()[0]+1)+"\u2013"+(spanAB()[1]+1)+(S.spanL!=null?" on "+S.layers[S.spanL].n:"");
/* the marks that begin inside the span, as copies rebased to frame 0 */
function spanCopy(){
  const [a,b]=spanAB();
  const got=S.strokes.filter(s=>inTake(s)&&onLine(s)&&sStart(s)<=b&&sEnd(s)>=a)
    .map(s=>Object.assign({},s,{f:Math.max(sStart(s),a)-a,to:Math.min(sEnd(s),b)-a,v:null}));
  const keys=S.spanL==null?S.camKeys.filter(k=>(k.v==null||k.v===S.ver)&&k.f>=a&&k.f<=b)
    .map(k=>Object.assign({},k,{f:k.f-a,v:null})):[];
  S.clip={n:b-a+1,L:S.spanL,strokes:got,keys,from:spanSays()};
  reel.classList.add("flash");setTimeout(()=>reel.classList.remove("flash"),500);
  ttrace(got.length?"holding "+got.length+" marks from "+spanSays()+" \u00b7 the dotted box shows where PASTE puts them":
    "nothing live in "+spanSays()+" to copy");}
/* cut a hole: marks born in the span go; marks held through it are ended
   at its edge and, if they carried on past it, resumed after it */
function spanClear(){
  const [a,b]=spanAB();const keep=[],add=[];let gone=0,cut=0;
  for(const s of S.strokes){
    if(!inTake(s)||!onLine(s)){keep.push(s);continue;}
    const f0=sStart(s),f1=sEnd(s);
    if(f0>b||f1<a){keep.push(s);continue;}
    if(f0>=a){gone++;if(f1>b)add.push(Object.assign({},s,{f:b+1}));continue;}
    cut++;
    if(f1>b)add.push(Object.assign({},s,{f:b+1,to:s.to==null?null:s.to}));
    keep.push(Object.assign(s,{to:a-1}));}
  S.strokes=keep.concat(add);
  if(S.spanL==null)S.camKeys=S.camKeys.filter(k=>!((k.v==null||k.v===S.ver)&&k.f>=a&&k.f<=b));
  return {gone,cut};}
function wasHere(a,b,l){S.was={a,b,l,epoch:S.epoch};}
function spanCut(){
  const [a0,b0]=spanAB();
  spanCopy();const r=spanClear();S.sel=null;S.epoch++;wasHere(a0,b0,S.spanL);
  ttrace("cut "+r.gone+" marks"+(r.cut?", ended "+r.cut+" held ones,":"")+" from "+spanSays()+" \u00b7 PASTE puts them back");}
/* every frame at or after `from` moves by `by` (negative closes a gap) */
function shiftFrames(from,by){
  for(const s of S.strokes){
    if(s.f!=null&&s.f>=from)s.f+=by;
    if(s.to!=null&&s.to>=from)s.to+=by;
    if(s.clip)s.clip.start=s.f;}
  for(const k of S.camKeys)if(k.f>=from)k.f+=by;
  S.frames=Math.max(1,S.frames+by);}
function spanPaste(){
  const c=S.clip;if(!c){ttrace("nothing copied yet");return;}
  if(!roomFor(c.strokes.length,"paste"))return;
  const at=S.frame,L=c.L==null?null:S.layer;
  for(const s of c.strokes)S.strokes.push(Object.assign({},s,{f:s.f+at,to:s.to+at,
    v:S.rows>1?S.ver:null,L:L==null?s.L:L}));
  for(const k of c.keys)if(!keyAt(k.f+at,S.ver))S.camKeys.push(Object.assign({},k,{f:k.f+at,v:S.rows>1?S.ver:null}));
  S.frames=Math.max(S.frames,at+c.n);
  S.span={a:at,b:at+c.n-1};S.spanL=L;S.epoch++;reel.dataset.sig="";
  ttrace("put "+c.strokes.length+" marks at "+spanSays()+" \u00b7 still holding them: PASTE again elsewhere, or \u00d7");}
function spanDup(){
  const [a,b]=spanAB();const n=b-a+1;
  const was=S.clip;spanCopy();const c=S.clip;S.clip=was;
  if(!roomFor(c.strokes.length,"a copy"))return;
  shiftFrames(b+1,n);
  for(const s of c.strokes)S.strokes.push(Object.assign({},s,{f:s.f+b+1,to:s.to+b+1,v:S.rows>1?S.ver:null}));
  for(const k of c.keys)S.camKeys.push(Object.assign({},k,{f:k.f+b+1,v:S.rows>1?S.ver:null}));
  S.span={a:b+1,b:b+n};S.frame=b+1;S.epoch++;reel.dataset.sig="";
  ttrace(spanSays()+" again, after itself \u00b7 now f"+(b+2)+"\u2013"+(b+n+1));}
function spanDrop(){
  const [a,b]=spanAB();const n=b-a+1;
  if(n>=S.frames){ttrace("that is every frame; CUT clears them instead");return;}
  const r=spanClear();shiftFrames(b+1,-n);
  S.span=null;S.spanL=null;S.frame=Math.min(a,S.frames-1);S.sel=null;S.epoch++;reel.dataset.sig="";
  wasHere(a,Math.min(b,S.frames-1),null);
  ttrace("dropped "+n+" frames ("+r.gone+" marks) \u00b7 the film is "+S.frames+" frames now");}
function spanNudge(d){
  const [a,b]=spanAB();
  if(a+d<0)return;
  for(const s of S.strokes){
    if(!inTake(s)||!onLine(s))continue;
    const f0=sStart(s);if(f0<a||f0>b)continue;
    s.f=f0+d;if(s.to!=null)s.to+=d;if(s.clip)s.clip.start=s.f;}
  if(S.spanL==null)for(const k of S.camKeys)if((k.v==null||k.v===S.ver)&&k.f>=a&&k.f<=b)k.f+=d;
  S.span={a:a+d,b:b+d};S.frames=Math.max(S.frames,b+d+1);S.frame=clamp(S.frame+d,0,S.frames-1);
  S.epoch++;reel.dataset.sig="";
  ttrace(spanSays()+" moved "+(d>0?"later":"earlier")+" by one");}
function spanClearSel(){S.span=null;S.spanL=null;draw();}
/* ================= the subject ==============================================
   Every verb in TIME acts on one thing, and the strip says which: the
   selection if there is one (frames a–b on one line or all), else the
   whole line you are on. subject() returns the marks and a sentence. */
function subjectMarks(){
  if(S.span){const [a,b]=spanAB();
    return S.strokes.filter(s=>inTake(s)&&onLine(s)&&sStart(s)>=a&&sStart(s)<=b);}
  return S.strokes.filter(s=>inTake(s)&&(s.L||0)===S.layer);}
function subjectMoves(marks){
  const set=new Set();
  for(const s of marks)if(s.m)for(const k in s.m)if(MOTION_MARK[k])set.add(k);
  return [...set];}
const MOVE_WORD={spin:"turning",bob:"swaying",pulse:"pulsing",boil:"boiling"};
function subjectSays(){
  const m=subjectMarks(),mv=subjectMoves(m).map(k=>MOVE_WORD[k]).join(" + ");
  const who=S.span?spanSays():S.layers[S.layer].n+" (whole line)";
  return {who,n:m.length,mv,html:"<b>"+who+"</b> <i>· "+m.length+" mark"+(m.length===1?"":"s")+
    (mv?" · "+mv:"")+"</i>"};}
/* carry the selection: sideways in time, up or down to another line */
function spanMove(df,dl){
  const [a,b]=spanAB();if(a+df<0)return false;
  const marks=subjectMarks();
  const L=(S.spanL!=null&&dl!=null&&dl!==S.spanL)?dl:null;
  for(const s of marks){s.f=sStart(s)+df;if(s.to!=null)s.to+=df;if(s.clip)s.clip.start=s.f;
    if(L!=null)s.L=L;}
  if(S.spanL==null&&df)for(const k of S.camKeys)if((k.v==null||k.v===S.ver)&&k.f>=a&&k.f<=b)k.f+=df;
  const l0=S.spanL;
  S.span={a:a+df,b:b+df};if(L!=null){S.spanL=L;S.layer=L;}
  S.frames=Math.max(S.frames,b+df+1);S.frame=clamp(S.frame+df,0,S.frames-1);
  S.epoch++;reel.dataset.sig="";wasHere(a,b,l0);
  ttrace("moved "+marks.length+" marks to "+spanSays());
  return true;}

/* ================= the equirectangular grid =========================
   The graticule of a plate carree is straight; that is the definition.
   What curves is the other system: rectilinear frames pushed through the
   chart. So the cube draws its cells, not just its outline, and the
   barrels appear. Every curve is sampled through the same projection the
   dots use, so the ball and the flat chart draw their own true version. */
const FD=[["FRONT",[0,0,1],[0,1,0]],["REAR",[0,0,-1],[0,1,0]],
  ["LEFT",[-1,0,0],[0,1,0]],["RIGHT",[1,0,0],[0,1,0]],
  ["TOP",[0,1,0],[0,0,-1]],["BOTTOM",[0,-1,0],[0,0,1]]];
const FACES=FD.map(o=>Object.assign({id:o[0]},basis(o[1],o[2])));
const fUnproj=(b,x,y,fov)=>{const t=Math.tan(fov/2);
  return norm(add(add(mul(b.r,x*t),mul(b.u,y*t)),b.f));};
function frameEdge(b,fov){const p=[],N=26,e=.999,at=(x,y)=>fUnproj(b,x,y,fov);
  for(let i=0;i<=N;i++)p.push(at(-e+2*e*i/N,e));
  for(let i=0;i<=N;i++)p.push(at(e,e-2*e*i/N));
  for(let i=0;i<=N;i++)p.push(at(e-2*e*i/N,-e));
  for(let i=0;i<=N;i++)p.push(at(-e,-e+2*e*i/N));
  p.push(null);return p;}
function frameCells(b,fov,n){const p=[],N=20,e=.999,at=(x,y)=>fUnproj(b,x,y,fov);
  for(let k=1;k<n;k++){const x=-e+2*e*k/n;
    for(let i=0;i<=N;i++)p.push(at(x,-e+2*e*i/N));p.push(null);}
  for(let k=1;k<n;k++){const y=-e+2*e*k/n;
    for(let i=0;i<=N;i++)p.push(at(-e+2*e*i/N,y));p.push(null);}
  return p;}
function drawGrid(g,W,H,P,dpr,wrapX){
  const G=S.grid;
  const put=(pts,col,w,dash,back)=>{
    g.setLineDash(dash||[]);g.lineWidth=w*dpr;g.strokeStyle=col;g.beginPath();
    let pen=false,pv=null;
    for(const d of pts){
      if(!d){pen=false;pv=null;continue;}
      const s=P(d);
      if(!s||(back?s[2]:!s[2])){pen=false;pv=null;continue;}
      if(pv&&wrapX&&Math.abs(s[0]-pv[0])>W*.45){pen=false;}
      if(!pen){g.moveTo(s[0],s[1]);pen=true;}else g.lineTo(s[0],s[1]);
      pv=s;}
    g.stroke();g.setLineDash([]);};
  const meridian=(lon,st)=>{const p=[];
    for(let a=-89.5;a<=89.5;a+=(st||2.5))p.push(dirLL(lon*D2R,a*D2R));return p;};
  const parallel=(lat,st)=>{const p=[];
    for(let l=-180;l<=180;l+=(st||3))p.push(dirLL(l*D2R,lat*D2R));return p;};
  const HAIR=a=>"rgba(0,0,0,"+(.17*a).toFixed(3)+")";
  const MAJ =a=>"rgba(0,0,0,"+(.42*a).toFixed(3)+")";
  const CELL=a=>"rgba(0,0,0,"+(.34*a).toFixed(3)+")";
  for(const back of [true,false]){
    const a=back?.30:1;
    if(G.minor){
      for(let lon=-180;lon<180;lon+=10)if(lon%30)put(meridian(lon,5),HAIR(a),.5,0,back);
      for(let lat=-80;lat<=80;lat+=10)if(lat%30)put(parallel(lat,6),HAIR(a),.5,0,back);}
    for(let lon=-180;lon<180;lon+=30)if(lon)put(meridian(lon),MAJ(a),.8,0,back);
    for(let lat=-60;lat<=60;lat+=30)if(lat)put(parallel(lat),MAJ(a),.8,0,back);
    put(meridian(0),"rgba(59,130,246,"+a+")",1.2,0,back);
    put(meridian(179.99),"rgba(255,46,46,"+(a*.7)+")",1.2,0,back);
    put(meridian(-179.99),"rgba(255,46,46,"+(a*.7)+")",1.2,0,back);
    if(G.cube)for(const f of FACES){
      put(frameCells(f,PI/2,6),CELL(a),.55,0,back);
      put(frameEdge(f,PI/2),"rgba(0,0,0,"+(a*.85)+")",1.2,0,back);}
    if(G.frame){
      const b=basis(S.dir,upFor(S.dir));
      put(frameCells(b,S.place,4),CELL(a),.5,[2*dpr,3*dpr],back);
      put(frameEdge(b,S.place),"rgba(0,0,0,"+(a*.9)+")",1.5,[3*dpr,2*dpr],back);}
    if(G.fan){
      const b=basis(S.dir,upFor(S.dir));
      for(let bear=0;bear<180;bear+=15){
        const t=add(mul(b.r,Math.cos(bear*D2R)),mul(b.u,Math.sin(bear*D2R)));
        const p=[];
        for(let al=-180;al<=180;al+=3)
          p.push(norm(add(mul(S.dir,Math.cos(al*D2R)),mul(t,Math.sin(al*D2R)))));
        put(p,"rgba(59,130,246,"+(a*.45)+")",.55,0,back);}}
  }
}

/* ---------- a picture wears its frame, and the frame has handles ------
   You can see how big it is, which way up it is, and where to grab it. */
function patchFrame(s){
  const ty=Math.tan(s.fov/2),tx=ty*(s.asp||1),b=s.basis;
  const e=0.995;                     // just inside, so the frame is on the picture
  const U=(x,y)=>norm(add(add(mul(b.r,x*e*tx),mul(b.u,y*e*ty)),b.f));
  const edge=[],N=14;
  for(let i=0;i<=N;i++)edge.push(U(-1+2*i/N,1));
  for(let i=0;i<=N;i++)edge.push(U(1,1-2*i/N));
  for(let i=0;i<=N;i++)edge.push(U(1-2*i/N,-1));
  for(let i=0;i<=N;i++)edge.push(U(-1,-1+2*i/N));
  edge.push(edge[0]);
  return {edge,size:U(1,0),roll:U(0,1),centre:b.f};}
function drawHandles(g,s,P,dpr){
  const F=patchFrame(s);
  g.setLineDash([4*dpr,3*dpr]);g.strokeStyle="#3b82f6";g.lineWidth=1.6*dpr;
  g.beginPath();let pen=false,pv=null;
  for(const d of F.edge){const q=P(d);
    if(!q||!q[2]){pen=false;pv=null;continue;}
    if(pv&&Math.hypot(q[0]-pv[0],q[1]-pv[1])>1e5)pen=false;
    if(!pen){g.moveTo(q[0],q[1]);pen=true;}else g.lineTo(q[0],q[1]);pv=q;}
  g.stroke();g.setLineDash([]);
  const knob=(d,fill)=>{const q=P(d);if(!q||!q[2])return;
    g.fillStyle=fill;g.strokeStyle="#000";g.lineWidth=1.4*dpr;
    g.beginPath();g.arc(q[0],q[1],7*dpr,0,TAU);g.fill();g.stroke();};
  knob(F.centre,"#fff");knob(F.size,"#3b82f6");knob(F.roll,"#ffd23f");}
/* which handle is under a screen point, if any */
function grabHandle(px,py,P,dpr){
  const s=S.sel;if(!s||!s.img||s.wrap)return null;
  const F=patchFrame(s);
  const near=(d,name)=>{const q=P(d);
    if(!q||!q[2])return null;
    return Math.hypot(q[0]-px,q[1]-py)<20*dpr?name:null;};
  return near(F.size,"size")||near(F.roll,"roll")||near(F.centre,"move");}

/* ---------- the volume ------------------------------------------------
   Standing at the centre, every ray meets the shell at the direction it
   points, and the sphere is a map. Step off the centre and it stops being
   a map: near things swing past faster than far ones. That parallax is the
   whole difference between a panorama and a set you are standing in.

   Eye at P inside the unit shell, ray direction d, the hit is
     t = -(P.d) + sqrt((P.d)^2 + 1 - |P|^2),  hit = P + t d
   which is a direction on the shell. At P = 0 it reduces to d, so the
   centre view and the volume view are the same function. */
/* A camera key is the whole camera at one frame of one take. Between two
   keys the shot moves; before the first and after the last it holds. With
   no keys at all the camera is simply where you left it. Angles are taken
   the short way round so a pan never spins the long way. */
const CAMNOW={yaw:.5,pitch:.18,fov:75*D2R,eye:0,roll:0};
/* how a key leaves itself: straight, or gathering, or settling, or both */
const EASES=["LINE","IN","OUT","BOTH"];
function ease(t,mode){
  if(mode==="IN")return t*t;
  if(mode==="OUT")return 1-(1-t)*(1-t);
  if(mode==="BOTH")return t<.5?2*t*t:1-2*(1-t)*(1-t);
  return t;}
const keyAt=(f,v)=>S.camKeys.find(k=>k.f===f&&(k.v==null||k.v===v));
function camSorted(v){
  return S.camKeys.filter(k=>k.v==null||k.v===v).sort((a,b)=>a.f-b.f);}
const shortWay=(a,b)=>{let d=b-a;
  while(d>PI)d-=TAU;while(d<-PI)d+=TAU;return d;};
function camAt(f,v){
  const ks=camSorted(v);
  if(!ks.length)return S.cam;
  if(f<=ks[0].f)return ks[0];
  if(f>=ks[ks.length-1].f)return ks[ks.length-1];
  let a=ks[0],b=ks[ks.length-1];
  for(let i=0;i<ks.length-1;i++)
    if(f>=ks[i].f&&f<=ks[i+1].f){a=ks[i];b=ks[i+1];break;}
  const raw=b.f===a.f?0:(f-a.f)/(b.f-a.f);
  const t=ease(raw,a.ease||"LINE");
  return {yaw:a.yaw+shortWay(a.yaw,b.yaw)*t,
          pitch:a.pitch+(b.pitch-a.pitch)*t,
          fov:a.fov+(b.fov-a.fov)*t,
          eye:a.eye+(b.eye-a.eye)*t,
          roll:(a.roll||0)+shortWay(a.roll||0,b.roll||0)*t};}
function useCam(f,v){
  const c=camAt(f,v);
  CAMNOW.yaw=c.yaw;CAMNOW.pitch=c.pitch;CAMNOW.fov=c.fov;CAMNOW.eye=c.eye;
  CAMNOW.roll=c.roll||0;}
/* editing writes to the key you are standing on, or to the camera itself */
/* Where an edit lands. Once a single key exists it governs every frame,
   so writing to the base camera would be written straight back over on the
   next paint and the control would look broken. It did. So: if this take
   has any keys, an edit always lands on a key at the frame you are on,
   made from the value showing there if it does not exist yet. With no keys
   at all, and auto off, an edit moves the camera itself. */
const takeIsKeyed=()=>S.camKeys.some(k=>k.v==null||k.v===S.ver);
function setCam(patch){
  let k=keyAt(S.frame,S.ver);
  if(!k&&S.frames>1&&(takeIsKeyed()||S.camAuto)){
    k={f:S.frame,v:S.rows>1?S.ver:null,yaw:CAMNOW.yaw,pitch:CAMNOW.pitch,
       fov:CAMNOW.fov,eye:CAMNOW.eye,roll:CAMNOW.roll||0,ease:"BOTH"};
    S.camKeys.push(k);reel.dataset.sig="";}
  Object.assign(k||S.cam,patch);
  if(k)useCam(S.frame,S.ver);else Object.assign(CAMNOW,patch);}
/* A move is a pair of keys over a run of frames, made from where the
   camera is now. The run is the marked span, or the whole take. Every one
   of these is a thing a camera can physically do, named the way a crew
   names it. */
function moveRun(){
  if(S.span){const F=spanFrames();return [F[0],F[F.length-1]];}
  return [0,Math.max(1,S.frames-1)];}
function putKey(f,c,easing){
  S.camKeys=S.camKeys.filter(k=>!(k.f===f&&(k.v==null||k.v===S.ver)));
  S.camKeys.push({f,v:S.rows>1?S.ver:null,yaw:c.yaw,pitch:c.pitch,fov:c.fov,
    eye:c.eye,roll:c.roll||0,ease:easing||"BOTH"});}
function makeMove(name){
  const [a,b]=moveRun();
  if(b<=a){ttrace("there is only one frame to move over");return;}
  const now={yaw:CAMNOW.yaw,pitch:CAMNOW.pitch,fov:CAMNOW.fov,
             eye:CAMNOW.eye,roll:CAMNOW.roll||0};
  const to=Object.assign({},now);
  const steps=[];
  if(name==="PAN")to.yaw=now.yaw+60*D2R;
  else if(name==="TILT")to.pitch=clamp(now.pitch+35*D2R,-1.45,1.45);
  else if(name==="PUSH")to.eye=0.85;
  else if(name==="PULL")to.eye=0;
  else if(name==="RACK")to.fov=now.fov>60*D2R?28*D2R:95*D2R;
  else if(name==="DUTCH")to.roll=now.roll?0:18*D2R;
  else if(name==="ORBIT"){
    /* a whole turn cannot be one pair: the short way round is nowhere.
       Four quarters, and it comes back to where it began. */
    for(let i=0;i<=4;i++)steps.push([a+Math.round((b-a)*i/4),
      Object.assign({},now,{yaw:now.yaw+i*90*D2R})]);}
  if(!steps.length){steps.push([a,now],[b,to]);}
  steps.forEach(([f,c],i)=>putKey(f,c,i===0||i===steps.length-1?"BOTH":"LINE"));
  S.camKeys.sort((x,y)=>x.f-y.f);
  S.frame=a;useCam(a,S.ver);
  reel.dataset.sig="";ttrace(name.toLowerCase()+" over frames "+(a+1)+"\u2013"+(b+1));
  buildTray();draw();}
function camKeyFrames(){return camSorted(S.ver).map(k=>k.f);}
function gotoKey(dir){
  const fs=camKeyFrames();
  if(!fs.length){ttrace("no keys yet");return;}
  const ahead=fs.filter(f=>dir>0?f>S.frame:f<S.frame);
  const to=ahead.length?(dir>0?ahead[0]:ahead[ahead.length-1])
    :(dir>0?fs[0]:fs[fs.length-1]);
  S.frame=to;S.pin=null;reel.dataset.sig="";buildTray();draw();}
function keyCamera(){
  const k=keyAt(S.frame,S.ver);
  if(k){
    S.camKeys=S.camKeys.filter(x=>x!==k);
    if(!takeIsKeyed())                     // the last one: keep where it was pointing
      S.cam={yaw:CAMNOW.yaw,pitch:CAMNOW.pitch,fov:CAMNOW.fov,eye:CAMNOW.eye,
        roll:CAMNOW.roll||0};
    ttrace("key dropped at frame "+(S.frame+1));}
  else{S.camKeys.push({f:S.frame,v:S.rows>1?S.ver:null,
        yaw:CAMNOW.yaw,pitch:CAMNOW.pitch,fov:CAMNOW.fov,eye:CAMNOW.eye,
        roll:CAMNOW.roll||0,ease:"BOTH"});
    ttrace("key set at frame "+(S.frame+1)+", "+S.camKeys.length+" in all");}
  reel.dataset.sig="";buildTray();draw();}
function camRot(){
  const cy=Math.cos(CAMNOW.yaw),sy=Math.sin(CAMNOW.yaw);
  const cp=Math.cos(CAMNOW.pitch),sp=Math.sin(CAMNOW.pitch);
  const r=[cy,0,-sy],u=[sy*sp,cp,cy*sp],f=[sy*cp,-sp,cy*cp];
  const a=CAMNOW.roll||0;
  if(!a)return [r,u,f];
  const c=Math.cos(a),s=Math.sin(a);        // tip the horizon: a dutch angle
  return [[r[0]*c+u[0]*s,r[1]*c+u[1]*s,r[2]*c+u[2]*s],
          [u[0]*c-r[0]*s,u[1]*c-r[1]*s,u[2]*c-r[2]*s],f];}
function eyePos(R){return mul(R[2],-clamp(CAMNOW.eye,0,0.92));}
function shellHit(P,d){
  const b=dot(P,d),c=dot(P,P)-1;
  const disc=b*b-c;
  if(disc<=0)return null;                    // cannot happen inside the shell
  return norm(add(P,mul(d,-b+Math.sqrt(disc))));}
/* screen to shell */
function volRay(x,y,R,asp){
  const ty=Math.tan(CAMNOW.fov/2),tx=ty*(asp||1);
  return norm([R[0][0]*x*tx+R[1][0]*y*ty+R[2][0],
               R[0][1]*x*tx+R[1][1]*y*ty+R[2][1],
               R[0][2]*x*tx+R[1][2]*y*ty+R[2][2]]);}
function volUnproject(x,y,R,asp){
  return shellHit(eyePos(R),volRay(x,y,R,asp));}
/* shell to screen: [x, y, in front of the eye] */
function volProject(p,R,asp){
  const P=eyePos(R),v=sub(p,P);
  const z=v[0]*R[2][0]+v[1]*R[2][1]+v[2]*R[2][2];
  if(z<=1e-6)return null;
  const ty=Math.tan(CAMNOW.fov/2),tx=ty*(asp||1);
  return [(v[0]*R[0][0]+v[1]*R[0][1]+v[2]*R[0][2])/z/tx,
          (v[0]*R[1][0]+v[1]*R[1][1]+v[2]*R[1][2])/z/ty,1];}
/* the four corners of what the camera sees, on the shell */
function frustumCorners(R,asp){
  const out=[];
  for(const c of [[-1,1],[1,1],[1,-1],[-1,-1]]){
    const p=volUnproject(c[0],c[1],R,asp);
    if(!p)return null;
    out.push(p);}
  return out;}

/* ---------- the onion ------------------------------------------------
   Layers are not a list. They are shells of the same ball. Here they are
   pulled apart so you can see through the stack, bottom at the back. */
function drawStack(cv,f,v,opt){
  const g=cv.getContext("2d"),W=cv.width,H=cv.height;
  g.fillStyle="#fff";g.fillRect(0,0,W,H);
  const n=S.layers.length;
  const rad=Math.min(W*0.30,H*0.34);
  const spread=Math.min((W-2*rad-20)/Math.max(n-1,1),rad*0.62);
  const hit=[];
  for(let l=0;l<n;l++){
    const L=S.layers[l];
    const cx=W/2-(n-1)*spread/2+l*spread;
    const cy=H/2+((n-1)/2-l)*rad*0.16;
    hit.push({l,cx,cy,rad});
    if(!L.vis){
      g.strokeStyle="rgba(0,0,0,.25)";g.lineWidth=1.2;g.setLineDash([4,4]);
      g.beginPath();g.arc(cx,cy,rad,0,TAU);g.stroke();g.setLineDash([]);}
    else drawOrb(cv,f,v,{step:opt.step||5,cx,cy,rad,keep:true,only:l,small:true,
      ground:false,horizon:false,marker:false,grid:false});
    g.strokeStyle=l===S.layer?"#ff2e2e":"rgba(0,0,0,.55)";
    g.lineWidth=(l===S.layer?2.6:1);
    g.beginPath();g.arc(cx,cy,rad,0,TAU);g.stroke();
    g.fillStyle="#000";g.font=(11*(W/460))+"px 'IBM Plex Mono',monospace";
    g.textAlign="center";g.textBaseline="top";
    g.fillText(L.n,cx,cy+rad+4);}
  return {stack:hit};}

/* ---------- the monitor -----------------------------------------------
   A small canvas kept beside the stage, drawn with the same volume code
   the shot export uses, so what you see in the corner is exactly what
   will be written. It reads the frame that is already baked, so it costs
   its own dots and nothing else. */
const MON={cv:null,w:0,h:0};
function drawMonitor(g,W,H,f,v,busy){
  const w=Math.round(Math.min(W*0.34,H*0.5*(S.shotAsp||16/9)));
  const hh=Math.max(1,Math.round(w/(S.shotAsp||16/9)));
  if(!MON.cv)MON.cv=document.createElement("canvas");
  if(MON.w!==w||MON.h!==hh){MON.cv.width=w;MON.cv.height=hh;MON.w=w;MON.h=hh;}
  drawVolume(MON.cv,f,v,{step:busy?9:5.5,grid:false,mono:true});
  const pad=Math.round(6*Math.max(1,W/460));
  const x=W-w-pad,y=H-hh-pad;
  g.fillStyle="#fff";g.fillRect(x,y,w,hh);
  g.drawImage(MON.cv,x,y);
  g.strokeStyle="#3b82f6";g.lineWidth=1.6*Math.max(1,W/460);
  g.strokeRect(x+.5,y+.5,w-1,hh-1);
  const t=Math.max(8,Math.round(9*Math.max(1,W/460)));
  g.fillStyle="#3b82f6";g.font="600 "+t+"px 'IBM Plex Mono',monospace";
  g.textAlign="left";g.textBaseline="bottom";
  g.fillText("SHOT",x+3,y-2);}

/* ================= stage ================= */
const stage=document.getElementById("stage");
let SG=null;
/* The backing store must match the box the canvas is displayed in. If the
   trays or the reel change height after the first fit, the box changes and
   the browser scales the old backing store to the new box: the ball comes
   out an ellipse. So the fit is checked before every paint, and watched. */
let NEED_FIT=true;
function fit(){
  NEED_FIT=false;
  const dpr=Math.min(2,devicePixelRatio||1);
  const r=stage.parentElement.getBoundingClientRect();
  const w=Math.max(1,Math.round(r.width*dpr)),hh=Math.max(1,Math.round(r.height*dpr));
  if(stage.width===w&&stage.height===hh&&stage.dpr===dpr)return false;
  stage.width=w;stage.height=hh;stage.dpr=dpr;
  return true;}
function cellOf(){return S.pin?S.pin:{f:S.frame,v:S.ver};}
/* ================= the governor ===============================================
   A paint that runs long twice in a row coarsens the ball one step; a paint
   that runs short twice brings it back. Four steps, a floor and a ceiling,
   and the line says "thinned \u00b7 slow paint" so a coarse ball is never
   mistaken for the score. It measures, it does not target: there is no
   number on screen to make green. */
const GOV={steps:[2.4,3.2,4.4,6],i:0,slow:0,fast:0,PAINT_MS:24,last:0};
function govStep(){return GOV.steps[Math.min(GOV.steps.length-1,GOV.i+(S.busy?1:0))];}
function govReport(ms){
  GOV.last=ms;
  if(ms>GOV.PAINT_MS){GOV.fast=0;if(++GOV.slow>=2){GOV.slow=0;
    if(GOV.i<GOV.steps.length-1)GOV.i++;}}
  else if(ms<GOV.PAINT_MS*.5){GOV.slow=0;if(++GOV.fast>=2){GOV.fast=0;if(GOV.i>0)GOV.i--;}}
  else{GOV.slow=0;GOV.fast=0;}}
function paint(){
  if(NEED_FIT)fit();                   // the observer says when; paint never measures
  const t0=performance.now();
  startPaintBudget();
  useCam(cellOf().f,cellOf().v);
  SGAIM=null;                          // set again only by a view that draws it
  const c=cellOf();
  const step=govStep();
  prevRefresh(Date.now());
  const wantMon=(S.camOn&&S.camMon)&&(S.view==="ORB"||S.view==="FLAT");
  SG=S.view==="ORB"?drawOrb(stage,c.f,c.v,
      {step,onion:!S.busy&&S.onion.n>0,handles:true,live:true,frustum:S.camOn})
    :S.view==="VOLUME"?drawVolume(stage,c.f,c.v,{step,live:true})
    :S.view==="ONION"?drawStack(stage,c.f,c.v,{step:S.busy?7:5})
    :drawFlat(stage,c.f,c.v,{step,onion:!S.busy&&S.onion.n>0});
  if(wantMon)drawMonitor(stage.getContext("2d"),stage.width,stage.height,
    c.f,c.v,S.busy);
  paintShotPanel(c.f,c.v);
  if(CAM.preview&&CAM.stream)draw2();          // keep the live view moving
  document.getElementById("rest").hidden=S.strokes.length>0;
  const ll=llDir(S.dir);
  if(S.playing&&stroke)document.getElementById("where").dataset.say="";
  if(bakeShort&&!document.getElementById("where").dataset.say)
    document.getElementById("where").dataset.say="";
  const say=document.getElementById("where").dataset.say;
  document.getElementById("where").textContent=say?say:
    (S.rows>1?String.fromCharCode(65+S.ver)+" ":"")+"f"+(S.frame+1)+"/"+S.frames+

/* Playback is a clock read on each animation frame, not an interval. An
   interval keeps firing while a slow view is still painting, and the ticks
   pile up behind the paint until nothing answers a finger; that was the
   freeze on VIEW during PLAY. The clock advances by elapsed time, drops
   the frames it missed, and paints at most once per animation frame. */
let timer=null,playAt=0;
function playTick(now){
  if(!S.playing)return;
  timer=requestAnimationFrame(playTick);
  if(document.hidden||q)return;               // a paint is already queued
  const per=1000/clamp(S.fps,1,24);
  if(now-playAt<per)return;
  const missed=Math.min(S.frames,Math.floor((now-playAt)/per));
  playAt+=missed*per;
  S.frame=(S.frame+missed)%S.frames;S.pin=null;draw();}

  if(timer)cancelAnimationFrame(timer);timer=null;
  if(on){playAt=performance.now();timer=requestAnimationFrame(playTick);}
  draw();}
/* a hidden tab draws nothing and keeps nothing running that it cannot show */

/* ================= pictures in ================= */
/* one canvas reads every picture and every film frame; it is never freed
   and never duplicated. Reading through a fresh canvas per frame is what
   made a 96-frame film ninety six allocations that WebKit frees late. */
const DECODE={cv:null,g:null};
function decodeCtx(w,h){
  if(!DECODE.cv){DECODE.cv=document.createElement("canvas");
    DECODE.g=DECODE.cv.getContext("2d",{willReadFrequently:true});}
  if(DECODE.cv.width!==w||DECODE.cv.height!==h){DECODE.cv.width=w;DECODE.cv.height=h;}
  return DECODE.g;}
function rgb(src,w,h){
  const g=decodeCtx(w,h);g.fillStyle="#fff";g.fillRect(0,0,w,h);
  g.drawImage(src,0,0,w,h);
  const px=g.getImageData(0,0,w,h).data,d=new Uint8ClampedArray(w*h*3);
  for(let i=0;i<w*h;i++){d[i*3]=px[i*4];d[i*3+1]=px[i*4+1];d[i*3+2]=px[i*4+2];}
  return {d,w,h};}
/* a picture two units wide and one high is an equirectangular picture.

const looksEquirect=(w,h)=>Math.abs(w/h-2)<0.16;
/* one picture, held from where it lands. With a span marked it starts at
   the head of the run and ends at its tail — not a copy on every frame. */
function newLayerFor(name){
  let n=(name||"PIC").replace(/\.[^.]+$/,"").replace(/[^A-Za-z0-9]+/g,"")
    .toUpperCase().slice(0,6)||"PIC";
  let k=1,base=n;while(S.layers.some(x=>x.n===n))n=base+"·"+(++k);
  if(S.layers.length>=BUDGET.LAYERS_MAX){
    ttrace("no room for another line: "+BUDGET.LAYERS_MAX+" is the ceiling");
    return S.layer;}
  S.layers.push({n,vis:true,mode:"OVER",op:1,key:false,kt:0.90});
  S.layer=S.layers.length-1;
  return S.layer;}
function place(img,f,wrap,only){
  const v=S.rows>1?S.ver:null;
  let f0=f,to=null;
  if(only!=null){f0=only;to=only;}
  else if(S.span){const F=spanFrames();f0=F[0];to=F[F.length-1];}
  const s=wrap?{img,wrap:true,f:f0,to,v,L:S.layer}
    :{img,basis:basis(S.dir,upFor(S.dir)),fov:S.place,roll:0,asp:1,f:f0,to,v,L:S.layer};
  S.strokes.push(s);S.sel=s;S.epoch++;return s;}
function addImage(src,name){
  const w=src.naturalWidth||src.videoWidth||2,hh=src.naturalHeight||src.videoHeight||1;
  if(!BUDGET.room(EW*EH*3)){
    ttrace("no room for another picture \u00b7 "+BUDGET.say());return null;}
  newLayerFor(name);                       // every picture gets a line of its own
  const wrap=S.wrapMode==="AUTO"?looksEquirect(w,hh):S.wrapMode==="WRAP";
  /* a patch lands in the middle of what you are looking at, never behind you */
  if(!wrap)S.dir=fromScreen(0,0,rot())||S.dir;
  const s=place(rgb(src,wrap?EW:PWP,wrap?EH:PWP),S.frames>1?S.frame:null,wrap);
  if(!wrap)S.tool="MOVE";
  reel.dataset.sig="";
  ttrace(wrap?"the whole ball":"drag it \u00b7 pinch to size \u00b7 twist to turn");
  draw();return s;}
/* how many frames of this film we can afford, decided before reading */
function filmRoom(wrap){
  const per=wrap?VW*VH*3:VWP*VWP*3;
  return Math.max(1,Math.floor((PIX_BUDGET-pixBytes())/per));}
function addClip(srcIndex,start,len,L){
  const src=SRC[srcIndex];

    img:src.frames[0],wrap:src.wrap,f:start,to:start+Math.min(len,src.frames.length)-1,
    v:S.rows>1?S.ver:null,L:L!=null?L:S.layer,start};
  s.clip.start=start;
  if(!src.wrap){s.basis=basis(S.dir,upFor(S.dir));s.fov=S.place;s.asp=1;s.roll=0;}
  S.strokes.push(s);S.epoch++;return s;}

  S.epoch++;reel.dataset.sig="";}

    const nin=clamp(s.clip.in+delta,0,src.frames.length-1);
    const nlen=s.clip.len-(nin-s.clip.in);
    if(nlen<1)return;
    s.clip.in=nin;s.clip.len=nlen;s.f=s.f+delta;s.clip.start=s.f;}
  else{                                        // the tail: just the length
    const nlen=clamp(to-s.f+1,1,src.frames.length-s.clip.in);
    s.clip.len=nlen;s.to=s.f+nlen-1;

async function addVideo(file){
  const v=document.createElement("video");
  v.muted=true;v.playsInline=true;v.src=URL.createObjectURL(file);
  await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=no;});
  /* the film says how many frames it is, unless a span says otherwise */
  let first=0,n=1;
  newLayerFor(file.name);
  if(!S.span){n=clamp(Math.round((v.duration||1)*S.fps),2,96);
    S.strokes.forEach(s=>{if(s.f==null)s.f=0;});
    S.frames=Math.max(S.frames,n);reel.dataset.sig="";}
  else{const F=spanFrames();first=F[0];n=F.length;}
  const wrap=S.wrapMode==="AUTO"?looksEquirect(v.videoWidth,v.videoHeight):S.wrapMode==="WRAP";
  const room=filmRoom(wrap);
  if(n>room){ttrace("that film needs "+n+" frames, there is room for "+room);
    n=room;S.frames=Math.max(S.frames,first+n);}
  const src={name:file.name,wrap,frames:[]};
  SRC.push(src);
  S.rendering=true;S.stop=false;buildTray();
  for(let i=0;i<n;i++){                        // bounded: n is fixed above
    if(S.stop){n=i;break;}                     // STOP keeps what was read
    ttrace("reading "+(i+1)+" of "+n+" \u00b7 STOP in E");
    v.currentTime=(i+.5)/n*v.duration;
    await new Promise(ok=>{v.onseeked=ok;});
    src.frames.push(rgb(v,wrap?VW:VWP,wrap?VH:VWP));}

  if(!n){SRC.pop();ttrace("stopped before a frame was read");return;}
  journalMark();
  addClip(SRC.length-1,first,n);
  URL.revokeObjectURL(v.src);S.frame=first;S.sel=null;
  ttrace("");reel.dataset.sig="";draw();
  setTimeout(()=>{ttrace(n+" frames of film at "+S.fps+"/s");
    setTimeout(()=>ttrace(""),2500);},0);}

/* Reordering is a permutation of the stack, applied to the layer array and
   to every mark's layer number at the same time, so nothing is orphaned. */
function moveLayer(from,to){
  const n=S.layers.length;
  if(from===to||from<0||to<0||from>=n||to>=n)return false;
  const order=[];for(let i=0;i<n;i++)order.push(i);
  order.splice(to,0,order.splice(from,1)[0]);
  const map=new Array(n);
  for(let pos=0;pos<n;pos++)map[order[pos]]=pos;
  S.layers=order.map(i=>S.layers[i]);
  for(const s of S.strokes)s.L=map[s.L||0];
  S.layer=map[S.layer];
  S.strokes.sort((a,b)=>(a.L||0)-(b.L||0));
  S.epoch++;reel.dataset.sig="";
  return true;}

   picture like any other and goes through the same budget. A run is
   bounded by frame count and by the pixel ceiling, never by how long you
   hold the key. */
const CAM={stream:null,vid:null,facing:"environment",busy:false,preview:false};

   into the field, which means thirty two thousand cells and a cache miss
   every frame. Instead one small canvas is refreshed a few times a second
   and each dot reads a pixel out of it. The cost is a lookup, not a bake,
   and nothing about the score changes while you look. */
const PREV_W=96,PREV_MS=90;   /* the ball shows about 5,000 dots; 96 square is plenty */

  return !!(CAM.preview&&CAM.stream&&CAM.vid&&CAM.vid.videoWidth&&PREV.data);}
function prevRefresh(now){
  if(!CAM.preview||!CAM.vid||!CAM.vid.videoWidth)return false;
  if(now-PREV.at<PREV_MS)return false;          // a few times a second, no more
  PREV.wrap=S.wrapMode==="WRAP";
  const w=PREV_W,hh=PREV.wrap?PREV_W>>1:PREV_W;
  if(!PREV.cv){PREV.cv=document.createElement("canvas");PREV.ctx=PREV.cv.getContext("2d");}
  if(PREV.cv.width!==w||PREV.cv.height!==hh){PREV.cv.width=w;PREV.cv.height=hh;}
  try{
    PREV.ctx.drawImage(CAM.vid,0,0,w,hh);
    PREV.data=PREV.ctx.getImageData(0,0,w,hh).data;
  }catch(e){PREV.data=null;return false;}      // a stream can die mid-read

  if(!PREV.data)return null;

  let x,y;
  if(PREV.wrap){const uv=uvDir(d);
    x=clamp((uv[0]*w)|0,0,w-1);y=clamp((uv[1]*hh)|0,0,hh-1);}
  else{
    const z=dot(d,b.f);if(z<=1e-6)return null;
    const t=Math.tan(PREV.fov/2);
    const px=dot(d,b.r)/z/t,py=dot(d,b.u)/z/t;
    if(Math.abs(px)>1||Math.abs(py)>1)return null;
    x=clamp(((px+1)/2*w)|0,0,w-1);y=clamp(((1-py)/2*hh)|0,0,hh-1);}
  const i=(y*w+x)*4;

async function camOpen(){
  if(CAM.stream)return true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    ttrace("this browser will not give a camera here");return false;}
  try{
    CAM.stream=await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:CAM.facing,width:{ideal:1280}},audio:false});
  }catch(err){
    ttrace(err&&err.name==="NotAllowedError"?"the camera was refused":
      "no camera: "+(err&&err.message||"unknown"));
    CAM.stream=null;return false;}
  const v=document.createElement("video");
  v.muted=true;v.playsInline=true;v.srcObject=CAM.stream;
  try{await v.play();}catch(e){/* some browsers resolve late; the frame read still works */}
  CAM.vid=v;buildTray();draw();return true;}
function camClose(){
  if(CAM.stream){for(const t of CAM.stream.getTracks())t.stop();}
  CAM.stream=null;CAM.vid=null;CAM.preview=false;
  PREV.data=null;PREV.at=0;
  if(liveTimer){clearTimeout(liveTimer);liveTimer=null;}
  buildTray();draw();}
async function camFlip(){
  CAM.facing=CAM.facing==="environment"?"user":"environment";
  camClose();await camOpen();}
/* one frame, placed where you are looking */
function camShoot(){
  if(!CAM.vid||!CAM.vid.videoWidth){ttrace("the camera has nothing yet");return;}
  newLayerFor("CAM");
  S.dir=fromScreen(0,0,rot())||S.dir;
  const s=place(rgb(CAM.vid,PWP,PWP),S.frames>1?S.frame:null,false);
  if(!s){ttrace("no room for another picture");return;}
  S.tool="MOVE";reel.dataset.sig="";
  ttrace("shot");draw();}
/* a run of frames, one per frame of the score, at the frame rate */
async function camFilm(){
  if(CAM.busy){CAM.busy=false;return;}
  if(!CAM.vid||!CAM.vid.videoWidth){ttrace("the camera has nothing yet");return;}
  const per=VWP*VWP*3;
  const room=Math.max(1,Math.floor((PIX_BUDGET-pixBytes())/per));
  let first=0,n;
  if(S.span){const F=spanFrames();first=F[0];n=F.length;}
  else{n=Math.min(24,room);first=S.frames>1?S.frame:0;
    S.strokes.forEach(x=>{if(x.f==null)x.f=0;});
    S.frames=Math.max(S.frames,first+n);}
  n=Math.min(n,room);
  newLayerFor("CAM");
  CAM.busy=true;buildTray();
  const wait=Math.max(40,1000/clamp(S.fps,1,24));
  for(let i=0;i<n;i++){                       // bounded: n is fixed before the loop
    if(!CAM.busy)break;
    ttrace("filming "+(i+1)+" of "+n);
    place(rgb(CAM.vid,VWP,VWP),first+i,false,first+i);
    draw();
    await new Promise(r=>setTimeout(r,wait));}
  CAM.busy=false;S.frame=first;reel.dataset.sig="";
  ttrace("filmed "+n+" frames");buildTray();draw();}

/* A row does three things and they must not be confused: the eye toggles,
   a tap selects, a drag reorders. The eye is checked first, then movement
   past a threshold, then the tap. */
function wireStack(){
  const rows=[...tray.querySelectorAll(".lrow")];
  if(!rows.length)return;
  for(const row of rows){
    let down=false,startY=0,moved=0,over=-1;
    const idx=+row.dataset.l;
    const eye=row.querySelector(".eyw");
    if(eye)eye.addEventListener("pointerdown",e=>{
      e.stopPropagation();
      const l=+eye.dataset.eye;
      S.layers[l].vis=!S.layers[l].vis;
      S.epoch++;reel.dataset.sig="";buildTray();draw();});
    row.addEventListener("pointerdown",e=>{
      down=true;moved=0;startY=e.clientY;over=-1;
      row.setPointerCapture(e.pointerId);});
    row.addEventListener("pointermove",e=>{
      if(!down)return;
      moved=Math.max(moved,Math.abs(e.clientY-startY));
      if(moved<10)return;
      row.classList.add("drag");
      let best=-1;
      for(const r of rows){                      // bounded: one pass of the list
        const b=r.getBoundingClientRect();
        if(e.clientY>=b.top&&e.clientY<=b.bottom)best=+r.dataset.l;}
      if(best!==over){
        for(const r of rows)r.classList.remove("over");
        if(best>=0&&best!==idx){
          const t=rows.find(r=>+r.dataset.l===best);
          if(t)t.classList.add("over");}
        over=best;}});
    row.addEventListener("pointerup",e=>{
      down=false;row.classList.remove("drag");
      for(const r of rows)r.classList.remove("over");
      if(moved>=10&&over>=0&&over!==idx){
        /* the list is drawn top of stack first, so the drop index is mirrored */
        const n=S.layers.length;
        moveLayer(idx,over);
        buildTray();draw();return;}
      S.layer=idx;reel.dataset.sig="";buildTray();draw();});
    row.addEventListener("pointercancel",()=>{
      down=false;row.classList.remove("drag");
      for(const r of rows)r.classList.remove("over");});}}

/* the same again for the way out: the panel shows the frame that is about
   to be written, in the shape it will be written in, drawn by the very
   functions that write it. Nothing here is described in words that the
   file could then disagree with. */
const OUT_ASP={FLAT:2,ORB:1};
const outAspect=()=>OUT_ASP[S.render.what||"FLAT"]||(S.shotAsp||16/9);
function outSize(){
  const W=S.render.size,a=outAspect();
  return [W,Math.max(1,Math.round(W/a))];}
function paintOutPanel(f,v){
  const cv=document.getElementById("outpv");
  if(!cv||S.rendering||S.busy||S.playing)return;   // a preview of a still, not a second player
  const wrap=cv.parentElement,a=outAspect();
  const availW=Math.max(60,(wrap.clientWidth||300)-2);
  const availH=Math.max(46,(wrap.clientHeight||120)-2);
  let w=availW,hh=Math.round(w/a);
  if(hh>availH){hh=availH;w=Math.round(hh*a);}
  const dpr=Math.min(2,devicePixelRatio||1);
  const W=Math.round(w*dpr),H=Math.round(hh*dpr);
  if(cv.width!==W||cv.height!==H){
    cv.width=W;cv.height=H;cv.style.width=w+"px";cv.style.height=hh+"px";}
  const what=S.render.what||"FLAT";
  const src=what==="FLAT"?equirect(f,v,W):what==="VIEW"?viewPNG(f,v,W):orbPNG(f,v,W);
  const g=cv.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,W,H);
  g.drawImage(src,0,0,W,H);}

/* the shot, inside the camera panel: the same volume code again, so the
   panel, the monitor and the export can never disagree */
function paintShotPanel(f,v){
  const cv=document.getElementById("campv");
  if(!cv)return;
  const wrap=cv.parentElement;
  const dpr=Math.min(2,devicePixelRatio||1);
  /* fit the shot into whatever the panel has left, keeping its shape, so
     the panel never needs a scrollbar */
  const asp=S.shotAsp||16/9;
  const availW=Math.max(60,(wrap.clientWidth||300)-2);
  const availH=Math.max(46,(wrap.clientHeight||120)-2);
  let w=availW,hh=Math.round(w/asp);
  if(hh>availH){hh=availH;w=Math.round(hh*asp);}
  const W=Math.round(w*dpr),H=Math.round(hh*dpr);
  if(cv.width!==W||cv.height!==H){
    cv.width=W;cv.height=H;cv.style.width=w+"px";cv.style.height=hh+"px";}
  drawVolume(cv,f,v,{step:(S.busy||S.playing)?7:4,grid:false,mono:true});}

/* ================= trays ================= */
const tray=document.getElementById("tray");
function ttrace(t){
  const e=document.getElementById("tTrace");if(e)e.textContent=t;
  const s=document.getElementById("say");if(s){s.textContent=t||"";s.hidden=!t;}
  const w=document.getElementById("where");
  if(w){w.dataset.say=t||"";if(t)w.textContent=t;else paint();}}
function openTray(n){S.tray=S.tray===n?null:n;buildTray();draw();}
function buildTray(){
  const keepScroll=tray.scrollTop;
  tray.classList.toggle("cam",S.tray==="cam");
  tray.classList.toggle("out",S.tray==="render");
  tray.hidden=!S.tray;
  setTimeout(()=>{tray.scrollTop=keepScroll;},0);
  ["fTool","fLayer","fCam","fMedia","fMotion","fRender"].forEach(id=>
    document.getElementById(id).setAttribute("aria-pressed",
      String(S.tray===id.slice(1).toLowerCase())));
  if(!S.tray)return;
  const $=i=>document.getElementById(i);
  if(S.tray==="tool"){
    const T=[["PEN",MARK.pen,"PEN"],["ARC",MARK.arc,"ARC"],["RING",MARK.ring,"RING"],
             ["BOX",MARK.box,"BOX"],["ERASE",MARK.erase,"ERASE"],
             ["MOVE",MARK.move,"MOVE"],["TURN",MARK.turn,"TURN"]];
    tray.innerHTML=
      grp("MAKE A MARK",'<span class="pal">'+
        T.map(t=>'<button class="gl" data-t="'+t[0]+'" aria-pressed="'+(S.tool===t[0])+'">'+
          t[1]+'<span>'+t[2]+'</span></button>').join("")+'</span>')+
      grp("HOW DARK",slider("ink",MARK.tone,1,INKS,S.ink,1))+
      grp("HOW WIDE",slider("brs",MARK.size,0,BRUSHES.length-1,
        Math.max(0,BRUSHES.indexOf(Math.round(S.brush*R2D))),1))+
      grp("WHAT YOU CAN SEE",'<span class="pal">'+
        ["minor","deg","cube","frame","fan"].map((k,i)=>
          '<button class="gl" data-g="'+k+'" aria-pressed="'+!!S.grid[k]+'">'+
          [MARK.tone,MARK.size,MARK.box,MARK.frameA,MARK.ring][i]+'<span>'+
          ["10\u00B0","DEGREES","CUBE","LENS","CIRCLES"][i]+'</span></button>').join("")+
        '</span>')+
      grp("ON THIS FRAME",'<span class="pal">'+
        '<button class="gl" id="outl">'+MARK.outline+'<span>OUTLINE</span></button>'+
        '<button class="gl" id="cut">'+MARK.cut+'<span>CUT</span></button>'+
        '<button class="gl" id="wipe">'+MARK.wipe+'<span>WIPE</span></button></span>');
    tray.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tool=b.dataset.t;buildTray();draw();});
    tray.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{
      S.grid[b.dataset.g]=!S.grid[b.dataset.g];buildTray();draw();});
    onSlide("ink",v=>{S.ink=v;});
    onSlide("brs",v=>{S.brush=BRUSHES[clamp(v,0,BRUSHES.length-1)]*D2R;});
    $("outl").onclick=()=>outline();
    $("cut").onclick=()=>cutHere();
    $("wipe").onclick=()=>{
      const F=S.span?spanFrames():[S.frame],a=F[0],b=F[F.length-1];
      S.strokes=S.strokes.filter(s=>{
        if(s.v!=null&&s.v!==S.ver)return true;
        if(s.f!=null&&s.f>=a&&s.f<=b)return false;        // born inside: gone
        if(s.f!=null&&s.f<a&&live(s,a,S.ver)>=0)s.to=a-1; // running in: ended
        return true;});
      S.sel=null;S.epoch++;draw();};
    return;}
  if(S.tray==="layer"){
    const cur=S.layers[S.layer];
    const count=n=>S.strokes.filter(s=>(s.L||0)===n).length;
    /* top of the stack first, the way a stack reads */
    let list="";
    for(let l=S.layers.length-1;l>=0;l--){
      const L=S.layers[l];
      list+='<div class="lrow'+(l===S.layer?" on":"")+'" data-l="'+l+'">'+
        '<span class="eyw" data-eye="'+l+'"><i class="ey'+(L.vis?"":" off")+'"></i></span>'+
        '<b>'+L.n+'</b><u>'+L.mode+(L.op<1?" "+Math.round(L.op*100)+"%":"")+
        (L.key?" \u00b7 keyed":"")+'</u><s>'+count(l)+'</s>'+
        '<span class="grip"><i></i><i></i><i></i></span></div>';}
    tray.innerHTML=
      grp("THE STACK",'<span class="stack">'+list+'</span>')+
      grp("HOW "+cur.n+" MEETS WHAT IS UNDER IT",
        '<span class="pal">'+BLENDS.map(m=>
          '<button class="gl" data-bm="'+m+'" aria-pressed="'+(cur.mode===m)+'">'+

          '<button class="gl" id="lUp">'+MARK.up+'<span>RAISE</span></button>':"")+
        (S.layer>0?'<button class="gl" id="lDn">'+MARK.down+'<span>LOWER</span></button>'+
          '<button class="gl" id="lMg">'+MARK.merge+'<span>MERGE</span></button>':"")+
        '<button class="gl" id="lCo">'+MARK.collage+'<span>FLATTEN</span></button>'+
        '<button class="gl" id="lDe">'+MARK.decollage+'<span>SPLIT</span></button>'+
        '</span>');
    wireStack();
    tray.querySelectorAll("[data-bm]").forEach(b=>b.onclick=()=>{
      cur.mode=b.dataset.bm;S.look++;buildTray();draw();});
    onSlide("op",v=>{cur.op=v/100;S.look++;},v=>v+"%");
    onSlide("kt",v=>{cur.kt=v/100;S.look++;},v=>v+"%");
    const $=i=>document.getElementById(i);
    $("tAdd").onclick=addTake;
    if($("tDel"))$("tDel").onclick=dropTake;
    if($("tPrev"))$("tPrev").onclick=()=>{
      S.ver=(S.ver+S.rows-1)%S.rows;S.pin=null;reel.dataset.sig="";buildTray();draw();};
    $("lKey").onclick=()=>{cur.key=!cur.key;S.look++;buildTray();draw();};
    $("lAdd").onclick=()=>{
      let k=S.layers.length+1;
      while(S.layers.some(x=>x.n==="L"+k))k++;
      S.layers.push({n:"L"+k,vis:true,mode:"OVER",op:1,key:false,kt:0.90});
      S.layer=S.layers.length-1;reel.dataset.sig="";buildTray();draw();};
    $("lVis").onclick=()=>{cur.vis=!cur.vis;S.epoch++;reel.dataset.sig="";buildTray();draw();};
    $("lClr").onclick=()=>{S.strokes=S.strokes.filter(s=>(s.L||0)!==S.layer);
      S.sel=null;S.epoch++;reel.dataset.sig="";buildTray();draw();};
    const swap=(a,b)=>{
      const t=S.layers[a];S.layers[a]=S.layers[b];S.layers[b]=t;
      S.strokes.forEach(s=>{const L=s.L||0;if(L===a)s.L=b;else if(L===b)s.L=a;});
      S.layer=b;S.epoch++;reel.dataset.sig="";buildTray();draw();};
    if($("lUp"))$("lUp").onclick=()=>swap(S.layer,S.layer+1);
    if($("lDn"))$("lDn").onclick=()=>swap(S.layer,S.layer-1);
    if($("lMg"))$("lMg").onclick=()=>{
      S.strokes.forEach(s=>{if((s.L||0)===S.layer)s.L=S.layer-1;
        else if((s.L||0)>S.layer)s.L=(s.L||0)-1;});
      S.layers.splice(S.layer,1);
      S.layer=clamp(S.layer-1,0,S.layers.length-1);
      S.epoch++;reel.dataset.sig="";buildTray();draw();};
    /* everything showing, pressed into one */
    $("lCo").onclick=()=>{
      if(S.layers.filter(x=>x.vis).length<2){ttrace("only one layer is showing");return;}
      S.strokes=S.strokes.filter(s=>S.layers[s.L||0]&&S.layers[s.L||0].vis);
      S.strokes.sort((a,b)=>(a.L||0)-(b.L||0));
      S.strokes.forEach(s=>{s.L=0;});
      S.layers=[{n:"FLAT",vis:true,mode:"OVER",op:1,key:false,kt:0.90}];
      S.layer=0;S.sel=null;S.epoch++;reel.dataset.sig="";buildTray();draw();};
    /* this layer taken apart, a shell for each piece */
    $("lDe").onclick=()=>{
      const mine=S.strokes.filter(s=>(s.L||0)===S.layer);
      if(mine.length<2){ttrace("there is only one thing here");return;}
      mine.forEach((s,i)=>{
        if(i===0)return;
        let k=S.layers.length+1;
        while(S.layers.some(x=>x.n==="L"+k))k++;
        S.layers.push({n:"L"+k,vis:true,mode:"OVER",op:1,key:false,kt:0.90});
        s.L=S.layers.length-1;});
      S.epoch++;reel.dataset.sig="";buildTray();draw();};
    return;}
  if(S.tray==="tool"){
    const T=[["PEN",MARK.pen,"PEN"],["ARC",MARK.arc,"ARC"],["RING",MARK.ring,"RING"],
             ["BOX",MARK.box,"BOX"],["ERASE",MARK.erase,"ERASE"],

      grp("ON THIS FRAME",'<span class="pal">'+

        '<button class="gl" id="cut">'+MARK.cut+'<span>CUT</span></button>'+
        '<button class="gl" id="wipe">'+MARK.wipe+'<span>WIPE</span></button></span>');
    tray.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tool=b.dataset.t;buildTray();draw();});
    onSlide("ink",v=>{S.ink=v;});
    onSlide("brs",v=>{S.brush=BRUSHES[clamp(v,0,BRUSHES.length-1)]*D2R;});
    $("outl").onclick=()=>outline();
    $("cut").onclick=()=>cutHere();
    $("wipe").onclick=()=>{
      const F=S.span?spanFrames():[S.frame],a=F[0],b=F[F.length-1];
      S.strokes=S.strokes.filter(s=>{

        if(s.f!=null&&s.f>=a&&s.f<=b)return false;        // born inside: gone
        if(s.f!=null&&s.f<a&&live(s,a,S.ver)>=0)s.to=a-1; // running in: ended
        return true;});
      S.sel=null;S.epoch++;draw();};
    return;}
  if(S.tray==="layer"){
    const cur=S.layers[S.layer];
    const inLayer=n=>S.strokes.filter(s=>(s.L||0)===n).length;
    tray.innerHTML=
      grp("DRAWING ON",S.layers.map((L,i)=>

      grp("DO IT TO "+cur.n,
        '<span class="pal">'+
        '<button class="gl" id="lAdd">'+MARK.newl+'<span>NEW</span></button>'+

        (S.layer>0?'<button class="gl" id="lDn">'+MARK.down+'<span>LOWER</span></button>'+
          '<button class="gl" id="lMg">'+MARK.merge+'<span>MERGE</span></button>':"")+
        '</span>')+
      grp("MANY AND ONE",'<span class="pal">'+
        '<button class="gl" id="lCo">'+MARK.collage+'<span>COLLAGE</span></button>'+

    tray.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{

    $("lVis").onclick=()=>{cur.vis=!cur.vis;S.epoch++;buildTray();draw();};
    $("lClr").onclick=()=>{S.strokes=S.strokes.filter(s=>(s.L||0)!==S.layer);
      S.sel=null;S.epoch++;buildTray();draw();};

    const swap=(a,b)=>{
      const t=S.layers[a];S.layers[a]=S.layers[b];S.layers[b]=t;
      S.strokes.forEach(s=>{const L=s.L||0;
        if(L===a)s.L=b;else if(L===b)s.L=a;});
      /* the paint order follows the layer order, so the array follows too */
      S.strokes.sort((p,q)=>(p.L||0)-(q.L||0));
      S.layer=b;S.epoch++;buildTray();draw();};
    /* everything you can see, pressed into one layer */
    $("lCo").onclick=()=>{
      const keep=S.layers.filter(x=>x.vis);
      if(keep.length<2){ttrace("only one layer is showing");return;}

    /* this layer taken apart: every piece onto a layer of its own */
