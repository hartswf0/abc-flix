/* the ghost of the frame before, turned into ink you can keep: the gallop */
function traceGhost(){
  if(S.frames<2){ttrace("there is only one frame to trace from");return;}
  if(!roomFor(1,"a trace"))return;
  const prev=((S.frame-1)%S.frames+S.frames)%S.frames;
  const pts=contourDirs(field(prev,S.ver),0.45);
  if(!pts.length){ttrace("nothing on the frame before");return;}
  S.strokes.push({pts,r:Math.max(2*D2R,S.brush*.45),ink:Math.max(1,S.ink-4),
    L:S.layer,f:S.frame,v:S.rows>1?S.ver:null});
  S.epoch++;ttrace("traced "+pts.length+" points off frame "+(prev+1));draw();}
/* the outline of what is on this frame, as its own mark */
function outline(){
  if(!roomFor(1,"an outline"))return;
  const pts=contourDirs(field(S.frame,S.ver),0.45);
  if(!pts.length){ttrace("nothing here to outline");return;}
  S.strokes.push({pts,r:Math.max(2*D2R,S.brush*.4),ink:S.ink,
    L:S.layer,f:S.frames>1?S.frame:null,v:S.rows>1?S.ver:null});
  S.epoch++;ttrace("outlined at the half tone, "+pts.length+" points");draw();}
/* this layer leaves a decaying trail on the frames after it */
function echo(){
  if(S.frames<2){ttrace("echo needs more than one frame");return;}
  const src=S.strokes.filter(s=>(s.L||0)===S.layer&&!s.img&&s.f===S.frame&&!s.echoed);
  if(!src.length){ttrace("nothing here to echo");return;}
  if(!roomFor(src.length*3,"echo"))return;
  let made=0;
  for(let k=1;k<=3;k++){
    const f=(S.frame+k)%S.frames,tone=Math.max(1,Math.round(S.ink*(1-k/4)));
    src.forEach(s=>{
      S.strokes.push(Object.assign({},s,{f,to:f,ink:tone,m:null,echoed:true}));made++;});}
  S.epoch++;ttrace("echoed onto the next three frames, fading");draw();}

/* end everything that is showing, here. The counterpart of a hold. */
function cutHere(){
  let n=0;
  S.strokes.forEach(s=>{
    if((s.L||0)!==S.layer)return;
    if(live(s,S.frame,S.ver)<0)return;
    if(s.f===S.frame&&s.to==null){s.to=S.frame;n++;}
    else if(s.f!=null&&s.f<S.frame){s.to=S.frame-1;n++;}});
  S.epoch++;ttrace("cut "+n+" at frame "+(S.frame+1));draw();}
const layerHere=()=>S.strokes.filter(s=>(s.L||0)===S.layer&&s.f===S.frame);
/* the same frame, held across the run */
/* holding is the default, so this bounds a mark to the run instead:
   it starts at the head of the span and ends at its tail */
function hold(){
  const F=spanFrames();if(F.length<2){ttrace("select a run of frames first");return;}
  const a=F[0],b=F[F.length-1];
  const src=S.span?subjectMarks():layerHere();if(!src.length){ttrace("nothing selected to hold");return;}
  journalMark();
  src.forEach(s=>{s.f=a;s.to=b;});
  S.epoch++;ttrace("kept to frames "+(a+1)+"\u2013"+(b+1));draw();}
/* the same frame, getting lighter across the run */
function fade(){
  const F=spanFrames();if(F.length<2){ttrace("select a run of frames first");return;}
  const src=S.span?subjectMarks().filter(s=>s.f===F[0]):layerHere();
  if(!src.length){ttrace("nothing on the first selected frame to fade from");return;}
  journalMark();S.frame=F[0];
  if(!roomFor(src.length*(F.length-1),"fade"))return;
  F.forEach((f,i)=>{
    const tone=Math.max(1,Math.round(S.ink*(1-i/(F.length-1))));
    if(f===S.frame){src.forEach(s=>{s.ink=S.ink;});return;}
    src.forEach(s=>S.strokes.push(Object.assign({},s,{f,to:f,ink:tone,m:null})));});
  S.epoch++;ttrace("faded over "+F.length+" frames");draw();}
/* the run, played backwards */
function reverse(){
  const F=spanFrames();if(F.length<2){ttrace("select a run of frames first");return;}
  const a=F[0],b=F[F.length-1];
  journalMark();
  subjectMarks().forEach(s=>{if(s.f!=null&&s.f>=a&&s.f<=b){
    const len=s.to!=null?s.to-s.f:0;s.f=a+b-s.f-len;s.to=s.to!=null?s.f+len:null;}});
  S.epoch++;ttrace("reversed frames "+(a+1)+" to "+(b+1));draw();}

function bake(){
  const s=S.strokes.filter(x=>(x.L||0)===S.layer&&x.m).slice(-1)[0];
  if(!s||!s.m){ttrace("nothing on this layer is moving yet");return;}
  const made=[];
  for(let f=0;f<S.frames;f++){
    const dt=f-(s.f||0),fw=motion(s.m,dt,false);
    if(s.img)made.push(Object.assign({},s,{m:null,f,to:f,
      basis:s.basis&&fw?{f:fw(s.basis.f),r:fw(s.basis.r),u:fw(s.basis.u)}:s.basis}));
    else made.push({pts:fw?s.pts.map(fw):s.pts.slice(),r:mR(s.m,s.r,dt),
      ink:s.ink,L:s.L,erase:s.erase,f,to:f,v:s.v});}
  S.strokes.splice(S.strokes.length-1,1,...made);
  S.epoch++;ttrace("baked into "+S.frames+" frames you can edit one at a time");draw();}
async function ask(text,set){
  if(!text)return;
  if(text[0]==="{"){try{set(JSON.parse(text));}catch(e){ttrace("cannot read that: "+e.message);}return;}
  ttrace("asking\u2026");
  const ac=new AbortController(),tmo=setTimeout(()=>ac.abort(),15000);
  try{
    const r=await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",headers:{"Content-Type":"application/json"},signal:ac.signal,
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,
        messages:[{role:"user",content:
          "Emit only a JSON object, no prose or fences. It describes motion on a unit sphere over "+
          S.frames+" frames. Keys: spin {axis:[x,y,z], rate: degrees per frame}, bob {axis:[x,y,z], "+
          "amp: degrees, period: frames}, pulse {amp: 0..1, period: frames}. Only the keys needed. "+
          "Description: "+text}]})});
    const d=await r.json();
    const t=(d.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("")
      .replace(/```json|```/g,"").trim();
    set(JSON.parse(t));
  }catch(e){ttrace((e.name==="AbortError"?"no answer in 15 s":"no spec came back: "+e.message)+
    '. Type one instead, like {"spin":{"axis":[0,1,0],"rate":8}}');}
  finally{clearTimeout(tmo);}}

/* ================= keep the work ====================================
   The score is strokes, layers, takes and pictures. Written whole and read
   back whole, so a session survives the tab. */
const ENCODE={cv:null};
function imgToPNG(im){
  if(!ENCODE.cv)ENCODE.cv=document.createElement("canvas");
  const c=ENCODE.cv;if(c.width!==im.w||c.height!==im.h){c.width=im.w;c.height=im.h;}
  const g=c.getContext("2d"),d=g.createImageData(im.w,im.h);
  for(let i=0;i<im.w*im.h;i++){
    d.data[i*4]=im.d[i*3];d.data[i*4+1]=im.d[i*3+1];
    d.data[i*4+2]=im.d[i*3+2];d.data[i*4+3]=255;}
  g.putImageData(d,0,0);return c.toDataURL("image/png");}
async function saveScore(){
  if(S.rendering){S.stop=true;return;}
  S.rendering=true;S.stop=false;
  const strokes=[];const pics=S.strokes.filter(s=>s.img&&!s.clip).length;let done=0;
  for(const s of S.strokes){
    if(S.stop)break;
    const o=Object.assign({},s);
    if(s.clip){delete o.img;}
    else if(s.img){
      ttrace("keeping picture "+(++done)+" of "+pics);
      await new Promise(r=>requestAnimationFrame(r));   // one picture, one frame
      o.img={w:s.img.w,h:s.img.h,png:imgToPNG(s.img)};}
    strokes.push(o);}
  S.rendering=false;
  if(S.stop){ttrace("stopped: nothing written");return;}
  const out={v:1,frames:S.frames,rows:S.rows,fps:S.fps,layers:S.layers,camKeys:S.camKeys,strokes};
  const b=new Blob([JSON.stringify(out)],{type:"application/json"});
  const a=document.createElement("a");
  a.download="orb_"+Date.now().toString(36)+".json";
  a.href=URL.createObjectURL(b);a.click();
  ttrace(S.strokes.length+" things written");}
async function openScore(file){
  const txt=await file.text();
  let j;try{j=JSON.parse(txt);}catch(e){ttrace("cannot read that file");return;}
  const pics=j.strokes.filter(s=>s.img&&s.img.png);
  await Promise.all(pics.map(s=>new Promise(res=>{
    const im=new Image();
    im.onload=()=>{s.img=rgb(im,s.img.w,s.img.h);res();};
    im.onerror=()=>{s.img=null;res();};
    im.src=s.img.png;})));
  S.frames=j.frames||1;S.rows=j.rows||1;S.fps=j.fps||8;
  S.layers=j.layers&&j.layers.length?j.layers:[{n:"BASE",vis:true}];
  S.camKeys=j.camKeys||[];
  S.strokes=j.strokes.filter(s=>!s.img||s.img.d);
  S.frame=0;S.ver=0;S.layer=0;S.sel=null;S.span=null;S.spanL=null;S.pin=null;
  reel.dataset.sig="";S.epoch++;
  ttrace("opened "+S.strokes.length+" things, "+S.frames+" frames");draw();}

/* ---------- spherical metadata ---------------------------------------
   A 360 player has no way to know a film is 360 unless the file says so.
   In WebM that is a Projection element inside the track's Video element,
   with ProjectionType 1, equirectangular. Writing it means growing three
   nested elements, so their size fields are rewritten in the eight byte
   form, which is always legal and saves guessing whether a shorter one
   still fits. If anything about the file is not as expected the original
   bytes are returned untouched and the caller is told. */
const EBML={SEGMENT:[0x18,0x53,0x80,0x67],TRACKS:[0x16,0x54,0xAE,0x6B],
  ENTRY:[0xAE],VIDEO:[0xE0],PROJECTION:[0x76,0x70],PROJTYPE:[0x76,0x71]};
function vintLen(b){                        // how many bytes this VINT occupies
  for(let i=0;i<8;i++)if(b&(0x80>>i))return i+1;
  return 0;}
function readSize(buf,i){
  const n=vintLen(buf[i]);
  if(!n)return null;
  let v=buf[i]&(0xFF>>n),all=(0xFF>>n)===v;
  for(let k=1;k<n;k++){v=v*256+buf[i+k];if(buf[i+k]!==0xFF)all=false;}
  return {size:v,len:n,unknown:all};}
function size8(v){                           // always eight bytes: always legal
  const out=new Uint8Array(8);out[0]=0x01;
  for(let i=7;i>=1;i--){out[i]=v%256;v=Math.floor(v/256);}
  return out;}
const idAt=(buf,i,id)=>id.every((b,k)=>buf[i+k]===b);
/* the first child with this id, within [from,to) */
function findChild(buf,from,to,id){
  let i=from,guard=0;
  while(i<to&&guard++<4096){
    const idLen=vintLen(buf[i]);
    if(!idLen)return null;
    const sz=readSize(buf,i+idLen);
    if(!sz)return null;
    const dataStart=i+idLen+sz.len;
    const dataEnd=sz.unknown?to:dataStart+sz.size;
    if(idAt(buf,i,id))return {idStart:i,idLen,dataStart,dataEnd,unknown:sz.unknown};
    if(dataEnd<=i||dataEnd>to)return null;
    i=dataEnd;}
  return null;}
const cat=parts=>{
  let n=0;for(const p of parts)n+=p.length;
  const out=new Uint8Array(n);let o=0;
  for(const p of parts){out.set(p,o);o+=p.length;}
  return out;};
function projectionBytes(){
  const type=cat([new Uint8Array(EBML.PROJTYPE),size8(1),new Uint8Array([1])]);
  return cat([new Uint8Array(EBML.PROJECTION),size8(type.length),type]);}
function wrapEl(id,data){
  return cat([new Uint8Array(id),size8(data.length),data]);}
function injectSpherical(buf){
  const seg=findChild(buf,0,buf.length,EBML.SEGMENT);
  if(!seg)return null;
  const tracks=findChild(buf,seg.dataStart,seg.dataEnd,EBML.TRACKS);
  if(!tracks||tracks.unknown)return null;
  const entry=findChild(buf,tracks.dataStart,tracks.dataEnd,EBML.ENTRY);
  if(!entry)return null;
  const video=findChild(buf,entry.dataStart,entry.dataEnd,EBML.VIDEO);
  if(!video)return null;
  if(findChild(buf,video.dataStart,video.dataEnd,EBML.PROJECTION))return buf; // already said
  const videoData=cat([buf.subarray(video.dataStart,video.dataEnd),projectionBytes()]);
  const newVideo=wrapEl(EBML.VIDEO,videoData);
  const entryData=cat([buf.subarray(entry.dataStart,video.idStart),newVideo,
    buf.subarray(video.dataEnd,entry.dataEnd)]);
  const newEntry=wrapEl(EBML.ENTRY,entryData);
  const tracksData=cat([buf.subarray(tracks.dataStart,entry.idStart),newEntry,
    buf.subarray(entry.dataEnd,tracks.dataEnd)]);
  const newTracks=wrapEl(EBML.TRACKS,tracksData);
  let out=cat([buf.subarray(0,tracks.idStart),newTracks,buf.subarray(tracks.dataEnd)]);
  if(!seg.unknown){                          // a sized Segment must grow as well
    const grew=out.length-buf.length;
    const segData=out.subarray(seg.dataStart,seg.dataEnd+grew);
    out=cat([out.subarray(0,seg.idStart),wrapEl(EBML.SEGMENT,segData)]);}
  return out;}

/* ---------- a film out of the machine ---------------------------------
   The frames are drawn into one canvas at the frame rate and recorded off
   it. Real time, because that is how a recorder stamps its frames. Every
   part is bounded: the count is the score times the loops, the loops are
   capped, and the recorder is stopped in a finally so a failure halfway
   cannot leave it running. */
const MOVIE_LOOPS_MAX=4;
function movieType(){
  if(typeof MediaRecorder!=="function")return null;
  const mp4=["video/mp4;codecs=avc1.42E01E","video/mp4;codecs=avc1","video/mp4"];
  const webm=["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
  const want=S.render.mp4?mp4.concat(webm):webm.concat(mp4);
  for(const t of want)
    if(!MediaRecorder.isTypeSupported||MediaRecorder.isTypeSupported(t))return t;
  return null;}
/* ---------- the same claim, in the other container --------------------
   An ISO file is boxes of [size:u32][type:4], nested. A 360 film carries
   st3d (monoscopic) and sv3d (equirectangular) inside the video sample
   entry, and every box on the way down grows by what was added. Sizes are
   plain 32 bit, so this is simpler than the WebM case; the only thing to
   refuse is a 64 bit size, which we do not rewrite. */
const b4=s=>Uint8Array.from([s.charCodeAt(0),s.charCodeAt(1),s.charCodeAt(2),s.charCodeAt(3)]);
const u32=n=>Uint8Array.from([(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255]);
const readU32=(b,i)=>((b[i]<<24)>>>0)+(b[i+1]<<16)+(b[i+2]<<8)+b[i+3];
function boxes(buf,from,to){
  const out=[];let i=from,guard=0;
  while(i+8<=to&&guard++<4096){
    const size=readU32(buf,i);
    const type=String.fromCharCode(buf[i+4],buf[i+5],buf[i+6],buf[i+7]);
    if(size===1)return out.concat([{type,large:true}]);   // 64 bit: refuse later
    const end=size===0?to:i+size;
    if(end<=i||end>to)break;
    out.push({type,start:i,dataStart:i+8,end});
    i=end;}
  return out;}
const findBox=(buf,from,to,type)=>boxes(buf,from,to).find(b=>b.type===type);
function mkBox(type,data){return cat([u32(data.length+8),b4(type),data]);}
function sphericalBoxes(){
  const st3d=mkBox("st3d",cat([u32(0),Uint8Array.from([0])]));        // monoscopic
  const svhd=mkBox("svhd",Uint8Array.from([...b4("orb "),0]));
  const prhd=mkBox("prhd",cat([u32(0),u32(0),u32(0),u32(0)]));        // yaw pitch roll 0
  const equi=mkBox("equi",cat([u32(0),u32(0),u32(0),u32(0),u32(0)])); // full frame
  const proj=mkBox("proj",cat([prhd,equi]));
  const sv3d=mkBox("sv3d",cat([svhd,proj]));
  return cat([st3d,sv3d]);}
const VISUAL=["avc1","avc3","hvc1","hev1","mp4v","vp09","av01"];
function injectSphericalMP4(buf){
  const path=[["moov"],["trak"],["mdia"],["minf"],["stbl"],["stsd"]];
  let from=0,to=buf.length;const chain=[];
  for(const [type] of path){
    const b=findBox(buf,from,to,type);
    if(!b||b.large)return null;
    chain.push(b);from=type==="stsd"?b.dataStart+8:b.dataStart;to=b.end;}
    /* stsd carries a version/flags word and an entry count before its children */
  const entry=boxes(buf,from,to).find(b=>VISUAL.indexOf(b.type)>=0);
  if(!entry||entry.large)return null;
  /* a visual sample entry has 78 bytes of fixed fields before its children */
  const kids=entry.dataStart+78;
  if(kids<entry.end&&findBox(buf,kids,entry.end,"sv3d"))return buf;   // already said
  const add=sphericalBoxes();
  let out=cat([buf.subarray(0,entry.end),add,buf.subarray(entry.end)]);
  const grow=add.length;
  /* every ancestor, and the sample entry itself, grew by the same amount */
  const bump=start=>{const s=readU32(out,start)+grow;out.set(u32(s),start);};
  bump(entry.start);
  for(let i=chain.length-1;i>=0;i--)bump(chain[i].start);
  return out;}
function movieFrames(frames,loops){
  return Math.max(1,frames)*clamp(loops||1,1,MOVIE_LOOPS_MAX);}
async function recordMovie(){
  if(S.rendering){S.stop=true;return;}
  const type=movieType();
  if(!type){ttrace("this browser will not record a film here");return;}
  const what=S.render.what||"FLAT",flat=what==="FLAT";
  const W=S.render.size;
  const H=flat?W>>1:what==="VIEW"?Math.round(W/(S.shotAsp||16/9)):W;
  const total=movieFrames(S.frames,S.render.loops);
  const fps=clamp(S.fps,1,24);
  if(!exportFits(W,H,"a film"))return;
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const g=cv.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,W,H);
  let stream=null,rec=null;
  const chunks=[];
  S.rendering=true;S.stop=false;buildTray();
  try{
    stream=cv.captureStream(fps);
    rec=new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:8000000});
    rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
    const done=new Promise(res=>{rec.onstop=res;});
    rec.start();
    const v=S.ver;
    for(let i=0;i<total;i++){                 // bounded before it begins
      if(S.stop)break;
      const f=i%S.frames;
      ttrace("filming "+(i+1)+" of "+total);
      const tile=flat?equirect(f,v,W):what==="VIEW"?viewPNG(f,v,W):orbPNG(f,v,W);
      g.fillStyle="#fff";g.fillRect(0,0,W,H);
      g.drawImage(tile,0,0,W,H);
      await new Promise(r=>setTimeout(r,1000/fps));}
    rec.stop();
    await done;
    let blob=new Blob(chunks,{type});
    if(!blob.size){ttrace("the recorder gave nothing back");return;}
    let said=false;
    const isWebm=type.indexOf("webm")>=0;
    if(flat){
      try{
        const raw=new Uint8Array(await blob.arrayBuffer());
        const out=isWebm?injectSpherical(raw):injectSphericalMP4(raw);
        if(out){blob=new Blob([out],{type});said=true;}
      }catch(e){/* the file is still good, it simply is not marked */}}
    const a=document.createElement("a");
    a.download="orb_"+Date.now().toString(36)+
      (flat?"_equirect360":what==="VIEW"?"_shot":"_ball")+
      "_"+W+"x"+H+"."+(isWebm?"webm":"mp4");
    a.href=URL.createObjectURL(blob);a.click();
    ttrace((blob.size/1048576).toFixed(1)+" MB, "+total+" frames at "+fps+"/s"+
      (flat?(said?" \u00b7 marked as 360, upload it as it is":
        " \u00b7 not marked: run Google's metadata injector before uploading"):""));
  }catch(err){
    ttrace("could not record: "+(err&&err.message||"unknown"));
  }finally{
    try{if(rec&&rec.state!=="inactive")rec.stop();}catch(e){/* already stopped */}
    if(stream)for(const t of stream.getTracks())t.stop();
    S.rendering=false;buildTray();}}

/* ================= render out ================= */
/* previews and film frames all draw into one canvas of the size asked;
   v4 made a new one per frame, and per paint when the OUT tray was open */
const TILE={cv:null};
function tileCanvas(W,H){
  if(!TILE.cv)TILE.cv=document.createElement("canvas");
  if(TILE.cv.width!==W||TILE.cv.height!==H){TILE.cv.width=W;TILE.cv.height=H;}
  return TILE.cv;}
function exportFits(W,H,what){
  if(W*H<=BUDGET.EXPORT_PX_MAX)return true;
  let fit=W;while(fit>128&&fit*Math.round(H*fit/W)>BUDGET.EXPORT_PX_MAX)fit=fit>>1;
  ttrace(what+" at "+W+"px is "+(W*H/1e6).toFixed(0)+" Mpx; this device stops at "+
    (BUDGET.EXPORT_PX_MAX/1e6)+" \u00b7 "+fit+"px fits");
  return false;}
function equirect(f,v,W){
  const H=W>>1,cv=tileCanvas(W,H);
  const g=cv.getContext("2d"),img=g.createImageData(W,H),o=img.data,grid=field(f,v);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const d=dirUV((x+.5)/W,(y+.5)/H);
    const c=colourAt(d,f,v),ink=inkAt(grid,d),i=(y*W+x)*4;
    if(c){o[i]=c[0];o[i+1]=c[1];o[i+2]=c[2];}
    else{const k=ink>.5?0:255;o[i]=o[i+1]=o[i+2]=k;}
    o[i+3]=255;}
  g.putImageData(img,0,0);return cv;}
/* what the camera sees, at whatever size is asked for: the shot */
function viewPNG(f,v,W){
  const H=Math.max(1,Math.round(W/(S.shotAsp||16/9)));
  const cv=tileCanvas(W,H);
  drawVolume(cv,f,v,{step:1.6,grid:false});
  return cv;}
function orbPNG(f,v,W){
  const cv=tileCanvas(W,W);
  drawOrb(cv,f,v,{step:1.6});return cv;}
const tile=(f,v,W)=>S.render.what==="FLAT"?equirect(f,v,W)
  :S.render.what==="VIEW"?viewPNG(f,v,W):orbPNG(f,v,W);
function save(cv,name){const a=document.createElement("a");
  a.download=name;a.href=cv.toDataURL("image/png");a.click();}
async function renderOut(){
  if(S.rendering){S.stop=true;return;}
  S.rendering=true;S.stop=false;buildTray();
  const W=S.render.size,v=S.ver,stamp=Date.now().toString(36);
  try{
    const [tw,th]=outSize();
    if(!exportFits(tw,th,"a still")){S.rendering=false;buildTray();return;}
    if(S.render.sheet){
      const cols=Math.min(S.frames,6),rows=Math.ceil(S.frames/cols);
      if(!exportFits(tw*cols,th*rows,"the sheet of "+S.frames)){S.rendering=false;buildTray();return;}
      const one=tile(0,v,W);
      const out=document.createElement("canvas");
      out.width=one.width*cols;out.height=one.height*rows;
      const g=out.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,out.width,out.height);
      for(let f=0;f<S.frames;f++){
        if(S.stop)break;
        ttrace("frame "+(f+1)+" of "+S.frames);
        await new Promise(r=>requestAnimationFrame(r));
        g.drawImage(tile(f,v,W),(f%cols)*one.width,((f/cols)|0)*one.height);}
      if(!S.stop)save(out,"orb_"+stamp+"_sheet.png");
    }else for(let f=0;f<S.frames;f++){
      if(S.stop)break;
      ttrace("frame "+(f+1)+" of "+S.frames);
      await new Promise(r=>requestAnimationFrame(r));
      save(tile(f,v,W),"orb_"+stamp+"_"+String(f+1).padStart(4,"0")+".png");
      await new Promise(r=>setTimeout(r,260));}
    ttrace(S.stop?"stopped":"wrote "+(S.render.sheet?"one sheet":S.frames+" files")+" at "+W+"px");
  }catch(e){ttrace("could not write: "+e.message);}
  S.rendering=false;buildTray();}

/* ================= keys ================= */
const $=i=>document.getElementById(i);
$("view").onclick=()=>{const V=["ORB","VOLUME","FLAT","ONION"];
  S.view=V[(V.indexOf(S.view)+1)%V.length];draw();};
$("camk").onclick=()=>{
  S.camOn=!S.camOn;
  if(S.camOn)openTray("cam");else if(S.tray==="cam")openTray("cam");
  buildTray();draw();};
$("hold").onclick=()=>{S.pin=null;draw();};
$("fTool").onclick=()=>openTray("tool");
$("fLayer").onclick=()=>openTray("layer");
$("fCam").onclick=()=>{if(!S.camOn){S.camOn=true;}openTray("cam");draw();};
$("fMedia").onclick=()=>openTray("media");
$("fMotion").onclick=()=>openTray("motion");
$("fRender").onclick=()=>openTray("render");
$("add").onclick=()=>document.getElementById("file").click();
$("undo").onclick=()=>{undo();draw();};
addEventListener("resize",()=>{NEED_FIT=true;reel.dataset.sig="";draw();});
addEventListener("orientationchange",()=>{NEED_FIT=true;reel.dataset.sig="";draw();});
if(typeof ResizeObserver==="function"){
  /* the box changes when a tray opens; watch it rather than guess */
  const ro=new ResizeObserver(()=>{NEED_FIT=true;draw();});
  ro.observe(stage.parentElement);}
/* ================= boot ===================================================== */
sessionOffer();
fit();draw();
</script>
