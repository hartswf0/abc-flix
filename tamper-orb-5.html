<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TAMPER ORB 5</title>
<meta name="theme-color" content="#ffffff">
<style>
:root{--ink:#000;--paper:#fff;--red:#ff2e2e;--amber:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--paper);color:var(--ink)}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;line-height:1;height:100dvh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:#fff;border:1px solid #000;cursor:pointer}
button:disabled{color:#aaa}
button[aria-pressed=true]{background:#000;color:#fff}
#file{display:none}
.top{height:28px;flex:0 0 28px;display:flex;border-bottom:2px solid #000}
.top>*{height:26px;border:0;border-right:1px solid #000;padding:0 8px;display:flex;align-items:center;white-space:nowrap;font:10px/1 ui-monospace,monospace;background:#fff}
#state{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
#seg{width:86px;justify-content:center;border-right:0;border-left:1px solid #000}
#seg.loading{background:var(--amber)}
#seg.ready{background:#000;color:#fff}
#seg.fault{background:var(--red);color:#fff}
.stage{position:relative;flex:1;min-height:0;background:#fff}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tip{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#777;font-size:9px;pointer-events:none}
.fault{position:absolute;z-index:6;left:8px;right:8px;top:8px;border:2px solid #000;background:#fff;padding:7px;display:flex;align-items:center;gap:6px}
.fault[hidden]{display:none}
.fault span{flex:1;line-height:1.35}
.fault button{padding:6px 8px}
.reel{height:54px;flex:0 0 54px;border-top:1px solid #000;display:flex;overflow-x:auto;background:#fff}
.empty{display:flex;align-items:center;padding:0 10px;color:#777;font-size:9px}
.thumb{position:relative;flex:0 0 68px;border:0;border-right:1px solid #000;overflow:hidden;background:#fff}
.thumb canvas{position:absolute;inset:0;width:100%;height:100%}
.thumb b{position:absolute;left:2px;top:2px;background:#fff;border:1px solid #000;padding:1px 2px;font-size:7px}
.thumb[aria-pressed=true]{box-shadow:inset 0 0 0 2px #000}
.thumb.rec::after{content:"";position:absolute;right:3px;bottom:3px;width:6px;height:6px;background:var(--red)}
.tray{min-height:0;flex:0 0 auto;border-top:1px solid #000;padding:5px;display:flex;gap:5px;align-items:center;background:#fff}
.tray[hidden]{display:none}
.tray button{height:25px;padding:0 8px;font-size:9px}
.tray input{flex:1}
.tray span{font-size:9px;white-space:nowrap}
.foot{height:49px;flex:0 0 49px;border-top:1px solid #000;display:flex;background:#fff}
.foot button{flex:1;border:0;border-right:1px solid #000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:7px;letter-spacing:.06em}
.foot button:last-child{border-right:0}
.foot b{font-size:16px;font-weight:500}
@media(max-width:620px){
  .top>*{padding:0 6px;font-size:9px}
  #seg{width:72px}
  .thumb{flex-basis:58px}
}
</style>
</head>
<body>
<div class="top">
  <button id="brand">TAMPER</button>
  <button id="cam">CAM</button>
  <span id="state">no film</span>
  <button id="add">+ ADD</button>
  <button id="undo">UNDO</button>
  <button id="seg">seg idle</button>
</div>

<div class="stage">
  <canvas id="stage"></canvas>
  <div class="tip" id="tip">add a film · tap a thing · C take</div>
  <div class="fault" id="fault" hidden>
    <span id="faultText"></span>
    <button id="retry">RETRY</button>
    <button id="dismiss">×</button>
  </div>
</div>

<div class="reel" id="reel"><div class="empty">nothing taken</div></div>
<div class="tray" id="tray" hidden></div>

<div class="foot">
  <button id="fFilm"><b>A</b>FILM</button>
  <button id="fSeg"><b>B</b>SEG</button>
  <button id="fTake" disabled><b>C</b>TAKE</button>
  <button id="fTime"><b>D</b>TIME</button>
  <button id="fOut"><b>E</b>OUT</button>
  <button id="fCam"><b>F</b>CAM</button>
</div>
<input id="file" type="file" accept="video/*">
<script src="./tamper-orb-5.js"></script>
</body>
</html>
