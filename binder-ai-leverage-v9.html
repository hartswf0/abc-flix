const $=id=>document.getElementById(id);
const out=$("out"), octx=out.getContext("2d",{willReadFrequently:true});
const grab=document.createElement("canvas"), grabx=grab.getContext("2d",{willReadFrequently:true});
const SRC=[];                       // {kind:'img'|'video', el, w, h}
let TONES=8;                        // changed by tapping a ball, not by a stepper
const UNDO=[];                      // every drag is reversible
let FILL=null, CUT=null, CACHE=null, APER=false, EDGES=false;
let playing=false, raf=0, recutTimer=0;
let SEL=-1;                          // the tone the finger last touched
let SELP=-1;                         // and the patch inside it
let SCOPE="patch";                   // which of the two the balls aim at
const OVR=new Map();                 // patch seed cell -> {dir,srcB}
let TONEB=null;                      // which picture each tone reads as its second

const DECK={A:{held:-1,drag:false,last:[0,0],near:0,detent:"",zoom:1,px:0,py:0,pt:new Map()},
            B:{held:-1,drag:false,last:[0,0],near:0,detent:"",zoom:1,px:0,py:0,pt:new Map()}};

/* haptics: a tick when a tone lands on a named setting, a knock when one is
   about to be dropped. Silently absent where the platform has none. */
const buzz=p=>{ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} };

function cnv(w,h){ const c=document.createElement("canvas"); c.width=Math.max(1,w|0); c.height=Math.max(1,h|0); return c; }
const rnd=(s=>()=>{ s|=0; s=s+0x6D2B79F5|0; let t=Math.imul(s^s>>>15,1|s);
  t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; })(12345);

const anyVideo=()=>SRC.some(s=>s.kind==="video");
function revealWork(){ document.body.classList.add("hasWork"); const s=$("workSide"); if(s) s.hidden=false; }
/* the live path runs smaller. Nothing about the result changes except its
   resolution, and a phone can hold thirty of these a second at 420. */
const workWidth=()=>playing?420:820;

function sampleInto(src,W,H,buf){
  grab.width=W; grab.height=H;
  grabx.clearRect(0,0,W,H);
  const el=src.el, iw=src.kind==="video"?(el.videoWidth||src.w):el.width,
        ih=src.kind==="video"?(el.videoHeight||src.h):el.height;
  if(!iw||!ih) return buf;
  const sc=Math.max(W/iw,H/ih);
  grabx.drawImage(el,(W-iw*sc)/2,(H-ih*sc)/2,iw*sc,ih*sc);
  const d=grabx.getImageData(0,0,W,H).data;
  if(buf&&buf.length===d.length){ buf.set(d); return buf; }
  return new Uint8ClampedArray(d);
}

/* ---- the expensive half: palette, cells, adjacency. Frozen while a clip
   plays, which is both the speed and the reason it does not strobe. ---- */
function recut(){
  if(!SRC.length) return;
  const t0=performance.now();
  const a=SRC[0], b=SRC[1]||SRC[0];
  const aw=a.kind==="video"?(a.el.videoWidth||a.w):a.el.width;
  const ah=a.kind==="video"?(a.el.videoHeight||a.h):a.el.height;
  if(!aw||!ah) return;
  const W=Math.min(workWidth(),aw), H=Math.max(8,Math.round(W*ah/aw));

  const dA=sampleInto(a,W,H,null);
  const palA=byTone(medianCut(dA,TONES));
  const K=palA.length;
  /* every loaded source is sampled and given a palette of the same length, so
     any of them can stand as the second picture for any patch */
  const DATA=[dA], PALS=[palA];
  for(let i=1;i<Math.max(2,SRC.length);i++){
    const src=SRC[i]||SRC[0];
    const d=sampleInto(src,W,H,null);
    const pl=byTone(medianCut(d,K));
    while(pl.length<K) pl.push(pl[pl.length-1]||[0,0,0]);
    DATA.push(d); PALS.push(pl.slice(0,K));
  }
  const dB=DATA[1], palB=PALS[1];
  const {V,lab:labsA}=buildMetric(palA);
  const lut=buildLUT(labsA);

  const idxField=new Uint8Array(W*H);
  quantiseField(lut,dA,W,H,idxField);

  CUT =resizePlaces(CUT ,K,defaultCuts);
  FILL=resizePlaces(FILL,K,defaultPlaces);
  const dens=CUT.map(d=>cutOf(d).dens);
  const cells=cellsFrom(CUT);

  const part=partition(dA,W,H,cells,rnd,idxField,dens);
  const adj=adjacency(part.ids,part.count,W,H);
  const N=part.count;

  const share=new Int32Array(K);
  for(let i=0;i<W*H;i++) share[idxField[i]]++;
  const shareB=new Int32Array(K);
  { const t=new Uint8Array(W*H); quantiseField(buildLUT(buildMetric(palB).lab),dB,W,H,t);
    for(let i=0;i<W*H;i++) shareB[t[i]]++; }

  OVR.clear();                       // a recut invalidates every patch override
  if(!TONEB||TONEB.length!==K) TONEB=new Int32Array(K).fill(1);
  CACHE={W,H,K,palA,palB,V,lut,part,adj,DATA,PALS,
    repA:representative(palA,share,W*H), repB:representative(palB,shareB,W*H),
    dA,dB,idxField,
    mA:new Float32Array(N*3), mB:new Float32Array(N*3),
    apR:new Float32Array(N), apX:new Float32Array(N), apY:new Float32Array(N),
    labels:null, terr:null, imgData:octx.createImageData(W,H),
    cutMs:performance.now()-t0};
  if(SEL>=K) SEL=-1;
  frame(true);
  drawDeck("A"); drawDeck("B");
  buildHead(); buildChips(); buildStrip();
}
const recutSoon=()=>{ clearTimeout(recutTimer); recutTimer=setTimeout(recut,90); };

/* ---- the cheap half: runs every frame ---- */
function frame(force){
  if(!CACHE) return;
  const t0=performance.now();
  const C=CACHE, {W,H,K,part,adj,V,palA,palB}=C;

  if(playing||force){
    const moving=s2=>s2.kind==="video";
    if(moving(SRC[0])||force) C.dA=sampleInto(SRC[0],W,H,C.dA);
    const b=SRC[1]||SRC[0];
    if(moving(b)||force) C.dB=sampleInto(b,W,H,C.dB);
    if(moving(SRC[0])||force) quantiseField(C.lut,C.dA,W,H,C.idxField);
  }

  const st=cellStats(part.ids,part.count,C.idxField,C.dA,C.dB,W,H,K);
  const lamOf=gripFrom(CUT);
  C.labels=solveLabels(st,adj,V,GRIP_FULL,playing?2:6,lamOf,C.labels);
  C.terr=territoryStats(part.ids,C.labels,W,H,K);
  C.patches=findPatches(part.count,C.labels,adj,st.n);
  C.lastStats=st;                      // kept so the text can describe the scene

  const N=part.count, {mA,mB,apR,apX,apY}=C;
  for(let c=0;c<N;c++){
    const n=st.n[c]||1;
    mA[c*3]=st.aR[c]/n;mA[c*3+1]=st.aG[c]/n;mA[c*3+2]=st.aB[c]/n;
    mB[c*3]=st.bR[c]/n;mB[c*3+1]=st.bG[c]/n;mB[c*3+2]=st.bB[c]/n;
    apX[c]=st.cx[c]/n;apY[c]=st.cy[c]/n;
    const v=Math.max(0,st.sq[c]/n-(mA[c*3]**2+mA[c*3+1]**2+mA[c*3+2]**2));
    apR[c]=Math.min(Math.sqrt(n)*0.52,Math.sqrt(Math.sqrt(v)/8)*Math.sqrt(n)*0.30);
  }

  if(out.width!==W||out.height!==H){ out.width=W; out.height=H; C.imgData=octx.createImageData(W,H); }
  const o=C.imgData.data, dA=C.dA, ids=part.ids, labels=C.labels;
  const PA=C.patches, DATA=C.DATA, PALS=C.PALS;
  /* resolve every patch once, then paint: a patch may hold its own setting
     and its own second picture */
  const pr=new Array(PA.count), pb=new Int32Array(PA.count);
  for(let i=0;i<PA.count;i++){
    const s2=settingFor(PA,i,OVR,FILL,TONEB);
    pr[i]=routeOf(s2.dir); pb[i]=Math.min(DATA.length-1,Math.max(1,s2.srcB));
  }
  /* while a tone is under the finger, everything else steps back — the one
     thing the old table could never show was WHERE a row lived */
  const grabbed = DECK.A.held>=0?DECK.A.held : DECK.B.held>=0?DECK.B.held : -1;
  /* grabbing a puck is always a whole-tone act, so it draws as one */
  const scTone = grabbed>=0 ? grabbed : SEL;
  const scMode = grabbed>=0 ? "tone" : SCOPE;
  const SS = PA ? scopeSets(PA,scMode,scTone,SELP) : null;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const i=y*W+x,p=i*4,c=ids[i],l=labels[c];
    const pid=PA.patchOf[c], r=pr[pid];
    const dB=DATA[pb[pid]], palBb=PALS[pb[pid]];
    const pa=palA[l], pbc=palBb[l];
    const ar=r.flat*pa[0]+r.photo*dA[p]  +r.mean*mA[c*3];
    const ag=r.flat*pa[1]+r.photo*dA[p+1]+r.mean*mA[c*3+1];
    const ab=r.flat*pa[2]+r.photo*dA[p+2]+r.mean*mA[c*3+2];
    const br=r.flat*pbc[0]+r.photo*dB[p]  +r.mean*mB[c*3];
    const bg=r.flat*pbc[1]+r.photo*dB[p+1]+r.mean*mB[c*3+1];
    const bb=r.flat*pbc[2]+r.photo*dB[p+2]+r.mean*mB[c*3+2];
    let m=r.mix;
    if(APER&&apR[c]>0.4){
      const dx=x+0.5-apX[c],dy=y+0.5-apY[c];
      if(dx*dx+dy*dy<apR[c]*apR[c]) m=1-m;
    }
    let R0=ar+(br-ar)*m, G0=ag+(bg-ag)*m, B0=ab+(bb-ab)*m;
    /* V6: selection never becomes a view mode. Keep the entire mosaic at full colour. */
    o[p]=R0; o[p+1]=G0; o[p+2]=B0; o[p+3]=255;
  }
  if(EDGES){
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const i=y*W+x,c=ids[i];
      if((x+1<W&&ids[i+1]!==c)||(y+1<H&&ids[i+W]!==c)){ const p=i*4; o[p]=0;o[p+1]=0;o[p+2]=0; }
    }
  }
  /* the boundary of what is in scope, so the extent is known before acting */
  if(SS&&!SS.none){
    const edgeOf=(set,dark)=>{
      for(let y=0;y<H;y++) for(let x=0;x<W;x++){
        const i=y*W+x, a=set[PA.patchOf[ids[i]]];
        if(!a) continue;
        const r=(x+1<W)?set[PA.patchOf[ids[i+1]]]:0;
        const d=(y+1<H)?set[PA.patchOf[ids[i+W]]]:0;
        const l2=(x>0)?set[PA.patchOf[ids[i-1]]]:0;
        const u=(y>0)?set[PA.patchOf[ids[i-W]]]:0;
        if(r&&d&&l2&&u) continue;
        const p=i*4;
        o[p]=dark?12:120; o[p+1]=dark?12:120; o[p+2]=dark?12:120;
      }
    };
    /* Only the active target is outlined. The rest of the composition stays visually untouched. */
    edgeOf(SS.inScope,true);
  }
  octx.putImageData(C.imgData,0,0);

  $("cntA").textContent=part.count+" cells";
  $("cntB").textContent=K+" tones \u00b7 "+C.patches.count+" patches";
  markScope();
  const ms=performance.now()-t0;
  $("foot").innerHTML=
    "<span>patches "+Math.round(C.terr.pooled*100)+"%</span>"+
    "<span>picture "+Math.round(detailFraction(o,W,H)*100)+"%</span>"+
    "<span>"+Math.round(ms)+" ms"+(playing?" \u00b7 "+Math.round(1000/Math.max(1,ms))+"/s":"")+"</span>";
}

/* ---- transport ---- */
function loop(){
  if(!playing) return;
  raf=requestAnimationFrame(loop);
  frame(false);
}
function setPlaying(v){
  playing=v;
  $("play").textContent=v?"STOP":"PLAY";
  $("play").setAttribute("aria-pressed",String(v));
  SRC.forEach(s=>{ if(s.kind==="video"){ v?s.el.play().catch(()=>{}):s.el.pause(); } });
  if(v){ recut(); raf=requestAnimationFrame(loop); }
  else { cancelAnimationFrame(raf); recut(); }
}
$("play").addEventListener("click",()=>setPlaying(!playing));

/* ============================================================
   THE DECKS
   ============================================================ */
function deckCanvas(which){ return which==="A"?$("orbA"):$("orbB"); }
function placesOf(which){ return which==="A"?CUT:FILL; }

function drawDeck(which){
  const cv=deckCanvas(which), g=cv.getContext("2d");
  const Wd=cv.width,Hd=cv.height,cx=Wd/2,cy=Hd/2,Rr=Math.min(Wd,Hd)*0.42;
  const D=DECK[which];
  g.fillStyle="#fff"; g.fillRect(0,0,Wd,Hd);
  const R=faceRot();
  const proj=d=>{ const k=faceProject(d,R,D.zoom,D.px,D.py);
    return [cx+k[0]*Rr, cy-k[1]*Rr, 1-k[2]]; };   // third value: >0 means on the face

  /* the surface, drawn by the same functions the picture uses */
  const repA=CACHE?CACHE.repA:[90,90,110], repB=CACHE?CACHE.repB:[190,170,140];
  /* the surface is sampled in the SETTING, evenly, because that is what the
     projection is now even in — no crowding at the rim */
  const NL=15, NP=15;
  for(let i=0;i<=NL;i++){
    const la=i/NL*180;
    for(let j=0;j<=NP;j++){
      const ph=-90+j/NP*180;
      const d=dirLL(la*D2R,ph*D2R), q=proj(d);
      if(q[2]<=0) continue;
      const dot = which==="A" ? cutDot(d) : fillDot(d,repA,repB);
      const rad=Math.max(0.6,(Rr*0.048)*dot.size*D.zoom);
      g.fillStyle="rgb("+(dot.col[0]|0)+","+(dot.col[1]|0)+","+(dot.col[2]|0)+")";
      g.beginPath(); g.arc(q[0],q[1],rad,0,TAU); g.fill();
    }
  }

  /* the detent lines: the settings a tone can actually land on */
  for(const ph of DET_LAT){
    if(Math.abs(ph)===90) continue;
    g.strokeStyle="rgba(17,17,17,.5)"; g.lineWidth=1;
    g.beginPath(); let on=false;
    for(let la=0;la<=180;la+=2){
      const q=proj(dirLL(la*D2R,ph*D2R));
      if(q[2]<0){on=false;continue;}
      if(!on){g.moveTo(q[0],q[1]);on=true;} else g.lineTo(q[0],q[1]);
    }
    g.stroke();
  }
  for(const la of DET_LON){
    g.strokeStyle= la===90?"rgba(17,17,17,.5)":"rgba(17,17,17,.22)";
    g.lineWidth=1;
    g.beginPath(); let on=false;
    for(let ph=-90;ph<=90;ph+=2){
      const q=proj(dirLL(la*D2R,ph*D2R));
      if(q[2]<0){on=false;continue;}
      if(!on){g.moveTo(q[0],q[1]);on=true;} else g.lineTo(q[0],q[1]);
    }
    g.stroke();
  }
  g.strokeStyle="#111"; g.lineWidth=1.4;
  g.beginPath(); g.arc(cx,cy,Rr*D.zoom,0,TAU); g.stroke();

  /* the four rim settings now sit at left, right, top and bottom with room
     around them, so their names go outside the disc instead of over it */
  g.font="7.5px ui-monospace,monospace"; g.textBaseline="middle";
  const rim = which==="A"
    ? [["LOOSE",-1,0],["TIGHT",1,0],["BIG",0,1],["SMALL",0,-1]]
    : [["1st",-1,0],["2nd",1,0],["FLAT",0,1],["AVG",0,-1]];
  g.fillStyle="#111";
  for(const [t,ux,uy] of rim){
    const x=cx+ux*(Rr*D.zoom+9), y=cy-uy*(Rr*D.zoom+9);
    g.textAlign = ux<0?"right":ux>0?"left":"center";
    g.fillText(t, clamp(x,2,Wd-2), clamp(y,7,Hd-7));
  }
  if(D.zoom>1.02){
    g.textAlign="left"; g.fillStyle="#8b8b8b";
    g.fillText("\u00d7"+D.zoom.toFixed(1),3,Hd-5);
  }

  if(!CACHE) return;
  const pl=placesOf(which); if(!pl) return;
  const {palA,palB,terr,W,H}=CACHE;
  const order=pl.map((d,i)=>i).sort((a,b)=>proj(pl[a])[2]-proj(pl[b])[2]);
  for(const i of order){
    const q=proj(pl[i]);
    const share=terr?terr.total[i]/(W*H):1/pl.length;
    const rad=6+Math.sqrt(share)*20;   // a finger, not a pixel
    let col=palA[i];
    if(which==="B"){ const r=routeOf(pl[i]), cb=palB[i];
      col=[Math.round(col[0]+(cb[0]-col[0])*r.mix),
           Math.round(col[1]+(cb[1]-col[1])*r.mix),
           Math.round(col[2]+(cb[2]-col[2])*r.mix)]; }
    g.beginPath(); g.arc(q[0],q[1],rad,0,TAU);
    g.fillStyle="rgb("+col[0]+","+col[1]+","+col[2]+")"; g.fill();
    g.lineWidth=(i===D.held)?2.6:1.4;
    g.strokeStyle=(i===D.held&&D.off)?"#c0392b":"#fff"; g.stroke();
    g.lineWidth=1; g.strokeStyle="#111"; g.stroke();
    if(i===SEL){                       // the tone the picture has selected
      g.beginPath(); g.arc(q[0],q[1],rad+4,0,TAU);
      g.setLineDash([2,2]); g.lineWidth=1.2; g.strokeStyle="#111"; g.stroke();
      g.setLineDash([]);
    }
    if(i===D.held&&D.off){
      g.beginPath(); g.moveTo(q[0]-rad,q[1]-rad); g.lineTo(q[0]+rad,q[1]+rad);
      g.moveTo(q[0]+rad,q[1]-rad); g.lineTo(q[0]-rad,q[1]+rad);
      g.strokeStyle="#c0392b"; g.lineWidth=1.6; g.stroke();
    }
  }
  /* when a patch is selected, deck B carries one extra puck: that patch's own
     setting, which may differ from the tone it belongs to */
  if(which==="B" && SCOPE==="patch" && CACHE.patches && SELP>=0 && SELP<CACHE.patches.count){
    const s2=settingFor(CACHE.patches,SELP,OVR,FILL,TONEB);
    const q=proj(s2.dir);
    const tone=CACHE.patches.tone[SELP];
    const c=palA[tone], r=routeOf(s2.dir), cb=palB[tone];
    const col=[Math.round(c[0]+(cb[0]-c[0])*r.mix),
               Math.round(c[1]+(cb[1]-c[1])*r.mix),
               Math.round(c[2]+(cb[2]-c[2])*r.mix)];
    g.beginPath(); g.arc(q[0],q[1],13,0,TAU);
    g.fillStyle="rgb("+col[0]+","+col[1]+","+col[2]+")"; g.fill();
    g.lineWidth=3; g.strokeStyle="#fff"; g.stroke();
    g.lineWidth=1.6; g.strokeStyle="#111"; g.stroke();
    g.beginPath(); g.arc(q[0],q[1],18,0,TAU);
    g.setLineDash([3,3]); g.lineWidth=1.2; g.strokeStyle="#111"; g.stroke(); g.setLineDash([]);
  }
  if(D.ghost&&D.held>=0){
    const q=proj(D.ghost);
    if(q[2]>=0){
      g.setLineDash([2,2]); g.strokeStyle="#555"; g.lineWidth=1;
      g.beginPath(); g.arc(q[0],q[1],5,0,TAU); g.stroke(); g.setLineDash([]);
    }
  }
}

function bindDeck(which){
  const cv=deckCanvas(which), D=DECK[which];
  const local=e=>{ const r=cv.getBoundingClientRect();
    return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; };
  const geom=()=>({cx:cv.width/2,cy:cv.height/2,Rr:Math.min(cv.width,cv.height)*0.42});

  /* a generous target, and a count of what else is under the finger so
     crowding is visible instead of being discovered by accident */
  const pick=(px,py)=>{
    const pl=placesOf(which); if(!pl) return {i:-1,near:0};
    const {cx,cy,Rr}=geom(), R=faceRot();
    const grab=Math.max(20,Rr*0.20);
    let best=-1,bd=grab*grab,near=0;
    for(let i=0;i<pl.length;i++){
      const k=faceProject(pl[i],R,D.zoom,D.px,D.py);
      const sx=cx+k[0]*Rr, sy=cy-k[1]*Rr;
      const d=(sx-px)**2+(sy-py)**2;
      if(d<grab*grab) near++;
      if(d<bd){bd=d;best=i;}
    }
    return {i:best,near};
  };
  const unproj=(px,py)=>{
    const {cx,cy,Rr}=geom();
    return faceUnproject((px-cx)/Rr,-(py-cy)/Rr,faceRot(),D.zoom,D.px,D.py);
  };

  /* what rotation was actually wanted for: reach. Pinch to magnify, or
     double-tap empty face to zoom in on that spot and again to come back. */
  const applyZoom=(z,ax,ay)=>{
    const {cx,cy,Rr}=geom();
    const fx=(ax-cx)/Rr, fy=-(ay-cy)/Rr;
    const before=[fx/D.zoom+D.px, fy/D.zoom+D.py];
    D.zoom=clamp(z,1,4);
    D.px=before[0]-fx/D.zoom; D.py=before[1]-fy/D.zoom;
    const lim=Math.max(0,1-1/D.zoom);
    D.px=clamp(D.px,-lim,lim); D.py=clamp(D.py,-lim,lim);
    if(D.zoom<=1.01){ D.zoom=1; D.px=0; D.py=0; }
    drawDeck(which);
  };
  let lastDeckTap=0;
  cv.addEventListener("pointerdown",e=>{
    if(!CACHE) return;
    cv.setPointerCapture(e.pointerId);
    D.pt.set(e.pointerId,[e.clientX,e.clientY]);
    if(D.pt.size===2){                       // a pinch beginning
      const [a,b]=[...D.pt.values()];
      D.pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z:D.zoom};
      D.drag=false; D.held=-1; return;
    }
    const [px,py]=local(e);
    const hit=pick(px,py);
    /* with a patch in hand, deck B drags that patch wherever you press */
    D.patchMode = (which==="B" && SCOPE==="patch" && SELP>=0 && hit.i<0);
    D.held=D.patchMode?-1:hit.i; D.near=hit.near;
    D.drag=true; D.moved=0; D.off=false; D.detent="";
    D.last=[e.clientX,e.clientY]; D.down=[px,py];
    /* a double tap on empty face is the zoom, not a new tone */
    const now=performance.now();
    if(D.held<0 && !D.patchMode && now-lastDeckTap<330){
      lastDeckTap=0; D.drag=false;
      applyZoom(D.zoom>1.5?1:2.6,px,py); buzz(9); return;
    }
    lastDeckTap=now;
    D.allBase = (D.held<0&&!D.patchMode) ? placesOf(which).map(d=>d.slice()) : null;
    if(D.patchMode) pushUndo("P",CACHE.patches.seed[SELP],
      (OVR.get(CACHE.patches.seed[SELP])||{}).dir||null);
    if(D.held>=0){ D.ghost=placesOf(which)[D.held].slice(); pushUndo(which,D.held,D.ghost); buzz(10);
      SEL=D.held; SELP=-1; setScope("tone",true); }   // a puck is a whole-tone grip
    report(which); drawDeck(which); if(D.held>=0&&!playing) frame(true);
  });

  cv.addEventListener("pointermove",e=>{
    if(D.pt.has(e.pointerId)) D.pt.set(e.pointerId,[e.clientX,e.clientY]);
    if(D.pt.size===2&&D.pinch){
      const [a,b]=[...D.pt.values()];
      const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
      const r=cv.getBoundingClientRect();
      const mx=((a[0]+b[0])/2-r.left)*cv.width/r.width;
      const my=((a[1]+b[1])/2-r.top)*cv.height/r.height;
      applyZoom(D.pinch.z*(d/Math.max(1,D.pinch.d)),mx,my);
      return;
    }
    if(!D.drag) return;
    const [px,py]=local(e);
    const dx=e.clientX-D.last[0], dy=e.clientY-D.last[1];
    D.moved+=Math.abs(dx)+Math.abs(dy);
    const {cx,cy,Rr}=geom();

    if(D.held>=0){
      const rr=Math.hypot(px-cx,py-cy)/(Rr*D.zoom);
      D.off = rr>1.14 && placesOf(which).length>2;
      if(D.off && D.detent!=="off"){ D.detent="off"; buzz([14,30,14]); }
      const raw=unproj(px,py);
      if(raw){
        const s2=snapFace(raw);
        placesOf(which)[D.held]=s2.dir;
        if(!D.off && s2.key!==D.detent){          // a tick when it lands on a name
          D.detent=s2.key;
          if(s2.hitLon!==null||s2.hitLat!==null) buzz(7);
        }
        report(which); drawDeck(which);
        if(which==="A") recutSoon(); else if(!playing) frame(true);
      }
    } else if(D.patchMode){
      const raw=unproj(px,py);
      if(raw){
        const s2=snapFace(raw);
        setDir(s2.dir,false);
        if(s2.key!==D.detent){ D.detent=s2.key;
          if(s2.hitLon!==null||s2.hitLat!==null) buzz(7); }
        buildHead(); drawDeck("B"); if(!playing) frame(true);
      }
    } else if(D.allBase){
      /* the gesture rotation used to waste: move every tone together */
      const dLon=(px-D.down[0])/(Rr*2)*180, dLat=-(py-D.down[1])/(Rr*2)*180;
      const moved=shiftAll(D.allBase,dLon,dLat);
      const pl=placesOf(which);
      for(let i=0;i<pl.length;i++) pl[i]=moved[i];
      report(which); drawDeck(which);
      if(which==="A") recutSoon(); else if(!playing) frame(true);
    }
    D.last=[e.clientX,e.clientY];
  });

  const end=()=>{
    if(!D.drag) return;
    const wasHeld=D.held, off=D.off, tap=(D.moved<7), moved=D.moved;
    const wasPatch=D.patchMode;
    D.drag=false; D.held=-1; D.off=false; D.ghost=null; D.allBase=null; D.detent=""; D.patchMode=false;
    if(wasPatch){ buildStrip(); buildHead(); report(which); return; }
    if(wasHeld>=0 && off){ buzz([18,40,18]); dropTone(wasHeld); }
    else if(wasHeld>=0 && tap){
      /* a tap on a tone parks it on the nearest named setting */
      const pl=placesOf(which);
      const s2=snapFace(pl[wasHeld]);
      const [lam,phi]=llDir(pl[wasHeld]);
      let bl=DET_LON[0],bp=DET_LAT[0];
      for(const t of DET_LON) if(Math.abs(lam*R2D-t)<Math.abs(lam*R2D-bl)) bl=t;
      for(const t of DET_LAT) if(Math.abs(phi*R2D-t)<Math.abs(phi*R2D-bp)) bp=t;
      pl[wasHeld]=dirLL(bl*D2R,bp*D2R); buzz(12);
      if(which==="A"){ clearTimeout(recutTimer); recut(); } else { drawDeck(which); if(!playing) frame(true); }
    }
    else if(wasHeld<0 && tap && CACHE){
      const {cx,cy,Rr}=geom(), [px,py]=D.down;
      if(Math.hypot(px-cx,py-cy)/(Rr*D.zoom)<=1){ buzz(15); addTone(); }
      else drawDeck(which);
    }
    else if(which==="A"){ clearTimeout(recutTimer); recut(); }
    else { drawDeck(which); if(!playing) frame(true); }
    report(which);
  };
  const lift=e=>{ D.pt.delete(e.pointerId); if(D.pt.size<2) D.pinch=null; end(e); commitVersion(which==="A"?"cut":"fill"); };
  cv.addEventListener("pointerup",lift);
  cv.addEventListener("pointercancel",lift);
}
bindDeck("A"); bindDeck("B");

/* tones are added and dropped on the ball, so K never needs a stepper */
function addTone(){
  if(!CACHE||TONES>=16) return;
  TONES++;
  recut();
}
function dropTone(i){
  if(!CACHE||TONES<=2) return;
  TONES--;
  if(CUT)  CUT.splice(i,1);
  if(FILL) FILL.splice(i,1);
  recut();
}
$("undo").addEventListener("click",()=>{
  const u=UNDO.pop(); if(!u||!CACHE){ buzz(4); return; }
  buzz(9);
  if(u.which==="P"){                       // a patch override
    if(u.dir) OVR.set(u.i,{...(OVR.get(u.i)||{}),dir:u.dir});
    else { const o=OVR.get(u.i); if(o){ delete o.dir; if(!o.srcB) OVR.delete(u.i); } }
    refreshPanel(); return;
  }
  const pl=placesOf(u.which);
  if(pl&&u.i<pl.length){
    pl[u.i]=u.dir.slice();
    drawDeck(u.which);
    if(u.which==="A") recut(); else frame(true);
    buildHead(); buildStrip();
  }
});

function report(which){
  const el=which==="A"?$("readA"):$("readB");
  const D=DECK[which], pl=placesOf(which);
  if(!CACHE||!pl){ el.textContent="\u2014"; return; }
  if(D.held<0){
    el.textContent = D.drag ? "moving all "+pl.length+" tones together"
      : D.zoom>1.02 ? "\u00d7"+D.zoom.toFixed(1)+" \u00b7 double tap to come back"
      : which==="A" ? "drag a tone \u00b7 pinch or double tap to magnify"
                    : "drag a tone \u00b7 pinch to magnify \u00b7 rim to drop";
    return; }
  const c=CACHE.palA[D.held];
  let txt = which==="A" ? cutLabel(cutOf(pl[D.held])) : routeLabel(routeOf(pl[D.held]));
  if(D.off) txt="release to drop this tone";
  else if(D.near>1) txt=txt+"  ("+D.near+" here)";
  el.innerHTML='<span class="sw" style="background:rgb('+c[0]+','+c[1]+','+c[2]+')"></span>'+txt;
}

/* ---- crossfader: slides every fill tone in longitude at once ---- */
let faderV=0, faderBase=null;
function applyFader(v){
  if(!FILL) return;
  if(!faderBase) faderBase=FILL.map(d=>d.slice());
  faderV=clamp(v,0,1);
  FILL=faderBase.map(d=>{
    const [lam,phi]=llDir(d);
    return clampFace(dirLL(clamp(lam/PI+faderV,0,1)*PI,phi));
  });
  const mark=Math.round(faderV*4);
  if(mark!==applyFader._m){ applyFader._m=mark; buzz(5); }
  $("knob").style.left=(faderV*100)+"%";
  $("knob").style.transform="translateX("+(-faderV*16)+"px)";
  drawDeck("B");
  if(!playing) frame(true);
}
(function bindFader(){
  const t=$("fader"); let on=false;
  const set=e=>{ const r=t.getBoundingClientRect(); applyFader((e.clientX-r.left)/r.width); };
  t.addEventListener("pointerdown",e=>{ if(!CACHE)return; faderBase=FILL.map(d=>d.slice());
    t.setPointerCapture(e.pointerId); on=true; set(e); });
  t.addEventListener("pointermove",e=>{ if(on) set(e); });
  t.addEventListener("pointerup",()=>{ on=false; faderBase=null; commitVersion("mix"); });
  t.addEventListener("pointercancel",()=>{ on=false; faderBase=null; });
})();

/* ============================================================
   THE PICTURE AS THE CONTROL SURFACE

   A touch names a patch — one connected run of cells — and the tone that
   owns it. The scope switch decides which of the two the balls and the cards
   act on, so the same gestures work at both grains.
   ============================================================ */
function hitAt(clientX,clientY){
  if(!CACHE||!CACHE.patches) return null;
  const r=out.getBoundingClientRect();
  const x=Math.floor((clientX-r.left)/r.width*CACHE.W);
  const y=Math.floor((clientY-r.top)/r.height*CACHE.H);
  if(x<0||y<0||x>=CACHE.W||y>=CACHE.H) return null;
  const c=CACHE.part.ids[y*CACHE.W+x];
  return {cell:c, tone:CACHE.labels[c], patch:CACHE.patches.patchOf[c]};
}
/* ---- blending happens ON the patch ----
   Reaching for a ball to say "more of the second picture here" is a long way
   round. Drag across what you selected: sideways is the mix, up and down is
   how it is read. The ball follows, so the mapping is learned by doing it. */
let lastTap=0, lastPatch=-1;
const SD={on:false,inScope:false,start:[0,0],base:null,moved:0,detent:""};

function inScopeAt(h){
  if(!h||!CACHE||!CACHE.patches) return false;
  const t=target(); if(!t) return false;
  return t.kind==="tone" ? h.tone===t.id : h.patch===t.id;
}
out.addEventListener("pointerdown",e=>{
  const h=hitAt(e.clientX,e.clientY);
  if(!h) return;
  e.preventDefault();
  out.setPointerCapture(e.pointerId);
  const wasSelected = (SEL===h.tone && SELP===h.patch && SCOPE==="patch");
  const samePatch = wasSelected;
  SD.on=true; SD.moved=0; SD.start=[e.clientX,e.clientY]; SD.hit=h; SD.detent="";
  SD.wasSelected=wasSelected; SD.newSelect=!samePatch;

  /* V6: every new contact targets that exact patch. If the user was on TONE,
     touching a concrete patch drops back to PATCH immediately. */
  if(!samePatch){
    SEL=h.tone; SELP=h.patch; SCOPE="patch";
    $("sc-patch").setAttribute("aria-pressed","true");
    $("sc-tone").setAttribute("aria-pressed","false");
    syncAiScope();
  }
  SD.inScope=true;
  SD.base=currentDir();
  const t=target();
  if(SD.base&&t){
    if(t.kind==="tone") pushUndo("B",t.id,FILL[t.id]);
    else pushUndo("P",CACHE.patches.seed[t.id],(OVR.get(CACHE.patches.seed[t.id])||{}).dir||null);
  }
  buildHead(); drawDeck("B"); if(!playing) frame(true);
});
out.addEventListener("pointermove",e=>{
  if(!SD.on||!SD.inScope||!SD.base) return;
  const dx=e.clientX-SD.start[0], dy=e.clientY-SD.start[1];
  SD.moved=Math.abs(dx)+Math.abs(dy);
  if(SD.moved<5) return;
  const r=out.getBoundingClientRect();
  const [lam,phi]=llDir(SD.base);
  const lon=clamp(lam*R2D + dx/r.width*200, 0,180);
  const lat=clamp(phi*R2D - dy/r.height*200, -90,90);
  const sn=snapFace(dirLL(lon*D2R,lat*D2R));
  setDir(sn.dir,false);
  if(sn.key!==SD.detent){ SD.detent=sn.key; if(sn.hitLon!==null||sn.hitLat!==null) buzz(7); }
  buildHead(); drawDeck("B"); if(!playing) frame(true);
});
out.addEventListener("pointerup",()=>{
  if(!SD.on) return;
  const h=SD.hit, dragged=SD.moved>=5, wasSelected=SD.wasSelected, newSelect=SD.newSelect;
  SD.on=false; SD.base=null;
  if(dragged){ buildStrip(); buildHead(); commitVersion("patch"); return; }
  const now=performance.now();
  const quick=(now-lastTap<340)&&lastPatch===h.patch;
  lastTap=now; lastPatch=h.patch;
  if(quick){ SEL=h.tone; SELP=h.patch; setScope("tone"); buzz([9,45,9]); return; }
  if(wasSelected&&!newSelect){ clearTarget(); return; }
  /* New tap keeps the new patch selected. */
  refreshPanel(); buzz(11);
});
out.addEventListener("pointercancel",()=>{ SD.on=false; SD.base=null; });

/* what the current scope is pointing at */
function target(){
  if(!CACHE||!CACHE.patches) return null;
  if(SCOPE==="patch"&&SELP>=0&&SELP<CACHE.patches.count) return {kind:"patch",id:SELP};
  if(SEL>=0&&FILL&&SEL<FILL.length) return {kind:"tone",id:SEL};
  return null;
}
function currentDir(){
  const t=target(); if(!t) return null;
  if(t.kind==="tone") return FILL[t.id];
  return settingFor(CACHE.patches,t.id,OVR,FILL,TONEB).dir;
}
function currentSrcB(){
  const t=target(); if(!t) return 1;
  if(t.kind==="tone") return TONEB?TONEB[t.id]:1;
  return settingFor(CACHE.patches,t.id,OVR,FILL,TONEB).srcB;
}
function setDir(dir,record){
  const t=target(); if(!t) return;
  if(t.kind==="tone"){
    if(record) pushUndo("B",t.id,FILL[t.id]);
    FILL[t.id]=dir;
    /* a whole-tone move clears the overrides it would otherwise contradict */
    if(record) for(const [k,v] of [...OVR]) { const pid=CACHE.patches.seed.indexOf(k);
      if(pid>=0&&CACHE.patches.tone[pid]===t.id) OVR.delete(k); }
  } else {
    const key=CACHE.patches.seed[t.id];
    const prev=OVR.get(key)||{};
    OVR.set(key,{...prev,dir});
  }
}
function setSrcB(i){
  const t=target(); if(!t) return;
  if(t.kind==="tone"){ if(TONEB) TONEB[t.id]=i; }
  else {
    const key=CACHE.patches.seed[t.id];
    OVR.set(key,{...(OVR.get(key)||{}),srcB:i});
  }
}

/* a whole frame, rendered small, so a choice is made by comparison */
function renderThumb(ctx,TW,TH,overrideDir,overrideSrc){
  if(!CACHE||!CACHE.patches) return;
  const {W,H,part,labels,mA,mB,dA,palA,DATA,PALS,patches}=CACHE;
  const t=target();
  const pr=new Array(patches.count), pb=new Int32Array(patches.count);
  for(let i=0;i<patches.count;i++){
    let s2=settingFor(patches,i,OVR,FILL,TONEB);
    const aimed = t && (t.kind==="patch" ? i===t.id : patches.tone[i]===t.id);
    const dir = (aimed&&overrideDir)?overrideDir:s2.dir;
    const sb  = (aimed&&overrideSrc!==undefined)?overrideSrc:s2.srcB;
    pr[i]=routeOf(dir); pb[i]=Math.min(DATA.length-1,Math.max(1,sb));
  }
  const im=ctx.createImageData(TW,TH), o=im.data;
  for(let ty=0;ty<TH;ty++){
    const sy=Math.min(H-1,(ty*H/TH)|0);
    for(let tx=0;tx<TW;tx++){
      const sx=Math.min(W-1,(tx*W/TW)|0);
      const i=sy*W+sx, p=i*4, c=part.ids[i], l=labels[c];
      const pid=patches.patchOf[c], r=pr[pid];
      const dB=DATA[pb[pid]], pbc=PALS[pb[pid]][l], pa=palA[l];
      const ar=r.flat*pa[0]+r.photo*dA[p]  +r.mean*mA[c*3];
      const ag=r.flat*pa[1]+r.photo*dA[p+1]+r.mean*mA[c*3+1];
      const ab=r.flat*pa[2]+r.photo*dA[p+2]+r.mean*mA[c*3+2];
      const br=r.flat*pbc[0]+r.photo*dB[p]  +r.mean*mB[c*3];
      const bg=r.flat*pbc[1]+r.photo*dB[p+1]+r.mean*mB[c*3+1];
      const bb=r.flat*pbc[2]+r.photo*dB[p+2]+r.mean*mB[c*3+2];
      const m=r.mix, q=(ty*TW+tx)*4;
      o[q]=ar+(br-ar)*m; o[q+1]=ag+(bg-ag)*m; o[q+2]=ab+(bb-ab)*m; o[q+3]=255;
    }
  }
  ctx.putImageData(im,0,0);
}
function sameDir(a,b){ return a&&b&&Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2])<1e-6; }

function refreshPanel(){ buildHead(); buildChips(); buildStrip(); drawDeck("A"); drawDeck("B");
  if(!playing) frame(true);
  if(!$("scriptPane").hidden) readBack(); }

/* the scope buttons carry the counts, so the choice is never abstract */
function markScope(){
  const bp=$("sc-patch"), bt=$("sc-tone"), tabs=$("targetBar");
  const has=!!(CACHE&&CACHE.patches&&SEL>=0);
  if(!has){
    $("nP").textContent=""; $("nT").textContent="";
    bp.disabled=true; bt.disabled=true;
    if(tabs) tabs.hidden=true;
    document.querySelector(".stage")?.classList.remove("targeting");
    syncAiScope();
    return;
  }
  bp.disabled=false; bt.disabled=false;
  if(tabs) tabs.hidden=false;
  document.querySelector(".stage")?.classList.add("targeting");
  const per=patchesPerTone(CACHE.patches,CACHE.K);
  const n=per[SEL]||1;
  const frac=SELP>=0?CACHE.patches.size[SELP]/(CACHE.W*CACHE.H):0;
  $("nP").textContent=(frac*100).toFixed(1)+"%";
  $("nT").textContent=n+(n===1?" run":" runs");
  syncAiScope();
}

function buildHead(){
  const head=$("tryHead"), t=target();
  markScope();
  if(!t){ head.textContent="TAP IMAGE"; return; }
  const tone=t.kind==="tone"?t.id:CACHE.patches.tone[t.id];
  const c=CACHE.palA[tone];
  const frac = t.kind==="tone"
    ? (CACHE.terr.total[tone]/(CACHE.W*CACHE.H))
    : (CACHE.patches.size[t.id]/(CACHE.W*CACHE.H));
  const own = t.kind==="patch" && OVR.has(CACHE.patches.seed[t.id]);
  head.innerHTML='<span class="sw" style="background:rgb('+c[0]+','+c[1]+','+c[2]+')"></span>'+
    "<b>"+(t.kind==="patch"?"PATCH":"TONE "+(tone+1))+"</b> "+
    (frac*100).toFixed(1)+"%"+
    (own?" · OWN":"")+
    " · "+routeLabel(routeOf(currentDir()));
}

/* which picture this patch reads as its second */
function buildChips(){
  const el=$("chips"); el.innerHTML="";
  if(!CACHE){ el.hidden=true; return; }
  el.hidden = SRC.length<=2 || !target();
  const cur=currentSrcB(), t=target();
  for(let i=1;i<Math.max(2,SRC.length);i++){
    const b=document.createElement("button");
    b.setAttribute("aria-pressed",String(t&&cur===i));
    b.disabled=!t;
    const cv=document.createElement("canvas"); cv.width=44; cv.height=30;
    const g=cv.getContext("2d"), src=SRC[i]||SRC[0];
    const el2=src.el, iw=src.kind==="video"?(el2.videoWidth||src.w):el2.width,
          ih=src.kind==="video"?(el2.videoHeight||src.h):el2.height;
    if(iw&&ih){ const sc=Math.max(44/iw,30/ih);
      try{ g.drawImage(el2,(44-iw*sc)/2,(30-ih*sc)/2,iw*sc,ih*sc); }catch(e){} }
    b.appendChild(cv);
    const n=document.createElement("span"); n.className="n"; n.textContent=i+1; b.appendChild(n);
    b.addEventListener("click",()=>{ setSrcB(i); buzz(10); refreshPanel(); commitVersion("source"); });
    el.appendChild(b);
  }
  if(SRC.length>2){ const add=document.createElement("button");
  add.className="add"; add.textContent="+"; add.title="add another picture";
  add.addEventListener("click",()=>$("file").click());
  el.appendChild(add); }
}

function buildStrip(){
  const strip=$("strip"); strip.innerHTML="";
  if(!CACHE){ strip.classList.add("inactive"); return; }
  const t=target();
  strip.classList.toggle("inactive",!t);
  if(!t) return;
  const TW=90, TH=Math.max(20,Math.round(TW*CACHE.H/CACHE.W));
  const cur=currentDir();
  for(const a of ALTS){
    const dir=altDir(a);
    const b=document.createElement("button");
    b.className="alt";
    b.setAttribute("aria-pressed",String(!!t&&sameDir(cur,dir)));
    b.disabled=!t;
    const cv=document.createElement("canvas"); cv.width=TW; cv.height=TH;
    renderThumb(cv.getContext("2d"),TW,TH,dir,undefined);
    b.appendChild(cv);
    const lab=document.createElement("span"); lab.textContent=a.t; b.appendChild(lab);
    b.addEventListener("click",()=>{ setDir(dir,true); buzz(12); refreshPanel(); commitVersion("preset"); });
    strip.appendChild(b);
  }
}

function setScope(sc,quiet){
  SCOPE=sc;
  $("sc-patch").setAttribute("aria-pressed",String(sc==="patch"));
  $("sc-tone").setAttribute("aria-pressed",String(sc==="tone"));
  /* the two grains feel different in the hand as well as look different */
  if(!quiet) buzz(sc==="tone"?[9,45,9]:11);
  refreshPanel();
}
function clearTarget(){
  SEL=-1; SELP=-1; SCOPE="patch"; AI_SCOPE="all";
  $("sc-patch").setAttribute("aria-pressed","true");
  $("sc-tone").setAttribute("aria-pressed","false");
  buzz(5); refreshPanel();
}
$("sc-patch").addEventListener("click",()=>{ if(SEL>=0) setScope("patch"); });
$("sc-tone").addEventListener("click",()=>{ if(SEL>=0) setScope("tone"); });
$("t-clear").addEventListener("click",clearTarget);

/* ============================================================
   THE TEXT INTERFACE
   ============================================================ */
function currentStateText(){
  if(!CACHE||!CACHE.patches) return STATE_HELP;
  const C=CACHE;
  const st=C.lastStats;
  let scene=[];
  if(st){
    const geo=patchGeometry(C.patches,st,C.W,C.H);
    const detail=toneDetail(C.K,C.labels,st,C.W,C.H);
    scene=scene.concat(
      SRC.map((s2,i)=>"# picture "+(i+1)+"  "+(i===0?"structural first image; lon 0":("command src "+i))+"  "+
        (s2.live?"the camera, live":s2.kind==="video"?"a clip":"a still")),
      ["#"],
      toneReport(C.K,C.palA,C.palB,C.terr,C.patches,st,geo,C.W,C.H,TONEB,detail),
      ["#"],
      patchReport(C.patches,geo,C.W,C.H,10));
  }
  return stateToText({
    tones:TONES, cuts:CUT, fills:FILL, toneSrc:TONEB,
    patches:C.patches, ovr:OVR, holes:APER, edges:EDGES, scene,
    stats:C.part.count+" cells, "+C.K+" tones, "+
          C.patches.count+" patches, frame "+C.W+"x"+C.H
  });
}
function readBack(){ $("scriptBox").value=currentStateText(); $("scriptMsg").textContent="read back"; }

function runScript(){
  if(!CACHE){ $("scriptMsg").textContent="load a picture first"; return; }
  const {state,errs}=parseState($("scriptBox").value);
  if(errs.length){
    $("scriptMsg").textContent="line "+errs[0].ln+": "+errs[0].msg+
      (errs.length>1?" (+"+(errs.length-1)+" more)":"");
    buzz([20,40,20]); return;
  }
  let needCut=false;
  if(state.tones!==null && state.tones!==TONES){ TONES=state.tones; needCut=true; }
  if(state.holes!==null) APER=state.holes;
  if(state.edges!==null) EDGES=state.edges;
  $("aper").setAttribute("aria-pressed",String(APER));
  $("edges").setAttribute("aria-pressed",String(EDGES));
  if(needCut) recut();
  const K=CACHE.K;
  for(const r of state.cuts) if(r.i>=0&&r.i<K) CUT[r.i]=dirLL(r.lon*D2R,r.lat*D2R);
  for(const r of state.fills){
    if(r.i<0||r.i>=K) continue;
    FILL[r.i]=dirLL(r.lon*D2R,r.lat*D2R);
    if(r.src!==undefined&&TONEB) TONEB[r.i]=Math.min(Math.max(1,r.src),Math.max(1,SRC.length-1));
  }
  if(state.cuts.length) recut();                 // the cut moved, so re-cut once
  if(CACHE.patches&&state.patches.length){
    const order=patchOrder(CACHE.patches);
    for(const r of state.patches){
      if(r.i<0||r.i>=order.length) continue;
      const key=CACHE.patches.seed[order[r.i]];
      const prev=OVR.get(key)||{};
      OVR.set(key,{...prev,dir:dirLL(r.lon*D2R,r.lat*D2R),
        ...(r.src!==undefined?{srcB:Math.min(Math.max(1,r.src),Math.max(1,SRC.length-1))}:{})});
    }
  }
  const n=state.cuts.length+state.fills.length+state.patches.length;
  $("scriptMsg").textContent=n+" line"+(n===1?"":"s")+" applied";
  buzz(12);
  refreshPanel();
  if(!VERSION_RESTORE) commitVersion("state");
}
$("script").addEventListener("click",()=>{
  const pane=$("scriptPane");
  pane.hidden=!pane.hidden;
  $("script").setAttribute("aria-pressed",String(!pane.hidden));
  if(!pane.hidden) readBack();
});
$("scriptClose").addEventListener("click",()=>{ $("scriptPane").hidden=true; $("script").setAttribute("aria-pressed","false"); });
$("scriptRun").addEventListener("click",runScript);
$("scriptRead").addEventListener("click",readBack);
$("scriptCopy").addEventListener("click",async()=>{
  try{ await navigator.clipboard.writeText($("scriptBox").value); $("scriptMsg").textContent="copied"; }
  catch(e){ $("scriptBox").select(); $("scriptMsg").textContent="select and copy"; }
});

/* ---- switches ---- */
$("aper").addEventListener("click",e=>{ APER=!APER; e.currentTarget.setAttribute("aria-pressed",String(APER)); if(!playing) frame(true); commitVersion("holes"); });
$("edges").addEventListener("click",e=>{ EDGES=!EDGES; e.currentTarget.setAttribute("aria-pressed",String(EDGES)); if(!playing) frame(true); commitVersion("edges"); });
$("reset").addEventListener("click",()=>{ if(!CACHE) return;
  TONES=8; UNDO.length=0; OVR.clear(); SEL=-1; SELP=-1;
  for(const k of ["A","B"]){ DECK[k].zoom=1; DECK[k].px=0; DECK[k].py=0; }
  FILL=defaultPlaces(TONES); CUT=defaultCuts(TONES);
  applyFader(0); recut(); commitVersion("reset"); });
/* The preview runs at 420 while a clip plays and 820 when it stops. Saving
   that would hand back a proxy. SAVE re-runs the whole chain at the source's
   own resolution with the settings currently on the balls. */
$("save").addEventListener("click",async()=>{
  if(!CACHE||!SRC.length) return;
  const btn=$("save"); btn.disabled=true; const saveHTML=btn.innerHTML; const saveLab=btn.querySelector("span:last-child"); if(saveLab) saveLab.textContent="…";
  await new Promise(r=>setTimeout(r,16));
  try{
    const a=SRC[0], b=SRC[1]||SRC[0];
    const aw=a.kind==="video"?(a.el.videoWidth||a.w):a.el.width;
    const ah=a.kind==="video"?(a.el.videoHeight||a.h):a.el.height;
    const W=Math.min(2600,aw), H=Math.max(8,Math.round(W*ah/aw));

       preview promised. The composition is resolution-independent: the same
       cells, drawn larger, with more photographic detail inside each. */
    const cells=cellsFrom(cuts);
    const part=partition(dA,W,H,cells,rnd,idxField,dens);
    const st=cellStats(part.ids,part.count,idxField,dA,dB,W,H,K);

      apX[c]=st.cx[c]/n;apY[c]=st.cy[c]/n;

      const ab=r.flat*pa[2]+r.photo*dA[p+2]+r.mean*mA[c*3+2];

      (lost?"<span>"+lost+" patch overrides not carried \u2014 export uses tone settings</span>":"");

});

function addReference(f){

      v.addEventListener("error",()=>{ URL.revokeObjectURL(url); res(false); },{once:true});

    }
    if(!/^image\//.test(f.type)){ URL.revokeObjectURL(url); return res(false); }

async function applyAiOption(i){
  const o=AI_OPTIONS[i]; if(!o||AI_APPLYING>=0) return;
  if(!aiKey()){ $("aiSettings").hidden=false; return; }
  AI_APPLYING=i;
  AI_BEFORE_URL=canvasDataURL(out,900,.92)||"";
  const buttons=[...document.querySelectorAll(".aiOption")]; buttons.forEach((b,j)=>b.setAttribute("aria-pressed",String(j===i)));
  $("aiPane").hidden=true; $("ai").setAttribute("aria-pressed","false");
  AI_ABORT=new AbortController();
  aiSetBusy(true,o.title,10);
  try{
    if(o.action==="script"){
      if(!o.script) throw new Error("move has no executable change");
      aiStep("applying "+o.title,62);
      $("scriptBox").value=o.script; runScript();
      labelLastVersion("AI · "+o.title);
    }else if(o.action==="generate"||o.action==="edit"){
      const seed=o.image_prompt||$("aiPrompt").value.trim();
      aiStep("building image",38);
      const ip=await resolveImagePrompt(seed,o.action);
      aiStep(o.action==="edit"?"editing pixels":"making pixels",70);
      const blob=o.action==="edit"?await editImageBlob(ip):await generatedImageBlob(ip);
      aiStep("loading result",92);
      await blobToSource(blob,o.action==="edit"?"binder-ai-edit":"binder-ai-generated");
      if(o.script){ $("scriptBox").value=o.script; runScript(); }
      labelLastVersion("AI · "+o.title);
    }else{
      $("aiAnswer").hidden=false; $("aiAnswer").textContent=o.effect;
    }
    aiProgress(100);
    await nextPaint();
    showAiCompare(AI_BEFORE_URL,o.title+" · "+o.effect);
    AI_OPTIONS=[]; renderAiOptions();
  }catch(e){
    $("aiPane").hidden=false; $("ai").setAttribute("aria-pressed","true");
    $("aiAnswer").hidden=false; $("aiAnswer").textContent=e.name==="AbortError"?"STOPPED":"ERROR · "+e.message;
  }finally{
    AI_ABORT=null; AI_APPLYING=-1; setTimeout(()=>aiSetBusy(false),120);
  }
}
async function aiAskOrDrive(mode){
  AI_ABORT=new AbortController();
  aiSetBusy(true,mode==="drive"?"driving":mode==="ideate"?"ideating":"looking",8);
  try{
    aiStep(mode==="drive"?"reading frame and state":"reading context",18);
    const txt=await callBinderModel(mode);
    aiProgress(62);
    if(mode==="drive"){
      const obj=parseModelJSON(txt), script=(obj.script||"").trim(), action=(obj.action||"script").toLowerCase();
      $("aiAnswer").textContent=(obj.message||"model planned an operation")+(script?"\n\n"+script:"");
      if(action==="generate"||action==="edit"){
        const sourcePrompt=(obj.image_prompt||$("aiPrompt").value.trim()).trim();
        aiStep(action==="edit"?"building edit prompt":"building image prompt",72);
        const ip=(await resolveImagePrompt(sourcePrompt,action)).trim();
        aiStep(action==="edit"?"editing pixels":"generating pixels",82);
        const blob=action==="edit"?await editImageBlob(ip):await generatedImageBlob(ip);
        aiStep("loading result into binder",94);
        await blobToSource(blob,action==="edit"?"binder-ai-edit":"binder-ai-generated");
        $("aiAnswer").textContent=(obj.message||action+" complete")+"\nnew image = picture "+SRC.length+" / command src "+(SRC.length-1)+(script?"\n\n"+script:"")+"\n\nimage prompt used:\n"+ip;
      }else if(action==="ideate"){
        const sourcePrompt=(obj.image_prompt||$("aiPrompt").value.trim()).trim();
        const ip=(await resolveImagePrompt(sourcePrompt,"generate")).trim();
        $("aiAnswer").textContent=(obj.message||"concept built")+"\n\n"+ip;
      }
      if(script){
        if(!CACHE) throw new Error("load a picture before applying BINDER commands");
        $("scriptBox").value=script; runScript();
      }else if(action==="script") throw new Error("model returned no BINDER commands");
    }else $("aiAnswer").textContent=txt||"(empty response)";
    aiProgress(100);
  }catch(e){ $("aiAnswer").textContent=e.name==="AbortError"?"STOPPED":"ERROR · "+e.message; }
  finally{ AI_ABORT=null; setTimeout(()=>aiSetBusy(false),150); }
}
function b64ToBlob(b64,type="image/png"){
  const bin=atob(b64), a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new Blob([a],{type});
}
async function blobToSource(blob,label){
  const f=new File([blob],(label||"generated")+".png",{type:blob.type||"image/png"});
  const hadCache=!!CACHE, oldN=SRC.length;
  const ok=await addSource(f);
  if(!ok) throw new Error("could not load returned image");
  revealWork(); $("rest").style.display="none"; out.style.display="block"; $("play").hidden=!anyVideo();
  $("where").textContent=SRC.length+" sources · latest from OpenAI";
  /* Adding a generated source must not recut the current mosaic. It is paint,
     not a new ground. Sample it into the existing field and leave CUT/FILL,
     patch identities, overrides and selection untouched. */
  if(hadCache&&CACHE&&SRC.length===oldN+1){
    const src=SRC[SRC.length-1], d=sampleInto(src,CACHE.W,CACHE.H,null);
    const pl=byTone(medianCut(d,CACHE.K));
    while(pl.length<CACHE.K) pl.push(pl[pl.length-1]||[0,0,0]);
    CACHE.DATA.push(d); CACHE.PALS.push(pl.slice(0,CACHE.K));
    refreshPanel();
  }else{
    recut(); refreshPanel();
  }
  commitVersion("new source");
}
async function generatedImageBlob(prompt){
  const quality=$("aiImageQuality")?.value||"medium";
  const body={model:"gpt-image-2",prompt,size:"1024x1024",quality,output_format:"png"};
  let r=await fetch(OPENAI_BASE+"/images/generations",{method:"POST",headers:aiHeaders(true),body:JSON.stringify(body),signal:AI_ABORT?.signal});
  let j=await r.json().catch(()=>({}));
  if(!r.ok){
    r=await fetch(OPENAI_BASE+"/images/generations",{method:"POST",headers:aiHeaders(true),body:JSON.stringify({model:"gpt-image-2",prompt}),signal:AI_ABORT?.signal});
    j=await r.json().catch(()=>({}));
  }
  if(!r.ok) throw new Error(j.error?.message||("image generation "+r.status));
  const d=j.data?.[0];
  if(d?.b64_json) return b64ToBlob(d.b64_json,"image/png");
  if(d?.url){ const q=await fetch(d.url); return await q.blob(); }
  throw new Error("image API returned no image");
}
async function editImageBlob(prompt){
  if(!CACHE||!out.width) throw new Error("load and render a picture first");
  const blob=await new Promise(res=>out.toBlob(res,"image/png"));
  if(!blob) throw new Error("could not capture frame");
  const fd=new FormData();
  fd.append("model","gpt-image-2");
  fd.append("prompt",prompt);
  fd.append("image",blob,"binder-current.png");
  const r=await fetch(OPENAI_BASE+"/images/edits",{method:"POST",headers:aiHeaders(false),body:fd,signal:AI_ABORT?.signal});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error?.message||("image edit "+r.status));
  const d=j.data?.[0];
  if(d?.b64_json) return b64ToBlob(d.b64_json,"image/png");
  if(d?.url){ const q=await fetch(d.url); return await q.blob(); }
  throw new Error("image edit API returned no image");
}

  AI_ABORT=new AbortController();

}

/* ---- sources: pictures or clips ---- */
function addSource(f){
  return new Promise(res=>{
    const url=URL.createObjectURL(f);
    if(/^video\//.test(f.type)){
      const v=document.createElement("video");
      v.src=url; v.loop=true; v.muted=true; v.playsInline=true; v.preload="auto";
      v.addEventListener("loadeddata",()=>{
        SRC.push({kind:"video",el:v,w:v.videoWidth,h:v.videoHeight});
        v.currentTime=0.05; res(true);
      },{once:true});
      v.addEventListener("error",()=>{ URL.revokeObjectURL(url); res(false); },{once:true});
      return;
    }
    if(!/^image\//.test(f.type)){ URL.revokeObjectURL(url); return res(false); }
    const im=new Image();
    im.onload=()=>{ const c=cnv(im.naturalWidth,im.naturalHeight);
      c.getContext("2d").drawImage(im,0,0);
      SRC.push({kind:"img",el:c,w:c.width,h:c.height});
      URL.revokeObjectURL(url); res(true); };
    im.onerror=()=>{ URL.revokeObjectURL(url); res(false); };
    im.src=url;
  });
}
async function take(files){
  if(!files||!files.length) return;
  surfaceWork(true,"LOADING",8,false);
  await nextPaint();
  let any=false;
  try{
    for(let i=0;i<files.length;i++){
      surfaceWork(true,"IMAGE "+(i+1)+" / "+files.length,Math.round(12+48*((i+1)/files.length)),false);
      if(await addSource(files[i])) any=true;
    }
    if(!any) return;
    $("rest").style.display="none"; out.style.display="block";
    $("play").hidden=!anyVideo();
    $("where").textContent = SRC.length<2 ? "ADD 2ND IMAGE" : "picture + picture";
    FILL=null; CUT=null;
    surfaceWork(true,"BUILDING MOSAIC",72,false);
    await nextPaint();
    recut();
    revealWork();
    commitVersion("open");
    if(anyVideo()) setPlaying(true);
    surfaceWork(true,"READY",100,false);
    await new Promise(r=>setTimeout(r,110));
  } finally {
    surfaceWork(false,"",0,false);
  }
}
$("cam").addEventListener("click",async()=>{
  const b=$("cam");
  if(b.getAttribute("aria-pressed")==="true"){          // stop the camera
    SRC.forEach(s2=>{ if(s2.live&&s2.el.srcObject)
      s2.el.srcObject.getTracks().forEach(t=>t.stop()); });
    for(let i=SRC.length-1;i>=0;i--) if(SRC[i].live) SRC.splice(i,1);
    b.setAttribute("aria-pressed","false"); b.textContent="CAM";
    if(SRC.length){ FILL=null;CUT=null; recut(); } else location.reload();
    return;
  }
  try{
    const st=await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:{ideal:"environment"},width:{ideal:1280}},audio:false});
    const v=document.createElement("video");
    v.srcObject=st; v.muted=true; v.playsInline=true;
    await v.play();
    SRC.push({kind:"video",live:true,el:v,w:v.videoWidth,h:v.videoHeight}); revealWork();
    b.setAttribute("aria-pressed","true"); b.textContent="CAM ON";
    $("rest").style.display="none"; out.style.display="block";
    $("play").hidden=false;
    $("where").textContent=SRC.length<2?"camera \u00b7 drop a picture to bind it against"
      :SRC.map(x=>x.live?"camera":x.kind==="video"?"clip":"picture").slice(0,2).join(" + ");
    FILL=null;CUT=null;
    recut(); setPlaying(true);
  }catch(err){
    $("where").textContent="the camera is not available";
  }
});
