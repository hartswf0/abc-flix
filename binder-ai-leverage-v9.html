<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BINDER</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='white'/%3E%3Ccircle cx='24' cy='32' r='16' fill='none' stroke='%23111' stroke-width='4'/%3E%3Ccircle cx='40' cy='32' r='16' fill='none' stroke='%23111' stroke-width='4'/%3E%3C/svg%3E">
<style>
:root{--paper:#fff;--ink:#111;--soft:#8b8b8b;--faint:#e6e6e6}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;background:var(--paper);color:var(--ink);overscroll-behavior:none;overflow:hidden}
body{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;line-height:1;
  display:flex;flex-direction:column;height:100dvh}
button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--ink);cursor:pointer}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button:focus-visible{outline:2px solid #2b6cd4;outline-offset:-3px}

.bar{flex:0 0 auto;display:flex;align-items:stretch;height:28px;border-bottom:2px solid var(--ink)}
.bar button,.bar span{display:flex;align-items:center;padding:0 9px;font-size:10px;
  border:none;border-right:1px solid var(--ink);background:var(--paper);letter-spacing:.04em;white-space:nowrap}
.bar .sp{margin-left:auto;border:none;border-left:1px solid var(--ink)}
.ico{display:inline-flex;align-items:center;justify-content:center;line-height:0}
.ico svg{width:16px;height:16px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.fill svg{fill:currentColor;stroke:none}
.restRow{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0 2px}
.restStep{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);padding:5px 8px;background:#fff;color:var(--ink);font-size:10px;letter-spacing:.05em}

.stage{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:6px}
.stage canvas{max-width:100%;max-height:100%;display:none;touch-action:none;cursor:crosshair}
.rest{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  font-size:11px;color:var(--soft);padding:0 20px;line-height:1.6}
.rest b{display:block;color:var(--ink);font-size:12px;margin-bottom:6px}
.rest button{margin-top:10px;padding:8px 14px;font-size:11px}
.stage.over{outline:2px dashed var(--ink);outline-offset:-8px}

#scriptPane{flex:0 0 auto;display:flex;flex-direction:column;border-top:2px solid var(--ink)}
#scriptBox{height:132px;width:100%;resize:none;border:0;border-bottom:1px solid var(--ink);
  padding:6px 8px;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
  background:#fbfbfb;color:var(--ink);outline:0;white-space:pre}
#scriptBox:focus-visible{outline:2px solid #2b6cd4;outline-offset:-2px}
.scriptbar{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--ink)}
.scriptbar button{border:0;border-right:1px solid var(--ink);height:30px;padding:0 11px;font-size:10px;
  letter-spacing:.06em;background:var(--paper)}
.scriptbar span{font-size:10px;color:var(--soft);padding:0 9px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}

.tabs{flex:0 0 auto;display:flex;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink)}
.tabs button{border:0;border-right:1px solid var(--ink);padding:0 11px;height:32px;
  font-size:10px;letter-spacing:.07em;background:var(--paper);
  display:flex;align-items:center;gap:5px}
.tabs button span{font-weight:600;letter-spacing:0;opacity:.6}
.tabs button[aria-pressed="true"] span{opacity:1}
.tabs button:disabled{opacity:.35}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs .sp{margin-left:auto;border-right:0;border-left:1px solid var(--ink)}

.tryhead{font-size:10px;color:var(--soft);padding:4px 8px;border-bottom:1px solid var(--faint);
  display:flex;align-items:center;gap:6px;line-height:1.35}
.tryhead .sw{width:11px;height:11px;border:1px solid var(--ink);display:inline-block;flex:0 0 auto}
.tryhead b{color:var(--ink);font-weight:600;letter-spacing:.05em}
.chips{display:flex;gap:4px;padding:4px 6px;overflow-x:auto;border-bottom:1px solid var(--faint)}
.chips button{flex:0 0 auto;padding:0;height:30px;width:44px;border:1px solid var(--ink);
  background:var(--paper);position:relative;overflow:hidden}
.chips canvas{display:block;width:100%;height:100%;object-fit:cover}
.chips button[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px}
.chips button .n{position:absolute;left:0;bottom:0;background:var(--ink);color:var(--paper);
  font-size:8px;padding:0 3px}
.chips .add{display:flex;align-items:center;justify-content:center;font-size:15px}
.strip{display:flex;gap:4px;overflow-x:auto;padding:5px 6px;touch-action:pan-x;
  scroll-snap-type:x proximity}
.alt{flex:0 0 auto;border:1px solid var(--ink);background:var(--paper);padding:0;cursor:pointer;
  display:flex;flex-direction:column;width:92px;scroll-snap-align:start}
.alt canvas{display:block;width:100%;height:auto}
.alt span{font-size:9px;padding:3px 4px;border-top:1px solid var(--ink);text-align:center;
  letter-spacing:.03em}
.alt[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:-2px}
.alt[aria-pressed="true"] span{background:var(--ink);color:var(--paper)}

.decks{flex:0 0 auto;border-top:0;display:flex}
.deck{flex:1 1 0;display:flex;flex-direction:column;border-right:1px solid var(--ink);min-width:0}
.deck:last-child{border-right:0}
.dl{font-size:9px;letter-spacing:.09em;padding:4px 6px;border-bottom:1px solid var(--ink);
  color:var(--soft);display:flex;justify-content:space-between;gap:6px}
.dl .rd{letter-spacing:0;color:var(--ink);font-weight:600}
.ball{position:relative;touch-action:none;display:flex;justify-content:center;padding:1px 0}
.ball canvas{display:block;max-width:100%;height:auto}
.dr{font-size:9.5px;padding:4px 6px;border-top:1px solid var(--ink);color:var(--ink);
  min-height:26px;display:flex;align-items:center;line-height:1.3;overflow:hidden}
.dr .sw{display:inline-block;width:9px;height:9px;border:1px solid var(--ink);margin-right:5px;flex:0 0 auto}

.fader{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:5px 8px;
  border-top:1px solid var(--ink);touch-action:none}
.fader .fl{font-size:9px;color:var(--soft);letter-spacing:.06em;flex:0 0 auto}
.track{flex:1 1 auto;height:22px;border:1px solid var(--ink);position:relative;background:var(--paper)}
.track::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--faint)}
.knob{position:absolute;top:-1px;bottom:-1px;width:16px;background:var(--ink);left:0}

.steps{flex:0 0 auto;display:flex;border-top:1px solid var(--ink)}
.step{flex:1 1 0;display:flex;align-items:center;justify-content:space-between;gap:4px;
  padding:0 5px;height:30px;border-right:1px solid var(--ink);min-width:0}
.step:last-child{border-right:0}
.step .lab{font-size:9px;color:var(--soft);letter-spacing:.03em;overflow:hidden;text-overflow:ellipsis}
.step .grp{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.step button{padding:0 6px;height:22px;font-size:12px;line-height:1}
.step .v{font-size:11px;font-weight:600;min-width:30px;text-align:center}

.foot{flex:0 0 auto;display:flex;height:24px;border-top:1px solid var(--ink);font-size:10px}
.foot span{display:flex;align-items:center;padding:0 8px;border-right:1px solid var(--ink);color:var(--soft);white-space:nowrap}
.foot span:last-child{border-right:0}
input[type=file]{display:none}

/* ---- OPENAI / MODEL DRIVER ---- */
.aiPane{flex:0 0 auto;border-top:2px solid var(--ink);background:#fff}
.aiTop{display:grid;grid-template-columns:minmax(150px,1.2fr) 130px 100px 92px;border-bottom:1px solid var(--ink)}
.aiTop input,.aiTop select{min-width:0;height:30px;border:0;border-right:1px solid var(--ink);padding:0 7px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff;color:#111;outline:0}
.aiTop button{height:30px;border:0;padding:0 8px;font-size:9px;letter-spacing:.06em}
.aiMini{display:grid;grid-template-columns:1fr auto auto auto;border-bottom:1px solid var(--ink)}
.aiMini button{height:29px;border:0;border-right:1px solid var(--ink);font-size:9px;letter-spacing:.05em;padding:0 8px;background:var(--paper)}
.aiMini button:last-child{border-right:0}
.aiRefZone{border-bottom:1px solid var(--ink);padding:6px;background:#fcfcfc}
.aiRefDrop{border:1px dashed var(--ink);padding:8px 9px;font-size:10px;line-height:1.45;color:var(--soft);background:#fff}
.aiRefDrop.over{background:#f3f3f3}
.aiRefStrip{display:flex;gap:6px;overflow-x:auto;padding-top:6px}
.aiRefCard{flex:0 0 auto;width:84px;border:1px solid var(--ink);background:#fff}
.aiRefCard canvas{display:block;width:100%;height:auto}
.aiRefCard .cap{display:flex;align-items:center;justify-content:space-between;gap:4px;border-top:1px solid var(--ink);padding:3px 4px;font-size:8px;letter-spacing:.04em}
.aiRefCard .cap button{border:0;background:none;padding:0;font:inherit;color:#111;cursor:pointer}
.aiPrompt{width:100%;height:82px;resize:vertical;border:0;border-bottom:1px solid var(--ink);padding:7px 8px;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;outline:0;background:#fbfbfb;color:#111}
.aiActions{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-bottom:1px solid var(--ink)}
.aiActions button{height:31px;border:0;border-right:1px solid var(--ink);font-size:9px;letter-spacing:.05em}
.aiActions button:last-child{border-right:0}
.aiExport{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--ink)}
.aiExport button{height:28px;border:0;border-right:1px solid var(--ink);font-size:9px;letter-spacing:.05em;background:#fff}
.aiExport button:last-child{border-right:0}
.aiAnswer{max-height:104px;overflow:auto;padding:6px 8px;font:10px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;color:#333}
.aiMeta{display:grid;grid-template-columns:auto 1fr auto;border-top:1px solid var(--faint);font-size:9px;color:var(--soft)}
.aiMeta span{padding:4px 7px;border-right:1px solid var(--faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aiMeta span:last-child{border-right:0}
.aiBusy{background:var(--ink)!important;color:var(--paper)!important}
.aiSpin{display:inline-block;width:8px;height:8px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-1px;margin-right:6px;opacity:0;animation:aiSpin .75s linear infinite}
.aiMeta.busy .aiSpin{opacity:1}
.aiProg{height:4px;background:#f0f0f0;border-top:1px solid var(--faint);position:relative;overflow:hidden}
.aiProgBar{position:absolute;left:0;top:0;bottom:0;width:0%;background:#111;transition:width .18s ease}
@keyframes aiSpin{to{transform:rotate(360deg)}}


/* ---- OPERATIONAL MOBILE SURFACE ---- */
.bar{height:auto;display:block;position:sticky;top:0;z-index:80;background:var(--paper);border-bottom:2px solid var(--ink)}
.primaryBar{display:grid;grid-template-columns:repeat(5,1fr);height:46px}
.primaryBar button{min-width:0;border:0;border-right:1px solid var(--ink);font-size:11px;letter-spacing:.045em;font-weight:600;background:var(--paper);justify-content:center}
.primaryBar button:last-child{border-right:0}
.statusBar{height:28px;display:flex;align-items:center;border-top:1px solid var(--ink)}
.statusBar span{display:block;width:100%;padding:0 10px;border:0!important;font-size:10px;line-height:28px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff!important}
.toolTray{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink)}
.toolTray button{height:44px;border:0;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);font-size:10.5px;letter-spacing:.035em;background:#fff;justify-content:center}
.toolTray button:nth-child(3n){border-right:0}
.sheetHead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;min-height:42px;border-bottom:1px solid var(--ink);background:#fff}
.sheetHead b{padding:0 10px;font-size:11px;letter-spacing:.07em}
.sheetHead span{font-size:9.5px;color:var(--soft);padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetHead button{height:42px;border:0;border-left:1px solid var(--ink);padding:0 12px;font-size:10px}
.deckHelp{padding:7px 9px;border-bottom:1px solid var(--faint);font-size:10px;line-height:1.45;color:var(--soft)}
.deckHelp b{color:var(--ink);font-weight:600}

@media(max-width:899px){
  html,body{height:100dvh;overflow:hidden;overscroll-behavior:none}
  body{display:grid;grid-template-rows:auto 34dvh minmax(0,1fr);height:100dvh;font-size:12px;line-height:1.2;padding-bottom:0}
  .bar{grid-row:1;position:relative;z-index:80;background:#fff}
  .primaryBar{display:grid;grid-template-columns:repeat(5,1fr);height:54px}
  .primaryBar button{min-width:0;border:0;border-right:1px solid var(--ink);font-size:9px;letter-spacing:.05em;font-weight:700;background:var(--paper);justify-content:center;display:flex;flex-direction:column;gap:4px;line-height:1}
  .primaryBar button:last-child{border-right:0}
  .primaryBar button .ico svg{width:18px;height:18px}
  .primaryBar button span:last-child{display:block}
  .statusBar{height:22px;display:flex;align-items:center;border-top:1px solid var(--ink)}
  .statusBar span{padding:0 8px;font-size:9px;line-height:22px;color:var(--soft)}
  .toolTray{position:absolute;left:0;right:0;top:100%;background:#fff;grid-template-columns:repeat(3,1fr);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:90}
  .toolTray button{height:46px;border:0;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);font-size:9px;letter-spacing:.04em;background:#fff;justify-content:center;display:flex;flex-direction:column;gap:4px;line-height:1}
  .toolTray button:nth-child(3n){border-right:0}
  .toolTray button .ico svg{width:17px;height:17px}

  .stage{grid-row:2;min-height:0;height:auto;padding:4px 6px 0;flex:none}
  .stage canvas{max-height:100%}
  .rest{font-size:11px;line-height:1.45;padding:0 16px}
  .rest b{font-size:18px;margin-bottom:8px;letter-spacing:.06em}
  .rest span{display:none}
  .rest button{min-height:52px;padding:0 20px;font-size:14px;font-weight:700}

  .side{grid-row:3;display:grid;grid-template-rows:40px 26px auto minmax(0,1fr) 40px;min-height:0;border-top:2px solid var(--ink);background:#fff}
  #scriptPane,.aiPane{position:fixed;left:0;right:0;bottom:0;z-index:120;max-height:84dvh;overflow-y:auto;background:#fff;border-top:2px solid var(--ink);box-shadow:0 -10px 32px rgba(0,0,0,.16);padding-bottom:env(safe-area-inset-bottom)}
  #scriptBox{height:42dvh;min-height:220px;padding:11px 12px;font-size:12px;line-height:1.55}
  .scriptbar{display:grid;grid-template-columns:1fr 1fr 1fr;position:sticky;bottom:0;background:#fff}
  .scriptbar button{height:48px;padding:0 7px;font-size:10px;font-weight:600}
  .scriptbar span{grid-column:1/-1;min-height:26px;display:flex;align-items:center}

  .aiTop{grid-template-columns:1fr 1fr;position:relative}
  .aiTop input{grid-column:1/-1;height:46px!important;font-size:12px!important;border-bottom:1px solid var(--ink)!important}
  .aiTop select,.aiTop button{height:44px!important;font-size:10px!important}
  .aiMini{grid-template-columns:repeat(4,1fr)}
  .aiMini button{height:44px;font-size:9.5px;padding:0 5px}
  .aiRefZone{padding:8px}
  .aiRefDrop{padding:11px;font-size:11px;line-height:1.5}
  .aiRefCard{width:104px}
  .aiPrompt{height:118px;min-height:96px;padding:11px 12px;font-size:12px;line-height:1.5}
  .aiActions{grid-template-columns:1fr 1fr}
  .aiActions button{height:48px;font-size:10.5px;font-weight:600}
  .aiExport button{height:42px;font-size:9.5px}
  .aiAnswer{max-height:126px;padding:10px 12px;font-size:11px;line-height:1.45}

  .tabs{border-top:0;border-bottom:1px solid var(--ink)}
  .tabs button{height:40px;font-size:10px;font-weight:700;padding:0 10px}
  .tryhead{min-height:26px;padding:4px 8px;font-size:9px;border-bottom:1px solid var(--faint);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .tryhead .sw{width:9px;height:9px}
  .tryhead b{font-size:9px}

  .chips{padding:4px 6px;gap:4px;overflow-x:auto;border-bottom:1px solid var(--faint);align-items:center;min-height:34px}
  .chips button{width:30px;height:24px;display:flex;align-items:center;justify-content:center}
  .chips canvas{display:none}
  .chips button .n{position:static;background:none;color:var(--ink);font-size:10px;padding:0}
  .chips .add{font-size:16px}

  .strip{padding:4px 6px;gap:4px;overflow-x:auto;border-bottom:1px solid var(--ink);height:34px;min-height:34px}
  .alt{width:auto;min-width:58px;display:flex;align-items:center;justify-content:center}
  .alt canvas{display:none}
  .alt span{border-top:0;font-size:9px;padding:0 6px;height:28px;display:flex;align-items:center;justify-content:center;white-space:nowrap}

  .decks{display:grid;grid-template-columns:1fr 1fr;min-height:0}
  .deck{border-right:1px solid var(--ink);border-bottom:0;min-height:0}
  .deck:last-child{border-right:0}
  .dl{font-size:10px;padding:4px 6px;color:var(--ink);font-weight:700;letter-spacing:.06em}
  .deckHelp{padding:3px 6px;font-size:8px;line-height:1.25}
  .ball{padding:0;min-height:0;flex:1 1 auto}
  .ball canvas{width:min(42vw,180px);max-width:none;height:auto}
  .dr{font-size:8.5px;min-height:20px;padding:3px 6px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .fader{min-height:40px;padding:4px 6px;gap:6px;border-top:1px solid var(--ink)}
  .fader .fl{font-size:9px;color:var(--ink);font-weight:700}
  .track{height:24px}
  .knob{width:18px}
  .foot{display:none}
}

@media(min-width:900px){
  html,body{height:100%;overflow:hidden}
  body{display:grid;grid-template-columns:minmax(0,60%) minmax(380px,40%);grid-template-rows:auto 1fr}
  .bar{grid-column:1/-1;grid-row:1;position:relative}
  .primaryBar{grid-template-columns:92px 92px 92px 92px 92px;justify-content:start}
  .statusBar{position:absolute;left:460px;right:0;top:0;height:46px;border-top:0;border-left:1px solid var(--ink)}
  .statusBar span{line-height:46px}
  .toolTray{grid-template-columns:repeat(6,1fr)}
  .toolTray button{border-bottom:0}
  .stage{grid-column:1;grid-row:2;min-height:0;height:auto}
  .side{grid-column:2;grid-row:2;display:flex;flex-direction:column;border-left:2px solid var(--ink);min-height:0;overflow-y:auto}
  #scriptPane,.aiPane{flex:0 0 auto}
  .decks{display:flex}
  .deck{border-top:0;flex-direction:column}
  .ball{border-right:0;border-bottom:1px solid var(--ink);align-self:center}
  .ball canvas{max-width:240px}
}

/* ---- V5 REGULARIZED SURFACE ---- */

/* ---- V6: TARGET, NEVER MODE ---- */
.targetExit{font-weight:800!important;letter-spacing:.06em}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr!important;min-height:40px}
.tabs[hidden]{display:grid!important;visibility:visible;pointer-events:none}
.tabs[hidden] button{visibility:hidden}
.tabs button{justify-content:center!important}
.tabs .targetExit{visibility:visible!important;opacity:.28}
.tabs:not([hidden]) .targetExit{opacity:1}
.strip.inactive{visibility:hidden;pointer-events:none}
.stage.targeting::after{content:"";position:absolute;inset:5px;pointer-events:none;border:1px solid rgba(17,17,17,.12);z-index:8}
.viewAll{display:none!important}
.workOverlay.surfaceLoad .workPanel{width:min(300px,78%)}
.workOverlay.surfaceLoad .workLine{grid-template-columns:1fr}
.workOverlay.surfaceLoad .workLine button{display:none}

.stage{overflow:hidden}
.viewAll{position:absolute;right:10px;top:10px;z-index:16;height:36px;padding:0 12px;background:#fff;border:1px solid #111;font-size:10px;font-weight:700;letter-spacing:.06em;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.workOverlay{position:absolute;inset:0;z-index:30;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;background:rgba(255,255,255,.28);overflow:hidden}
.workOverlay[hidden]{display:none!important}
.workSweep{position:absolute;top:0;bottom:0;width:1px;background:#111;opacity:.55;animation:workSweep 1.2s ease-in-out infinite alternate}
.workPanel{pointer-events:auto;width:min(420px,88%);margin-bottom:12px;background:#fff;border:1px solid #111;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.workLine{display:grid;grid-template-columns:1fr auto;align-items:center;min-height:34px;font-size:10px;letter-spacing:.04em}

<script>
"use strict";
/*===CORE_START===*/

/* ---- sphere math, in the ORB idiom ---- */
const TAU=Math.PI*2, PI=Math.PI, D2R=PI/180, R2D=180/PI;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm3=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];};
const dirLL=(lam,phi)=>{const c=Math.cos(phi);return [c*Math.sin(lam),Math.sin(phi),c*Math.cos(lam)];};
const llDir=d=>[Math.atan2(d[0],d[2]),Math.asin(clamp(d[1],-1,1))];
function rotOf(yaw,pitch){
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  return [[cy,0,-sy],[sy*sp,cp,cy*sp],[sy*cp,-sp,cy*cp]];
}
const toScreen=(d,R)=>[dot3(d,R[0]),dot3(d,R[1]),dot3(d,R[2])];
function fromScreen(x,y,R){
  const r2=x*x+y*y; if(r2>1) return null;
  const z=Math.sqrt(1-r2);
  return norm3([R[0][0]*x+R[1][0]*y+R[2][0]*z,
                R[0][1]*x+R[1][1]*y+R[2][1]*z,
                R[0][2]*x+R[1][2]*y+R[2][2]*z]);
}

/* ============================================================
   THE BALL IS THE ROUTING TABLE

   Every tone sits somewhere on it, and its position says everything:

     longitude   which picture it reads.   0 = the first, 180 = the second,
                 anywhere between = a mix of the two.
     latitude    how it reads it.  north pole = flat tone, equator = the
                 photograph itself, south pole = the cell's average.

   Nowhere on the ball is undefined, so there is no bad place to drag to.
   ============================================================ */
function routeOf(d){
  const [lam,phi]=llDir(d);
  const mix=Math.abs(lam)/PI;                 // 0 at the A meridian, 1 at B
  const t=phi/(PI/2);                         // +1 north, -1 south
  let flat=0,photo=0,mean=0;
  if(t>=0){ flat=t; photo=1-t; } else { mean=-t; photo=1+t; }
  return {mix,flat,photo,mean,lam,phi};
}
function routeLabel(r){
  const b=Math.round(r.mix*100);
  const parts=[];
  if(r.flat>0.5) parts.push("flat tone"); else if(r.mean>0.5) parts.push("cell average");
  else parts.push("photograph");
  if(r.flat>0.02&&r.flat<=0.5) parts.push("flattened "+Math.round(r.flat*100)+"%");
  if(r.mean>0.02&&r.mean<=0.5) parts.push("averaged "+Math.round(r.mean*100)+"%");
  const src = b<3 ? "first picture" : b>97 ? "second picture" : b+"% second";
  return src+" \u00b7 "+parts.join(", ");
}
/* ---- deck A: the same two gestures, aimed at the cut instead of the fill.
   longitude  how tightly this tone's cells pool into patches
   latitude   how finely its region is cut.  north = few big cells,
              equator = as cut, south = many small ones.
   ---- */
function cutOf(d){
  const [lam,phi]=llDir(d);
  const tight=Math.abs(lam)/PI;              // 0 loose, 1 tight
  const t=phi/(PI/2);                        // +1 north, -1 south
  const dens=Math.pow(4, -t);                // a quarter at the north pole, four at the south
  return {tight,dens,lam,phi};
}
function cutLabel(c){
  const d = c.dens<0.75 ? "few big cells" : c.dens>1.35 ? "many small cells" : "cells as cut";
  return d+" \u00b7 patches "+Math.round(c.tight*100)+"%";
}
function defaultCuts(K){
  const p=[];
  for(let i=0;i<K;i++) p.push(dirLL(PI*0.35,0));   // everything at the same middling grip, front face
  return p;
}

/* There is no cell-count control and no grip control. Both are readings of
   deck A: latitude is how fine a tone wants its ground, so the mean of those
   wishes IS the cell count; longitude is how hard a tone grips, so the grip
   dial was only ever a scale factor and is now a constant. */
const CELL_BASE=700, CELL_MIN=110, CELL_MAX=3000, GRIP_FULL=30;
function cellsFrom(cuts){
  if(!cuts||!cuts.length) return CELL_BASE;
  /* density is a ratio, so the mean has to be geometric. Averaged the plain
     way, a ball with half its tones north and half south came out at 2.1x the
     base instead of 1x — mixed wishes drifted toward more cells for no reason. */
  let ln=0; for(const d of cuts) ln+=Math.log(cutOf(d).dens);
  return Math.round(clamp(CELL_BASE*Math.exp(ln/cuts.length),CELL_MIN,CELL_MAX));
}
function gripFrom(cuts){ return cuts.map(d=>cutOf(d).tight*2); }

/* ============================================================
   WHY THE BALLS WERE UNUSABLE, AND WHAT REPLACED IT

   Half of every ball was a mirror of the other half. mix reads |longitude|,
   so -140 and +140 are the same setting; the far hemisphere held nothing new
   and hid every puck that drifted onto it. Free rotation made that worse: it
   moved pucks across the screen without changing a single value, so the ball
   appeared to respond while nothing happened.

   The fix is to stop pretending the space is a sphere. It is two bounded
   numbers. Longitude is clamped to 0..180 and the view is nailed to one
   orientation, which puts the ENTIRE reachable set on the front face at all
   times. Nothing is ever behind. Rotation is gone, and the gesture it wasted
   now moves every tone together.
   ============================================================ */
const FACE_YAW=PI/2, FACE_PITCH=0;
const faceRot=()=>rotOf(FACE_YAW,FACE_PITCH);
function clampFace(d){
  let [lam,phi]=llDir(d);
  lam=clamp(lam,0.0001,PI-0.0001);
  phi=clamp(phi,-PI/2+0.0001,PI/2-0.0001);
  return dirLL(lam,phi);
}

/* ============================================================
   WHY THE FACE WAS STILL HARD, AFTER THE HEMISPHERE FIX

   Orthographic projection squeezes the rim to nothing. Measured on a 63px
   disc: 1.10 px per degree at the centre, 0.10 at 85 degrees out, 0.02 at 89.
   And the four settings you reach for most — the first picture, the second,
   flat, average — ALL sit at 90 degrees out. They had essentially zero screen
   width. The ball was not hard to read; it was hard to hit.

   Equidistant projection maps angular distance linearly to radius: a constant
   0.70 px per degree everywhere, rim included. The four anchors land on the
   rim at left, right, top and bottom, evenly spaced, with room around them.

   This is also why rotation is not coming back. Spinning a face that already
   shows every reachable setting moves pixels without changing a value — that
   was the original complaint. What rotation was wanted FOR is reach, and reach
   is what the projection and the zoom below actually fix.
   ============================================================ */
function faceProject(d,R,zoom,px,py){
  const a=dot3(d,R[0]), b=dot3(d,R[1]), z=dot3(d,R[2]);
  const th=Math.acos(clamp(z,-1,1));
  const r=th/(PI/2);
  const m=Math.hypot(a,b);
  const ux = m>1e-9 ? a/m : 0, uy = m>1e-9 ? b/m : 0;
  return [(r*ux-px)*zoom, (r*uy-py)*zoom, r];
}
function faceUnproject(X,Y,R,zoom,px,py){
  const x=X/zoom+px, y=Y/zoom+py;
  const r=Math.hypot(x,y);
  if(r>1.0001) return null;
  const th=Math.min(r,1)*(PI/2), sn=Math.sin(th), cs=Math.cos(th);
  const ux = r>1e-9 ? x/r : 0, uy = r>1e-9 ? y/r : 0;
  return norm3([R[0][0]*ux*sn+R[1][0]*uy*sn+R[2][0]*cs,
                R[0][1]*ux*sn+R[1][1]*uy*sn+R[2][1]*cs,
                R[0][2]*ux*sn+R[1][2]*uy*sn+R[2][2]*cs]);
}
/* px per degree, so the claim above stays checkable */
function faceScale(Rr,zoom){ return Rr*zoom/90; }

/* ---- detents: the named settings you can actually land on ----
   Continuous everywhere, but the six places worth naming pull you in and
   tick. Without them nothing could be set exactly and every value was a
   near-miss you could not read back. ---- */
const DET_LON=[0,90,180], DET_LAT=[-90,0,90], DET_DEG=7;
function snapFace(d){
  let [lam,phi]=llDir(clampFace(d));
  let la=lam*R2D, ph=phi*R2D, hitLon=null, hitLat=null;
  for(const t of DET_LON) if(Math.abs(la-t)<DET_DEG){ la=t; hitLon=t; break; }
  for(const t of DET_LAT) if(Math.abs(ph-t)<DET_DEG){ ph=t; hitLat=t; break; }
  return {dir:dirLL(la*D2R,ph*D2R),hitLon,hitLat,
          key:(hitLon===null?"-":hitLon)+"/"+(hitLat===null?"-":hitLat)};
}
/* move every tone by the same amount, the gesture rotation used to waste */
function shiftAll(places,dLonDeg,dLatDeg){
  return places.map(d=>{
    const [lam,phi]=llDir(d);
    /* clamp the NUMBERS, not the direction. Building the direction first and
       clamping after let a tone shifted past 180 wrap to -140 and reappear on
       the opposite rim — dragging right teleported tones to the left. */
    const la=clamp(lam*R2D+dLonDeg,0,180);
    const ph=clamp(phi*R2D+dLatDeg,-90,90);
    return dirLL(la*D2R,ph*D2R);
  });
}

/* ============================================================
   THE INDIRECTION THAT WAS LEFT

   Even with the balls fixed, the control surface still sat beside the
   picture: you dragged an abstract puck, then looked at the image to find
   out what you had done. Selecting a tone meant hunting for the right puck
   among sixteen, none of which said where they lived.

   The picture is the control surface. Touch a region, and the tone that owns
   it is selected. Its alternatives are then shown as whole rendered frames,
   so the choice is made by comparing outcomes rather than by guessing at
   coordinates. The ball keeps its job — continuous adjustment after the
   coarse choice is made.
   ============================================================ */
const ALTS=[
  {t:"1st",        la:0,   ph:0},
  {t:"half",       la:90,  ph:0},
  {t:"2nd",        la:180, ph:0},
  {t:"flat 1st",   la:0,   ph:90},
  {t:"flat 2nd",   la:180, ph:90},
  {t:"avg 1st",    la:0,   ph:-90},
  {t:"avg 2nd",    la:180, ph:-90},
  {t:"soft half",  la:90,  ph:52}
];
const altDir=a=>dirLL(a.la*D2R,a.ph*D2R);

/* ============================================================
   PATCHES

   A tone is scattered: it owns cells all over the frame. A patch is one
   connected run of them — the thing you actually point at. Everything the
   balls do can be aimed at either, and a patch may also name a different
   second picture from the rest of its tone.

   Patches are keyed by their lowest cell index, which is stable for as long
   as the cut is frozen. A recut drops the overrides, because after a recut
   they would be pointing at cells that no longer exist.
   ============================================================ */
function findPatches(count,labels,adj,area){
  const patchOf=new Int32Array(count).fill(-1);
  const tone=[],seed=[],size=[];
  const stack=new Int32Array(count);
  for(let c0=0;c0<count;c0++){
    if(patchOf[c0]>=0) continue;
    const id=tone.length, l=labels[c0];
    let sp=0,n=0,px=0;
    stack[sp++]=c0; patchOf[c0]=id;
    while(sp){
      const c=stack[--sp]; n++; px+=area?area[c]:1;
      for(let e=adj.start[c];e<adj.start[c+1];e++){
        const q=adj.nb[e];
        if(patchOf[q]<0 && labels[q]===l){ patchOf[q]=id; stack[sp++]=q; }
      }
    }
    tone.push(l); seed.push(c0); size.push(px);
  }
  return {patchOf,count:tone.length,tone:Int32Array.from(tone),
          seed:Int32Array.from(seed),size:Int32Array.from(size)};
}

/* ============================================================
   KNOWING WHICH GRAIN YOU ARE ON

   A scope switch that only changes a button is a mode error waiting to
   happen: patch and tone look the same on screen, and if a tone happens to be
   one connected run they ARE the same. So the scope is drawn in the picture.

   Three tiers, always visible before you act:
     in scope     full colour, hard outline — this is what will move
     siblings     half sunk, thin outline — the rest of this tone, which
                  will NOT move while you are on a patch
     everything   sunk to grey
   ============================================================ */
function scopeSets(patches,scope,tone,patch){
  const inScope=new Uint8Array(patches.count);
  const sibling=new Uint8Array(patches.count);
  let nIn=0,nSib=0;
  if(tone<0) return {inScope,sibling,nIn:0,nSib:0,none:true};
  for(let i=0;i<patches.count;i++){
    if(patches.tone[i]!==tone) continue;
    if(scope==="tone"||i===patch){ inScope[i]=1; nIn++; }
    else { sibling[i]=1; nSib++; }
  }
  return {inScope,sibling,nIn,nSib,none:false};
}
function patchesPerTone(patches,K){
  const n=new Int32Array(K);
  for(let i=0;i<patches.count;i++) n[patches.tone[i]]++;
  return n;
}

/* patches ranked biggest first, so a written program can name them by a
   number that means the same thing every time the same cut is in place */
function patchOrder(patches){
  const idx=[];
  for(let i=0;i<patches.count;i++) idx.push(i);
  idx.sort((a,b)=> patches.size[b]-patches.size[a] || patches.seed[a]-patches.seed[b]);
  return idx;
}

/* what a patch is actually set to: its own override if it has one,
   otherwise whatever its tone says */
function settingFor(patches,pid,overrides,fills,toneSrc){
  const l=patches.tone[pid], key=patches.seed[pid];
  const o=overrides.get(key);
  return {dir:(o&&o.dir)?o.dir:fills[l],
          srcB:(o&&o.srcB!==undefined)?o.srcB:(toneSrc?toneSrc[l]:1),
          own:!!o};
}

/* ---- what a ball looks like before you touch it ----
   Both balls are drawn as a lat/lon dot lattice, and every dot is rendered by
   the same functions the picture uses. The surface is therefore a map of its
   own effect: you read the option off the ball instead of discovering it by
   dragging. ---- */
function fillDot(d,repA,repB){
  const r=routeOf(d);
  const col=[repA[0]+(repB[0]-repA[0])*r.mix,
             repA[1]+(repB[1]-repA[1])*r.mix,
             repA[2]+(repB[2]-repA[2])*r.mix];
  // a photographic reading keeps its grain; a flat or averaged one does not
  return {col,size:0.30+0.70*r.photo};
}
function cutDot(d){
  const c=cutOf(d);
  // dot size is the cell size that latitude asks for; grey is how hard it grips
  const g=Math.round(228-150*c.tight);
  return {col:[g,g,g],size:clamp(Math.pow(c.dens,-0.5),0.42,2.0)};
}
/* the bands worth naming, as latitude/longitude pairs with a word */
const BANDS={
  A:[{ph:78,t:"BIG CELLS"},{ph:0,t:"AS CUT"},{ph:-78,t:"SMALL CELLS"},
     {la:0,t:"LOOSE"},{la:180,t:"TIGHT"}],
  B:[{ph:78,t:"FLAT"},{ph:0,t:"PHOTOGRAPH"},{ph:-78,t:"AVERAGE"},
     {la:0,t:"1st"},{la:180,t:"2nd"}]
};

/* adding and removing tones is done on the ball, so the places must survive
   a change of K: keep every puck we already have, in tonal order */
function resizePlaces(places,K,makeDefault){
  const def=makeDefault(K);
  if(!places||!places.length) return def;
  const out=[];
  for(let i=0;i<K;i++) out.push(i<places.length?places[i].slice():def[i].slice());
  return out;
}

/* the ball starts as a ring around the equator: every tone photographic,
   spread from the first picture to the second in tonal order */
function defaultPlaces(K){
  const p=[];
  for(let i=0;i<K;i++){
    const lam = 0.04*PI + (i/(Math.max(1,K-1)))*PI*0.92;
    p.push(dirLL(lam,0));
  }
  return p;
}

/* ---- colour ---- */
function lin(c){ c/=255; return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4); }
function fLab(t){ return t>0.008856?Math.cbrt(t):(7.787*t)+16/116; }
function toLab(r,g,b){
  const R=lin(r),G=lin(g),B=lin(b);
  const X=(R*0.4124+G*0.3576+B*0.1805)/0.95047;
  const Y=(R*0.2126+G*0.7152+B*0.0722);
  const Z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
  const fx=fLab(X),fy=fLab(Y),fz=fLab(Z);
  return [116*fy-16,500*(fx-fy),200*(fy-fz)];
}
const luma=(r,g,b)=>0.299*r+0.587*g+0.114*b;

function medianCut(d,k){
  const px=[]; const stride=Math.max(4,(d.length/4/20000|0))*4;
  for(let i=0;i<d.length;i+=stride){ if(d[i+3]<8) continue; px.push([d[i],d[i+1],d[i+2]]); }
  if(!px.length) return [[0,0,0]];
  let boxes=[px];
  while(boxes.length<k){
    let bi=-1,bw=-1;
    for(let i=0;i<boxes.length;i++){
      const b=boxes[i]; if(b.length<2) continue;
      let mn=[255,255,255],mx=[0,0,0];
      for(const p of b) for(let c=0;c<3;c++){ if(p[c]<mn[c])mn[c]=p[c]; if(p[c]>mx[c])mx[c]=p[c]; }
      const w=Math.max(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]);
      if(w>bw){bw=w;bi=i;}
    }
    if(bi<0||bw<=0) break;
    const b=boxes[bi];
    let mn=[255,255,255],mx=[0,0,0];
    for(const p of b) for(let c=0;c<3;c++){ if(p[c]<mn[c])mn[c]=p[c]; if(p[c]>mx[c])mx[c]=p[c]; }
    let ch=0; if(mx[1]-mn[1]>mx[ch]-mn[ch])ch=1; if(mx[2]-mn[2]>mx[ch]-mn[ch])ch=2;
    b.sort((p,q)=>p[ch]-q[ch]);
    const mid=b.length>>1;
    boxes.splice(bi,1,b.slice(0,mid),b.slice(mid));
  }
  const seen=new Set(), pal=[];
  for(const b of boxes){
    if(!b.length) continue;
    let r=0,g=0,bl=0; for(const p of b){r+=p[0];g+=p[1];bl+=p[2];}
    const c=[Math.round(r/b.length),Math.round(g/b.length),Math.round(bl/b.length)];
    const key=c.join(","); if(seen.has(key)) continue; seen.add(key); pal.push(c);
  }
  return pal.length?pal:[[0,0,0]];
}
const byTone=p=>p.slice().sort((a,b)=>luma(a[0],a[1],a[2])-luma(b[0],b[1],b[2]));

function buildMetric(pal){
  const lab=pal.map(c=>toLab(c[0],c[1],c[2]));
  const K=pal.length,V=new Float32Array(K*K); let mx=1e-6;
  for(let i=0;i<K;i++) for(let j=0;j<K;j++){
    const a=lab[i],b=lab[j];
    const d=Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
    V[i*K+j]=d; if(d>mx) mx=d;
  }
  for(let i=0;i<V.length;i++) V[i]/=mx;
  return {V,K,lab};
}
function quantIndex(labs,r,g,b){
  const L=toLab(r,g,b); let best=0,bd=Infinity;
  for(let i=0;i<labs.length;i++){
    const p=labs[i];
    const d=(L[0]-p[0])**2+(L[1]-p[1])**2+(L[2]-p[2])**2;
    if(d<bd){bd=d;best=i;}
  }
  return best;
}
/* Converting to Lab per pixel per frame is what makes video impossible.
   Five bits a channel is 32768 entries, built once when the palette changes,
   and every frame after that is an array lookup. */
function buildLUT(labs){
  const lut=new Uint8Array(32768);
  for(let r=0;r<32;r++) for(let g=0;g<32;g++) for(let b=0;b<32;b++)
    lut[(r<<10)|(g<<5)|b]=quantIndex(labs,r*8+4,g*8+4,b*8+4);
  return lut;
}
const lutLook=(lut,r,g,b)=>lut[((r>>3)<<10)|((g>>3)<<5)|(b>>3)];
function quantiseField(lut,data,W,H,outIdx){
  for(let i=0,p=0;i<W*H;i++,p+=4)
    outIdx[i]=lut[((data[p]>>3)<<10)|((data[p+1]>>3)<<5)|(data[p+2]>>3)];
  return outIdx;
}

/* ---- partition ---- */
function sobel(data,W,H){
  const lum=new Float32Array(W*H);
  for(let i=0,p=0;i<W*H;i++,p+=4) lum[i]=luma(data[p],data[p+1],data[p+2]);
  const m=new Float32Array(W*H); let mx=1e-6;
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){
    const i=y*W+x;
    const gx=-lum[i-W-1]-2*lum[i-1]-lum[i+W-1]+lum[i-W+1]+2*lum[i+1]+lum[i+W+1];
    const gy=-lum[i-W-1]-2*lum[i-W]-lum[i-W+1]+lum[i+W-1]+2*lum[i+W]+lum[i+W+1];
    const v=Math.sqrt(gx*gx+gy*gy); m[i]=v; if(v>mx)mx=v;
  }
  for(let i=0;i<m.length;i++) m[i]/=mx;
  return m;
}
function nearestAssign(W,H,seeds,ids){
  const n=seeds.length/2;
  const cell=Math.max(2,Math.round(Math.sqrt((W*H)/n)));
  const gw=Math.ceil(W/cell),gh=Math.ceil(H/cell),gn=gw*gh;
  const counts=new Int32Array(gn),cxs=new Int32Array(n),cys=new Int32Array(n);
  for(let i=0;i<n;i++){
    const sx=clamp(seeds[2*i],0,W-1),sy=clamp(seeds[2*i+1],0,H-1);
    const cx=Math.min(gw-1,(sx/cell)|0),cy=Math.min(gh-1,(sy/cell)|0);
    cxs[i]=cx;cys[i]=cy;counts[cy*gw+cx]++;
  }
  const start=new Int32Array(gn+1);
  for(let i=0;i<gn;i++) start[i+1]=start[i]+counts[i];
  const cur=start.slice(0,gn),items=new Int32Array(n);
  for(let i=0;i<n;i++) items[cur[cys[i]*gw+cxs[i]]++]=i;
  const maxR=Math.max(gw,gh);
  for(let y=0;y<H;y++){
    const py=y+0.5,cy=Math.min(gh-1,(y/cell)|0);
    for(let x=0;x<W;x++){
      const px=x+0.5,cx=Math.min(gw-1,(x/cell)|0);
      let best=Infinity,bi=0;
      for(let r=0;r<=maxR;r++){
        if(r>0){ const bnd=(r-1)*cell; if(best<=bnd*bnd) break; }
        const y0=cy-r,y1=cy+r;
        for(let gy=y0;gy<=y1;gy++){
          if(gy<0||gy>=gh) continue;
          const edge=(gy===y0||gy===y1);
          for(let gx=cx-r;gx<=cx+r;gx+=(edge?1:(2*r))){
            if(gx<0||gx>=gw) continue;
            const c2=gy*gw+gx;
            for(let k=start[c2];k<start[c2+1];k++){
              const s=items[k];
              const dx=seeds[2*s]-px,dy=seeds[2*s+1]-py;
              const d=dx*dx+dy*dy;
              if(d<best){best=d;bi=s;}
            }
            if(r===0) break;
          }
        }
      }
      ids[y*W+x]=bi;
    }
  }
}
function partition(dataA,W,H,n,rnd,idxField,dens){
  const imp=sobel(dataA,W,H);
  const seeds=new Float32Array(n*2);
  let placed=0,tries=0;
  let peak=1;
  if(idxField&&dens){ for(const d of dens) if(d>peak) peak=d; }
  while(placed<n&&tries<n*400){
    tries++;
    const x=rnd()*W,y=rnd()*H;
    const i=(y|0)*W+(x|0);
    let w=0.06+Math.pow(imp[i],0.75);
    if(idxField&&dens) w*=dens[idxField[i]];      // a tone may ask for finer cells
    if(rnd()*1.06*peak < w){ seeds[placed*2]=x; seeds[placed*2+1]=y; placed++; }
  }
  while(placed<n){ seeds[placed*2]=rnd()*W; seeds[placed*2+1]=rnd()*H; placed++; }
  const ids=new Int32Array(W*H);
  const sx=new Float64Array(n),sy=new Float64Array(n),ct=new Int32Array(n);
  for(let r=0;r<3;r++){
    nearestAssign(W,H,seeds,ids);
    if(r===2) break;
    sx.fill(0);sy.fill(0);ct.fill(0);
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const s=ids[y*W+x]; sx[s]+=x+0.5; sy[s]+=y+0.5; ct[s]++; }
    for(let i=0;i<n;i++) if(ct[i]>0){ seeds[2*i]=sx[i]/ct[i]; seeds[2*i+1]=sy[i]/ct[i]; }
  }
  return {ids,count:n};
}

function cellStats(ids,count,idxField,dA,dB,W,H,K){
  const n=new Int32Array(count);
  const aR=new Float64Array(count),aG=new Float64Array(count),aB=new Float64Array(count);
  const bR=new Float64Array(count),bG=new Float64Array(count),bB=new Float64Array(count);
  const sq=new Float64Array(count),cx=new Float64Array(count),cy=new Float64Array(count);
  const hist=new Int32Array(count*K);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const i=y*W+x,c=ids[i],p=i*4;
    n[c]++;
    aR[c]+=dA[p];aG[c]+=dA[p+1];aB[c]+=dA[p+2];
    bR[c]+=dB[p];bG[c]+=dB[p+1];bB[c]+=dB[p+2];
    sq[c]+=dA[p]*dA[p]+dA[p+1]*dA[p+1]+dA[p+2]*dA[p+2];
    cx[c]+=x+0.5;cy[c]+=y+0.5;
    hist[c*K+idxField[i]]++;
  }
  return {n,aR,aG,aB,bR,bG,bB,sq,cx,cy,hist,count,K};
}
function adjacency(ids,count,W,H){
  const map=new Map();
  const add=(a,b)=>{ if(a===b)return; const k=a<b?a*count+b:b*count+a; map.set(k,(map.get(k)||0)+1); };
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const c=ids[y*W+x];
    if(x+1<W) add(c,ids[y*W+x+1]);
    if(y+1<H) add(c,ids[(y+1)*W+x]);
  }
  const deg=new Int32Array(count),pairs=[];
  for(const [k,len] of map){ const a=(k/count)|0,b=k%count; pairs.push([a,b,len]); deg[a]++; deg[b]++; }
  const start=new Int32Array(count+1);
  for(let i=0;i<count;i++) start[i+1]=start[i]+deg[i];
  const cur=start.slice(0,count);
  const nb=new Int32Array(pairs.length*2),wt=new Float32Array(pairs.length*2);
  for(const [a,b,len] of pairs){ nb[cur[a]]=b;wt[cur[a]]=len;cur[a]++; nb[cur[b]]=a;wt[cur[b]]=len;cur[b]++; }
  return {start,nb,wt};
}
function dataTerm(st,c,l){ const n=st.n[c]; return n?1-st.hist[c*st.K+l]/n:0; }
/* lamOf is per tone, so one tone can pool into a broad patch while another
   stays finely broken. warm supplies the previous frame's labels, which is
   both faster and what keeps video from strobing. */
function solveLabels(st,adj,V,lam,sweeps,lamOf,warm){
  const K=st.K,lab=new Int32Array(st.count);
  if(warm&&warm.length===st.count) lab.set(warm);
  else for(let c=0;c<st.count;c++){
    let best=0,bd=Infinity;
    for(let l=0;l<K;l++){ const d=dataTerm(st,c,l); if(d<bd){bd=d;best=l;} }
    lab[c]=best;
  }
  const lamFor=l=>lam*(lamOf?lamOf[l]:1);
  if(lam<=0||sweeps<=0){
    for(let c=0;c<st.count;c++){
      let best=0,bd=Infinity;
      for(let l=0;l<K;l++){ const d=dataTerm(st,c,l); if(d<bd){bd=d;best=l;} }
      lab[c]=best;
    }
    return lab;
  }
  for(let s=0;s<sweeps;s++){
    let ch=0;
    for(let c=0;c<st.count;c++){
      if(!st.n[c]) continue;
      let best=lab[c],bd=Infinity;
      for(let l=0;l<K;l++){
        let cost=st.n[c]*dataTerm(st,c,l);
        for(let e=adj.start[c];e<adj.start[c+1];e++){
          const q=lab[adj.nb[e]];
          cost+=0.5*(lamFor(l)+lamFor(q))*adj.wt[e]*V[l*K+q];
        }
        if(cost<bd){bd=cost;best=l;}
      }
      if(best!==lab[c]){ lab[c]=best; ch++; }
    }
    if(!ch) break;
  }
  return lab;
}
function territoryStats(ids,labels,W,H,K){
  const px=new Int32Array(W*H);
  for(let i=0;i<W*H;i++) px[i]=labels[ids[i]];
  const total=new Int32Array(K),biggest=new Int32Array(K);
  const seen=new Uint8Array(W*H),st=new Int32Array(W*H);
  for(let i=0;i<W*H;i++) total[px[i]]++;
  for(let s=0;s<W*H;s++){
    if(seen[s]) continue;
    const a=px[s]; let sp=0,cnt=0; st[sp++]=s; seen[s]=1;
    while(sp){
      const c=st[--sp]; cnt++;
      const x=c%W,y=(c/W)|0;
      if(x>0  &&!seen[c-1]&&px[c-1]===a){seen[c-1]=1;st[sp++]=c-1;}
      if(x<W-1&&!seen[c+1]&&px[c+1]===a){seen[c+1]=1;st[sp++]=c+1;}
      if(y>0  &&!seen[c-W]&&px[c-W]===a){seen[c-W]=1;st[sp++]=c-W;}
      if(y<H-1&&!seen[c+W]&&px[c+W]===a){seen[c+W]=1;st[sp++]=c+W;}
    }
    if(cnt>biggest[a]) biggest[a]=cnt;
  }
  let num=0,den=0;
  for(let k=0;k<K;k++){ if(!total[k]) continue; num+=biggest[k]; den+=total[k]; }
  return {pooled:den?num/den:0,total,biggest};
}

/* a frame can be fully painted and carry no picture; this measures the picture */
/* one colour standing for each picture, weighted by how much of the frame
   each tone actually owns — so the ball's mix axis is this pair, not a guess */
function representative(pal,share,total){
  let r=0,g=0,b=0,w=0;
  for(let i=0;i<pal.length;i++){
    const s=share[i]||0; if(!s) continue;
    r+=pal[i][0]*s; g+=pal[i][1]*s; b+=pal[i][2]*s; w+=s;
  }
  if(!w) return [128,128,128];
  return [r/w,g/w,b/w];
}

function detailFraction(o,W,H){
  let live=0,tot=0;
  for(let y=1;y<H-1;y+=2) for(let x=1;x<W-1;x+=2){
    const p=(y*W+x)*4;
    const c=luma(o[p],o[p+1],o[p+2]);
    const r=luma(o[p+8],o[p+9],o[p+10]);
    const d=luma(o[p+W*8],o[p+W*8+1],o[p+W*8+2]);
    tot++;
    if(Math.abs(c-r)+Math.abs(c-d)>6) live++;
  }
  return tot?live/tot:0;
}
/* ============================================================
   TELLING A MODEL WHAT IT IS LOOKING AT

   A settings dump alone is useless to anything that cannot see: "fill 3 90 0"
   is valid and blind. So the text opens with a description of the scene —
   every tone's colour, share, how many runs it has, how much detail it holds
   and where its mass sits, plus the largest patches with their boxes. A model
   given this can say "the dark mass in the lower right is tone 5" and mean it.
   ============================================================ */
function whereWord(x,y){
  const c=y<0.34?"upper":y>0.66?"lower":"middle";
  const r=x<0.34?"left":x>0.66?"right":"centre";
  return (c==="middle"&&r==="centre")?"centre":c+" "+r;
}
function hex2(c){
  return "#"+[c[0],c[1],c[2]].map(v=>Math.max(0,Math.min(255,Math.round(v)))
    .toString(16).padStart(2,"0")).join("");
}
/* per patch: where it sits and how far it spreads, from the cell centroids */
function patchGeometry(patches,st,W,H){
  const n=patches.count;
  const cx=new Float64Array(n),cy=new Float64Array(n),wt=new Float64Array(n);
  const x0=new Float64Array(n).fill(1e9),y0=new Float64Array(n).fill(1e9);
  const x1=new Float64Array(n).fill(-1e9),y1=new Float64Array(n).fill(-1e9);
  for(let c=0;c<st.count;c++){
    const a=st.n[c]; if(!a) continue;
    const p=patches.patchOf[c];
    const px=st.cx[c]/a, py=st.cy[c]/a;
    cx[p]+=px*a; cy[p]+=py*a; wt[p]+=a;
    if(px<x0[p])x0[p]=px; if(px>x1[p])x1[p]=px;
    if(py<y0[p])y0[p]=py; if(py>y1[p])y1[p]=py;
  }
  for(let i=0;i<n;i++){ if(wt[i]){ cx[i]/=wt[i]; cy[i]/=wt[i]; } }
  return {cx,cy,x0,y0,x1,y1,W,H};
}
/* per tone: colour, share, runs, how much detail it holds, where it sits */
function toneReport(K,palA,palB,terr,patches,st,geo,W,H,toneSrc,detail){
  const per=patchesPerTone(patches,K);
  const cx=new Float64Array(K),cy=new Float64Array(K),wt=new Float64Array(K);
  for(let i=0;i<patches.count;i++){
    const t=patches.tone[i], a=patches.size[i];
    cx[t]+=geo.cx[i]*a; cy[t]+=geo.cy[i]*a; wt[t]+=a;
  }
  const out=[];
  for(let k=0;k<K;k++){
    const share=terr.total[k]/(W*H);
    if(share<=0){ out.push("# tone "+k+"  unused"); continue; }
    const x=wt[k]?cx[k]/wt[k]/W:0.5, y=wt[k]?cy[k]/wt[k]/H:0.5;
    out.push("# tone "+k+"  "+hex2(palA[k])+"  "+(share*100).toFixed(1)+"%  "+
      per[k]+(per[k]===1?" run":" runs")+
      "  detail "+Math.round((detail?detail[k]:0)*100)+"%"+
      "  "+whereWord(x,y)+
      ((toneSrc&&toneSrc[k]!==1)?"  reading picture "+toneSrc[k]:""));
  }
  return out;
}
function patchReport(patches,geo,W,H,limit){
  const order=patchOrder(patches);
  const out=[];
  for(let r=0;r<Math.min(limit,order.length);r++){
    const i=order[r], share=patches.size[i]/(W*H);
    if(share<0.004) break;
    out.push("# patch "+r+"  tone "+patches.tone[i]+"  "+(share*100).toFixed(1)+"%  "+
      whereWord(geo.cx[i]/W,geo.cy[i]/H)+
      "  box "+Math.round(geo.x0[i]/W*100)+","+Math.round(geo.y0[i]/H*100)+
      " to "+Math.round(geo.x1[i]/W*100)+","+Math.round(geo.y1[i]/H*100));
  }
  return out;
}
/* how much of each tone is texture rather than flat colour */
function toneDetail(K,labels,st,W,H){
  const sum=new Float64Array(K), wt=new Float64Array(K);
  for(let c=0;c<st.count;c++){
    const a=st.n[c]; if(!a) continue;
    const mr=st.aR[c]/a, mg=st.aG[c]/a, mb=st.aB[c]/a;
    const v=Math.max(0, st.sq[c]/a-(mr*mr+mg*mg+mb*mb));
    sum[labels[c]]+=Math.sqrt(v)*a; wt[labels[c]]+=a;
  }
  const out=new Float64Array(K);
  for(let k=0;k<K;k++) out[k]= wt[k] ? Math.min(1,(sum[k]/wt[k])/70) : 0;
  return out;
}

/* ============================================================
   THE SESSION AS TEXT

   Everything the balls, the cards and the picture can set is also a line of
   plain text. That makes the whole state readable, diffable, pasteable, and
   drivable by anything that can write a few lines — including a model that
   never sees the screen.

     tones <n>
     cut   <tone> <lon> <lat>          deck A, degrees
     fill  <tone> <lon> <lat> [src n]  deck B, degrees
     patch <rank> <lon> <lat> [src n]  one run, ranked biggest first
     holes on|off
     edges on|off

   lon 0 is the first picture, 180 the second. lat 90 is a flat tone, 0 the
   photograph, -90 the cell average.
   ============================================================ */
const STATE_HELP=
"# tones <n> | cut <tone> <lon> <lat> | fill <tone> <lon> <lat> [src n]\n"+
"# patch <rank> <lon> <lat> [src n] | holes on|off | edges on|off\n"+
"# lon 0=first picture 180=second, lat 90=flat 0=photograph -90=average\n";

function degOf(d){
  const [lam,phi]=llDir(d);
  return [Math.round(lam*R2D*10)/10, Math.round(phi*R2D*10)/10];
}
function stateToText(o){
  const {tones,cuts,fills,toneSrc,patches,ovr,holes,edges,stats,scene}=o;
  const L=[STATE_HELP.trim()];
  if(stats) L.push("# "+stats);
  if(scene&&scene.length){ L.push("#"); scene.forEach(x=>L.push(x)); L.push("#"); }
  L.push("tones "+tones);
  cuts.forEach((d,i)=>{ const [a,b]=degOf(d); L.push("cut "+i+" "+a+" "+b); });
  fills.forEach((d,i)=>{ const [a,b]=degOf(d);
    L.push("fill "+i+" "+a+" "+b+((toneSrc&&toneSrc[i]!==1)?" src "+toneSrc[i]:"")); });
  if(patches&&ovr&&ovr.size){
    const order=patchOrder(patches);
    order.forEach((pid,rank)=>{
      const key=patches.seed[pid], o2=ovr.get(key);
      if(!o2) return;
      const d=o2.dir||fills[patches.tone[pid]];
      const [a,b]=degOf(d);
      L.push("# rank "+rank+" is tone "+patches.tone[pid]+", "+
             (patches.size[pid]/(stats&&stats.px?stats.px:1)*100).toFixed(1)+"% of the frame");
      L.push("patch "+rank+" "+a+" "+b+((o2.srcB!==undefined&&o2.srcB!==1)?" src "+o2.srcB:""));
    });
  }
  L.push("holes "+(holes?"on":"off"));
  L.push("edges "+(edges?"on":"off"));
  return L.join("\n");
}

function parseState(text){
  const out={tones:null,cuts:[],fills:[],patches:[],holes:null,edges:null},errs=[];
  const num=t=>t!==undefined&&t!==""&&!isNaN(+t);
  text.split(/\r?\n/).forEach((raw,i)=>{
    const ln=i+1;
    const line=raw.replace(/#.*$/,"").trim();
    if(!line) return;
    const t=line.split(/\s+/), k=t[0].toLowerCase();
    const bad=m=>errs.push({ln,msg:m});
    if(k==="tones"){
      if(!num(t[1])) return bad("tones needs a number");
      out.tones=clamp(Math.round(+t[1]),2,16); return;
    }
    if(k==="holes"||k==="edges"){
      const v=(t[1]||"").toLowerCase();
      if(v!=="on"&&v!=="off") return bad(k+" takes on or off");
      out[k]= v==="on"; return;
    }
    if(k==="cut"||k==="fill"||k==="patch"){
      if(!num(t[1])||!num(t[2])||!num(t[3]))
        return bad(k+" needs an index and two angles");
      const rec={i:Math.round(+t[1]),
                 lon:clamp(+t[2],0,180), lat:clamp(+t[3],-90,90)};
      if((t[4]||"").toLowerCase()==="src"){
        if(!num(t[5])) return bad("src needs a picture number");
        rec.src=Math.max(1,Math.round(+t[5]));
      } else if(t[4]!==undefined) return bad("I do not know \u201c"+t[4]+"\u201d");
      (k==="cut"?out.cuts:k==="fill"?out.fills:out.patches).push(rec);
      return;
    }
    bad("I do not know \u201c"+t[0]+"\u201d");
  });
  return {state:out,errs};
}
