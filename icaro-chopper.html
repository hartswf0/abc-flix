<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CHOPPER</title>
<style>
:root{--bg:#fff;--ink:#000;--bw:2px}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0!important}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;user-select:none}
#app{display:grid;grid-template-rows:1fr auto 60px;height:100dvh}

/* VIDEO ZONE — dominates the screen */
#zone{position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;touch-action:none;cursor:pointer}
#zone video{width:100%;height:100%;object-fit:contain}
#zone .drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:900 24px/1.2 monospace;text-transform:uppercase;letter-spacing:.02em;z-index:2}
#zone .drop small{font-weight:400;font-size:12px;margin-top:6px;opacity:.5}
#zone .drop.gone{display:none}
#zone input{display:none}
/* Scrub bar — full width at bottom of video */
#scrub{position:absolute;bottom:0;left:0;right:0;height:44px;z-index:3;touch-action:none;cursor:ew-resize}
#scrub .track{position:absolute;bottom:0;left:0;right:0;height:6px;background:rgba(255,255,255,.2)}
#scrub .fill{height:100%;background:#fff;transition:width .05s}
#scrub .sections{position:absolute;bottom:6px;left:0;right:0;height:28px;display:flex}
#scrub .sec{flex:1;border-right:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font:700 8px/1 monospace;color:rgba(255,255,255,.5);transition:background .1s,color .1s}
#scrub .sec.here{background:rgba(255,255,255,.15);color:#fff}
#scrub .sec.done{background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)}
#scrub .sec.cutting{background:rgba(200,0,0,.4);color:#fff}
/* HUD overlay */
#hud{position:absolute;top:10px;left:10px;font:900 14px/1.3 monospace;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);z-index:3;pointer-events:none}
#hud small{font-weight:400;font-size:10px;display:block;opacity:.6}
#prog{position:absolute;top:0;left:0;height:3px;background:#c00;z-index:4;transition:width .1s}

/* CONTROLS — one compact row */
#ctrl{display:flex;align-items:center;gap:0;border-top:var(--bw) solid var(--ink);border-bottom:var(--bw) solid var(--ink);background:var(--bg);min-height:38px}
#ctrl .f{display:flex;align-items:center;gap:4px;padding:0 10px;font:900 11px/1 monospace;text-transform:uppercase;border-right:1px solid #ddd;height:100%}
#ctrl .f select,#ctrl .f input{font:900 13px/1 monospace;border:var(--bw) solid var(--ink);padding:2px 4px;width:52px;text-align:center;background:var(--bg)}
#ctrl .f select{width:auto}
#ctrl .f b{cursor:pointer;padding:2px 6px;border:var(--bw) solid var(--ink);background:var(--bg)}
#ctrl .f b:active,#ctrl .f b.on{background:var(--ink);color:var(--bg)}
#ctrl .status{flex:1;text-align:center;font:400 10px/1 monospace;text-transform:uppercase;opacity:.5;padding:0 6px}

/* RAIL — two big buttons + results counter */
#rail{display:grid;grid-template-columns:1fr 1fr;border-top:var(--bw) solid var(--ink)}
#rail button{font:900 16px/1 monospace;text-transform:uppercase;letter-spacing:.02em;border:none;cursor:pointer;min-height:60px}
#rail .chop{background:var(--ink);color:var(--bg)}
#rail .chop:active{background:#333}
#rail .save{background:var(--bg);color:var(--ink);border-left:var(--bw) solid var(--ink)}
#rail .save:active{background:#eee}
#rail .save:disabled{opacity:.2;cursor:default}

/* RESULTS — slides up from bottom when populated */
#out{position:fixed;bottom:60px;left:0;right:0;max-height:50vh;overflow-y:auto;background:var(--bg);border-top:var(--bw) solid var(--ink);z-index:10;transform:translateY(100%);transition:transform .2s ease}
#out.show{transform:translateY(0)}
#out .row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #eee;font:400 10px/1.3 monospace;text-transform:uppercase}
#out .row:last-child{border-bottom:none}
#out .row .id{font-weight:900;width:60px}
#out .row .time{flex:1;opacity:.5}
#out .row .thumbs{display:flex;gap:4px}
#out .row .thumbs img{width:48px;height:36px;object-fit:cover;border:1px solid var(--ink);background:#eee}
#out .row .dl{display:flex;gap:4px}
#out .row .dl button{font:700 9px/1 monospace;padding:4px 8px;border:1px solid var(--ink);background:var(--bg);cursor:pointer;text-transform:uppercase}
#out .row .dl button:active{background:var(--ink);color:var(--bg)}
#out .dismiss{position:sticky;top:0;width:100%;font:900 10px/1 monospace;text-transform:uppercase;padding:8px;border:none;background:var(--ink);color:var(--bg);cursor:pointer}
</style>
</head>
<body>
<div id="app">

<div id="zone">
  <div class="drop" id="drop" onclick="fin.click()">
    DROP VIDEO<small>or tap to browse</small>
  </div>
  <video id="vid" playsinline muted></video>
  <input type="file" id="fin" accept="video/*">
  <div id="hud" style="display:none"></div>
  <div id="scrub" style="display:none">
    <div class="sections" id="secBar"></div>
    <div class="track"><div class="fill" id="fill" style="width:0"></div></div>
  </div>
  <div id="prog" style="width:0"></div>
</div>

<div id="ctrl">
  <div class="f">CUT <input type="number" id="fTarget" value="95" min="1">
    <b onclick="setTarget(95)">95</b>
    <b onclick="setTarget(190)">190</b>
  </div>
  <div class="f">FPS
    <select id="fFps">
      <option value="23.976">23.976</option><option value="24">24</option><option value="25">25</option>
      <option value="29.97">29.97</option><option value="30" selected>30</option>
      <option value="48">48</option><option value="59.94">59.94</option><option value="60">60</option>
    </select>
  </div>
  <div class="f">HD <b id="hdBtn" onclick="toggleHD()">OFF</b></div>
  <div class="status" id="status">DROP A VIDEO TO START</div>
</div>

<div id="rail">
  <button class="chop" id="chopBtn" onclick="doChop()">CHOP</button>
  <button class="save" id="saveBtn" onclick="doSave()" disabled>SAVE ALL</button>
</div>

</div>

<div id="out">
  <button class="dismiss" onclick="$('out').classList.remove('show')">CLOSE RESULTS</button>
  <div id="outBody"></div>
</div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const vid=$('vid'),fin=$('fin');
let SRC=null,SECTIONS=[],BLOBS=[],KEYS=[];
let HD=false,CHOPPING=false;

// ── FILE LOAD ──
function handleFile(f){
  if(!f)return;
  vid.src=URL.createObjectURL(f);
  $('drop').classList.add('gone');
  vid.onloadedmetadata=()=>{
    const fps=parseFloat($('fFps').value)||30;
    const dur=vid.duration;
    const total=Math.round(dur*fps);
    SRC={name:f.name,stem:f.name.replace(/\.[^.]+$/,''),fps,duration:dur,totalFrames:total,size:f.size,w:vid.videoWidth,h:vid.videoHeight};
    // Auto-select closest FPS
    const opts=$('fFps').options;
    let best=4;for(let i=0;i<opts.length;i++)if(Math.abs(parseFloat(opts[i].value)-30)<Math.abs(parseFloat(opts[best].value)-30))best=i;
    $('fFps').selectedIndex=best;
    $('hud').style.display='';
    $('scrub').style.display='';
    $('status').textContent=SRC.stem+' · '+vid.videoWidth+'×'+vid.videoHeight+' · '+dur.toFixed(1)+'s';
    autoCalc();
    initScrub();
  };
}
fin.onchange=e=>handleFile(e.target.files[0]);
// Drag-drop on entire zone
const zone=$('zone');
zone.ondragover=e=>{e.preventDefault()};
zone.ondrop=e=>{e.preventDefault();handleFile(e.dataTransfer.files[0])};

// ── CONTROLS ──
function setTarget(n){$('fTarget').value=n;autoCalc();}
function toggleHD(){HD=!HD;$('hdBtn').textContent=HD?'ON':'OFF';$('hdBtn').classList.toggle('on',HD);}
$('fTarget').oninput=autoCalc;
$('fFps').onchange=autoCalc;

function autoCalc(){
  if(!SRC)return;
  const target=parseInt($('fTarget').value)||95;
  const fps=parseFloat($('fFps').value)||30;
  SRC.fps=fps;SRC.totalFrames=Math.round(SRC.duration*fps);
  const total=SRC.totalFrames;
  SECTIONS=[];BLOBS=[];KEYS=[];
  let i=0,idx=0;
  while(i<total){
    const end=Math.min(i+target,total);
    const core=end-i;
    const sid='SEC_'+String(idx).padStart(3,'0');
    SECTIONS.push({id:sid,idx,sf:i,ef:end,core,st:i/fps,et:end/fps,dur:core/fps,rem:core<target});
    i+=target;idx++;
  }
  renderSecBar();
  updateHUD();
  $('saveBtn').disabled=true;
  $('out').classList.remove('show');
}

function renderSecBar(){
  const bar=$('secBar');
  bar.innerHTML='';
  SECTIONS.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='sec';
    d.textContent=s.id.replace('SEC_','');
    d.onclick=e=>{e.stopPropagation();vid.currentTime=s.st;updateHUD();};
    bar.appendChild(d);
  });
}

// ── HUD + SCRUB ──
function fmtTime(s){
  if(s>=60){const m=Math.floor(s/60);return m+':'+((s%60).toFixed(1)).padStart(4,'0');}
  return s.toFixed(1)+'s';
}

function updateHUD(){
  if(!SRC)return;
  const t=vid.currentTime;
  const f=Math.round(t*SRC.fps);
  let cur=null;
  for(const s of SECTIONS)if(f>=s.sf&&f<s.ef){cur=s;break;}
  $('hud').innerHTML=fmtTime(t)+' / '+fmtTime(SRC.duration)
    +'<small>F'+f+' · '+(cur?cur.id:'--')+' · '+SECTIONS.length+' sections</small>';
  $('fill').style.width=(t/SRC.duration*100)+'%';
  // Highlight current section
  const secs=$('secBar').children;
  for(let i=0;i<secs.length;i++){
    secs[i].classList.toggle('here',cur&&cur.idx===i);
  }
}
vid.ontimeupdate=updateHUD;

function initScrub(){
  const scrub=$('scrub');
  const doScrub=e=>{
    const x=e.touches?e.touches[0].clientX:e.clientX;
    const rect=scrub.getBoundingClientRect();
    const pct=Math.max(0,Math.min(1,(x-rect.left)/rect.width));
    vid.currentTime=pct*vid.duration;
    updateHUD();
  };
  const end=()=>{document.removeEventListener('mousemove',doScrub);document.removeEventListener('mouseup',end);document.removeEventListener('touchmove',doScrub);document.removeEventListener('touchend',end);zone.classList.remove('scrubbing');};
  scrub.addEventListener('mousedown',e=>{if(!SRC)return;e.preventDefault();e.stopPropagation();zone.classList.add('scrubbing');doScrub(e);document.addEventListener('mousemove',doScrub);document.addEventListener('mouseup',end);});
  scrub.addEventListener('touchstart',e=>{if(!SRC)return;zone.classList.add('scrubbing');doScrub(e);document.addEventListener('touchmove',doScrub,{passive:false});document.addEventListener('touchend',end);},{passive:false});
  // Tap video to play/pause
  zone.addEventListener('click',e=>{
    if(!SRC||e.target.closest('#scrub'))return;
    if(vid.paused)vid.play().catch(()=>{});else vid.pause();
  });
}

// ── CAPTURE FRAME ──
function captureFrame(time){
  return new Promise(resolve=>{
    const onSeek=()=>{
      vid.removeEventListener('seeked',onSeek);
      try{
        const cv=document.createElement('canvas');
        if(HD){cv.width=vid.videoWidth;cv.height=vid.videoHeight;}
        else{cv.width=640;cv.height=Math.round(640*vid.videoHeight/vid.videoWidth);}
        cv.getContext('2d').drawImage(vid,0,0,cv.width,cv.height);
        const dataUrl=cv.toDataURL('image/jpeg',0.85);
        cv.toBlob(blob=>{resolve({blob,dataUrl,w:cv.width,h:cv.height});},HD?'image/png':'image/jpeg',0.92);
      }catch(e){resolve({blob:null,dataUrl:'',w:0,h:0});}
    };
    vid.addEventListener('seeked',onSeek,{once:true});
    vid.currentTime=time;
  });
}

// ── CHOP ──
async function doChop(){
  if(!SRC||!SECTIONS.length||CHOPPING)return;
  CHOPPING=true;
  $('chopBtn').textContent='CHOPPING...';
  BLOBS=new Array(SECTIONS.length).fill(null);
  KEYS=new Array(SECTIONS.length).fill(null);

  for(let i=0;i<SECTIONS.length;i++){
    const s=SECTIONS[i];
    $('prog').style.width=((i+1)/SECTIONS.length*100)+'%';
    $('status').textContent='CUTTING '+s.id+' ('+Math.round((i+1)/SECTIONS.length*100)+'%)';
    const secs=$('secBar').children;
    for(let j=0;j<secs.length;j++)secs[j].classList.toggle('cutting',j===i);
    try{
      const head=await captureFrame(s.st);
      const tail=await captureFrame(Math.max(s.st,s.et-0.04));
      KEYS[i]={head,tail};
      BLOBS[i]=await chopSection(s);
      if(secs[i])secs[i].classList.add('done');
    }catch(e){
      console.error('Chop failed',s.id,e);
      $('status').textContent='FAILED '+s.id;
    }
    for(let j=0;j<secs.length;j++)secs[j].classList.remove('cutting');
  }
  CHOPPING=false;
  $('chopBtn').textContent='CHOP';
  const ok=BLOBS.filter(Boolean).length;
  $('status').textContent='DONE · '+ok+'/'+SECTIONS.length+' SECTIONS · '+(KEYS.filter(Boolean).length*2)+' KEYFRAMES';
  $('prog').style.width='100%';
  $('saveBtn').disabled=false;
  renderResults();
}

function chopSection(s){
  return new Promise((resolve,reject)=>{
    const cv=document.createElement('canvas');
    if(HD){cv.width=vid.videoWidth;cv.height=vid.videoHeight;}
    else{cv.width=640;cv.height=Math.round(640*vid.videoHeight/vid.videoWidth);}
    const ctx=cv.getContext('2d');
    const stream=cv.captureStream(SRC.fps);
    try{if(vid.captureStream){const at=vid.captureStream().getAudioTracks();if(at.length)stream.addTrack(at[0]);}}catch(e){}
    const bps=HD?16000000:4000000;
    const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    let mime='video/webm';for(const t of types)if(MediaRecorder.isTypeSupported(t)){mime=t;break;}
    const mr=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:bps});
    const chunks=[];
    mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    mr.onstop=()=>resolve(new Blob(chunks,{type:mr.mimeType}));
    mr.onerror=e=>reject(e);
    const onSeek=()=>{
      vid.removeEventListener('seeked',onSeek);
      mr.start();
      vid.play().catch(()=>{});
      const draw=()=>{
        if(vid.currentTime>=s.et||vid.ended||vid.paused){vid.pause();try{mr.stop();}catch(e){}return;}
        ctx.drawImage(vid,0,0,cv.width,cv.height);
        requestAnimationFrame(draw);
      };
      requestAnimationFrame(draw);
    };
    vid.addEventListener('seeked',onSeek,{once:true});
    vid.currentTime=s.st;
  });
}

// ── RESULTS ──
function renderResults(){
  const body=$('outBody');
  body.innerHTML='';
  SECTIONS.forEach((s,i)=>{
    if(!BLOBS[i])return;
    const ext=BLOBS[i].type.startsWith('video/mp4')?'.mp4':'.webm';
    const row=document.createElement('div');
    row.className='row';
    row.innerHTML='<div class="id">'+s.id+'</div>'
      +'<div class="thumbs">'
        +(KEYS[i]&&KEYS[i].head.dataUrl?'<img src="'+KEYS[i].head.dataUrl+'" title="HEAD">':'')
        +(KEYS[i]&&KEYS[i].tail.dataUrl?'<img src="'+KEYS[i].tail.dataUrl+'" title="TAIL">':'')
      +'</div>'
      +'<div class="time">'+fmtTime(s.st)+' → '+fmtTime(s.et)+' · '+s.core+'f · '+s.dur.toFixed(1)+'s</div>'
      +'<div class="dl">'
        +'<button onclick="dlBlob(BLOBS['+i+'],\''+SRC.stem+'_'+s.id+ext+'\')">VID</button>'
        +(KEYS[i]&&KEYS[i].head.blob?'<button onclick="dlBlob(KEYS['+i+'].head.blob,\''+SRC.stem+'_'+s.id+'_HEAD'+(HD?'.png':'.jpg')+'\')">HEAD</button>':'')
        +(KEYS[i]&&KEYS[i].tail.blob?'<button onclick="dlBlob(KEYS['+i+'].tail.blob,\''+SRC.stem+'_'+s.id+'_TAIL'+(HD?'.png':'.jpg')+'\')">TAIL</button>':'')
      +'</div>';
    body.appendChild(row);
  });
  $('out').classList.add('show');
}

// ── DOWNLOADS ──
function dlBlob(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function doSave(){
  if(!BLOBS.filter(Boolean).length)return;
  let c=0;
  const ext=BLOBS.find(Boolean)?.type.startsWith('video/mp4')?'.mp4':'.webm';
  SECTIONS.forEach((s,i)=>{
    if(BLOBS[i])setTimeout(()=>dlBlob(BLOBS[i],SRC.stem+'_'+s.id+ext),c++*250);
    if(KEYS[i]){
      if(KEYS[i].head.blob)setTimeout(()=>dlBlob(KEYS[i].head.blob,SRC.stem+'_'+s.id+'_HEAD'+(HD?'.png':'.jpg')),c++*250);
      if(KEYS[i].tail.blob)setTimeout(()=>dlBlob(KEYS[i].tail.blob,SRC.stem+'_'+s.id+'_TAIL'+(HD?'.png':'.jpg')),c++*250);
    }
  });
  $('status').textContent='DOWNLOADING '+c+' FILES';
}
</script>
</body>
</html>
