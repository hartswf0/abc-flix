<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ICARO-PRES · PFLIX</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000'/%3E%3Crect x='4' y='4' width='56' height='56' fill='%23111' stroke='%23333' stroke-width='2'/%3E%3Ccircle cx='32' cy='28' r='14' fill='none' stroke='%23e60000' stroke-width='3'/%3E%3Ccircle cx='32' cy='28' r='5' fill='%23e60000'/%3E%3Ctext x='32' y='44' text-anchor='middle' fill='%23fff' font-family='Helvetica,Arial,sans-serif' font-size='9' font-weight='900'%3EABC%3C/text%3E%3C/svg%3E">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { background:#000; color:#fff; font-family:'DM Sans',Helvetica,sans-serif; height:100%; overflow:hidden; }
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700;900&family=Space+Mono&display=swap');

        #app {
            display:flex; flex-direction:column; height:100%;
            height:100dvh; /* dynamic viewport for mobile */
        }
        /* ── PRES CONTROL BAR ── */
        #pres-bar {
            display:flex; align-items:center; gap:6px; padding:6px 10px;
            background:#111; border-bottom:2px solid #e60000;
            flex-wrap:wrap; flex-shrink:0;
            font-size:10px; font-weight:900; color:#999;
            letter-spacing:0.08em; text-transform:uppercase;
        }
        #pres-bar label { display:flex; align-items:center; gap:2px; }
        #pres-bar input[type=number] {
            width:38px; background:#222; color:#fff; border:1px solid #444;
            padding:2px 4px; font-size:10px; font-family:monospace; text-align:center;
        }
        #pres-bar button {
            padding:4px 12px; background:#e60000; color:#fff; border:none;
            font-weight:900; font-size:10px; letter-spacing:0.1em; cursor:pointer;
        }
        .pres-label { color:#e60000; font-size:11px; letter-spacing:0.15em; margin-right:4px; }

        /* ── CANVAS ZONE ── */
        #canvas-zone {
            flex:1; display:flex; align-items:center; justify-content:center;
            background:#0a0a0a; position:relative; overflow:hidden;
            min-height:0; /* critical for flex shrink */
        }
        canvas {
            image-rendering:pixelated; cursor:pointer;
            max-width:100%; max-height:100%;
        }

        /* ── STATUS BAR ── */
        #status-bar {
            display:flex; align-items:center; justify-content:space-between;
            padding:6px 12px; background:#111; border-top:1px solid #333;
            font-size:11px; font-weight:900; letter-spacing:0.1em;
            flex-shrink:0;
        }
        #status-bar .st-val { color:#e60000; font-family:'Space Mono',monospace; }
        #toast {
            position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
            background:rgba(0,0,0,0.92); color:#e60000; padding:10px 20px;
            font-weight:900; font-size:14px; letter-spacing:0.12em;
            border:2px solid #e60000; pointer-events:none;
            opacity:0; transition:opacity 0.2s;
            z-index:999;
        }
        #toast.on { opacity:1; }
    </style>
</head>
<body>
<div id="app">
    <!-- PRES CONTROL BAR -->
    <div id="pres-bar">
        <span class="pres-label">PRES</span>
        <label>HOLD<input id="pres-hold" type="number" value="24" min="4" max="60" step="4"></label>
        <label>TRANS<input id="pres-trans" type="number" value="6" min="2" max="12" step="2"></label>
        <label>SIZE<input id="pres-size" type="number" value="10" min="6" max="20" step="1"></label>
        <label>Y<input id="pres-y" type="number" value="30" min="0" max="80" step="4"></label>
        <label>INK<input id="pres-ink" type="number" value="7" min="1" max="7" step="1"></label>
        <button id="btn-recompile">RECOMPILE</button>
    </div>

    <!-- CANVAS -->
    <div id="canvas-zone">
        <canvas id="screen" width="640" height="480"></canvas>
    </div>

    <!-- STATUS -->
    <div id="status-bar">
        <span>FRAME <span class="st-val" id="st-frame">—</span></span>
        <span>FPS <span class="st-val" id="st-fps">12</span></span>
        <span id="st-status" style="color:#999">LOADING…</span>
    </div>
</div>
<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════
// ██ ICARO-PRES: LEAN BEFLIX PRESENTATION PLAYER
// ══════════════════════════════════════════════════
// Lightweight player — no editor, no heavy per-frame buffers.
// Compiles BEFLIX script into compact grid snapshots (96×128 bytes each),
// then renders them to canvas using dot stamps. ~100x less memory than icaro-pro.

const G_ROWS = 96, G_COLS = 128, B_SZ = 5;
const W = G_COLS * B_SZ, H = G_ROWS * B_SZ; // 640×480
const cvs = document.getElementById('screen');
cvs.width = W; cvs.height = H;
const ctx = cvs.getContext('2d');

// ── INK PALETTE (BEFLIX 8-level) ──
const INKS = [
    { rgb: [10,10,10] },      // 0 BLACK
    { rgb: [40,35,30] },      // 1
    { rgb: [70,62,55] },      // 2
    { rgb: [105,95,85] },     // 3
    { rgb: [145,132,120] },   // 4
    { rgb: [185,172,158] },   // 5
    { rgb: [215,205,195] },   // 6
    { rgb: [245,240,235] },   // 7 WHITE
];

// ── DOT STAMPS (pre-rendered per ink level) ──
const DOT_STAMPS = [];
function buildDotStamps() {
    for (let i = 0; i < 8; i++) {
        const c = document.createElement('canvas');
        c.width = B_SZ; c.height = B_SZ;
        const cx = c.getContext('2d');
        const r = INKS[i].rgb;
        // Circular dot with slight edge fade
        const cx2 = B_SZ / 2, cy2 = B_SZ / 2, rad = B_SZ / 2 - 0.3;
        const grad = cx.createRadialGradient(cx2, cy2, 0, cx2, cy2, rad);
        grad.addColorStop(0, `rgba(${r[0]},${r[1]},${r[2]},1)`);
        grad.addColorStop(0.85, `rgba(${r[0]},${r[1]},${r[2]},0.95)`);
        grad.addColorStop(1, `rgba(${r[0]},${r[1]},${r[2]},0.3)`);
        cx.fillStyle = grad;
        cx.beginPath(); cx.arc(cx2, cy2, rad, 0, Math.PI * 2); cx.fill();
        DOT_STAMPS[i] = c;
    }
}
buildDotStamps();

// ══════════════════════════════════════════════════
// ██ FRAME STORAGE: COMPACT GRID (12KB per frame vs 2.4MB)
// ══════════════════════════════════════════════════
// Each frame is a Uint8Array(96*128) = 12,288 bytes
// Stores ink level 0-7 per grid cell

let frames = [];       // Uint8Array[]
let frameMeta = [];    // { text: string|null }[] for narration
let playing = false;
let curFrame = 0;
let playRAF = null;
let lastT = 0;
let BASE_FPS = 12;
let rawBflix = '';      // cached for recompile

function newGrid() { return new Uint8Array(G_ROWS * G_COLS); }
function cloneGrid(g) { return new Uint8Array(g); }

// ── RENDER A GRID TO CANVAS ──
function renderGrid(grid) {
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);
    for (let y = 0; y < G_ROWS; y++) {
        for (let x = 0; x < G_COLS; x++) {
            const v = grid[y * G_COLS + x];
            if (v > 0 || true) { // render all dots for BEFLIX look
                ctx.drawImage(DOT_STAMPS[v], x * B_SZ, y * B_SZ);
            }
        }
    }
}

// ══════════════════════════════════════════════════
// ██ TEXT RASTERIZER (for title cards)
// ══════════════════════════════════════════════════
const _tc = document.createElement('canvas');
_tc.width = G_COLS; _tc.height = G_ROWS;
const _tx = _tc.getContext('2d', { willReadFrequently: true });

function rasterizeText(text, fontSize, gx, gy, ink) {
    const grid = newGrid();
    _tx.clearRect(0, 0, G_COLS, G_ROWS);
    _tx.fillStyle = '#000';
    _tx.font = `900 ${fontSize}px Helvetica, Arial, sans-serif`;
    _tx.textBaseline = 'top';
    _tx.textAlign = 'left';
    const lineH = Math.ceil(fontSize * 1.2);
    const maxW = G_COLS - gx - 4;
    const words = text.split(' ');
    let curLine = '', cy = gy;
    for (const word of words) {
        const test = curLine ? curLine + ' ' + word : word;
        if (_tx.measureText(test).width > maxW && curLine) {
            _tx.fillText(curLine, gx, cy);
            cy += lineH;
            curLine = word;
        } else {
            curLine = test;
        }
    }
    if (curLine) _tx.fillText(curLine, gx, cy);

    const px = _tx.getImageData(0, 0, G_COLS, G_ROWS).data;
    for (let y = 0; y < G_ROWS; y++) {
        for (let x = 0; x < G_COLS; x++) {
            const alpha = px[(y * G_COLS + x) * 4 + 3];
            if (alpha > 30) {
                grid[y * G_COLS + x] = Math.max(1, Math.round((alpha / 255) * ink));
            }
        }
    }
    return grid;
}

// ══════════════════════════════════════════════════
// ██ BEFLIX COMPILER
// ══════════════════════════════════════════════════
function compile(code) {
    const lines = code.toUpperCase().split('\n');
    const res = [];
    const meta = [];
    let mat = newGrid();
    let lastComment = '';

    // Read PRES config
    const pSize = parseInt(document.getElementById('pres-size')?.value) || 10;
    const pY = parseInt(document.getElementById('pres-y')?.value) || 30;
    const pInk = parseInt(document.getElementById('pres-ink')?.value) || 7;
    const pTrans = Math.min(parseInt(document.getElementById('pres-trans')?.value) || 6, 12);
    const pHold = Math.min(parseInt(document.getElementById('pres-hold')?.value) || 24, 48);

    for (let li = 0; li < lines.length; li++) {
        const l = lines[li].trim();
        if (!l) continue;
        const parts = l.split(/\s+/);
        const cmd = parts[0];
        const a = parts.slice(1).map(Number);

        if (cmd === 'C') {
            const raw = lines[li].trim();
            const txt = raw.substring(2).trim();
            if (!txt || txt.startsWith('═') || txt.startsWith('---')) continue;
            lastComment = txt;

            // Chapter openers (STATE 01) and RESOLVE → ripple title cards
            const isChapter = /^STATE\s*0?1\s/i.test(txt);
            const isResolve = /^RESOLVE/i.test(txt);
            if (isChapter || isResolve) {
                let displayText = txt;
                if (isChapter) displayText = txt.replace(/^STATE\s*0?1\s*/i, '').trim();
                else displayText = txt.replace(/^RESOLVE\s*/i, '').trim();
                if (!displayText) displayText = txt;

                const titleGrid = rasterizeText(displayText, pSize, 4, pY, pInk);
                const cx = G_COLS / 2, cy = G_ROWS / 2;
                const maxDist = Math.sqrt(cx * cx + cy * cy);
                const holdN = isResolve ? Math.round(pHold * 1.3) : pHold;

                // Ripple reveal frames
                for (let fi = 0; fi < pTrans; fi++) {
                    const t = fi / Math.max(1, pTrans - 1);
                    const phase = t * Math.PI * 4;
                    const tg = newGrid();
                    for (let gy = 0; gy < G_ROWS; gy++) {
                        for (let gx = 0; gx < G_COLS; gx++) {
                            const dist = Math.sqrt((gx - cx) * (gx - cx) + (gy - cy) * (gy - cy));
                            const norm = dist / maxDist;
                            const tv = titleGrid[gy * G_COLS + gx];
                            if (tv > 0 && norm < t * 1.5) {
                                tg[gy * G_COLS + gx] = tv;
                            } else if (t < 0.8) {
                                const wave = Math.sin((dist / 15) * Math.PI * 2 - phase);
                                tg[gy * G_COLS + gx] = Math.max(0, Math.min(2, Math.round((wave + 1) * 1)));
                            }
                        }
                    }
                    res.push(tg);
                    meta.push({ text: displayText });
                }
                // Hold frames
                for (let fi = 0; fi < holdN; fi++) {
                    res.push(cloneGrid(titleGrid));
                    meta.push({ text: displayText });
                }
            }
            continue;
        }

        if (cmd === 'CLR') {
            mat.fill(a[0] || 0);
        }
        else if (cmd === 'PNT') {
            const px = a[0], py = a[1], pw = a[2], ph = a[3], pv = a[4];
            for (let y = py; y < py + ph; y++)
                for (let x = px; x < px + pw; x++)
                    if (y >= 0 && y < G_ROWS && x >= 0 && x < G_COLS)
                        mat[y * G_COLS + x] = pv;
        }
        else if (cmd === 'LIN') {
            let lx1=a[0],ly1=a[1],lx2=a[2],ly2=a[3],lv=a[4];
            let dx=Math.abs(lx2-lx1),sx=lx1<lx2?1:-1;
            let dy=-Math.abs(ly2-ly1),sy=ly1<ly2?1:-1;
            let err=dx+dy,lim=2000;
            while(lim-->0){
                if(lx1>=0&&lx1<G_COLS&&ly1>=0&&ly1<G_ROWS) mat[ly1*G_COLS+lx1]=lv;
                if(lx1===lx2&&ly1===ly2) break;
                let e2=2*err;
                if(e2>=dy){err+=dy;lx1+=sx;}
                if(e2<=dx){err+=dx;ly1+=sy;}
            }
        }
        else if (cmd === 'REC') {
            const n = Math.min(a[0] || 1, 5000);
            for (let i = 0; i < n; i++) {
                res.push(cloneGrid(mat));
                meta.push({ text: null });
            }
        }
        else if (cmd === 'SHF') {
            const sdx=a[0],sdy=a[1],sn=Math.min(a[2]||1,5000);
            for (let f = 0; f < sn; f++) {
                const n = newGrid();
                for (let y=0;y<G_ROWS;y++)
                    for (let x=0;x<G_COLS;x++){
                        let nx=x-sdx,ny=y-sdy;
                        if(nx>=0&&nx<G_COLS&&ny>=0&&ny<G_ROWS) n[y*G_COLS+x]=mat[ny*G_COLS+nx];
                    }
                mat = n;
                res.push(cloneGrid(mat));
                meta.push({ text: null });
            }
        }
    }

    if (!res.length) { res.push(mat); meta.push({ text: null }); }
    return { frames: res, meta: meta };
}

// ══════════════════════════════════════════════════
// ██ PLAYBACK ENGINE
// ══════════════════════════════════════════════════
function renderFrame() {
    if (!frames.length) return;
    renderGrid(frames[curFrame]);
    document.getElementById('st-frame').textContent =
        String(curFrame + 1).padStart(3, '0') + '/' + String(frames.length).padStart(3, '0');
}

function playStep(now) {
    if (!playing) return;
    playRAF = requestAnimationFrame(playStep);
    const el = now - lastT, dur = 1000 / BASE_FPS;
    if (el >= dur) {
        lastT = now - (el % dur);
        curFrame = (curFrame + 1) % frames.length;
        renderFrame();
    }
}

function togglePlay() {
    playing = !playing;
    if (playing) {
        lastT = performance.now();
        playRAF = requestAnimationFrame(playStep);
        document.getElementById('st-status').textContent = '▶ PLAYING';
        document.getElementById('st-status').style.color = '#e60000';
    } else {
        cancelAnimationFrame(playRAF);
        document.getElementById('st-status').textContent = '⏸ PAUSED';
        document.getElementById('st-status').style.color = '#999';
    }
}

// Tap canvas to play/pause
cvs.addEventListener('click', togglePlay);

// ══════════════════════════════════════════════════
// ██ TOAST
// ══════════════════════════════════════════════════
let _toastTimer;
function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('on'), 2000);
}

// ══════════════════════════════════════════════════
// ██ AUTO-LOAD films.md
// ══════════════════════════════════════════════════
function extractBflix(raw) {
    const valid = new Set(['CLR','PNT','LIN','REC','SHF','C']);
    return raw.split('\n').filter(line => {
        const t = line.trim();
        if (!t) return false;
        const cmd = t.split(/\s+/)[0].toUpperCase();
        return valid.has(cmd);
    }).join('\n');
}

async function loadAndCompile() {
    const status = document.getElementById('st-status');
    try {
        status.textContent = 'LOADING…';
        const resp = await fetch('films.md');
        if (!resp.ok) throw new Error(resp.status);
        const raw = await resp.text();
        rawBflix = extractBflix(raw);
        const lineCount = rawBflix.split('\n').length;
        status.textContent = 'COMPILING ' + lineCount + ' LINES…';
        toast(lineCount + ' LINES');

        // Compile in next frame to let UI update
        await new Promise(r => setTimeout(r, 50));
        const result = compile(rawBflix);
        frames = result.frames;
        frameMeta = result.meta;
        curFrame = 0;
        renderFrame();

        const memKB = Math.round(frames.length * G_ROWS * G_COLS / 1024);
        toast(frames.length + ' FRAMES · ' + memKB + 'KB');
        status.textContent = frames.length + ' FRAMES';

        // Auto-play after a beat
        setTimeout(() => { if (!playing) togglePlay(); }, 800);
    } catch (e) {
        status.textContent = 'FAILED: ' + e.message;
        toast('LOAD FAILED');
        console.error(e);
    }
}

// ── RECOMPILE ──
document.getElementById('btn-recompile').addEventListener('click', async () => {
    if (playing) togglePlay();
    toast('RECOMPILING…');
    await new Promise(r => setTimeout(r, 50));
    const result = compile(rawBflix);
    frames = result.frames;
    frameMeta = result.meta;
    curFrame = 0;
    renderFrame();
    toast(frames.length + ' FRAMES — READY');
    setTimeout(() => { if (!playing) togglePlay(); }, 400);
});

// ── BOOT ──
loadAndCompile();
</script>
</body>
</html>
