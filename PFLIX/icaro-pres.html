<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>ICARO-PRES · PFLIX</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{background:#000;color:#fff;font-family:'DM Sans',Helvetica,sans-serif;height:100%;overflow:hidden}
        #app{display:flex;flex-direction:column;height:100dvh}
        #pres-bar{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#111;border-bottom:2px solid #e60000;flex-wrap:wrap;flex-shrink:0;font-size:10px;font-weight:900;color:#999;letter-spacing:.08em;text-transform:uppercase}
        #pres-bar label{display:flex;align-items:center;gap:2px}
        #pres-bar input[type=number]{width:38px;background:#222;color:#fff;border:1px solid #444;padding:2px 4px;font-size:10px;font-family:monospace;text-align:center}
        #pres-bar button{padding:4px 12px;background:#e60000;color:#fff;border:none;font-weight:900;font-size:10px;letter-spacing:.1em;cursor:pointer}
        .pres-label{color:#e60000;font-size:11px;letter-spacing:.15em;margin-right:4px}
        #canvas-zone{flex:1;display:flex;align-items:center;justify-content:center;background:#0a0a0a;position:relative;overflow:hidden;min-height:0}
        canvas{image-rendering:pixelated;max-width:100%;max-height:100%}
        #status-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:#111;border-top:1px solid #333;font-size:11px;font-weight:900;letter-spacing:.1em;flex-shrink:0;gap:8px}
        .st-val{color:#e60000;font-family:'Space Mono',monospace}
        #start-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.88);cursor:pointer;z-index:50}
        #toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.92);color:#e60000;padding:10px 20px;font-weight:900;font-size:14px;letter-spacing:.12em;border:2px solid #e60000;pointer-events:none;opacity:0;transition:opacity .2s;z-index:999}
        #toast.on{opacity:1}
        .exp-btn{padding:4px 10px;background:#222;color:#e60000;border:1px solid #e60000;font-weight:900;font-size:10px;letter-spacing:.1em;cursor:pointer}
        .fps-btn{width:22px;height:22px;background:#222;color:#fff;border:1px solid #444;font-weight:900;cursor:pointer}
    </style>
</head>
<body>
<div id="app">
    <div id="pres-bar">
        <span class="pres-label">PRES</span>
        <label>HOLD<input id="pres-hold" type="number" value="36" min="4" max="60" step="4"></label>
        <label>TRANS<input id="pres-trans" type="number" value="6" min="2" max="12" step="2"></label>
        <label>SIZE<input id="pres-size" type="number" value="10" min="6" max="20" step="1"></label>
        <label>Y<input id="pres-y" type="number" value="30" min="0" max="80" step="4"></label>
        <label>INK<input id="pres-ink" type="number" value="7" min="1" max="7" step="1"></label>
        <button id="btn-recompile">RECOMPILE</button>
    </div>
    <div id="canvas-zone">
        <canvas id="screen" width="640" height="480"></canvas>
        <div id="start-overlay">
            <div style="text-align:center">
                <div style="font-size:48px;color:#e60000">▶</div>
                <div style="font-size:14px;font-weight:900;letter-spacing:.2em;color:#fff;margin-top:8px">TAP TO START</div>
            </div>
        </div>
    </div>
    <div id="status-bar">
        <span>FRAME <span class="st-val" id="st-frame">—</span></span>
        <span style="display:flex;align-items:center;gap:4px">FPS
            <button class="fps-btn" onclick="adjustFPS(-1)">−</button>
            <span class="st-val" id="st-fps">12</span>
            <button class="fps-btn" onclick="adjustFPS(1)">+</button>
        </span>
        <span id="st-status" style="color:#999">LOADING…</span>
        <button class="exp-btn" onclick="exportVideo()">⬇ EXPORT</button>
    </div>
</div>
<div id="toast"></div>

<script>
// ══════════════════════════════════════════════════
// ICARO-PRES: AUDIO-DRIVEN BEFLIX PLAYER
// Audio is the MASTER CLOCK. Animation frame index
// is derived from audio.currentTime. Zero drift.
// ══════════════════════════════════════════════════

const G_ROWS=96, G_COLS=128, B_SZ=5;
const W=G_COLS*B_SZ, H=G_ROWS*B_SZ;
const cvs=document.getElementById('screen');
cvs.width=W; cvs.height=H;
const ctx=cvs.getContext('2d');

const INKS=[
    {rgb:[10,10,10]},{rgb:[40,35,30]},{rgb:[70,62,55]},{rgb:[105,95,85]},
    {rgb:[145,132,120]},{rgb:[185,172,158]},{rgb:[215,205,195]},{rgb:[245,240,235]}
];

// Dot stamps
const DOT_STAMPS=[];
(function(){
    for(let i=0;i<8;i++){
        const c=document.createElement('canvas');c.width=B_SZ;c.height=B_SZ;
        const cx=c.getContext('2d'),r=INKS[i].rgb,rad=B_SZ/2-.3;
        const g=cx.createRadialGradient(B_SZ/2,B_SZ/2,0,B_SZ/2,B_SZ/2,rad);
        g.addColorStop(0,`rgba(${r[0]},${r[1]},${r[2]},1)`);
        g.addColorStop(.85,`rgba(${r[0]},${r[1]},${r[2]},.95)`);
        g.addColorStop(1,`rgba(${r[0]},${r[1]},${r[2]},.3)`);
        cx.fillStyle=g;cx.beginPath();cx.arc(B_SZ/2,B_SZ/2,rad,0,Math.PI*2);cx.fill();
        DOT_STAMPS[i]=c;
    }
})();

let frames=[], chapterStarts=[], playing=false, curFrame=0, playRAF=null;
let BASE_FPS=12, rawBflix='';

// ── AUDIO STATE ──
let audioCtx=null;

function newGrid(){return new Uint8Array(G_ROWS*G_COLS)}
function cloneGrid(g){return new Uint8Array(g)}

function renderGrid(grid){
    ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);
    for(let y=0;y<G_ROWS;y++) for(let x=0;x<G_COLS;x++)
        ctx.drawImage(DOT_STAMPS[grid[y*G_COLS+x]],x*B_SZ,y*B_SZ);
}

// ── TEXT RASTERIZER ──
const _tc=document.createElement('canvas');_tc.width=G_COLS;_tc.height=G_ROWS;
const _tx=_tc.getContext('2d',{willReadFrequently:true});
function rasterizeText(text,fontSize,gx,gy,ink){
    const grid=newGrid();
    _tx.clearRect(0,0,G_COLS,G_ROWS);_tx.fillStyle='#000';
    _tx.font=`900 ${fontSize}px Helvetica,Arial,sans-serif`;
    _tx.textBaseline='top';_tx.textAlign='left';
    const lineH=Math.ceil(fontSize*1.2),maxW=G_COLS-gx-4,words=text.split(' ');
    let curLine='',cy=gy;
    for(const word of words){
        const test=curLine?curLine+' '+word:word;
        if(_tx.measureText(test).width>maxW&&curLine){_tx.fillText(curLine,gx,cy);cy+=lineH;curLine=word;}
        else curLine=test;
    }
    if(curLine)_tx.fillText(curLine,gx,cy);
    const px=_tx.getImageData(0,0,G_COLS,G_ROWS).data;
    for(let y=0;y<G_ROWS;y++) for(let x=0;x<G_COLS;x++){
        const a=px[(y*G_COLS+x)*4+3];
        if(a>30) grid[y*G_COLS+x]=Math.max(1,Math.round((a/255)*ink));
    }
    return grid;
}

// ── BEFLIX COMPILER ──
function compile(code){
    const lines=code.toUpperCase().split('\n'),res=[],meta=[];
    let mat=newGrid();
    const pSize=parseInt(document.getElementById('pres-size')?.value)||10;
    const pY=parseInt(document.getElementById('pres-y')?.value)||30;
    const pInk=parseInt(document.getElementById('pres-ink')?.value)||7;
    const pTrans=Math.min(parseInt(document.getElementById('pres-trans')?.value)||6,12);
    const pHold=Math.min(parseInt(document.getElementById('pres-hold')?.value)||36,60);
    const cStarts=[];

    for(let li=0;li<lines.length;li++){
        const l=lines[li].trim();if(!l)continue;
        const parts=l.split(/\s+/),cmd=parts[0],a=parts.slice(1).map(Number);
        if(cmd==='C'){
            const txt=l.substring(2).trim();
            if(!txt||txt.startsWith('═')||txt.startsWith('---'))continue;
            const isChapter=/^STATE\s*0?1\s/i.test(txt);
            const isResolve=/^RESOLVE/i.test(txt);
            if(isChapter) cStarts.push(res.length);
            if(isChapter||isResolve){
                let dt=txt;
                if(isChapter)dt=txt.replace(/^STATE\s*0?1\s*/i,'').trim();
                else dt=txt.replace(/^RESOLVE\s*/i,'').trim();
                if(!dt)dt=txt;
                const tg=rasterizeText(dt,pSize,4,pY,pInk);
                const cx=G_COLS/2,cy=G_ROWS/2,md=Math.sqrt(cx*cx+cy*cy);
                const holdN=isResolve?Math.round(pHold*1.3):pHold;
                for(let fi=0;fi<pTrans;fi++){
                    const t=fi/Math.max(1,pTrans-1),phase=t*Math.PI*4,tm=newGrid();
                    for(let gy=0;gy<G_ROWS;gy++) for(let gx=0;gx<G_COLS;gx++){
                        const dist=Math.sqrt((gx-cx)*(gx-cx)+(gy-cy)*(gy-cy)),norm=dist/md;
                        const tv=tg[gy*G_COLS+gx];
                        if(tv>0&&norm<t*1.5) tm[gy*G_COLS+gx]=tv;
                        else if(t<.8){const w=Math.sin((dist/15)*Math.PI*2-phase);tm[gy*G_COLS+gx]=Math.max(0,Math.min(2,Math.round((w+1)*1)));}
                    }
                    res.push(tm);meta.push({text:dt});
                }
                for(let fi=0;fi<holdN;fi++){res.push(cloneGrid(tg));meta.push({text:dt});}
            }
            continue;
        }
        if(cmd==='CLR') mat.fill(a[0]||0);
        else if(cmd==='PNT'){for(let y=a[1];y<a[1]+a[3];y++) for(let x=a[0];x<a[0]+a[2];x++) if(y>=0&&y<G_ROWS&&x>=0&&x<G_COLS) mat[y*G_COLS+x]=a[4];}
        else if(cmd==='LIN'){let lx=a[0],ly=a[1],ex=a[2],ey=a[3],v=a[4],dx=Math.abs(ex-lx),sx=lx<ex?1:-1,dy=-Math.abs(ey-ly),sy=ly<ey?1:-1,err=dx+dy,n=2000;while(n-->0){if(lx>=0&&lx<G_COLS&&ly>=0&&ly<G_ROWS)mat[ly*G_COLS+lx]=v;if(lx===ex&&ly===ey)break;let e2=2*err;if(e2>=dy){err+=dy;lx+=sx;}if(e2<=dx){err+=dx;ly+=sy;}}}
        else if(cmd==='REC'){const n=Math.min(a[0]||1,5000);for(let i=0;i<n;i++){res.push(cloneGrid(mat));meta.push({text:null});}}
        else if(cmd==='SHF'){const sdx=a[0],sdy=a[1],sn=Math.min(a[2]||1,5000);for(let f=0;f<sn;f++){const ng=newGrid();for(let y=0;y<G_ROWS;y++) for(let x=0;x<G_COLS;x++){let nx=x-sdx,ny=y-sdy;if(nx>=0&&nx<G_COLS&&ny>=0&&ny<G_ROWS)ng[y*G_COLS+x]=mat[ny*G_COLS+nx];}mat=ng;res.push(cloneGrid(mat));meta.push({text:null});}}
    }
    if(!res.length){res.push(mat);meta.push({text:null});}
    return{frames:res,meta:meta,chapterStarts:cStarts};
}

// ══════════════════════════════════════════════════
// BULKHEADED CHAPTER SEQUENCER
// Each chapter is an independent sync unit.
// Plays its audio + animates its frames. When BOTH
// finish, next chapter starts clean. Zero drift leak.
// ══════════════════════════════════════════════════
let chapterAudioBuffers = []; // decoded AudioBuffers per chapter

function renderFrame(){
    if(!frames.length)return;
    renderGrid(frames[curFrame]);
    document.getElementById('st-frame').textContent=
        String(curFrame+1).padStart(3,'0')+'/'+String(frames.length).padStart(3,'0');
}

async function loadChapterAudio(){
    if(!audioCtx) audioCtx=new AudioContext();
    chapterAudioBuffers=[];
    for(let i=1;i<=10;i++){
        try{
            const resp=await fetch('audio/ch'+String(i).padStart(2,'0')+'.m4a');
            const ab=await resp.arrayBuffer();
            chapterAudioBuffers.push(await audioCtx.decodeAudioData(ab));
        }catch(e){chapterAudioBuffers.push(null);console.warn('Audio ch'+i,e);}
    }
}

// Play one chapter: audio + frames, wait for BOTH to finish
function playChapter(chIdx){
    return new Promise(resolve=>{
        // Determine frame range for this chapter
        const startFrame=chapterStarts[chIdx]||0;
        const endFrame=(chIdx<chapterStarts.length-1)?chapterStarts[chIdx+1]:frames.length;
        const chFrames=endFrame-startFrame;
        if(chFrames<=0){resolve();return;}

        // Audio for this chapter
        const audioBuf=chapterAudioBuffers[chIdx]||null;
        const audioDur=audioBuf?audioBuf.duration:0;

        // Animation duration at BASE_FPS
        const animDur=chFrames/BASE_FPS;

        // The chapter lasts whichever is LONGER
        const chDur=Math.max(audioDur,animDur);

        // Start audio
        let src=null;
        if(audioBuf){
            src=audioCtx.createBufferSource();
            src.buffer=audioBuf;
            src.connect(audioCtx.destination);
            src.start();
        }

        // Animate frames: spread them evenly across chDur
        const frameInterval=chDur/chFrames;
        const chStartTime=performance.now();
        let audioFinished=!audioBuf;
        let animFinished=false;

        if(src) src.onended=()=>{audioFinished=true;checkDone();};

        function checkDone(){
            if(audioFinished&&animFinished) resolve();
        }

        function tick(){
            if(!playing){if(src)try{src.stop();}catch(e){}resolve();return;}
            const elapsed=(performance.now()-chStartTime)/1000;
            // Map elapsed time to frame within this chapter
            const localFrame=Math.min(Math.floor(elapsed/frameInterval),chFrames-1);
            curFrame=startFrame+localFrame;
            renderFrame();
            // Update chapter indicator
            document.getElementById('st-status').textContent=
                '▶ CH '+(chIdx+1)+'/'+chapterStarts.length;
            if(localFrame>=chFrames-1){
                animFinished=true;
                checkDone();
                return;
            }
            playRAF=requestAnimationFrame(tick);
        }
        playRAF=requestAnimationFrame(tick);
    });
}

// Play all chapters sequentially
async function playFilm(){
    if(!frames.length)return;
    playing=true;
    document.getElementById('st-status').style.color='#e60000';
    for(let i=0;i<chapterStarts.length;i++){
        if(!playing)break;
        await playChapter(i);
    }
    playing=false;
    document.getElementById('st-status').textContent='FINISHED';
    document.getElementById('st-status').style.color='#999';
}

function stopPlayback(){
    playing=false;
    cancelAnimationFrame(playRAF);
    document.getElementById('st-status').textContent='⏸ STOPPED';
    document.getElementById('st-status').style.color='#999';
}

cvs.addEventListener('click',function(){
    if(playing) stopPlayback();
    else playFilm();
});

document.getElementById('start-overlay').addEventListener('click',async function(){
    this.style.display='none';
    if(!audioCtx) audioCtx=new AudioContext();
    await audioCtx.resume();
    if(frames.length) playFilm();
});

// ── TOAST ──
let _tt;
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>e.classList.remove('on'),2000);}

// ── EXTRACT BFLIX ──
function extractBflix(raw){
    const valid=new Set(['CLR','PNT','LIN','REC','SHF','C']);
    return raw.split('\n').filter(l=>{const t=l.trim();if(!t)return false;return valid.has(t.split(/\s+/)[0].toUpperCase());}).join('\n');
}

// ── LOAD + COMPILE ──
async function loadAndCompile(){
    const st=document.getElementById('st-status');
    try{
        st.textContent='LOADING…';
        const resp=await fetch('films.md');
        if(!resp.ok)throw new Error(resp.status);
        rawBflix=extractBflix(await resp.text());
        const lc=rawBflix.split('\n').length;
        st.textContent='COMPILING '+lc+' LINES…';
        toast(lc+' LINES');
        await new Promise(r=>setTimeout(r,50));
        const result=compile(rawBflix);
        frames=result.frames;
        chapterStarts=result.chapterStarts||[];
        curFrame=0;renderFrame();

        st.textContent='LOADING AUDIO…';
        await loadChapterAudio();
        const audioCount=chapterAudioBuffers.filter(Boolean).length;
        toast(frames.length+' FRAMES · '+audioCount+' AUDIO TRACKS');
        st.textContent=frames.length+' FRAMES · '+chapterStarts.length+' CHAPTERS';
    }catch(e){st.textContent='FAILED: '+e.message;toast('LOAD FAILED');console.error(e);}
}

// ── RECOMPILE ──
document.getElementById('btn-recompile').addEventListener('click',async()=>{
    if(playing)stopPlayback();
    toast('RECOMPILING…');
    await new Promise(r=>setTimeout(r,50));
    const result=compile(rawBflix);
    frames=result.frames;chapterStarts=result.chapterStarts||[];
    curFrame=0;renderFrame();
    toast(frames.length+' FRAMES — READY');
});

// ── FPS (for export only now) ──
function adjustFPS(d){BASE_FPS=Math.max(1,Math.min(30,BASE_FPS+d));document.getElementById('st-fps').textContent=BASE_FPS;}

// ── EXPORT WITH AUDIO ──
async function exportVideo(){
    if(!frames.length){toast('NO FRAMES');return;}
    if(playing)stopPlayback();
    toast('EXPORTING…');
    const st=document.getElementById('st-status');
    st.textContent='EXPORTING…';st.style.color='#e60000';

    const expCtx=new AudioContext();
    const dest=expCtx.createMediaStreamDestination();

    // Decode audio buffers in export context
    const expAudio=[];
    for(let i=1;i<=10;i++){
        try{
            const r=await fetch('audio/ch'+String(i).padStart(2,'0')+'.m4a');
            expAudio.push(await expCtx.decodeAudioData(await r.arrayBuffer()));
        }catch(e){expAudio.push(null);}
    }

    const vidStream=cvs.captureStream(0);
    const combined=new MediaStream([...vidStream.getVideoTracks(),...dest.stream.getAudioTracks()]);
    const chunks=[];
    const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm';
    const rec=new MediaRecorder(combined,{mimeType:mime,videoBitsPerSecond:2000000});
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
    const done=new Promise(r=>{rec.onstop=r;});
    rec.start();

    // Play chapters sequentially into the recording
    for(let ci=0;ci<chapterStarts.length;ci++){
        const sf=chapterStarts[ci]||0;
        const ef=(ci<chapterStarts.length-1)?chapterStarts[ci+1]:frames.length;
        const nf=ef-sf;if(nf<=0)continue;

        const ab=expAudio[ci];
        const aDur=ab?ab.duration:0;
        const vDur=nf/BASE_FPS;
        const chDur=Math.max(aDur,vDur);
        const interval=chDur/nf;

        // Start this chapter's audio
        if(ab){const s=expCtx.createBufferSource();s.buffer=ab;s.connect(dest);s.start();}

        // Render frames for this chapter
        for(let fi=0;fi<nf;fi++){
            curFrame=sf+fi;renderFrame();
            if(vidStream.getVideoTracks()[0].requestFrame)vidStream.getVideoTracks()[0].requestFrame();
            await new Promise(r=>setTimeout(r,interval*1000));
        }
        st.textContent='EXPORT CH '+(ci+1)+'/'+chapterStarts.length;
    }

    rec.stop();await done;expCtx.close();
    const blob=new Blob(chunks,{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='pflix-film.mp4';a.click();
    URL.revokeObjectURL(url);
    toast('EXPORTED · '+(blob.size/1048576).toFixed(1)+'MB');
    st.textContent=frames.length+' FRAMES';st.style.color='#999';
    curFrame=0;renderFrame();
}

// ── BOOT ──
loadAndCompile();
</script>
</body>
</html>
