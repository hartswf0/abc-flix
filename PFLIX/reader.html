<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>PFLIX · Program Theory Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--ink:#000000;--paper:#f8f8f8;--line:#e0e0e0;--mute:#999;--act:#c8a800;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;font-size:16px;line-height:1.75;-webkit-text-size-adjust:100%}

/* STRIP NAV */
nav{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:2px solid var(--ink);padding:8px 16px;display:flex;align-items:center;gap:12px}
.nav-brand{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.12em;color:var(--ink);text-decoration:none;flex-shrink:0}
.nav-strip{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;flex:1}
.nav-strip::-webkit-scrollbar{display:none}
.nav-tab{flex-shrink:0;padding:6px 12px;font-family:'Bebas Neue',sans-serif;font-size:13px;letter-spacing:.08em;color:var(--mute);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.nav-tab:active,.nav-tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.nav-film{flex-shrink:0;padding:6px 12px;font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--bg);background:var(--ink);border:none;cursor:pointer;text-transform:uppercase}

/* CONTENT */
main{max-width:680px;margin:0 auto;padding:24px 16px calc(40px + var(--safe))}

/* INDEX */
#index .idx-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,12vw,72px);letter-spacing:.06em;line-height:.9;color:var(--ink);margin-bottom:2px}
#index .idx-sub{font-family:'Space Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);margin-bottom:32px}
.idx-row{display:block;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer}
.idx-row:first-child{border-top:1px solid var(--line)}
.idx-row:active{background:var(--paper)}
.idx-num{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.06em;line-height:1;color:var(--ink)}
.idx-name{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:900;letter-spacing:.02em;margin-top:2px}
.idx-desc{font-size:12px;color:var(--mute);margin-top:2px;line-height:1.4}
.idx-bflix{display:inline-block;margin-top:4px;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);border:1px solid var(--line);padding:2px 6px}
#index.off{display:none}

/* ARTICLE */
article{display:none}
article.on{display:block}
.art-header{margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.art-num{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.2em;color:var(--mute)}
.art-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,7vw,48px);letter-spacing:.03em;line-height:1;color:var(--ink)}
.art-content h1{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.04em;color:var(--ink);margin:36px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.art-content h2{font-family:'Bebas Neue',sans-serif;font-size:19px;color:var(--ink);margin:28px 0 10px;letter-spacing:.04em}
.art-content h3{font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin:20px 0 8px}
.art-content p{margin:12px 0}
.art-content blockquote{margin:16px 0;padding:12px 16px;border-left:3px solid var(--ink);background:var(--paper);font-weight:700;font-size:14px;line-height:1.6}
.art-content pre{margin:14px 0;padding:14px;background:var(--ink);overflow-x:auto;font-family:'Space Mono',monospace;font-size:11px;line-height:1.6;color:#fff;-webkit-user-select:text;user-select:text}
.art-content code{font-family:'Space Mono',monospace;font-size:12px;background:var(--paper);padding:2px 4px;border:1px solid var(--line)}
.art-content pre code{background:none;border:none;padding:0;color:#fff}
.art-content strong{font-weight:900}
.art-content em{font-style:italic}
.art-content hr{border:none;border-top:1px solid var(--line);margin:28px 0}
.art-content ul,.art-content ol{padding-left:20px;margin:10px 0}
.art-content li{margin:4px 0}
.art-content table{width:100%;border-collapse:collapse;margin:14px 0;font-size:12px}
.art-content th{background:var(--ink);color:var(--bg);padding:6px 10px;text-align:left;font-weight:900;text-transform:uppercase;font-size:10px;letter-spacing:.1em}
.art-content td{padding:6px 10px;border:1px solid var(--line)}

/* BACK LINK */
.art-back{display:inline-block;margin-top:32px;padding:10px 0;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:.15em;color:var(--mute);text-decoration:none;border-bottom:1px solid var(--line);cursor:pointer}
.art-back:active{color:var(--ink)}
</style>
</head>
<body>
<nav>
<a class="nav-brand" href="#" onclick="go(-1);return false">PFLIX</a>
<div class="nav-strip" id="strip"></div>
<button class="nav-film" onclick="copyFilms()">FILMS.MD</button>
</nav>
<main>
<div id="index">
<div class="idx-title">PFLIX</div>
<div class="idx-sub">Program Theory Reader · 10 Nodes</div>
<div id="cards"></div>
</div>
</main>
<script>
const T=[
{id:'PT-01',f:'PT-01_video-codec-engineering.md',b:'01.md',t:'Video Codec Engineering',d:'Controlled perceptual destruction under constraint.'},
{id:'PT-02',f:'PT-02_flexcompute-hackathon.md',b:'02.md',t:'Flexcompute Hackathon',d:'Training-and-conversion system for photonic chip design.'},
{id:'PT-03',f:'PT-03_unified-signal-platforms.md',b:'03.md',t:'Unified Signal Platforms',d:'Both codec and photonic design are signal governance.'},
{id:'PT-04',f:'PT-04_photonic-codec-hackathon.md',b:'04.md',t:'Photonic Codec Hackathon',d:'A photonic transform primitive for codec preprocessing.'},
{id:'PT-05',f:'PT-05_beflix-photoncodec.md',b:'05.md',t:'BEFLIX PhotonCodec',d:'Historical animation meets photonic compression.'},
{id:'PT-06',f:'PT-06_beflix-sanity-check.md',b:'06.md',t:'BEFLIX Sanity Check',d:'Stripping overclaims. Finding the defensible kernel.'},
{id:'PT-07',f:'PT-07_first-principles-optical-precoder.md',b:'07.md',t:'First Principles Optical Pre-Codec',d:'Ground-zero rebuild from light to measurement.'},
{id:'PT-08',f:'PT-08_final-prompted-optical-precoder.md',b:'08.md',t:'Final Prompted Optical Pre-Codec',d:'The definitive condensed version.'},
{id:'PT-09',f:'PT-09_pflix-photonic-flicks.md',b:'09.md',t:'PFLIX Photonic Flicks',d:'From codec accelerator to photonic programming language.'},
{id:'PT-10',f:'PT-10_pflix-world-model.md',b:'10.md',t:'PFLIX World Model',d:'Schmidhuber synthesis: compression is understanding.'}
];
let cur=-1,cache={};
const main=document.querySelector('main');
function buildStrip(){
document.getElementById('strip').innerHTML=T.map((t,i)=>`<button class="nav-tab" data-i="${i}" onclick="go(${i})">${t.id.replace('PT-','')}</button>`).join('');
}
function buildCards(){
document.getElementById('cards').innerHTML=T.map((t,i)=>`<a class="idx-row" href="#" onclick="go(${i});return false">
<div class="idx-num">${t.id}</div>
<div class="idx-name">${t.t}</div>
<div class="idx-desc">${t.d}</div>
<div class="idx-bflix">BFLIX · ${t.b}</div>
</a>`).join('');
}
function renderMD(md){
let h=md
.replace(/^### (.+)$/gm,'<h3>$1</h3>')
.replace(/^## (.+)$/gm,'<h2>$1</h2>')
.replace(/^# (.+)$/gm,'<h1>$1</h1>')
.replace(/^---$/gm,'<hr>')
.replace(/^> \*\*(.+?)\*\*$/gm,'<blockquote><strong>$1</strong></blockquote>')
.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>')
.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
.replace(/\*(.+?)\*/g,'<em>$1</em>')
.replace(/`([^`\n]+)`/g,'<code>$1</code>');
h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(m,lang,code)=>
'<pre><code>'+code.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</code></pre>');
h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
h=h.replace(/(<li>[\s\S]*?<\/li>(\s*\n)?)+/g,m=>'<ul>'+m+'</ul>');
h=h.replace(/\n{2,}/g,'\n<p>\n');
h=h.replace(/<\/blockquote>\s*<blockquote>/g,'<br>');
return h;
}
async function go(i){
document.querySelectorAll('article').forEach(a=>a.remove());
document.querySelectorAll('.nav-tab').forEach(p=>p.classList.remove('on'));
if(i<0){cur=-1;document.getElementById('index').classList.remove('off');window.scrollTo(0,0);return}
cur=i;
document.getElementById('index').classList.add('off');
document.querySelectorAll(`.nav-tab[data-i="${i}"]`).forEach(p=>p.classList.add('on'));
const t=T[i];
if(!cache[t.f]){try{const r=await fetch(t.f);cache[t.f]=await r.text()}catch(e){cache[t.f]='# Error\nCould not load '+t.f}}
const art=document.createElement('article');
art.className='on';
art.innerHTML=`<div class="art-header"><div class="art-num">${t.id}</div><div class="art-title">${t.t}</div></div>
<div class="art-content">${renderMD(cache[t.f])}</div>
<a class="art-back" href="#" onclick="go(-1);return false">← ALL THEORIES</a>`;
main.appendChild(art);
window.scrollTo(0,0);
}
async function copyFilms(){
try{const r=await fetch('films.md');const t=await r.text();await navigator.clipboard.writeText(t);
document.querySelector('.nav-film').textContent='COPIED!';setTimeout(()=>document.querySelector('.nav-film').textContent='FILMS.MD',1500)}
catch(e){window.open('films.md','_blank')}
}
buildStrip();buildCards();
if(location.hash){const m=location.hash.match(/(\d+)/);if(m){const i=parseInt(m[1])-1;if(i>=0&&i<T.length)go(i)}}
</script>
</body>
</html>
