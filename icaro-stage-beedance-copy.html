<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BeeDance — Chat-First Story Studio</title>
    <style>
        :root {
            --bg: #070707;
            --panel: #111316;
            --panel2: #171a1f;
            --ink: #f7f7f2;
            --muted: #a7adb6;
            --line: #2a2f37;
            --line2: #3a424d;
            --accent: #7c5cff;
            --good: #3ddc84;
            --warn: #f4c430;
            --bad: #ff6464;
            --blue: #4c8dff;
            --bee: #ffcc3d;
            --shadow: 0 18px 50px rgba(0, 0, 0, .45);
            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
            --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --radius: 18px;
        }

        [data-theme="light"] {
            --bg: #f8f8f5;
            --panel: #ffffff;
            --panel2: #f0f1f2;
            --ink: #080808;
            --muted: #5a6068;
            --line: #d5d7dc;
            --line2: #b8bdc6;
            --shadow: 0 14px 40px rgba(0, 0, 0, .10);
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--sans);
            overflow: hidden
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        .app {
            height: 100dvh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            background:
                radial-gradient(circle at 18% 10%, rgba(124, 92, 255, .16), transparent 30%),
                radial-gradient(circle at 92% 20%, rgba(255, 204, 61, .10), transparent 26%),
                var(--bg);
        }

        .topbar {
            height: 58px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 8px 14px;
            border-bottom: 1px solid var(--line);
            background: rgba(7, 7, 7, .78);
            backdrop-filter: blur(12px);
            z-index: 20
        }

        [data-theme="light"] .topbar {
            background: rgba(248, 248, 245, .85)
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-width: 0
        }

        .brand h1 {
            margin: 0;
            font: 900 18px/1 var(--mono);
            letter-spacing: .02em;
            text-transform: uppercase;
            white-space: nowrap
        }

        .brand span {
            font: 700 10px/1.1 var(--mono);
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: .08em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .status-pill {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 7px 10px;
            background: var(--panel);
            font: 700 11px/1 var(--mono);
            color: var(--muted);
            white-space: nowrap
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--bad);
            box-shadow: 0 0 12px currentColor;
            color: var(--bad)
        }

        .dot.ready {
            background: var(--good);
            color: var(--good)
        }

        .dot.busy {
            background: var(--warn);
            color: var(--warn)
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 12px;
            display: grid;
            place-items: center;
            color: var(--ink)
        }

        .icon-btn:hover,
        .primary:hover,
        .secondary:hover {
            border-color: var(--line2);
            filter: brightness(1.08)
        }

        .shell {
            height: 100%;
            min-height: 0;
            display: grid;
            grid-template-columns: 330px minmax(0, 1fr) 300px;
            gap: 10px;
            padding: 10px;
            overflow: hidden
        }

        .panel {
            background: color-mix(in srgb, var(--panel) 94%, transparent);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            min-height: 0;
            overflow: hidden
        }

        .left,
        .right,
        .main {
            display: flex;
            flex-direction: column;
            min-height: 0
        }

        .rail-title {
            padding: 14px 14px 10px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px
        }

        .rail-title strong {
            font: 900 12px/1 var(--mono);
            text-transform: uppercase;
            letter-spacing: .07em
        }

        .rail-title small {
            font: 700 10px/1 var(--mono);
            color: var(--muted);
            text-transform: uppercase
        }

        .chat-log {
            flex: 1;
            overflow: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: thin
        }

        .msg {
            display: grid;
            grid-template-columns: 28px 1fr;
            gap: 9px;
            align-items: start
        }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font: 900 11px/1 var(--mono);
            background: var(--ink);
            color: var(--bg);
            flex: none
        }

        .msg.user .avatar {
            background: var(--accent);
            color: #fff
        }

        .bubble {
            border: 1px solid var(--line);
            background: var(--panel2);
            border-radius: 14px;
            padding: 10px 11px;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.43;
            color: var(--ink)
        }

        .msg.user .bubble {
            background: color-mix(in srgb, var(--accent) 18%, var(--panel2));
            border-color: color-mix(in srgb, var(--accent) 55%, var(--line))
        }

        .meta {
            margin-top: 5px;
            color: var(--muted);
            font: 700 10px/1 var(--mono);
            text-transform: uppercase;
            letter-spacing: .04em
        }

        .composer {
            border-top: 1px solid var(--line);
            padding: 10px;
            background: color-mix(in srgb, var(--panel) 94%, transparent)
        }

        .composer-row {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 8px;
            align-items: end
        }

        .composer textarea {
            height: 46px;
            max-height: 120px;
            resize: none;
            border: 1px solid var(--line);
            background: var(--bg);
            border-radius: 14px;
            padding: 12px;
            color: var(--ink);
            outline: none;
            font-size: 13px;
            line-height: 1.25
        }

        .composer textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 92, 255, .16)
        }

        .send {
            width: 46px;
            height: 46px;
            border: none;
            border-radius: 14px;
            background: var(--accent);
            color: #fff;
            font-weight: 900;
            display: grid;
            place-items: center
        }

        .tiny {
            font: 800 10px/1 var(--mono);
            text-transform: uppercase;
            color: var(--muted);
            letter-spacing: .05em
        }

        .main-head {
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            min-height: 54px;
            overflow: auto;
            scrollbar-width: none
        }

        .tab {
            border: 1px solid transparent;
            background: transparent;
            color: var(--muted);
            border-radius: 12px;
            padding: 9px 10px;
            font: 900 11px/1 var(--mono);
            text-transform: uppercase;
            letter-spacing: .04em;
            white-space: nowrap
        }

        .tab.active {
            background: var(--ink);
            color: var(--bg);
            border-color: var(--ink)
        }

        .surface {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 14px;
            scrollbar-width: thin
        }

        .grid {
            display: grid;
            gap: 12px
        }

        .grid.two {
            grid-template-columns: repeat(2, minmax(0, 1fr))
        }

        .grid.three {
            grid-template-columns: repeat(3, minmax(0, 1fr))
        }

        .card {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 16px;
            padding: 13px;
            overflow: hidden
        }

        .card h2,
        .card h3,
        .card h4 {
            margin: 0 0 8px;
            font-family: var(--mono);
            text-transform: uppercase;
            letter-spacing: .04em
        }

        .card h2 {
            font-size: 18px
        }

        .card h3 {
            font-size: 13px
        }

        .card h4 {
            font-size: 11px;
            color: var(--muted)
        }

        .card p {
            margin: 0 0 8px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.45
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px
        }

        .kpi {
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 10px;
            background: var(--panel2)
        }

        .kpi b {
            display: block;
            font: 900 20px/1 var(--mono)
        }

        .kpi span {
            display: block;
            margin-top: 5px;
            font: 800 9px/1.1 var(--mono);
            text-transform: uppercase;
            color: var(--muted)
        }

        .empty {
            height: 100%;
            min-height: 420px;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 28px
        }

        .empty svg {
            width: 84px;
            height: 84px;
            margin-bottom: 18px;
            color: var(--muted)
        }

        .empty h2 {
            font: 900 26px/1.05 var(--mono);
            text-transform: uppercase;
            margin: 0 0 8px
        }

        .empty p {
            max-width: 440px;
            margin: 0 auto 18px;
            color: var(--muted);
            line-height: 1.5
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center
        }

        .chip {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 999px;
            padding: 8px 10px;
            font-size: 12px;
            color: var(--ink)
        }

        .script {
            font-family: var(--mono);
            line-height: 1.55;
            font-size: 13px;
            white-space: pre-wrap;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 18px;
            min-height: 360px
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .row {
            border: 1px solid var(--line);
            background: var(--panel2);
            border-radius: 14px;
            padding: 10px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 10px;
            align-items: center
        }

        .row.selected {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124, 92, 255, .14)
        }

        .row-num {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: var(--ink);
            color: var(--bg);
            display: grid;
            place-items: center;
            font: 900 11px/1 var(--mono)
        }

        .row-main b {
            display: block;
            font: 900 12px/1.2 var(--mono);
            text-transform: uppercase
        }

        .row-main span {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35
        }

        .tag {
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 5px 7px;
            font: 800 9px/1 var(--mono);
            text-transform: uppercase;
            color: var(--muted);
            background: var(--panel)
        }

        .board {
            position: relative;
            min-height: 500px;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 44px 44px;
            overflow: hidden;
            padding: 20px
        }

        .node {
            position: absolute;
            width: 150px;
            min-height: 62px;
            border: 2px solid var(--ink);
            border-radius: 14px;
            background: var(--panel);
            display: grid;
            place-items: center;
            text-align: center;
            padding: 8px;
            font: 900 11px/1.2 var(--mono);
            text-transform: uppercase;
            box-shadow: var(--shadow);
            cursor: pointer
        }

        .node.selected {
            background: var(--accent);
            color: #fff;
            border-color: #fff
        }

        .edge {
            position: absolute;
            height: 2px;
            background: var(--ink);
            transform-origin: left center;
            opacity: .72
        }

        .edge:after {
            content: "";
            position: absolute;
            right: -1px;
            top: -4px;
            border-left: 8px solid var(--ink);
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent
        }

        .diagram-wrap {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 240px;
            gap: 12px;
            align-items: start
        }

        .diagram {
            position: relative;
            aspect-ratio: 16/10;
            border: 2px solid var(--line2);
            border-radius: 16px;
            background: #f7f7f2;
            color: #080808;
            overflow: hidden;
            min-height: 330px
        }

        [data-theme="light"] .diagram {
            background: #fff
        }

        .train-outline {
            position: absolute;
            inset: 8% 5%;
            border: 3px solid #111;
            border-radius: 28px;
            background: linear-gradient(90deg, rgba(0, 0, 0, .04) 0 49%, rgba(0, 0, 0, .08) 50% 51%, rgba(0, 0, 0, .04) 52%)
        }

        .seat {
            position: absolute;
            width: 9%;
            height: 12%;
            border: 2px solid #111;
            border-radius: 7px;
            background: #fff
        }

        .person {
            position: absolute;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #111;
            color: #fff;
            display: grid;
            place-items: center;
            font: 900 9px/1 var(--mono);
            transform: translate(-50%, -50%)
        }

        .person.boy {
            background: #6b54ff
        }

        .person.conductor {
            background: #111
        }

        .person.maya {
            background: #0a7a3f
        }

        .person.walter {
            background: #704214
        }

        .cam {
            position: absolute;
            transform: translate(-50%, -50%);
            color: #135dff;
            font: 900 10px/1 var(--mono);
            text-align: center
        }

        .cam:before {
            content: "📹";
            display: block;
            font-size: 22px
        }

        .bee {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #c48800;
            box-shadow: 0 0 0 1px #111;
            transform: translate(-50%, -50%)
        }

        .path {
            position: absolute;
            inset: 0;
            pointer-events: none
        }

        .path svg {
            width: 100%;
            height: 100%
        }

        .inspector {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--panel);
            padding: 12px;
            min-height: 320px
        }

        .field {
            display: grid;
            gap: 5px;
            margin-bottom: 10px
        }

        .field label {
            font: 900 10px/1 var(--mono);
            text-transform: uppercase;
            color: var(--muted)
        }

        .field input,
        .field select {
            border: 1px solid var(--line);
            background: var(--bg);
            border-radius: 10px;
            padding: 10px;
            outline: none
        }

        .field input:focus,
        .field select:focus {
            border-color: var(--accent)
        }

        .shot-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            font-size: 12px
        }

        .shot-table th {
            text-align: left;
            color: var(--muted);
            font: 900 10px/1 var(--mono);
            text-transform: uppercase;
            padding: 0 8px
        }

        .shot-table td {
            background: var(--panel2);
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            padding: 10px 8px
        }

        .shot-table td:first-child {
            border-left: 1px solid var(--line);
            border-radius: 12px 0 0 12px
        }

        .shot-table td:last-child {
            border-right: 1px solid var(--line);
            border-radius: 0 12px 12px 0
        }

        .timeline {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--panel);
            padding: 14px;
            overflow: auto
        }

        .tl-row {
            display: grid;
            grid-template-columns: 90px minmax(620px, 1fr);
            gap: 10px;
            align-items: center;
            margin: 10px 0
        }

        .tl-label {
            font: 900 11px/1 var(--mono);
            text-transform: uppercase
        }

        .tl-track {
            height: 34px;
            border: 1px solid var(--line);
            border-radius: 10px;
            position: relative;
            background: var(--bg)
        }

        .tl-block {
            position: absolute;
            top: 5px;
            height: 22px;
            border-radius: 7px;
            background: color-mix(in srgb, var(--accent) 65%, #fff);
            color: #fff;
            font: 900 9px/22px var(--mono);
            text-align: center;
            overflow: hidden;
            text-transform: uppercase;
            padding: 0 4px
        }

        .tl-block.good {
            background: color-mix(in srgb, var(--good) 60%, #111)
        }

        .tl-block.warn {
            background: color-mix(in srgb, var(--warn) 70%, #111);
            color: #111
        }

        .tl-block.blue {
            background: color-mix(in srgb, var(--blue) 70%, #111)
        }

        .wave {
            height: 42px;
            background: repeating-linear-gradient(90deg, transparent 0 8px, var(--line) 8px 9px), linear-gradient(180deg, transparent 40%, var(--muted) 42% 58%, transparent 60%);
            border-radius: 10px;
            border: 1px solid var(--line)
        }

        .story-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px
        }

        .frame {
            border: 1px solid var(--line);
            background: var(--panel);
            border-radius: 16px;
            overflow: hidden
        }

        .frame-art {
            aspect-ratio: 16/10;
            background: #f7f7f2;
            color: #111;
            display: grid;
            place-items: center;
            position: relative;
            border-bottom: 1px solid var(--line)
        }

        .frame-art svg {
            width: 100%;
            height: 100%
        }

        .frame-body {
            padding: 10px
        }

        .frame-body b {
            font: 900 11px/1.2 var(--mono);
            text-transform: uppercase
        }

        .frame-body p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35
        }

        .diagnostic {
            border: 1px solid var(--line);
            border-left-width: 5px;
            border-radius: 14px;
            padding: 12px;
            background: var(--panel2)
        }

        .diagnostic.warn {
            border-left-color: var(--warn)
        }

        .diagnostic.bad {
            border-left-color: var(--bad)
        }

        .diagnostic.good {
            border-left-color: var(--good)
        }

        .diagnostic b {
            display: block;
            font: 900 12px/1 var(--mono);
            text-transform: uppercase
        }

        .diagnostic p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 12px
        }

        .right-body {
            flex: 1;
            overflow: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .stack-item {
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 11px;
            background: var(--panel2);
            display: grid;
            grid-template-columns: 32px 1fr auto;
            gap: 10px;
            align-items: center
        }

        .stack-item .ico {
            font-size: 20px
        }

        .stack-item b {
            font: 900 11px/1.2 var(--mono);
            text-transform: uppercase
        }

        .stack-item span {
            font-size: 12px;
            color: var(--muted)
        }

        .primary,
        .secondary,
        .danger {
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 10px 12px;
            font: 900 11px/1 var(--mono);
            text-transform: uppercase;
            letter-spacing: .03em;
            background: var(--panel2);
            color: var(--ink)
        }

        .primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff
        }

        .danger {
            background: transparent;
            border-color: var(--bad);
            color: var(--bad)
        }

        .wide {
            width: 100%
        }

        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .settings {
            max-width: 820px;
            margin: auto
        }

        .notice {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--panel2);
            padding: 14px;
            color: var(--muted);
            line-height: 1.45
        }

        .notice strong {
            color: var(--ink)
        }

        .toast {
            position: fixed;
            right: 16px;
            bottom: 72px;
            z-index: 50;
            max-width: 360px;
            border: 1px solid var(--line);
            background: var(--panel);
            box-shadow: var(--shadow);
            border-radius: 16px;
            padding: 12px;
            display: none
        }

        .toast.show {
            display: block
        }

        .toast b {
            font: 900 11px/1 var(--mono);
            text-transform: uppercase
        }

        .toast p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.35
        }

        .bottomnav {
            display: none;
            border-top: 1px solid var(--line);
            background: color-mix(in srgb, var(--panel) 94%, transparent);
            padding: 6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
            z-index: 25
        }

        .navbtn {
            border: none;
            background: transparent;
            color: var(--muted);
            display: grid;
            gap: 4px;
            place-items: center;
            font: 800 9px/1 var(--mono);
            text-transform: uppercase
        }

        .navbtn.active {
            color: var(--accent)
        }

        .navbtn span {
            font-size: 18px
        }

        .mobile-chat-toggle {
            display: none
        }

        .hidden {
            display: none !important
        }

        @media (max-width: 1120px) {
            .shell {
                grid-template-columns: 300px minmax(0, 1fr)
            }

            .right {
                display: none
            }

            .diagram-wrap {
                grid-template-columns: 1fr
            }

            .inspector {
                min-height: auto
            }

            .grid.three {
                grid-template-columns: repeat(2, minmax(0, 1fr))
            }
        }

        @media (max-width: 760px) {
            body {
                overflow: hidden
            }

            .app {
                grid-template-rows: auto 1fr auto
            }

            .topbar {
                height: 54px;
                padding: 8px 10px
            }

            .brand span {
                display: none
            }

            .brand h1 {
                font-size: 15px
            }

            .status-pill {
                font-size: 9px;
                padding: 6px 8px
            }

            .icon-btn {
                width: 34px;
                height: 34px;
                border-radius: 10px
            }

            .shell {
                padding: 0;
                display: block;
                position: relative;
                height: 100%;
                overflow: hidden
            }

            .panel {
                border-radius: 0;
                border-left: none;
                border-right: none;
                box-shadow: none
            }

            .left {
                position: absolute;
                inset: 0;
                z-index: 10;
                transform: translateX(-100%);
                transition: .2s ease;
                background: var(--bg)
            }

            .left.open {
                transform: translateX(0)
            }

            .main {
                height: 100%;
                border-top: none;
                border-bottom: none
            }

            .right {
                display: none
            }

            .main-head {
                min-height: 46px;
                padding: 6px 8px
            }

            .tab {
                font-size: 10px;
                padding: 8px 9px
            }

            .surface {
                padding: 10px 10px 76px
            }

            .grid.two,
            .grid.three {
                grid-template-columns: 1fr
            }

            .kpis {
                grid-template-columns: repeat(2, 1fr)
            }

            .bottomnav {
                display: grid;
                grid-template-columns: repeat(5, 1fr)
            }

            .mobile-chat-toggle {
                display: grid
            }

            .empty {
                min-height: calc(100dvh - 160px)
            }

            .diagram {
                min-height: 270px
            }

            .person {
                width: 28px;
                height: 28px;
                font-size: 8px
            }

            .cam:before {
                font-size: 18px
            }

            .node {
                width: 120px;
                font-size: 9px
            }

            .board {
                min-height: 430px;
                padding: 10px
            }

            .story-grid {
                grid-template-columns: 1fr 1fr
            }

            .tl-row {
                grid-template-columns: 70px minmax(520px, 1fr)
            }

            .toast {
                left: 10px;
                right: 10px;
                bottom: 78px;
                max-width: none
            }
        }
    </style>
</head>

<body data-theme="dark">
    <div class="app">
        <header class="topbar">
            <button id="chatToggle" class="icon-btn mobile-chat-toggle" title="Chat">☰</button>
            <div class="brand">
                <h1>BeeDance</h1>
                <span>Chat-first builder — words assemble film</span>
            </div>
            <div class="status-pill" id="apiStatus"><i class="dot"></i><span>API not connected</span></div>
            <button id="themeBtn" class="icon-btn" title="Theme">◐</button>
            <button id="settingsBtn" class="icon-btn" title="Settings">⚙</button>
        </header>

        <main class="shell">
            <section class="panel left" id="leftPanel">
                <div class="rail-title"><strong>Chat Command</strong><small id="selectedLabel">No selection</small>
                </div>
                <div class="chat-log" id="chatLog"></div>
                <form class="composer" id="chatForm">
                    <div class="composer-row">
                        <button type="button" class="icon-btn" id="quickBtn" title="Quick prompts">＋</button>
                        <textarea id="chatInput"
                            placeholder="Ask anything. Describe what you want to make..."></textarea>
                        <button class="send" id="sendBtn" title="Send">➤</button>
                    </div>
                    <div class="tiny" id="composerHint" style="margin-top:7px">Real AI generation requires your API key.
                    </div>
                </form>
            </section>

            <section class="panel main">
                <div class="main-head" id="tabs"></div>
                <div class="surface" id="surface"></div>
            </section>

            <aside class="panel right">
                <div class="rail-title"><strong>Project Stack</strong><small id="stackCount">0 assets</small></div>
                <div class="right-body" id="stackBody"></div>
            </aside>
        </main>

        <nav class="bottomnav" id="bottomNav">
            <button class="navbtn" data-mobile="chat"><span>●</span>Chat</button>
            <button class="navbtn active" data-surface="overview"><span>⌂</span>Home</button>
            <button class="navbtn" data-surface="diagram"><span>⌁</span>Diagram</button>
            <button class="navbtn" data-surface="storyboard"><span>▧</span>Board</button>
            <button class="navbtn" data-surface="export"><span>⇧</span>Export</button>
        </nav>
    </div>

    <div class="toast" id="toast"><b></b>
        <p></p>
    </div>

    <script>
        const STORAGE_KEY = "beedance_v1_state";
        const API_KEY_STORAGE = "beedance_v1_api_key";

        const surfaces = [
            ["overview", "Overview"], ["script", "Script"], ["board", "Board"], ["diagram", "Diagram"],
            ["shots", "Shots"], ["timeline", "Timeline"], ["storyboard", "Storyboard"],
            ["diagnostics", "Diagnostics"], ["stack", "Stack"], ["export", "Export"], ["settings", "Settings"]
        ];

        const state = {
            api: {
                endpoint: "https://api.openai.com/v1/chat/completions",
                model: "gpt-4o-mini",
                key: "",
                remember: false,
                temperature: 0.72,
                strict: true,
                connected: false
            },
            ui: {
                surface: "overview",
                selected: null,
                busy: false,
                theme: "dark",
                mobileChatOpen: false
            },
            chat: [
                {
                    role: "assistant",
                    content: "Hi. I’m BeeDance. Tell me the film you want to make.\n\nI can generate scripts, boards, blocking, shots, timelines, storyboard prompts, diagnostics, and export packets.\n\nReal generation starts after you add your API key in Settings.",
                    time: nowTime()
                }
            ],
            project: null,
            history: []
        };

        function nowTime() { return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); }
        function uid(prefix = "id") { return `${prefix}_${Math.random().toString(36).slice(2, 9)}_${Date.now().toString(36)}`; }
        function esc(s = "") { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c])); }
        function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

        function load() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const saved = JSON.parse(raw);
                    Object.assign(state.api, saved.api || {});
                    Object.assign(state.ui, saved.ui || {});
                    state.chat = saved.chat || state.chat;
                    state.project = saved.project || null;
                    state.history = saved.history || [];
                }
                const rememberedKey = localStorage.getItem(API_KEY_STORAGE);
                if (rememberedKey) { state.api.key = rememberedKey; state.api.remember = true; }
            } catch (e) { console.warn(e) }
            document.body.dataset.theme = state.ui.theme || "dark";
        }

        function save() {
            const safe = JSON.parse(JSON.stringify(state));
            if (!state.api.remember) safe.api.key = "";
            localStorage.setItem(STORAGE_KEY, JSON.stringify(safe));
            if (state.api.remember && state.api.key) localStorage.setItem(API_KEY_STORAGE, state.api.key);
            if (!state.api.remember) localStorage.removeItem(API_KEY_STORAGE);
        }

        function toast(title, body = "") {
            const t = document.getElementById("toast");
            t.querySelector("b").textContent = title;
            t.querySelector("p").textContent = body;
            t.classList.add("show");
            clearTimeout(toast._t);
            toast._t = setTimeout(() => t.classList.remove("show"), 4200);
        }

        function pushChat(role, content) {
            state.chat.push({ role, content, time: nowTime() });
            save();
            renderChat();
            setTimeout(() => { const log = document.getElementById("chatLog"); log.scrollTop = log.scrollHeight; }, 0);
        }

        function setBusy(v, label = "Generating") {
            state.ui.busy = v;
            const btn = document.getElementById("sendBtn");
            if (btn) btn.textContent = v ? "…" : "➤";
            renderApiStatus(label);
        }

        function renderApiStatus(label) {
            const el = document.getElementById("apiStatus");
            const dot = el.querySelector(".dot");
            const span = el.querySelector("span");
            dot.className = "dot";
            if (state.ui.busy) { dot.classList.add("busy"); span.textContent = label || "Working"; return; }
            if (state.api.connected || state.api.key) { dot.classList.add("ready"); span.textContent = state.api.connected ? "API connected" : "API key present"; }
            else span.textContent = "API not connected";
        }

        function renderChat() {
            const log = document.getElementById("chatLog");
            log.innerHTML = state.chat.map(m => `
        <div class="msg ${m.role === "user" ? "user" : "assistant"}">
          <div class="avatar">${m.role === "user" ? "Y" : "B"}</div>
          <div>
            <div class="bubble">${esc(m.content)}</div>
            <div class="meta">${m.time || "now"}</div>
          </div>
        </div>
      `).join("");
            document.getElementById("composerHint").textContent = state.api.key ? "Chat changes the selected surface or whole project." : "Real AI generation requires your API key.";
            const sel = state.ui.selected;
            document.getElementById("selectedLabel").textContent = sel ? `${sel.type}: ${sel.label || sel.id}` : "No selection";
        }

        function renderTabs() {
            const tabs = document.getElementById("tabs");
            tabs.innerHTML = surfaces.map(([id, label]) => `<button class="tab ${state.ui.surface === id ? "active" : ""}" data-surface="${id}">${label}</button>`).join("");
        }

        function render() {
            renderApiStatus();
            renderTabs();
            renderChat();
            renderSurface();
            renderStack();
            updateBottomNav();
            save();
        }

        function emptyProjectHTML() {
            return `
        <div class="empty">
          <div>
            <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3">
              <path d="M24 26h52v34H58L45 74V60H24z"/>
              <circle cx="42" cy="43" r="3" fill="currentColor"/><circle cx="51" cy="43" r="3" fill="currentColor"/><circle cx="60" cy="43" r="3" fill="currentColor"/>
            </svg>
            <h2>Your movie is empty.</h2>
            <p>Tell BeeDance what you want to make. The app will ask the AI for structured actions that create script, board, diagram, shots, timeline, storyboard prompts, diagnostics, and exports.</p>
            <div class="chips">
              <button class="chip prompt-chip">make a movie about bees on a train</button>
              <button class="chip prompt-chip">write a weird opening scene</button>
              <button class="chip prompt-chip">make a storyboard</button>
              <button class="chip prompt-chip">check what is missing</button>
            </div>
          </div>
        </div>`;
        }

        function renderSurface() {
            const root = document.getElementById("surface");
            if (state.ui.surface === "settings") { root.innerHTML = settingsHTML(); bindSettings(); return; }
            if (!state.project) { root.innerHTML = emptyProjectHTML(); bindPromptChips(); return; }
            const p = state.project;
            const map = {
                overview: overviewHTML,
                script: scriptHTML,
                board: boardHTML,
                diagram: diagramHTML,
                shots: shotsHTML,
                timeline: timelineHTML,
                storyboard: storyboardHTML,
                diagnostics: diagnosticsHTML,
                stack: stackHTML,
                export: exportHTML
            };
            root.innerHTML = (map[state.ui.surface] || overviewHTML)(p);
            bindSurfaceActions();
        }

        function overviewHTML(p) {
            const scene = p.scenes?.[0];
            return `
        <div class="grid">
          <div class="card">
            <h2>${esc(p.title || "Untitled Project")}</h2>
            <p>${esc(p.logline || "No logline yet.")}</p>
            <div class="kpis">
              <div class="kpi"><b>${p.scenes?.length || 0}</b><span>Scenes</span></div>
              <div class="kpi"><b>${p.characters?.length || 0}</b><span>Characters</span></div>
              <div class="kpi"><b>${p.shots?.length || 0}</b><span>Shots</span></div>
              <div class="kpi"><b>${p.storyboard?.length || 0}</b><span>Frames</span></div>
            </div>
          </div>
          <div class="grid two">
            <div class="card"><h3>Current Scene</h3><p>${scene ? esc(scene.title + " — " + scene.summary) : "No scene yet."}</p><button class="secondary" data-surface-jump="script">Open Script</button></div>
            <div class="card"><h3>Primary Theme</h3><p>${esc(p.theme || "Not set.")}</p><button class="secondary" data-surface-jump="board">Open Board</button></div>
          </div>
          <div class="grid three">
            ${p.characters?.map(c => `<div class="card selectable" data-select-type="character" data-select-id="${c.id}" data-select-label="${esc(c.name)}"><h3>${esc(c.name)}</h3><p><b>${esc(c.role || "")}</b></p><p>${esc(c.description || "")}</p></div>`).join("") || ""}
          </div>
          <div class="card"><h3>Recent Changes</h3><div class="list">${(p.changeLog || []).slice(-6).reverse().map(x => `<div class="row"><div class="row-num">✓</div><div class="row-main"><b>${esc(x.title || "Change")}</b><span>${esc(x.body || "")}</span></div><span class="tag">${esc(x.time || "")}</span></div>`).join("") || `<p>No changes yet.</p>`}</div></div>
        </div>`;
        }

        function scriptHTML(p) {
            const sceneTabs = (p.scenes || []).map((s, i) => `<button class="chip selectable" data-select-type="scene" data-select-id="${s.id}" data-select-label="${esc(s.title)}">${i + 1}. ${esc(s.title)}</button>`).join("");
            const text = p.script || p.scenes?.map(s => s.script).filter(Boolean).join("\n\n") || "No script yet.";
            return `<div class="grid"><div class="card"><h3>Script Surface</h3><div class="chips" style="justify-content:flex-start">${sceneTabs}</div></div><div class="script">${esc(text)}</div></div>`;
        }

        function boardHTML(p) {
            const nodes = p.beats || [];
            if (!nodes.length) return `<div class="card"><h3>No causal board yet</h3><p>Ask BeeDance to create a story map.</p></div>`;
            const W = 720, H = 450;
            const positions = nodes.map((b, i) => {
                const cols = Math.min(4, Math.ceil(Math.sqrt(nodes.length)));
                const row = Math.floor(i / cols), col = i % cols;
                return { id: b.id, x: 40 + col * (W - 200) / (cols - 1 || 1), y: 35 + row * 120 };
            });
            const edges = [];
            for (let i = 0; i < positions.length - 1; i++) edges.push([positions[i], positions[i + 1]]);
            const edgeHTML = edges.map(([a, b]) => {
                const x1 = a.x + 150, y1 = a.y + 31, x2 = b.x, y2 = b.y + 31;
                const dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy), ang = Math.atan2(dy, dx) * 180 / Math.PI;
                return `<div class="edge" style="left:${x1}px;top:${y1}px;width:${len}px;transform:rotate(${ang}deg)"></div>`;
            }).join("");
            return `<div class="board" style="min-width:${W}px">${edgeHTML}${nodes.map((b, i) => { const pos = positions[i]; return `<div class="node selectable ${state.ui.selected?.id === b.id ? "selected" : ""}" style="left:${pos.x}px;top:${pos.y}px" data-select-type="beat" data-select-id="${b.id}" data-select-label="${esc(b.title)}">${i + 1}. ${esc(b.title)}</div>` }).join("")}</div>`;
        }

        function diagramHTML(p) {
            const d = p.blocking || defaultBlocking();
            const seats = [];
            for (let i = 0; i < 6; i++) seats.push(`<div class="seat" style="left:${12 + i * 13}%;top:18%"></div><div class="seat" style="left:${12 + i * 13}%;top:70%"></div>`);
            const people = (d.characters || []).map(ch => `<div class="person ${esc(ch.kind || "")} selectable" data-select-type="blocking-character" data-select-id="${esc(ch.id)}" data-select-label="${esc(ch.name)}" style="left:${ch.x}%;top:${ch.y}%">${esc((ch.name || "?").slice(0, 2).toUpperCase())}</div>`).join("");
            const cams = (d.cameras || []).map(c => `<div class="cam selectable" data-select-type="camera" data-select-id="${esc(c.id)}" data-select-label="${esc(c.label)}" style="left:${c.x}%;top:${c.y}%">${esc(c.label)}</div>`).join("");
            const bees = Array.from({ length: d.beeCount || 46 }, (_, i) => {
                const a = i * 2.399, r = 2 + (i % 19) * .7;
                const x = (d.beeCenter?.x || 52) + Math.cos(a) * r + ((i % 5) - 2) * .8;
                const y = (d.beeCenter?.y || 50) + Math.sin(a) * r * .65 + ((i % 7) - 3) * .5;
                return `<i class="bee" style="left:${clamp(x, 8, 92)}%;top:${clamp(y, 12, 88)}%"></i>`;
            }).join("");
            const path = `<div class="path"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M ${d.path?.[0]?.x || 18} ${d.path?.[0]?.y || 52} C 35 30, 48 72, 58 48 S 78 42, 86 34" fill="none" stroke="#149947" stroke-width="1.2" stroke-dasharray="4 3"/><path d="M86 34 l-4 1 l2 4" fill="none" stroke="#149947" stroke-width="1.2"/></svg></div>`;
            return `
        <div class="diagram-wrap">
          <div class="diagram">
            <div class="train-outline"></div>${seats.join("")}${path}${bees}${people}${cams}
          </div>
          <div class="inspector">
            <h3>Diagram Inspector</h3>
            <p class="tiny">Top-down blocking generated from project state.</p>
            <div class="field"><label>Scene</label><input value="${esc(p.scenes?.[0]?.title || "Scene")}" readonly></div>
            <div class="field"><label>Swarm Density</label><input value="${d.beeCount || 46} bees shown" readonly></div>
            <div class="field"><label>Selected</label><input value="${esc(state.ui.selected?.label || "None")}" readonly></div>
            <button class="primary wide prompt-action" data-prompt="regenerate the blocking diagram from the current script and make it clearer">Regenerate Blocking</button>
            <button class="secondary wide prompt-action" style="margin-top:8px" data-prompt="make the bee path more readable and update the camera positions">Clarify Paths</button>
          </div>
        </div>`;
        }

        function shotsHTML(p) {
            const shots = p.shots || [];
            return `<div class="card"><h3>Shot List</h3><table class="shot-table"><thead><tr><th>#</th><th>Shot</th><th>Camera</th><th>Type</th><th>Purpose</th><th>Time</th></tr></thead><tbody>${shots.map((s, i) => `<tr class="selectable" data-select-type="shot" data-select-id="${s.id}" data-select-label="${esc(s.title)}"><td>${String(i + 1).padStart(2, "0")}</td><td><b>${esc(s.title)}</b><br><span class="tiny">${esc(s.subject || "")}</span></td><td>${esc(s.camera || "")}</td><td>${esc(s.type || "")}</td><td>${esc(s.purpose || "")}</td><td>${esc(s.time || "")}</td></tr>`).join("")}</tbody></table>${shots.length ? "" : `<p>No shots yet. Ask BeeDance to generate a shot list.</p>`}</div>`;
        }

        function timelineHTML(p) {
            const rows = p.timeline?.tracks || [];
            return `<div class="timeline"><h3>Timeline / State Strip</h3>${rows.map((r, idx) => `<div class="tl-row"><div class="tl-label">${esc(r.label)}</div><div class="tl-track">${(r.blocks || []).map((b, j) => `<div class="tl-block ${["good", "warn", "blue", ""][j % 4]}" style="left:${b.start || 0}%;width:${b.width || 20}%">${esc(b.label)}</div>`).join("")}</div></div>`).join("")}<div class="tl-row"><div class="tl-label">Sound</div><div class="wave"></div></div>${rows.length ? "" : `<p>No timeline yet. Ask BeeDance to build the timeline.</p>`}</div>`;
        }

        function storyboardHTML(p) {
            const frames = p.storyboard || [];
            return `<div class="grid"><div class="card"><h3>Storyboard</h3><p>Frames can be actual generated images when your endpoint supports image generation, or production-ready prompts when it only supports chat.</p><button class="primary prompt-action" data-prompt="generate or regenerate the full storyboard prompts for every shot">Regenerate Storyboard</button></div><div class="story-grid">${frames.map((f, i) => `<div class="frame selectable" data-select-type="storyboard-frame" data-select-id="${f.id}" data-select-label="${esc(f.title)}"><div class="frame-art">${frameSVG(i, f)}</div><div class="frame-body"><b>${String(i + 1).padStart(2, "0")} ${esc(f.title)}</b><p>${esc(f.description || f.prompt || "")}</p></div></div>`).join("")}</div>${frames.length ? "" : `<div class="card"><p>No storyboard yet.</p></div>`}</div>`;
        }

        function frameSVG(i, f) {
            const mood = i % 4;
            return `<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
        <rect width="320" height="200" fill="#f7f7f2"/>
        <rect x="12" y="24" width="296" height="130" rx="18" fill="none" stroke="#111" stroke-width="4"/>
        <line x1="28" y1="70" x2="292" y2="70" stroke="#111" stroke-width="2" opacity=".35"/>
        <line x1="28" y1="126" x2="292" y2="126" stroke="#111" stroke-width="2" opacity=".35"/>
        ${Array.from({ length: mood === 2 ? 34 : 18 }, (_, k) => `<circle cx="${130 + Math.cos(k * 2.1) * (20 + k % 10 * 3)}" cy="${86 + Math.sin(k * 1.7) * (10 + k % 8 * 2)}" r="3" fill="#c48800" stroke="#111"/>`).join("")}
        <circle cx="${60 + mood * 12}" cy="120" r="15" fill="#111"/><rect x="${48 + mood * 12}" y="136" width="24" height="28" fill="#111"/>
        <circle cx="238" cy="118" r="15" fill="#111"/><rect x="226" y="134" width="24" height="28" fill="#111"/>
        <path d="M40 172 C90 150, 150 186, 210 164 S280 160,300 145" fill="none" stroke="#111" stroke-width="3"/>
        <text x="16" y="18" font-family="monospace" font-size="11" font-weight="900" fill="#111">${esc(f.camera || "CAM")} · ${esc(f.type || "SHOT")}</text>
      </svg>`;
        }

        function diagnosticsHTML(p) {
            const ds = p.diagnostics || [];
            return `<div class="grid"><div class="card"><h3>Diagnostics</h3><p>Ask in plain language: “fix whatever doesn't make sense.”</p><button class="primary prompt-action" data-prompt="run a full story diagnostic and repair anything that does not make sense while preserving the current project">Fix Whatever Doesn't Make Sense</button></div><div class="list">${ds.map(d => `<div class="diagnostic ${esc(d.severity || "warn")}"><b>${esc(d.title)}</b><p>${esc(d.description)}</p><p class="tiny">Affects: ${esc((d.affects || []).join(", "))}</p></div>`).join("") || `<div class="diagnostic good"><b>No diagnostics yet</b><p>Ask BeeDance to check the story.</p></div>`}</div></div>`;
        }

        function stackHTML(p) {
            return `<div class="grid three">${stackItems(p).map(item => `<div class="stack-item"><div class="ico">${item.ico}</div><div><b>${esc(item.title)}</b><br><span>${esc(item.body)}</span></div><span class="tag">${item.count}</span></div>`).join("")}</div>`;
        }

        function exportHTML(p) {
            const ready = Boolean(p.script && p.shots?.length && (p.storyboard?.length || p.storyboardPrompts?.length));
            return `<div class="grid">
        <div class="card"><h2>${ready ? "Production Packet Ready" : "Export Checklist"}</h2><p>${ready ? "Everything needed for a first packet exists." : "Some outputs are missing. You can still export project JSON, or ask BeeDance to finish the missing assets."}</p></div>
        <div class="grid two">
          <button class="primary export-btn" data-export="json">Download Project JSON</button>
          <button class="secondary export-btn" data-export="script">Download Script HTML</button>
          <button class="secondary export-btn" data-export="shots">Download Shot List CSV</button>
          <button class="secondary export-btn" data-export="storyboard">Download Storyboard HTML</button>
        </div>
        <div class="card"><h3>Deliverables</h3><div class="list">
          <div class="row"><div class="row-num">${p.script ? "✓" : "!"}</div><div class="row-main"><b>Script</b><span>${p.script ? "Generated" : "Missing"}</span></div></div>
          <div class="row"><div class="row-num">${p.shots?.length ? "✓" : "!"}</div><div class="row-main"><b>Shot List</b><span>${p.shots?.length || 0} shots</span></div></div>
          <div class="row"><div class="row-num">${p.storyboard?.length ? "✓" : "!"}</div><div class="row-main"><b>Storyboard</b><span>${p.storyboard?.length || 0} frames/prompts</span></div></div>
          <div class="row"><div class="row-num">✓</div><div class="row-main"><b>Scene Data</b><span>JSON state export available</span></div></div>
        </div></div>
      </div>`;
        }

        function settingsHTML() {
            return `<div class="settings grid">
        <div class="notice"><strong>Real AI mode.</strong> BeeDance does not fake generation. Add an OpenAI-compatible chat/completions endpoint and API key. Your key is used directly from this browser. For production, put a server proxy in front of this.</div>
        <div class="card">
          <h2>AI Settings</h2>
          <div class="field"><label>Endpoint</label><input id="apiEndpoint" value="${esc(state.api.endpoint)}" placeholder="https://api.openai.com/v1/chat/completions"></div>
          <div class="field"><label>Model</label><input id="apiModel" value="${esc(state.api.model)}" placeholder="gpt-4o-mini"></div>
          <div class="field"><label>API Key</label><input id="apiKey" type="password" value="${esc(state.api.key)}" placeholder="sk-..."></div>
          <div class="field"><label>Temperature</label><input id="apiTemp" type="number" min="0" max="2" step="0.05" value="${esc(state.api.temperature)}"></div>
          <label style="display:flex;gap:9px;align-items:center;margin:8px 0 14px"><input id="rememberKey" type="checkbox" ${state.api.remember ? "checked" : ""}> <span>Remember key on this device</span></label>
          <div class="btn-row"><button class="primary" id="saveSettings">Save Settings</button><button class="secondary" id="testApi">Test Connection</button><button class="danger" id="clearKey">Clear Key</button></div>
        </div>
        <div class="card"><h3>Required model behavior</h3><p>The model must return JSON with an assistant_message and an actions array. BeeDance applies the actions to the project state and then renders all surfaces from that state.</p></div>
      </div>`;
        }

        function renderStack() {
            const body = document.getElementById("stackBody");
            const items = state.project ? stackItems(state.project) : [];
            document.getElementById("stackCount").textContent = `${items.length} assets`;
            body.innerHTML = items.length ? items.map(item => `<div class="stack-item"><div class="ico">${item.ico}</div><div><b>${esc(item.title)}</b><br><span>${esc(item.body)}</span></div><span class="tag">${item.count}</span></div>`).join("") : `<div class="notice">No project stack yet. Start by typing a movie idea.</div>`;
        }

        function stackItems(p) {
            return [
                { ico: "🎬", title: "Project", body: p.title || "Untitled", count: "1" },
                { ico: "👥", title: "Characters", body: "Cast and lenses", count: p.characters?.length || 0 },
                { ico: "▤", title: "Scenes", body: "Script scenes", count: p.scenes?.length || 0 },
                { ico: "⌁", title: "Causal Board", body: "Beats and links", count: p.beats?.length || 0 },
                { ico: "🎥", title: "Shots", body: "Camera plan", count: p.shots?.length || 0 },
                { ico: "▧", title: "Storyboard", body: "Frames and prompts", count: p.storyboard?.length || 0 },
                { ico: "⚠", title: "Diagnostics", body: "Story checks", count: p.diagnostics?.length || 0 }
            ];
        }

        function bindPromptChips() {
            document.querySelectorAll(".prompt-chip").forEach(b => b.onclick = () => { document.getElementById("chatInput").value = b.textContent; document.getElementById("chatInput").focus(); });
        }

        function bindSurfaceActions() {
            document.querySelectorAll("[data-surface-jump]").forEach(b => b.onclick = () => { state.ui.surface = b.dataset.surfaceJump; render(); });
            document.querySelectorAll(".selectable").forEach(el => el.onclick = () => {
                state.ui.selected = { type: el.dataset.selectType, id: el.dataset.selectId, label: el.dataset.selectLabel };
                toast("Selected", `${state.ui.selected.type}: ${state.ui.selected.label}`);
                render();
            });
            document.querySelectorAll(".prompt-action").forEach(b => b.onclick = () => { document.getElementById("chatInput").value = b.dataset.prompt; document.getElementById("chatInput").focus(); openChatMobile(); });
            document.querySelectorAll(".export-btn").forEach(b => b.onclick = () => exportThing(b.dataset.export));
        }

        function bindSettings() {
            document.getElementById("saveSettings").onclick = saveSettings;
            document.getElementById("testApi").onclick = testApi;
            document.getElementById("clearKey").onclick = () => { state.api.key = ""; state.api.connected = false; localStorage.removeItem(API_KEY_STORAGE); save(); render(); toast("Key cleared", "Generation is blocked until a key is added."); };
        }

        function saveSettings() {
            state.api.endpoint = document.getElementById("apiEndpoint").value.trim();
            state.api.model = document.getElementById("apiModel").value.trim();
            state.api.key = document.getElementById("apiKey").value.trim();
            state.api.temperature = Number(document.getElementById("apiTemp").value || 0.7);
            state.api.remember = document.getElementById("rememberKey").checked;
            save(); render(); toast("Settings saved", state.api.key ? "API key present." : "No API key saved.");
        }

        async function testApi() {
            saveSettings();
            if (!requireApi()) return;
            setBusy(true, "Testing API");
            try {
                const res = await callChat([{ role: "system", content: "Return only this JSON: {\"assistant_message\":\"ok\",\"actions\":[]}" }, { role: "user", content: "test" }], .1);
                state.api.connected = true;
                toast("API connected", "The endpoint responded. BeeDance can generate real project actions.");
            } catch (e) {
                state.api.connected = false;
                toast("API test failed", e.message || String(e));
            } finally { setBusy(false); render(); }
        }

        function requireApi() {
            if (!state.api.endpoint || !state.api.model || !state.api.key) {
                state.ui.surface = "settings";
                render();
                toast("API required", "Add endpoint, model, and key before generating.");
                return false;
            }
            return true;
        }

        async function handleUserSubmit(text) {
            text = text.trim();
            if (!text || state.ui.busy) return;
            pushChat("user", text);
            if (!requireApi()) return;
            setBusy(true, "Asking AI");
            try {
                const packet = await askAIForActions(text);
                if (packet.assistant_message) pushChat("assistant", packet.assistant_message);
                applyActions(packet.actions || [], text);
                state.api.connected = true;
                render();
            } catch (e) {
                pushChat("assistant", `Generation failed. ${e.message || e}\n\nYour project state was preserved.`);
                toast("Generation failed", e.message || String(e));
            } finally {
                setBusy(false); render();
            }
        }

        function projectSummaryForPrompt() {
            if (!state.project) return "No project exists yet.";
            const p = state.project;
            return JSON.stringify({
                title: p.title, logline: p.logline, genre: p.genre, tone: p.tone, theme: p.theme,
                scenes: (p.scenes || []).map(s => ({ id: s.id, title: s.title, summary: s.summary })),
                characters: (p.characters || []).map(c => ({ id: c.id, name: c.name, role: c.role, description: c.description })),
                beats: (p.beats || []).map(b => ({ id: b.id, title: b.title, description: b.description })),
                shots: (p.shots || []).map(s => ({ id: s.id, title: s.title, type: s.type, purpose: s.purpose, time: s.time })),
                selected: state.ui.selected
            }, null, 2);
        }

        function systemPrompt() {
            return `You are BeeDance, a real AI action engine for a chat-first film builder. Words assemble film. The GUI only reveals, tunes, selects, and exports state.

CRITICAL OUTPUT RULE:
Return ONLY valid JSON. No markdown. No code fences. The JSON shape is:
{"assistant_message":"short helpful message to user","actions":[{"type":"action_name","payload":{}}]}

You are not a prose chatbot. You generate structured actions that mutate a project.

Supported actions:
- create_project: payload is a full project object.
- update_project: payload fields merge into project.
- add_change: payload {title, body}.
- set_surface: payload {surface}.
- replace_characters: payload {characters:[...]}
- replace_scenes: payload {scenes:[...]}
- replace_beats: payload {beats:[...]}
- replace_script: payload {script:"..."}
- replace_blocking: payload {blocking:{characters,cameras,beeCenter,beeCount,path}}
- replace_shots: payload {shots:[...]}
- replace_timeline: payload {timeline:{tracks:[...]}}
- replace_storyboard: payload {storyboard:[...]}
- replace_diagnostics: payload {diagnostics:[...]}

When creating a new project, generate a complete first pass: project, characters, scenes, beats, script, blocking, shots, timeline, storyboard prompts, diagnostics.

Every entity needs stable ids. Use lowercase ids like char_frank, scene_01, beat_01, shot_01, frame_01.

Project shape:
{
 title, logline, genre, tone:[...], theme, createdAt,
 characters:[{id,name,role,description,motivation,fear,dialogueStyle}],
 scenes:[{id,title,slugline,summary,script,beats:[beat ids]}],
 beats:[{id,title,description,purpose}],
 script,
 blocking:{characters:[{id,name,kind,x,y}], cameras:[{id,label,x,y}], beeCenter:{x,y}, beeCount:number, path:[{x,y}]},
 shots:[{id,title,camera,type,subject,purpose,time,beatId,description}],
 timeline:{tracks:[{label,blocks:[{label,start,width}]}]},
 storyboard:[{id,title,shotId,camera,type,description,prompt}],
 diagnostics:[{id,severity,title,description,affects:[...]}],
 changeLog:[]
}

For Bees on a Train, keep it funny, chaotic, cinematic, and filmable. Assume novice prompts. Make strong decisions. Keep scope small if the user refers to selected object. If user asks to export, set surface to export and add missing export readiness diagnostics if needed.`;
        }

        async function askAIForActions(userText) {
            const messages = [
                { role: "system", content: systemPrompt() },
                { role: "user", content: `Current project state summary:\n${projectSummaryForPrompt()}\n\nCurrent surface: ${state.ui.surface}\nSelected object: ${JSON.stringify(state.ui.selected)}\n\nUser request:\n${userText}` }
            ];
            const raw = await callChat(messages, state.api.temperature);
            return parseActionPacket(raw);
        }

        async function callChat(messages, temperature) {
            const res = await fetch(state.api.endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json", "Authorization": `Bearer ${state.api.key}` },
                body: JSON.stringify({ model: state.api.model, messages, temperature, response_format: { type: "json_object" } })
            });
            const text = await res.text();
            if (!res.ok) throw new Error(`HTTP ${res.status}: ${text.slice(0, 400)}`);
            let data;
            try { data = JSON.parse(text); } catch { throw new Error(`Endpoint returned non-JSON response: ${text.slice(0, 300)}`) }
            const content = data.choices?.[0]?.message?.content ?? data.output_text ?? data.content;
            if (!content) throw new Error("No assistant content returned by endpoint.");
            return content;
        }

        function parseActionPacket(raw) {
            let txt = String(raw).trim();
            txt = txt.replace(/^```json/i, "").replace(/^```/i, "").replace(/```$/i, "").trim();
            try {
                const packet = JSON.parse(txt);
                if (!packet || typeof packet !== "object") throw new Error("Packet is not an object.");
                if (!Array.isArray(packet.actions)) packet.actions = [];
                return packet;
            } catch (e) {
                throw new Error(`Model returned invalid action JSON. Raw: ${txt.slice(0, 500)}`);
            }
        }

        function applyActions(actions, sourcePrompt) {
            if (!Array.isArray(actions)) return;
            const before = JSON.stringify(state.project);
            for (const a of actions) {
                if (!a || !a.type) continue;
                const p = a.payload || {};
                switch (a.type) {
                    case "create_project": state.project = normalizeProject(p); break;
                    case "update_project": if (state.project) Object.assign(state.project, p); break;
                    case "replace_characters": ensureProject(); state.project.characters = p.characters || []; break;
                    case "replace_scenes": ensureProject(); state.project.scenes = p.scenes || []; break;
                    case "replace_beats": ensureProject(); state.project.beats = p.beats || []; break;
                    case "replace_script": ensureProject(); state.project.script = p.script || ""; break;
                    case "replace_blocking": ensureProject(); state.project.blocking = p.blocking || defaultBlocking(); break;
                    case "replace_shots": ensureProject(); state.project.shots = p.shots || []; break;
                    case "replace_timeline": ensureProject(); state.project.timeline = p.timeline || { tracks: [] }; break;
                    case "replace_storyboard": ensureProject(); state.project.storyboard = p.storyboard || []; break;
                    case "replace_diagnostics": ensureProject(); state.project.diagnostics = p.diagnostics || []; break;
                    case "add_change": addChange(p.title || "AI Change", p.body || "Updated project."); break;
                    case "set_surface": if (p.surface) state.ui.surface = p.surface; break;
                }
            }
            if (state.project) {
                state.project.updatedAt = new Date().toISOString();
                state.project.provenance = state.project.provenance || [];
                state.project.provenance.push({ id: uid("prov"), prompt: sourcePrompt, time: new Date().toISOString(), actions: actions.map(a => a.type) });
                addChange("Prompt applied", sourcePrompt);
                if (!state.project.blocking) state.project.blocking = defaultBlocking();
            }
            const after = JSON.stringify(state.project);
            if (before !== after) state.history.push({ time: new Date().toISOString(), sourcePrompt, actions });
        }

        function ensureProject() {
            if (!state.project) state.project = normalizeProject({ title: "Untitled Film", logline: "", genre: "", tone: [], createdAt: new Date().toISOString() });
        }

        function normalizeProject(p) {
            return {
                id: p.id || uid("project"),
                title: p.title || "Untitled Film",
                logline: p.logline || "",
                genre: p.genre || "",
                tone: p.tone || [],
                theme: p.theme || "",
                createdAt: p.createdAt || new Date().toISOString(),
                updatedAt: new Date().toISOString(),
                characters: p.characters || [],
                scenes: p.scenes || [],
                beats: p.beats || [],
                script: p.script || p.scenes?.map(s => s.script).filter(Boolean).join("\n\n") || "",
                blocking: p.blocking || defaultBlocking(),
                shots: p.shots || [],
                timeline: p.timeline || { tracks: [] },
                storyboard: p.storyboard || [],
                diagnostics: p.diagnostics || [],
                changeLog: p.changeLog || [],
                provenance: p.provenance || []
            };
        }

        function addChange(title, body) {
            if (!state.project) return;
            state.project.changeLog = state.project.changeLog || [];
            state.project.changeLog.push({ title, body, time: nowTime() });
            if (state.project.changeLog.length > 80) state.project.changeLog = state.project.changeLog.slice(-80);
        }

        function defaultBlocking() {
            return {
                characters: [
                    { id: "char_man", name: "Man", kind: "man", x: 20, y: 58 },
                    { id: "char_conductor", name: "Conductor", kind: "conductor", x: 78, y: 56 },
                    { id: "char_boy", name: "Boy", kind: "boy", x: 82, y: 24 }
                ],
                cameras: [{ id: "cam_a", label: "CAM A", x: 50, y: 8 }, { id: "cam_b", label: "CAM B", x: 50, y: 92 }],
                beeCenter: { x: 52, y: 48 }, beeCount: 42, path: [{ x: 18, y: 52 }, { x: 50, y: 42 }, { x: 82, y: 36 }]
            };
        }

        function exportThing(kind) {
            if (!state.project) { toast("Nothing to export", "Create a project first."); return; }
            const p = state.project;
            if (kind === "json") download(`${safeName(p.title)}_project.json`, JSON.stringify(p, null, 2), "application/json");
            if (kind === "script") download(`${safeName(p.title)}_script.html`, `<!doctype html><meta charset="utf-8"><title>${esc(p.title)} Script</title><style>body{font-family:monospace;max-width:760px;margin:40px auto;white-space:pre-wrap;line-height:1.55}</style><h1>${esc(p.title)}</h1>${esc(p.script || "")}`, "text/html");
            if (kind === "shots") download(`${safeName(p.title)}_shot_list.csv`, shotsCSV(p.shots || []), "text/csv");
            if (kind === "storyboard") download(`${safeName(p.title)}_storyboard.html`, storyboardDoc(p), "text/html");
            toast("Export created", `${kind.toUpperCase()} downloaded.`);
        }

        function safeName(s) { return String(s || "beedance").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, ""); }
        function download(name, content, type) { const blob = new Blob([content], { type }); const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
        function shotsCSV(shots) { const rows = [["id", "title", "camera", "type", "subject", "purpose", "time", "beatId"]].concat(shots.map(s => [s.id, s.title, s.camera, s.type, s.subject, s.purpose, s.time, s.beatId])); return rows.map(r => r.map(x => `"${String(x || "").replace(/"/g, '""')}"`).join(",")).join("\n"); }
        function storyboardDoc(p) { return `<!doctype html><meta charset="utf-8"><title>${esc(p.title)} Storyboard</title><style>body{font-family:system-ui;margin:30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{border:1px solid #111;padding:12px;border-radius:12px}pre{white-space:pre-wrap}</style><h1>${esc(p.title)} Storyboard</h1><div class="grid">${(p.storyboard || []).map((f, i) => `<div class="card"><h2>${i + 1}. ${esc(f.title)}</h2><p>${esc(f.description || "")}</p><pre>${esc(f.prompt || "")}</pre></div>`).join("")}</div>`; }

        function updateBottomNav() {
            document.querySelectorAll(".navbtn[data-surface]").forEach(b => b.classList.toggle("active", b.dataset.surface === state.ui.surface));
        }
        function openChatMobile() { document.getElementById("leftPanel").classList.add("open"); state.ui.mobileChatOpen = true; }
        function closeChatMobile() { document.getElementById("leftPanel").classList.remove("open"); state.ui.mobileChatOpen = false; }

        document.addEventListener("click", e => {
            const t = e.target.closest("[data-surface]");
            if (t) { state.ui.surface = t.dataset.surface; closeChatMobile(); render(); }
            const m = e.target.closest("[data-mobile='chat']");
            if (m) { openChatMobile(); }
        });

        document.getElementById("chatToggle").onclick = () => {
            const p = document.getElementById("leftPanel");
            p.classList.toggle("open");
        };
        document.getElementById("settingsBtn").onclick = () => { state.ui.surface = "settings"; render(); };
        document.getElementById("themeBtn").onclick = () => { state.ui.theme = state.ui.theme === "dark" ? "light" : "dark"; document.body.dataset.theme = state.ui.theme; render(); };
        document.getElementById("quickBtn").onclick = () => {
            const suggestions = ["make a movie about bees on a train", "make it funnier", "show the blocking diagram", "generate the full storyboard", "fix whatever doesn't make sense", "export everything"];
            const txt = suggestions.map(s => `• ${s}`).join("\n");
            toast("Example prompts", txt);
        };
        document.getElementById("chatForm").addEventListener("submit", e => {
            e.preventDefault(); const input = document.getElementById("chatInput"); const text = input.value; input.value = ""; handleUserSubmit(text); if (window.innerWidth < 760) closeChatMobile();
        });
        document.getElementById("chatInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("chatForm").requestSubmit(); } });

        load();
        render();
    </script>
</body>

</html>
