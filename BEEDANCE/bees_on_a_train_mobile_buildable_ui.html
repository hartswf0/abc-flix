<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEEDANCE — Chat First AI Builder</title>
<style>
:root{--bg:#fffaf0;--paper:#fff;--ink:#080808;--honey:#f6c400;--soft:#f3ead0;--mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;--sans:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}body{padding:16px}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;background:var(--paper);border:2px solid var(--ink)}button:disabled{opacity:.35;cursor:not-allowed}.shell{max-width:1440px;margin:0 auto;display:grid;gap:14px}.brand{border:3px solid var(--ink);background:var(--paper);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;padding:16px;box-shadow:8px 8px 0 var(--ink)}.brand h1{margin:0;text-transform:uppercase;font-size:clamp(42px,8vw,104px);letter-spacing:-.08em;line-height:.78;font-weight:1000}.brandline{font-family:var(--mono);text-transform:uppercase;font-size:12px;line-height:1.35;text-align:right;max-width:560px}.workspace{display:grid;grid-template-columns:300px minmax(360px,1fr) 390px;gap:14px;align-items:stretch}.rail,.stage,.chat{border:3px solid var(--ink);background:var(--paper);min-height:calc(100dvh - 180px);max-height:calc(100dvh - 70px);overflow:hidden;display:grid}.rail{grid-template-rows:auto 1fr auto}.stage{grid-template-rows:auto 1fr}.chat{grid-template-rows:auto 1fr auto}.head{border-bottom:3px solid var(--ink);padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);font-family:var(--mono);font-weight:950;text-transform:uppercase;font-size:12px}.bee{width:34px;height:26px;border:3px solid var(--ink);border-radius:50%;background:var(--honey);display:grid;place-items:center;font-size:14px}.bee:before{content:"◆"}.pane{padding:12px;overflow:auto;display:grid;gap:10px;align-content:start}.card{border:2px solid var(--ink);background:var(--paper);padding:10px;display:grid;gap:8px}.card.hot{background:var(--honey)}.card-title{font-family:var(--mono);font-size:11px;text-transform:uppercase;font-weight:950;display:flex;justify-content:space-between;gap:8px}.tiny{font-family:var(--mono);font-size:11px;line-height:1.35;text-transform:uppercase}.field{display:grid;gap:5px}.field label{font-family:var(--mono);font-size:10px;text-transform:uppercase;font-weight:950}.field input,.field textarea,.field select{width:100%;border:2px solid var(--ink);background:var(--paper);padding:9px;font-size:12px}.field textarea{min-height:120px;resize:vertical;font-family:var(--mono);line-height:1.4}.msg{border:2px solid var(--ink);padding:10px;font-size:14px;line-height:1.35;white-space:pre-wrap;max-width:94%;background:var(--paper)}.msg.user{justify-self:end;border-width:3px}.msg.assistant{justify-self:start}.msg.system{justify-self:stretch;border-style:dashed;font-family:var(--mono);font-size:11px;text-transform:uppercase}.msg.error{background:var(--ink);color:var(--paper)}.msg small{display:block;border-bottom:1px solid currentColor;margin-bottom:5px;padding-bottom:4px;font-family:var(--mono);font-size:10px;text-transform:uppercase;font-weight:950}.composer{border-top:3px solid var(--ink);padding:10px;display:grid;grid-template-columns:1fr 44px;gap:8px;background:var(--paper)}.composer textarea{border:3px solid var(--ink);min-height:54px;max-height:150px;resize:none;padding:10px;font-size:15px;line-height:1.25}.send{background:var(--ink);color:var(--paper);border:3px solid var(--ink);font-size:22px;font-weight:950}.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:3px solid var(--ink)}.tab{border:0;border-right:2px solid var(--ink);padding:12px 4px;font-family:var(--mono);font-size:10px;text-transform:uppercase;font-weight:950}.tab:last-child{border-right:0}.tab.active{background:var(--ink);color:var(--paper)}.primary{background:var(--ink);color:var(--paper);border:3px solid var(--ink);padding:11px;font-family:var(--mono);font-size:11px;text-transform:uppercase;font-weight:950}.secondary{background:var(--paper);border:2px solid var(--ink);padding:9px;font-family:var(--mono);font-size:11px;text-transform:uppercase;font-weight:950}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.artifact{border:2px solid var(--ink);background:var(--paper);padding:12px;font-family:var(--mono);font-size:12px;line-height:1.45;white-space:pre-wrap;overflow:auto;max-height:430px}.artifact.big{max-height:none;min-height:320px}.status-dot{display:inline-block;width:10px;height:10px;border:2px solid var(--ink);border-radius:50%;background:var(--paper);margin-right:6px}.status-dot.live{background:var(--honey)}.status-dot.fail{background:var(--ink)}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);border:3px solid var(--ink);background:var(--paper);padding:10px 14px;font-family:var(--mono);font-size:12px;text-transform:uppercase;box-shadow:6px 6px 0 var(--ink);display:none;z-index:10}.toast.show{display:block}.loading{animation:pulse .8s steps(2,end) infinite}@keyframes pulse{50%{opacity:.35}}@media(max-width:1060px){body{padding:10px}.brand{grid-template-columns:1fr}.brandline{text-align:left}.workspace{grid-template-columns:1fr}.rail,.stage,.chat{min-height:auto;max-height:none}.stage{min-height:54dvh}.chat{min-height:70dvh}.brand h1{font-size:56px}.rail{order:2}.stage{order:1}.chat{order:3}}@media(max-width:520px){.brand h1{font-size:46px}.row{grid-template-columns:1fr}.composer{grid-template-columns:1fr 42px}.head{font-size:11px}}
</style>
</head>
<body>
<main class="shell">
<header class="brand"><h1>BEEDANCE</h1><div class="brandline">Chat-first AI builder. Words over buttons. GUI only for tuning. No mock AI. No output without a real API call.</div></header>
<section class="workspace">
<aside class="rail">
<div class="head"><span><span class="status-dot" id="statusDot"></span><span id="statusText">API REQUIRED</span></span><span class="bee"></span></div>
<div class="pane" id="railPane"></div>
<div class="tabs"><button class="tab active" data-tab="stage" type="button">Stage</button><button class="tab" data-tab="system" type="button">System</button><button class="tab" data-tab="hive" type="button">Hive</button><button class="tab" data-tab="export" type="button">Export</button></div>
</aside>
<section class="stage"><div class="head"><span id="stageTitle">Blank Stage</span><button class="secondary" id="copyBtn" type="button">Copy</button></div><div class="pane" id="stagePane"></div></section>
<section class="chat"><div class="head"><span>Conversation</span><button class="secondary" id="clearBtn" type="button">Clear</button></div><div class="pane" id="chatPane"></div><form class="composer" id="chatForm"><textarea id="chatInput" placeholder="say what to build... example: make a film called bees on a train"></textarea><button class="send" id="sendBtn" type="submit">›</button></form></section>
</section>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var NL=String.fromCharCode(10);
var KEY='beedance-api-first-v1';
var E={rail:document.getElementById('railPane'),stage:document.getElementById('stagePane'),chat:document.getElementById('chatPane'),stageTitle:document.getElementById('stageTitle'),form:document.getElementById('chatForm'),input:document.getElementById('chatInput'),send:document.getElementById('sendBtn'),clear:document.getElementById('clearBtn'),copy:document.getElementById('copyBtn'),toast:document.getElementById('toast'),statusDot:document.getElementById('statusDot'),statusText:document.getElementById('statusText')};
var tabs=Array.prototype.slice.call(document.querySelectorAll('.tab'));
var profiles={
film:'You are BEEDANCE, a chat-first film and storyboard builder. The user is a novice and writes lazy prompts. Convert their words into structured production artifacts. Return ONLY valid compact JSON with keys: title, artifact_type, summary, script, storyboard, image_prompts, next_words. storyboard must be an array of shot objects with shot, action, image_prompt.',
app:'You are BEEDANCE, a chat-first app and interface builder. Convert rough language into buildable product artifacts. Return ONLY valid compact JSON with keys: title, artifact_type, summary, screens, components, data_model, system_prompts, next_words.',
research:'You are BEEDANCE, a chat-first research builder. Convert rough language into a structured scholarly artifact. Return ONLY valid compact JSON with keys: title, artifact_type, thesis, questions, outline, claims, methods, next_words.',
image:'You are BEEDANCE, a chat-first visual prompt builder. Convert rough language into production image prompts. Return ONLY valid compact JSON with keys: title, artifact_type, concept, prompt, negative_prompt, variations, code_render_plan, next_words.',
custom:'You are BEEDANCE, a chat-first AI builder. Convert user words into structured artifacts. Return ONLY valid compact JSON with keys: title, artifact_type, summary, artifact, next_words.'
};
var base={tab:'stage',busy:false,settings:{endpoint:'https://api.openai.com/v1/chat/completions',apiKey:'',model:'gpt-4.1-mini',temperature:'0.7',profile:'film',customSystem:''},messages:[],artifacts:[],active:null,lastError:''};
var state=load()||copyObj(base);
function copyObj(x){return JSON.parse(JSON.stringify(x))}
function esc(v){v=String(v==null?'':v);return v.split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;').split("'").join('&#39;')}
function load(){try{var r=localStorage.getItem(KEY);if(!r)return null;var s=JSON.parse(r);if(s.settings)s.settings.apiKey='';return s}catch(e){return null}}
function save(){var s=copyObj(state);if(s.settings)s.settings.apiKey='';try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function toast(t){E.toast.textContent=t;E.toast.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){E.toast.classList.remove('show')},1600)}
function hasAPI(){return state.settings.endpoint.trim()&&state.settings.apiKey.trim()&&state.settings.model.trim()}
function systemPrompt(){return state.settings.profile==='custom'&&state.settings.customSystem.trim()?state.settings.customSystem:profiles[state.settings.profile]}
function setStatus(){if(state.busy){E.statusText.textContent='CALLING API';E.statusDot.className='status-dot live loading';return}if(hasAPI()){E.statusText.textContent='API READY';E.statusDot.className='status-dot live';return}E.statusText.textContent='API REQUIRED';E.statusDot.className='status-dot'}
function addMsg(role,text){state.messages.push({role:role,text:String(text),time:new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})})}
function buildPayload(userText){var recent=state.messages.slice(-10).filter(function(m){return m.role==='user'||m.role==='assistant'}).map(function(m){return{role:m.role,content:m.text}});return{model:state.settings.model,temperature:Number(state.settings.temperature)||0.7,response_format:{type:'json_object'},messages:[{role:'system',content:systemPrompt()}].concat(recent).concat([{role:'user',content:userText}])}}
async function callAPI(userText){if(!hasAPI())throw new Error('Add endpoint, API key, and model in System before building.');var payload=buildPayload(userText);var headers={'Content-Type':'application/json','Authorization':'Bearer '+state.settings.apiKey.trim()};var res=await fetch(state.settings.endpoint.trim(),{method:'POST',headers:headers,body:JSON.stringify(payload)});if(!res.ok)throw new Error('API '+res.status+': '+await res.text());var data=await res.json();var content=data.content||(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content)||data.output_text||'';if(!content)throw new Error('API response did not contain message content.');return parseArtifact(content,userText)}
function parseArtifact(content,userText){var obj;try{obj=typeof content==='string'?JSON.parse(content):content}catch(e){obj={title:titleFrom(userText),artifact_type:'raw_text',summary:String(content),artifact:String(content),next_words:['revise this','turn it into images','export it']}}if(!obj.title)obj.title=titleFrom(userText);if(!obj.artifact_type)obj.artifact_type='artifact';return{created:new Date().toISOString(),prompt:userText,json:obj,raw:content}}
function titleFrom(s){s=String(s);var lower=s.toLowerCase();var i=lower.indexOf('called ');if(i>-1)return titleCase(s.slice(i+7).split('.')[0].trim());return 'Untitled Build'}
function titleCase(s){return s.split(' ').map(function(w){return w?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():w}).join(' ')}
async function submit(text){var userText=String(text||'').trim();if(!userText)return;addMsg('user',userText);state.busy=true;render();try{var artifact=await callAPI(userText);state.artifacts.unshift(artifact);state.active=artifact;addMsg('assistant',summarize(artifact.json));state.tab='stage';state.lastError=''}catch(err){state.lastError=err.message;addMsg('assistant','API call failed. '+err.message);state.tab=hasAPI()?'stage':'system'}finally{state.busy=false;save();render()}}
function summarize(o){var a=[o.title||'Artifact'];if(o.summary)a.push(o.summary);if(o.thesis)a.push(o.thesis);if(o.concept)a.push(o.concept);if(o.next_words)a.push('Next words: '+o.next_words.join(' · '));return a.join(NL)}
function render(){setStatus();tabs.forEach(function(t){t.classList.toggle('active',t.dataset.tab===state.tab)});renderRail();renderChat();renderStage();E.send.disabled=state.busy;E.input.placeholder=hasAPI()?'say what to build...':'open System and paste your API key first';}
function renderRail(){if(state.tab==='system'){renderSystemRail();return}if(state.tab==='hive'){renderHiveRail();return}if(state.tab==='export'){renderExportRail();return}renderStageRail()}
function renderStageRail(){E.rail.innerHTML='<div class="card hot"><div class="card-title">Chat First Law</div><div class="tiny">Words create. GUI tweaks. Nothing generates without a successful API call.</div></div><div class="card"><div class="card-title">Current Profile</div><div class="tiny">'+esc(state.settings.profile)+'</div></div><div class="card"><div class="card-title">Artifacts</div><div class="tiny">'+state.artifacts.length+' generated by real API calls</div></div>'}
function renderSystemRail(){var html='';html+='<div class="card hot"><div class="card-title">API Key Required</div><div class="tiny">No mock AI. Paste your own key or use your own proxy endpoint. Keys are kept in memory only and are not saved to localStorage.</div></div>';html+='<div class="card"><div class="card-title">Provider</div>'+field('Endpoint','endpoint',state.settings.endpoint,'https://api.openai.com/v1/chat/completions')+field('API Key','apiKey',state.settings.apiKey,'paste key for this session')+field('Model','model',state.settings.model,'gpt-4.1-mini')+field('Temperature','temperature',state.settings.temperature,'0.7')+'</div>';html+='<div class="card"><div class="card-title">System Prompt</div>'+selectField('Profile','profile',{film:'Film Builder',app:'App Builder',research:'Research Builder',image:'Image Builder',custom:'Custom'},state.settings.profile)+'<div class="field"><label>Custom System Instruction</label><textarea data-setting="customSystem">'+esc(state.settings.customSystem)+'</textarea></div><button class="secondary" data-action="copySystem" type="button">Copy Active System</button></div>';html+='<div class="card"><div class="card-title">Active System</div><div class="artifact">'+esc(systemPrompt())+'</div></div>';E.rail.innerHTML=html}
function renderHiveRail(){if(!state.artifacts.length){E.rail.innerHTML='<div class="card"><div class="card-title">Hive Empty</div><div class="tiny">Artifacts appear only after successful API calls.</div></div>';return}E.rail.innerHTML=state.artifacts.map(function(a,i){return '<button class="card" data-action="openArtifact" data-index="'+i+'" type="button"><div class="card-title">'+esc(a.json.title||'Artifact')+'</div><div class="tiny">'+esc(a.json.artifact_type||'artifact')+'</div></button>'}).join('')}
function renderExportRail(){E.rail.innerHTML='<div class="card"><div class="card-title">Export</div><div class="tiny">Download the real API-generated workspace.</div><div class="row"><button class="primary" data-action="downloadJSON" type="button">JSON</button><button class="primary" data-action="downloadMD" type="button">MD</button></div><button class="secondary" data-action="downloadHTML" type="button">HTML</button></div>'}
function renderChat(){E.chat.innerHTML='';if(!state.messages.length){E.chat.insertAdjacentHTML('beforeend','<div class="msg system"><small>System</small>Paste API key in System. Then write normally. Example: make a film called bees on a train.</div>');return}state.messages.slice(-14).forEach(function(m){E.chat.insertAdjacentHTML('beforeend','<div class="msg '+esc(m.role)+(m.text.indexOf('API call failed')===0?' error':'')+'"><small>'+esc(m.role)+'</small>'+esc(m.text)+'</div>')});E.chat.scrollTop=E.chat.scrollHeight}
function renderStage(){if(state.tab==='system'){E.stageTitle.textContent='System Payload';E.stage.innerHTML='<div class="card"><div class="card-title">Request Payload Shape</div><div class="artifact big">'+esc(JSON.stringify(buildPayload('YOUR WORDS HERE'),null,2))+'</div></div>';return}if(state.tab==='hive'){E.stageTitle.textContent='Hive';E.stage.innerHTML='<div class="card"><div class="card-title">Artifact History</div><div class="tiny">Select an artifact from the left rail.</div></div>';return}if(state.tab==='export'){E.stageTitle.textContent='Export';E.stage.innerHTML='<div class="card"><div class="card-title">Bundle Preview</div><div class="artifact big">'+esc(JSON.stringify(bundle(),null,2))+'</div></div>';return}var a=state.active;if(!a){E.stageTitle.textContent='Blank Stage';E.stage.innerHTML='<div class="empty"><div class="orb">B</div><div>BEEDANCE waits for words.<br>No buttons to begin.<br>No output without API.</div></div>';return}E.stageTitle.textContent=a.json.title||'Artifact';E.stage.innerHTML=artifactHTML(a.json)}
function artifactHTML(o){var h='<div class="card"><div class="card-title">'+esc(o.title||'Artifact')+'<span>'+esc(o.artifact_type||'artifact')+'</span></div>';Object.keys(o).forEach(function(k){if(k==='title'||k==='artifact_type')return;var v=o[k];h+='<div class="artifact"><b>'+esc(k.toUpperCase())+'</b>'+NL+esc(typeof v==='object'?JSON.stringify(v,null,2):v)+'</div>'});return h+'</div>'}
function field(label,key,value,ph){return '<div class="field"><label>'+esc(label)+'</label><input data-setting="'+esc(key)+'" value="'+esc(value)+'" placeholder="'+esc(ph||'')+'"></div>'}
function selectField(label,key,opts,value){var h='<div class="field"><label>'+esc(label)+'</label><select data-setting="'+esc(key)+'">';Object.keys(opts).forEach(function(k){h+='<option value="'+esc(k)+'" '+(k===value?'selected':'')+'>'+esc(opts[k])+'</option>'});return h+'</select></div>'}
function bundle(){return{brand:'BEEDANCE',system_prompt:systemPrompt(),settings:{endpoint:state.settings.endpoint,model:state.settings.model,temperature:state.settings.temperature,profile:state.settings.profile},messages:state.messages,artifacts:state.artifacts}}
function markdown(){var b=bundle();var out=['# BEEDANCE Export','','## System Prompt','```',b.system_prompt,'```','','## Artifacts'];b.artifacts.forEach(function(a,i){out.push('','### '+(i+1)+'. '+(a.json.title||'Artifact'),'```json',JSON.stringify(a.json,null,2),'```')});return out.join(NL)}
function htmlExport(){return '<!doctype html><html><head><meta charset="utf-8"><title>BEEDANCE Export</title><style>body{font-family:monospace;max-width:900px;margin:40px auto;line-height:1.5}pre{white-space:pre-wrap;border:2px solid #000;padding:16px}</style></head><body><h1>BEEDANCE Export</h1><pre>'+esc(markdown())+'</pre></body></html>'}
function download(name,text,type){var blob=new Blob([text],{type:type});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);toast('Downloaded')}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast('Copied')});else toast('Clipboard unavailable')}
E.form.addEventListener('submit',function(e){e.preventDefault();var v=E.input.value.trim();E.input.value='';E.input.style.height='auto';submit(v)});E.input.addEventListener('input',function(){E.input.style.height='auto';E.input.style.height=Math.min(E.input.scrollHeight,150)+'px'});E.clear.addEventListener('click',function(){state.messages=[];save();render()});E.copy.addEventListener('click',function(){copyText(state.active?JSON.stringify(state.active.json,null,2):JSON.stringify(bundle(),null,2))});tabs.forEach(function(t){t.addEventListener('click',function(){state.tab=t.dataset.tab;save();render()})});document.body.addEventListener('input',function(e){var k=e.target.getAttribute('data-setting');if(!k)return;state.settings[k]=e.target.value;if(k==='profile'&&e.target.value!=='custom')state.settings.customSystem='';save();render()});document.body.addEventListener('change',function(e){var k=e.target.getAttribute('data-setting');if(!k)return;state.settings[k]=e.target.value;save();render()});document.body.addEventListener('click',function(e){var b=e.target.closest('[data-action]');if(!b)return;var action=b.getAttribute('data-action');if(action==='copySystem')copyText(systemPrompt());if(action==='openArtifact'){var i=Number(b.getAttribute('data-index'));state.active=state.artifacts[i];state.tab='stage';save();render()}if(action==='downloadJSON')download('beedance-export.json',JSON.stringify(bundle(),null,2),'application/json');if(action==='downloadMD')download('beedance-export.md',markdown(),'text/markdown');if(action==='downloadHTML')download('beedance-export.html',htmlExport(),'text/html')});
render();
})();
</script>
</body>
</html>
